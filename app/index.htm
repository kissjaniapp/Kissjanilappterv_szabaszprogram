  function suggestedBoardSize(bin){
    if(!bin?.placements?.length)return null;
    // Munkalapnál nincs kisebb készletjavaslat: a teljes, katalógusból vett táblaszélességet megtartjuk.
    if(Math.abs(Number(bin.thickness)-38)<.001)return null;
    const trim=Math.max(0,Number(bin.trim)||0),kerf=Math.max(0,Number(state.kerf)||0);
    let neededX,neededY;
    if(bin.machine?.strips?.length){
      // A TÉNYLEGES csíktervvel számolunk: csíkszélességek + közöttük a vágásrés,
      // és a leghosszabb csík darabjai + keresztvágások. Így a javasolt tábla
      // az első és a második gépi menetet is elbírja, nem csupán a rajzi határolót.
      const feedUsed=bin.machine.feedUsed;
      const crossUsed=Math.max(...bin.machine.strips.map(s=>s.usedLength));
      const allowance=2*trim+(trim?kerf/2:0)+kerf;
      neededX=bin.machine.feed==='y'?feedUsed+allowance:crossUsed+allowance;
      neededY=bin.machine.feed==='x'?feedUsed+allowance:crossUsed+allowance;
    }else{
      const xs=bin.placements.map(p=>p.x),ys=bin.placements.map(p=>p.y);
      const spanX=Math.max(...bin.placements.map(p=>p.x+p.realW))-Math.min(...xs);
      const spanY=Math.max(...bin.placements.map(p=>p.y+p.realH))-Math.min(...ys);
      neededX=spanX+2*trim+kerf;
      neededY=spanY+2*trim+kerf;
    }
    // Praktikus 10 mm-es méretlépcső; a plusz vágásrés elkerüli a gépben
    // visszamaradó, már le nem vágható néhány mm-es csíkot.
    const a=Math.min(bin.a,Math.ceil((neededX-0.00001)/10)*10);
    const b=Math.min(bin.b,Math.ceil((neededY-0.00001)/10)*10);
    // A kijelzett mennyiség az alkatrészekhez szükséges táblaanyag,
    // NEM a régi tábla után megmaradó felület.
    const originalArea=bin.a*bin.b;
    const neededArea=a*b;
    const netPartArea=bin.used;
    const neededShare=originalArea>0?neededArea/originalArea:0;
    const util=originalArea>0?netPartArea/originalArea:0;
    if(neededShare>.75||util>.60)return null;
    return {a,b,neededArea,netPartArea,neededShare};
  }

    const directionControl=`<div class="panel" style="margin-bottom:18px"><div class="panel-body"><div class="toolbar"><div><div class="panel-title">A tábla ütköztetése a géphez</div><div class="panel-sub">A gép csak teljes szélességben vág. Először a tábla felénk eső oldalától végigcsíkozza az anyagot, majd a csíkokat 90°-kal elfordítva, ugyanebben a sorrendben visszakéri. A hosszú/rövid él minden táblánál annak tényleges méretét jelenti. A munkalap speciális szabását a program nem támogatja; csak bútorlapok gépi csíktervét készítjük.</div></div><div style="min-width:260px;max-width:420px;flex:1"><label for="cut-direction">Melyik él ütközzön a géphez?</label><select id="cut-direction" data-scope="settings" data-key="cutDirection"><option value="auto" ${(!state.cutDirection||state.cutDirection==='auto')?'selected':''}>Vegyes / automatikus · táblánként legjobb él</option><option value="long" ${['long','y'].includes(state.cutDirection)?'selected':''}>Hosszú él a gépnél · hosszabb oldalról beadás</option><option value="short" ${['short','x'].includes(state.cutDirection)?'selected':''}>Rövid él a gépnél · rövidebb oldalról beadás</option></select></div><div style="min-width:220px;max-width:360px;flex:1"><label for="layout-mode">Elrendezési módszer</label><select id="layout-mode" data-scope="settings" data-key="layoutMode"><option value="mosaic" ${state.layoutMode==='mosaic'?'selected':''}>Mozaikos</option><option value="auto" ${['auto','machine','rows'].includes(state.layoutMode)?'selected':''}>Szabad · legsűrűbb elrendezés keresése</option><option value="economy" ${state.layoutMode==='economy'?'selected':''}>Anyagtakarékos · nagyobb maradékok megőrzése</option></select></div>
</div></div></div>`;
    let body='';
    if(!result){body=`<div class="panel empty"><div class="empty-icon">▦</div><h2>Rajzoljuk meg a szabástervet!</h2><p>Összesen <strong>${nfmt(summary.total)} kitöltött alkatrészt</strong> kell elhelyezni a megadott anyagokon. A program figyeli a szálirányt, a vágásrést és a darabszámot.</p><span class="muted small">A terv az adatok megadásakor automatikusan elkészül.</span><div class="select-detail">Több guillotine elrendezési próbát vizsgálunk; a hiányos alkatrészsorok kimaradnak.</div></div>`;}
    else if(result.error){body=`<div class="notice error">${h(result.error)}</div><div class="section-bottom"><button class="btn" data-action="page" data-page="furniture">Alkatrészek ellenőrzése</button><button class="btn" data-action="page" data-page="stock">Anyagok ellenőrzése</button></div>`;}
    else{
      const b=result.bins[Math.max(0,Math.min(result.bins.length-1,state.selectedBoard))];
      const util=result.sheetArea?result.usedArea/result.sheetArea*100:0;

      const stats=`${geometryNotice}${requiredRemnantNote}${ecoInfo}<div class="statrow">

            </div>

    }

r-gradient(135deg,#35473c,#25342d)}\n.theme-dark .drawing-caption,.theme-dark .parts th,.theme-dark .hint,.theme-dark .subbox,.theme-dark .stat{background:#2c3c32;color:#edf7f0}\n.theme-dark .small.muted,.theme-dark .muted,.theme-dark .mini.muted{color:#c4d4c9}\n.theme-dark .parts td,.theme-dark .parts th{color:#edf7f0}\n/* A beágyazott szerkesztő a három választható Gatterka-színből kevert árnyalatokat használ. */\n:root{--ui-soft:color-mix(in srgb,var(--canvas) 86%,var(--ink) 14%);--ui-border:color-mix(in srgb,var(--canvas) 75%,var(--ink) 25%);--ui-hover:color-mix(in srgb,var(--canvas) 78%,var(--pine-2) 22%);--ui-input:var(--surface)}\nbody,.panel,.panel-head,.panel-body{color:var(--ink)}\n.panel-head{border-bottom-color:var(--ui-border)}\ninput:not([type=\"checkbox\"]):not([type=\"radio\"]),select,.btn,.count-control button,.view-controls button{background:var(--ui-input);color:var(--ink);border-color:var(--ui-border)}\ninput:disabled{opacity:.88;color:var(--muted)}\n.field label,.shelf-advanced-row label,.shelf-row label,.hint,.shelf-note,.footnote,.drawing-caption,.preview-label,.view-tip,.parts th,.parts td,.toggle,.choice,.seg span,.small.muted,.muted{color:var(--ink)}\n.muted,.hint,.footnote,.view-tip,.preview-label,.small.muted{opacity:.8}\n.toggle,.subbox,.seg,.choice,.shelf-row input.auto-value,.shelf-row input.locked-value,.stat,.drawing-caption,.parts th,.theme-toolbar,.preview-stage{background:var(--ui-soft);color:var(--ink);border-color:var(--ui-border)}\n.seg input:checked+span,.btn:hover,.count-control button:hover,.view-controls button:hover{background:var(--ui-hover);color:var(--ink)}\n.seg span{color:var(--ink)}\n.btn.primary,.view-controls button.active{background:var(--pine-2);color:var(--button-contrast,#ffffff);border-color:var(--pine-2)}\n.shelf-drill-heading{padding-top:14px;border-top:1px solid var(--ui-border)}\n.count-control select{min-width:92px;font-weight:800;text-align:center;cursor:pointer}\n.theme-dark input:not([type=\"checkbox\"]):not([type=\"radio\"]),.theme-dark select,.theme-dark .btn,.theme-dark .count-control button,.theme-dark .view-controls button{background:var(--ui-input);color:var(--ink);border-color:var(--ui-border)}\n.theme-dark .seg input:checked+span,.theme-dark .btn:hover{background:var(--ui-hover);color:var(--ink)}\n.theme-dark .toggle,.theme-dark .seg,.theme-dark .subbox,.theme-dark .choice,.theme-dark .shelf-row input.auto-value,.theme-dark .shelf-row input.locked-value,.theme-dark .drawing-caption,.theme-dark .parts th,.theme-dark .stat{background:var(--ui-soft);color:var(--ink)}\n.theme-dark .btn.primary,.theme-dark .view-controls button.active{background:var(--pine-2);color:var(--button-contrast,#ffffff)}\n\n/* Nagy, görgethető szerkezeti szerkesztő: az alap 2D/3D előnézet megmarad. */\n.visual-stage{padding:15px 17px 17px;border-bottom:1px solid var(--border)}\n.visual-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}\n.visual-heading strong{font-size:15px;color:var(--pine)}\n.visual-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}\n.visual-tools button{border:1px solid #cbdacc;border-radius:7px;background:#f7faf7;padding:6px 11px;font-size:12px;font-weight:750;color:#28533c}\n.visual-tools button.selected{background:#286a4b;color:white;border-color:#286a4b}\n.visual-tools .visual-zoom{min-width:46px;text-align:center;font-size:12px;font-weight:750}\n.visual-scroll{height:650px;max-height:min(70vh,760px);overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable;background:#eaf0e9;border:1px solid #c3d8c9;border-radius:10px;position:relative}\n.visual-svg{display:block;max-width:none;height:auto;touch-action:none;user-select:none}\n.visual-svg [data-vis-axis],.visual-svg [data-vis-part]{cursor:grab}\n.visual-svg [data-vis-joint]{cursor:pointer}\n.visual-svg [data-vis-end]{cursor:crosshair}\n.visual-svg [data-vis-gap]{cursor:text}\n.visual-svg [data-vis-gap]:hover rect{stroke:#30895d;stroke-width:2;fill:#e3f5e7}\n.visual-svg .visual-ghost{opacity:.12;stroke-dasharray:4 8}\n.visual-svg .visual-hit:hover{fill:#31b68d;fill-opacity:.25}\n.visual-help{font-size:11px;color:#647b6d;line-height:1.6;margin:9px 0}\n.visual-line{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:12px;color:#4b725a}\n.visual-line label{font-size:12px;display:inline-flex;align-items:center;gap:7px;cursor:pointer}\n.visual-line input[type=radio]{width:auto}\n.visual-editor{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin-top:10px;background:#f3f8f3;padding:10px;border-radius:9px}\n.visual-editor label{display:flex;align-items:center;gap:7px;font-size:11px;color:#53685a}\n.visual-editor input{width:88px;padding:6px 7px}\n.visual-editor button{font-size:11px;padding:6px 9px;background:#fff;border:1px solid #bdd5c2;border-radius:7px}\n.visual-dimension-pop{display:none;position:relative;z-index:9;margin-top:9px;background:#fff;padding:10px;border:1px solid #9fc7a9;box-shadow:0 8px 25px #1a483122;border-radius:10px;gap:7px;align-items:center;flex-wrap:wrap}\n.visual-dimension-pop.open{display:flex}\n.visual-dimension-pop input{width:112px;padding:6px}\n.visual-dimension-pop button{width:auto;padding:6px 10px;border:1px solid #a8c9b4;border-radius:7px;background:#eaf5ed}\n@media(min-width:1350px){.content{grid-template-columns:minmax(340px,430px) minmax(700px,1fr)}.main{max-width:1900px}}\n@media(max-width:1150px){.preview-col{position:static}}\n</style>\n<style>\n.sidebar,.topbar,.brand,.nav-current,.nav-tag{display:none!important}\n.shell{display:block!important;min-height:0!important}\n.main{padding:10px!important;max-width:none!important}\n.content{grid-template-columns:minmax(310px,38%) minmax(430px,1fr)!important;gap:12px!important}\n.preview-col{position:static!important}\n@media(max-width:950px){.content{grid-template-columns:1fr!important}.preview-col{order:1}.controls{order:2}}\n</style></head>\n<body>\n<div class=\"shell\">\n<aside class=\"sidebar\"><div class=\"brand\"><div class=\"brand-icon\">▤</div><div><strong>Gatterka</strong><span>BÚTORTERVEZŐ · MINTA</span></div></div><div class=\"nav-tag\">Tervezési modul</div><div class=\"nav-current\">▦ &nbsp; Bútor megadása</div><div class=\"sidebar-note\">Önálló bemutató oldal.<br>Nem kapcsolódik a meglévő szabászprogram mentéséhez és gépi exportjához.</div></aside>\n<main class=\"main\">\n<div class=\"topbar\"><div class=\"headline\"><div class=\"eyebrow\">01 / Bútor megadása</div><h1>Paraméteres szekrénytervező</h1><div class=\"muted small\">Állítsd be a szekrényt – a rajz és az előzetes alkatrészek azonnal változnak.</div></div><div class=\"top-actions\"><span class=\"pill\">Interaktív prototípus</span><button class=\"btn\" id=\"reset\" type=\"button\">↻ Alaphelyzet</button></div></div>\n<div class=\"content\"><div class=\"controls\">\n<!-- A W/H/D és a vastagság kizárólag a fő Gatterka méretmezőiből érkezik. -->\n<div hidden aria-hidden=\"true\" id=\"cabinet-dimensions-from-gatterka\">\n<input id=\"w\" type=\"hidden\" value=\"1000\"><input id=\"h\" type=\"hidden\" value=\"910\">\n<input id=\"d\" type=\"hidden\" value=\"600\"><input id=\"t\" type=\"hidden\" value=\"18\">\n</div>\n<section class=\"panel\"><div class=\"panel-head\"><h2>▤ &nbsp; Fenék és tető</h2></div><div class=\"panel-body\"><div class=\"toggle\" style=\"margin-bottom:12px\"><div><strong>Kell fenék?</strong><div class=\"small muted\">Kikapcsolva az alsó lap kimarad a rajzból és az alkatrészlistából.</div></div><input type=\"checkbox\" id=\"hasBottom\" checked></div><div id=\"bottomSetup\" class=\"field\"><label>Fenék kialakítása</label><div class=\"seg\"><label><input type=\"radio\" name=\"bottom\" value=\"between\" checked><span>Oldalak közé</span></label><label><input type=\"radio\" name=\"bottom\" value=\"full\"><span>Végigmenő</span></label></div></div>\n<div class=\"toggle\" id=\"falseBottomSetup\" style=\"margin:11px 0 15px\"><div><strong>Pótfenék</strong><div class=\"small muted\">A pótfenék a teljes H külméret része: az oldallap magasságából levonjuk a vastagságát. Szélességi túlnyúlás 0,5–0,5 mm.</div></div><input type=\"checkbox\" id=\"falseBottom\"></div>\n<div class=\"toggle\" id=\"legsSetup\" style=\"margin:11px 0 12px\"><div><strong>Kell bútorláb?</strong><div class=\"small muted\">4 db láb: 28 × 28 mm, 100 mm magas. A közepe a külső szélektől 59 mm. A pótfenék, vagy annak hiányában a fenék alá kerül; az alkatrészlistába nem kerül.</div></div><input type=\"checkbox\" id=\"hasLegs\" aria-label=\"Kell bútorláb?\"></div>\n<div class=\"small muted\" id=\"legOverallInfo\" style=\"margin:-4px 0 13px\">Teljes külső magasság: testmagasság H.</div>\n<div class=\"toggle\" style=\"margin:11px 0 12px\"><div><strong>Kell tető?</strong><div class=\"small muted\">Kikapcsolva a felső lap kimarad a rajzból és az alkatrészlistából.</div></div><input type=\"checkbox\" id=\"hasTop\" checked></div><div id=\"topSetup\" class=\"field\"><label>Tető kialakítása</label><div class=\"seg\"><label><input type=\"radio\" name=\"top\" value=\"between\" checked><span>Oldalak közé</span></label><label><input type=\"radio\" name=\"top\" value=\"full\"><span>Végigmenő</span></label></div></div></div></section>\n<section class=\"panel\"><div class=\"panel-head\"><h2>☷ &nbsp; Állítható polcok</h2><span class=\"mini muted\">polctartó csapokon</span></div><div class=\"panel-body\"><div class=\"toggle\"><div><strong>Polcok száma</strong><div class=\"small muted\">Csak a polctartó csapokon álló polc. A fixen befúrt vízszintes elem V-osztó.</div></div><div class=\"count-control\"><select id=\"count\" aria-label=\"Polcok száma\" title=\"Polc darabszám – polc=0 alapértelmezés\"><option value=\"0\" selected>0</option><option value=\"1\">1</option><option value=\"2\">2</option><option value=\"3\">3</option><option value=\"4\">4</option><option value=\"5\">5</option><option value=\"6\">6</option><option value=\"7\">7</option><option value=\"8\">8</option><option value=\"9\">9</option><option value=\"10\">10</option><option value=\"11\">11</option><option value=\"12\">12</option></select></div></div>\n<div style=\"margin-top:14px\" class=\"field\" id=\"distributionSetup\"><label>Polcok magassági kiosztása</label><div class=\"seg\"><label><input type=\"radio\" name=\"distribution\" value=\"equal\" checked><span>Egyenlő elosztás</span></label><label><input type=\"radio\" name=\"distribution\" value=\"manual\"><span>Egyedi magasságok</span></label></div></div>\n<div id=\"manualBox\" class=\"subbox hidden\"><h3>Polcok közötti szabad távolságok (mm)</h3><div class=\"small muted\" style=\"margin-bottom:9px\">Alulról felfelé: fenék teteje (fenék nélkül a szekrény alsó síkja) → 1. polc alja → további polcok. A nem módosított mezők automatikusan és egyenlően osztoznak a fennmaradó helyen. A polclap vastagsága külön számít.</div><div id=\"manualRows\"></div><div class=\"small muted\" id=\"topGapInfo\"></div><button class=\"btn\" type=\"button\" id=\"clearLocks\" style=\"margin-top:10px\">↻ Egyedi rögzítések törlése</button></div>\n<div class=\"alert hidden\" id=\"manualAlert\" role=\"alert\" style=\"margin-top:10px\"></div>\n<div class=\"fields\" style=\"margin-top:14px\"><div class=\"field\"><label for=\"frontSetback\">Első visszaállás</label><input id=\"frontSetback\" type=\"number\" min=\"0\" max=\"200\" value=\"0\"></div><div class=\"field\"><label>Hátsó alapeset</label><input id=\"backPrinciple\" type=\"text\" disabled value=\"Falc szerint automatikus\"></div></div>\n<p class=\"hint\">Falcos hát esetén a polc a falc vonaláig ér. Teli hát esetén az automatikus hátsó visszaállás a hátlap vastagsága + a hátlap hátulról megadott visszaállása. Hátfal nélkül a polc az oldallap hátsó síkjáig fut. Az egyedi polcmélység és visszaállás felülírhatja az automatikus értéket.</p><div id=\"shelfAdvanced\" class=\"subbox\"><h3>Polconkénti finomhangolás</h3><div class=\"small muted\" style=\"margin-bottom:9px\">A magassági kiosztás mindig a polc elején (front oldalon) számít. A dőlés alapértéke 0°.</div><div id=\"shelfRowsAdvanced\"></div></div></div><div class=\"panel-head shelf-drill-heading\"><h3>⫶ &nbsp; Polcfuratozás</h3></div><div class=\"panel-body\"><div class=\"choice-list\">\n<label class=\"choice\" style=\"display:none\"><input type=\"radio\" name=\"drilling\" value=\"fixed\" checked><span>Régi fix polc mód – kompatibilitás</span></label>\n<label class=\"choice\"><input type=\"radio\" name=\"drilling\" value=\"full\"><span>Végig állítható – teljes raszterfurat-sor</span></label>\n<label class=\"choice\"><input type=\"radio\" name=\"drilling\" value=\"local\"><span>Helyi állítás – furatcsoport minden polchoz</span></label></div>\n<div id=\"drillSettings\" class=\"subbox hidden\"><div class=\"fields\"><div class=\"field\"><label for=\"raster\">Furatosztás (mm)</label><input id=\"raster\" type=\"number\" min=\"8\" max=\"200\" value=\"32\"></div><div class=\"field\" id=\"holesWrap\"><label for=\"holes\">Furat / polc / oldal</label><input id=\"holes\" type=\"number\" min=\"1\" max=\"9\" value=\"3\"></div><div class=\"field\"><label for=\"supportInset\">Polctartó távolsága az éltől</label><input id=\"supportInset\" type=\"number\" min=\"0\" max=\"200\" value=\"50\"></div></div>\n<div class=\"fields\" style=\"margin-top:12px\">\n<div class=\"field\"><label for=\"cncGapBottom\">CNC: kihagyás a fenéktől (mm)</label><input id=\"cncGapBottom\" type=\"number\" min=\"0\" max=\"300\" value=\"0\"></div>\n<div class=\"field\"><label for=\"cncGapDivider\">CNC: kihagyás a V-osztótól, mindkét oldalon (mm)</label><input id=\"cncGapDivider\" type=\"number\" min=\"0\" max=\"300\" value=\"0\"></div>\n<div class=\"field\"><label for=\"cncGapTop\">CNC: kihagyás a tetőtől (mm)</label><input id=\"cncGapTop\" type=\"number\" min=\"0\" max=\"300\" value=\"0\"></div></div>\n<div class=\"hint\">A CNC REF minden V-osztó által elkülönített rekeszhez saját szakaszt számít, az oldallap alsó éle felől. A kihagyásokat a REF kezdőpont és a DX szakaszhossz tartalmazza; 0 mm esetén nincs további kihagyás.</div><div class=\"hint\">A polctartó furatok a polc tényleges mélységéhez igazodnak: elöl az első visszaállás + polctartó távolság, hátul az adott polc hátsó visszaállása + polctartó távolság. Teli hátnál az alapértelmezett hátsó visszaállás = hátlapvastagság + hátlap-visszaállás. Döntött polcnál nem rajzolunk polctartót, mert az csak fixen fúrható.</div></div>\n</div></section>\n<section class=\"panel\" id=\"fixedDividers\">\n  <div class=\"panel-head\"><h2>⊞ &nbsp; Fix osztók – F és V</h2><span class=\"mini muted\">akár több darab</span></div>\n  <div class=\"panel-body\">\n   <div class=\"fields\">\n    <div class=\"field\"><label for=\"vCount\">V-osztó – vízszintes (db)</label><select id=\"vCount\"><option value=\"0\" selected>0 db</option><option value=\"1\">1 db</option><option value=\"2\">2 db</option><option value=\"3\">3 db</option><option value=\"4\">4 db</option><option value=\"5\">5 db</option><option value=\"6\">6 db</option><option value=\"7\">7 db</option><option value=\"8\">8 db</option><option value=\"9\">9 db</option><option value=\"10\">10 db</option><option value=\"11\">11 db</option><option value=\"12\">12 db</option></select></div>\n    <div class=\"field\"><label for=\"fCount\">F-osztó – függőleges (db)</label><select id=\"fCount\"><option value=\"0\" selected>0 db</option><option value=\"1\">1 db</option><option value=\"2\">2 db</option><option value=\"3\">3 db</option><option value=\"4\">4 db</option><option value=\"5\">5 db</option><option value=\"6\">6 db</option><option value=\"7\">7 db</option><option value=\"8\">8 db</option><option value=\"9\">9 db</option><option value=\"10\">10 db</option><option value=\"11\">11 db</option><option value=\"12\">12 db</option></select></div>\n   </div>\n   <div id=\"dividerCrossing\" class=\"subbox hidden\">\n    <div class=\"field\"><label>Az F- és V-osztók találkozásánál melyik fusson végig?</label>\n     <div class=\"seg\"><label><input name=\"dividerThrough\" type=\"radio\" value=\"f\" checked><span>F-osztó</span></label><label><input name=\"dividerThrough\" type=\"radio\" value=\"v\"><span>V-osztó</span></label></div>\n    </div>\n    <div class=\"hint\">A megszakított osztót a program külön alkatrészekre bontja. A polcok magassági kiosztása közös a V-osztókéval.</div>\n   </div>\n   <div class=\"subbox hidden\" id=\"vDividerSettings\">\n    <h3>V-osztók – vízszintes</h3>\n    <div class=\"field\"><label for=\"vSetback\">V-osztó első visszaállása (mm)</label><input id=\"vSetback\" type=\"number\" min=\"0\" value=\"0\" step=\"0.1\"></div>\n    <div class=\"field\"><label for=\"shelfBias\">Páratlan polcnál több polc</label><select id=\"shelfBias\"><option value=\"below\">Alulra</option><option value=\"above\">Felülre</option></select></div>\n    <div class=\"small muted\">A fixen befúrt vízszintes elem V-osztó; a polctartós, állítható polc külön kategória. A rajzon mindkettő mozgatható és milliméterre méretezhető.</div>\n    <div id=\"vDividerRows\"></div>\n   </div>\n   <div class=\"subbox hidden\" id=\"fDividerSettings\">\n    <h3>F-osztók – függőleges</h3>\n    <div class=\"field\"><label for=\"fSetback\">F-osztó első visszaállása (mm)</label><input id=\"fSetback\" type=\"number\" min=\"0\" value=\"0\" step=\"0.1\"></div>\n    <div class=\"small muted\">Alapból a teljes belső magasságban, egyforma szélességi osztásban. Az alsó és felső határ polcra, V-osztóra vagy a fenékre/tetőre állítható.</div>\n    <div id=\"fDividerRows\"></div>\n   </div>\n  </div>\n </section>\n<section class=\"panel\"><div class=\"panel-head\"><h2>▥ &nbsp; Hátfal</h2></div><div class=\"panel-body\"><div class=\"field\"><label>Hátfal kialakítása</label><div class=\"seg\"><label><input type=\"radio\" name=\"backType\" value=\"none\"><span>Nincs hátfal</span></label><label><input type=\"radio\" name=\"backType\" value=\"rabbet\" checked><span>Falcos hát</span></label><label><input type=\"radio\" name=\"backType\" value=\"full\"><span>Teli hát</span></label></div></div><div id=\"rabbetSettings\" class=\"subbox\"><div class=\"fields\"><div class=\"field\"><label for=\"rabbetWidth\">Falc szélessége (mm)</label><input id=\"rabbetWidth\" type=\"number\" value=\"4\" min=\"1\" max=\"30\"></div><div class=\"field\"><label>Falc mélysége</label><input id=\"rabbetDepth\" type=\"text\" disabled value=\"13 mm\"></div></div><div class=\"hdf-joins\" style=\"display:grid;gap:10px;margin-top:12px\"><div id=\"topHdfJoin\" class=\"subbox\"><div class=\"field\"><label for=\"topHdfCut\">Tető és HDF hátfal csatlakozása</label><select id=\"topHdfCut\"><option value=\"falc\" selected>Falcos – 5,5 mm</option><option value=\"trim\">Visszavágott – 2 mm</option></select></div></div><div id=\"bottomHdfJoin\" class=\"subbox\"><div class=\"field\"><label for=\"bottomHdfCut\">Fenék és HDF hátfal csatlakozása</label><select id=\"bottomHdfCut\"><option value=\"falc\" selected>Falcos – 5,5 mm</option><option value=\"trim\">Visszavágott – 2 mm</option></select></div></div></div><div class=\"hint\">Falcos hát: mindig 4 mm-es HDF. Szélesség = W−11 mm. Magasság = oldallap magassága − tető levonás − fenék levonás (külön 5,5 vagy 2 mm). A polc hátul a falc vonaláig ér.</div></div><div id=\"fullBackSettings\" class=\"subbox hidden\"><div class=\"fields\"><div class=\"field\"><label for=\"fullBackSetback\">Teli hát visszaállása hátulról (mm)</label><input id=\"fullBackSetback\" type=\"number\" value=\"0\" min=\"0\" max=\"200\"></div><div class=\"field\"><label>Hátlap vastagsága</label><input id=\"backThickness\" type=\"text\" disabled value=\"18 mm\"></div></div><div class=\"hint\">Teli hát: a hátlap egy, az anyagvastagsággal megegyező bútorlap. A visszaállás a külső hátoldaltól befelé értendő.</div></div></div></section>\n</div>\n<div class=\"preview-col\">\n<section class=\"panel\"><div class=\"preview-head\"><div><h2>Élő szekrényrajz</h2><div class=\"mini muted\">Elölnézet + oldalnézet, mellette elölről nézett izometrikus 3D előnézet</div></div><span class=\"pill\">Automatikusan frissül</span></div><div class=\"preview-stage\">\n<div class=\"visual-stage\" id=\"visualEditor\">\n <div class=\"visual-heading\"><div><strong>Nagy szerkezeti szerkesztő</strong><div class=\"mini muted\">Húzd a teljes F/V-sort, vagy bontás után módosíts egyetlen alkatrészt. Kattints a közméret számjára a pontos bevitelhez.</div></div>\n  <div class=\"visual-tools\">\n    <button type=\"button\" id=\"visualZoomOut\">−</button><span class=\"visual-zoom\" id=\"visualZoomValue\">100%</span><button type=\"button\" id=\"visualZoomIn\">+</button><button type=\"button\" id=\"visualZoomReset\">100%</button>\n  </div></div>\n <div class=\"visual-line\" role=\"group\" aria-label=\"Szerkesztési mód\">\n   <label><input type=\"radio\" name=\"visualMode\" value=\"row\" checked> Teljes F/V-sor húzása</label>\n   <label><input type=\"radio\" name=\"visualMode\" value=\"piece\"> Egyedi alkatrész / szakasz</label>\n </div>\n <div class=\"visual-scroll\" id=\"visualScroll\" tabindex=\"0\" aria-label=\"Nagyítható elölnézet vízszintes és függőleges görgetősávval\">\n   <svg id=\"visualSvg\" class=\"visual-svg\" viewBox=\"0 0 1100 850\" role=\"img\" aria-label=\"Húzható F- és V-osztók, állítható polcok és kattintható szabad közméretek\"></svg>\n </div>\n <div class=\"visual-dimension-pop\" id=\"visualDimensionPop\">\n   <label class=\"mini\" id=\"visualExactLabel\" for=\"visualExactInput\">Szabad hézag (mm)</label>\n   <input type=\"number\" min=\"0\" step=\"0.1\" id=\"visualExactInput\" aria-label=\"Pontos szabad közméret milliméterben\">\n   <button type=\"button\" id=\"visualExactApply\">Beállít</button><button type=\"button\" id=\"visualExactCancel\">Mégse</button>\n </div>\n <div class=\"visual-help\" id=\"visualMessage\">Egész sor módban a lapot húzd a közméret megváltoztatásához. Egyedi módban válassz alkatrészt, a végpontjait is módosíthatod; a halványan jelzett szakasz visszaállítható. Az F/V csatlakozások melletti jelölés mutatja, melyik fut végig.</div>\n <div class=\"visual-editor\" id=\"visualPartEditor\"><span class=\"mini muted\">Válassz egy alkatrészt az „Egyedi alkatrész” módban.</span></div>\n</div>\n<div class=\"preview-split\"><div class=\"preview-pane\"><div class=\"preview-label\">2D nézet</div><svg id=\"drawing\" class=\"schematic\" viewBox=\"0 0 720 570\" role=\"img\" aria-label=\"Szekrény sematikus elölnézete és oldalnézete\"></svg></div><div class=\"preview-pane view-panel\"><div class=\"preview-label\">3D nézet · <span id=\"viewName\">Elöl – bal</span></div><div class=\"view-controls\" role=\"group\" aria-label=\"3D nézet választása\"><button type=\"button\" data-view=\"front-left\" class=\"active\">Elöl · bal</button><button type=\"button\" data-view=\"front-right\">Elöl · jobb</button><button type=\"button\" data-view=\"reset\">Visszaállítás</button></div><canvas id=\"isoDrawing\" class=\"schematic\" width=\"520\" height=\"570\" role=\"img\" aria-label=\"Forgatható tömör szekrény 3D nézete\"></canvas><div class=\"view-tip\">Egérrel vagy érintéssel forgasd a szekrényt a 3D rajzon.</div><div class=\"view-tip\" id=\"backDimensionInfo\" aria-live=\"polite\"></div></div></div><div class=\"drawing-caption\">A rajzon a polcok közötti szabad távolságokat írjuk ki. A furatok az oldalnézeten láthatók. A 3D nézet tömör testként mutatja a lapokat elölről, bal vagy jobb nézetből. A falc nem gyártási maráspálya.<div class=\"legend\"><span><i class=\"swatch\"></i> Bútorlap</span><span><i class=\"swatch dot\"></i> Furatozás</span><span><i class=\"swatch\" style=\"background:#6598a2;border-color:#406e7b\"></i> Hátfal</span><span><span style=\"width:16px;border-top:2px dashed #ba8357;display:inline-block\"></span> Falc</span></div></div></div>\n</section>\n<section class=\"panel\"><div class=\"panel-head\"><h2>Alkatrész-előnézet</h2><span class=\"mini muted\">nem gépi szabásterv</span></div><div class=\"parts\"><table><thead><tr><th>Alkatrész</th><th>Db</th><th>Méret (mm)</th><th>Megjegyzés</th></tr></thead><tbody id=\"partsRows\"></tbody></table>\n<div class=\"handoff-toolbar\"><span class=\"small muted\">Az alkatrészek automatikusan frissülnek a Gatterka alkatrészlistájában. Az élzárás és reszelés az Alkatrészek oldalon szerkeszthető.</span></div><div id=\"partsStatus\" class=\"small muted\" role=\"status\"></div></div><div class=\"footnote\">A lapméretek előzetes, szerkezeti méretek. Az élzárás és a megmunkálási ráhagyások még nem részei ennek a mintának, de a hátfal módja már szemléltetve van.</div></section>\n\n</div></div>\n</main></div>\n<script>\n(()=>{\n'use strict';\nconst $=id=>document.getElementById(id);\nconst val=id=>Number($(id).value);\nconst choice=name=>document.querySelector('input[name=\"'+name+'\"]:checked').value;\nconst choiceHdfCut=id=>$(id)?.value==='trim'?'trim':'falc';\nconst clamp=(x,min,max)=>Math.max(min,Math.min(max,x));\nconst fmt=n=>Number.isFinite(n)?(Math.round(n*10)/10).toLocaleString('hu-HU',{maximumFractionDigits:1}):'–';\n// null: automatikusan kiosztott hézag, szám: felhasználó által rögzített hézag.\nlet fixedGaps=[];\nlet shelfBackOverrides=[];\nlet shelfFrontOverrides=[];\nlet shelfDepthOverrides=[];\nlet shelfAngles=[];\nlet verticalGaps=[],horizontalGaps=[],fStarts=[],fEnds=[],vLefts=[],vRights=[];\n// A vizuálisan kivett szakaszok és alkatrészenkénti végpontkorrekciók.\n// Csak szerkezeti geometria, a védett fűrészelési és xMix/xPrg kódot nem módosítja.\nlet visualMaskF=[],visualMaskH={},visualPieceEdits={},visualCuts={},visualRemoved={},visualEdited=false;\nlet visualZoom=100,visualSelected=null,visualDragging=null,visualExact=null;\nfunction visualMaskValue(axis,key,index){\n const row=axis==='f'?visualMaskF[Number(key)]:visualMaskH[String(key)];\n return !Array.isArray(row)||row[index]!==false;\n}\nfunction visualLayout(p){\n const horizontals=horizontalLayout(p).map(x=>({...x,z:p.bodyBottomOffset+(p.hasBottom?p.t:0)+x.level}));\n const f=fPositions(p);\n return {horizontals,f,x0:p.t,x3:p.w-p.t,\n  z0:p.bodyBottomOffset+(p.hasBottom?p.t:0),z3:p.h-(p.hasTop?p.t:0)};\n}\nfunction visualApplyParts(p,base,layout){\n if(!visualEdited)return base;\n const {horizontals,f,x0,x3,z0,z3}=layout;\n const out=[],t=p.t,issues=base.connectionIssues||[];\n const cuts=typeof visualCuts==='undefined'?{}:visualCuts;\n const removed=typeof visualRemoved==='undefined'?{}:visualRemoved;\n const ghosts=[];\n // Kézi vágás: F/V szimmetrikusan, stabil darabkulccsal. A gyermekek\n // saját végpontot, eltolást, anyagot és élzárást kaphatnak.\n const visualSubdivide=(part,axis,depth=0)=>{\n   const loName=axis==='f'?'z1':'x1',hiName=axis==='f'?'z2':'x2';\n   if(part.key.includes('-part-')){\n     const edit=visualPieceEdits[part.key]||{};\n     const length=part[hiName]-part[loName];\n     const start=Math.max(0,Math.min(length-1,Number(edit.start)||0));\n     const end=Math.max(0,Math.min(length-start-1,Number(edit.end)||0));\n     part[loName]+=start;part[hiName]-=end;\n     const shift=Number(edit.shift)||0;\n     if(axis==='f'){part.x1+=shift;part.x2+=shift;}\n     else{part.z1+=shift;part.z2+=shift;}\n     const boundLo=axis==='f'?p.t:z0,boundHi=axis==='f'?p.w-p.t:z3;\n     const physicalLo=axis==='f'?part.x1:part.z1,physicalHi=axis==='f'?part.x2:part.z2;\n     if(physicalLo<boundLo-.01||physicalHi>boundHi+.01)\n       issues.push(part.name+': egyedi lap túllóg a bútor belső részén.');\n     if(start||end||shift)\n       issues.push(part.name+': egyedi eltolás/végpont CNC-csatlakozása ellenőrizendő.');\n   }\n   part.a=Math.round((part[hiName]-part[loName])*10)/10;\n   if(removed[part.key]){\n     ghosts.push({...part,visualRemoved:true});\n     issues.push(part.name+': kivett darab, CNC-csatlakozás ellenőrizendő.');\n     return [];\n   }\n   const cut=cuts[part.key];\n   if(cut&&depth<5&&(part.kind==='f'||part.kind==='v')){\n     const length=part[hiName]-part[loName];\n     const gap=Math.max(2,Math.min(100,Number(cut.gap)||30));\n     const ratio=Math.max(.2,Math.min(.8,Number(cut.ratio)||.5));\n     if(length>=gap+60){\n       const middle=part[loName]+length*ratio;\n       const leftEnd=middle-gap/2,rightStart=middle+gap/2;\n       const a={...part,key:part.key+'-part-a',name:part.name+' · A',\n         [hiName]:leftEnd,visualBaseStart:part[loName],visualBaseEnd:leftEnd};\n       const b={...part,key:part.key+'-part-b',name:part.name+' · B',\n         [loName]:rightStart,visualBaseStart:rightStart,visualBaseEnd:part[hiName]};\n       if(axis==='f'){a.visualOriginalZ2=leftEnd;b.visualOriginalZ1=rightStart;}\n       else{a.visualOriginalX2=leftEnd;b.visualOriginalX1=rightStart;}\n       issues.push(part.name+': kézi F/V darabolás, CNC-kötések ellenőrzendők.');\n       return [...visualSubdivide(a,axis,depth+1),...visualSubdivide(b,axis,depth+1)];\n     }\n   }\n   return part.a>.01?[part]:[];\n };\n const segmentBoards=(board,axis)=>{\n  const count=axis==='f'?horizontals.length+1:f.length+1;\n  const maskKey=axis==='f'?board.index:board.kind+'-'+board.index;\n  const active=Array.from({length:count},(_,i)=>visualMaskValue(axis,maskKey,i));\n  const runs=[];let start=-1;\n  for(let k=0;k<=count;k++){\n   if(k<count&&active[k]){if(start<0)start=k;}\n   else if(start>=0){runs.push([start,k]);start=-1;}\n  }\n  const result=[];\n  for(const [a,b] of runs){\n   const lo=axis==='f'?(a===0?z0:horizontals[a-1].z+t/2):\n     (a===0?x0:f[a-1].center+t/2);\n   // A megtartott [a,b) rekeszek vége a (b-1). osztó előtti él;\n   // b. osztó választása egy teljes rekesszel hosszabb, hibás alkatrészt adott.\n   const hi=axis==='f'?(b===count?z3:horizontals[b-1].z-t/2):\n     (b===count?x3:f[b-1].center-t/2);\n   const lower=axis==='f'?'z1':'x1',upper=axis==='f'?'z2':'x2';\n   const start=Math.max(board[lower],lo),end=Math.min(board[upper],hi);\n   if(end-start<1)continue;\n   const key=result.length?'':board.key;\n   const fragment={...board,key:key||board.key+'-cut-'+a,\n     [lower]:start,[upper]:end,visualBaseStart:start,visualBaseEnd:end,\n     // Az elhúzott darab eredeti fizikai csatlakozási élei a horgonypontok.\n     // A V és F szakaszok kapcsolata nem az egész sor rácsától függ.\n     visualOriginalX1:axis==='f'?board.x1:start,\n     visualOriginalX2:axis==='f'?board.x2:end,\n     visualOriginalZ1:axis==='f'?start:board.z1,\n     visualOriginalZ2:axis==='f'?end:board.z2,\n     visualAxis:axis,visualMaskKey:String(maskKey),visualRun:[a,b]};\n   result.push(fragment);\n  }\n  return result;\n };\n for(const board of base){\n  if(!['f','v','shelf'].includes(board.kind)){out.push(board);continue;}\n  const axis=board.kind==='f'?'f':'h',items=segmentBoards(board,axis);\n  for(const piece of items){\n   const edit=visualPieceEdits[piece.key]||{};\n   const lower=axis==='f'?'z1':'x1',upper=axis==='f'?'z2':'x2';\n   const maxTrim=Math.max(0,piece[upper]-piece[lower]-1);\n   const st=Math.min(maxTrim,Math.max(0,Number(edit.start)||0));\n   const en=Math.min(maxTrim-st,Math.max(0,Number(edit.end)||0));\n   piece[lower]+=st;piece[upper]-=en;\n   const shift=Number(edit.shift)||0;\n   if(shift){\n    if(axis==='f'){piece.x1+=shift;piece.x2+=shift;}\n    else{piece.z1+=shift;piece.z2+=shift;}\n   }\n   const minPos=axis==='f'?p.t:z0,maxPos=axis==='f'?p.w-p.t:z3;\n   const pLo=axis==='f'?piece.x1:piece.z1,pHi=axis==='f'?piece.x2:piece.z2;\n   if(pLo<minPos-.01||pHi>maxPos+.01)\n     issues.push(piece.name+': a külön elhúzott alkatrész kilógna a belső térből.');\n   piece.a=Math.round((axis==='f'?piece.z2-piece.z1:piece.x2-piece.x1)*10)/10;\n   if(piece.a>0)out.push(...visualSubdivide(piece,axis));\n   if(st||en||shift)issues.push(piece.name+': az egyedi lapvég/eltolás CNC-csatlakozását ellenőrizni kell.');\n  }\n }\n\n // Kétirányú csatlakozási követés: F-rész vízszintes eltolására a hozzá\n // valóban hozzákötött V/polc éle követi az F új élét; fordítva V-elem\n // függőleges eltolására a hozzá kapcsolódó F-vég is fel/le mozdul.\n // A kötési referenciát az eredeti fizikai lapél tárolja, nem a közös\n // sor rácsvonala, ez roup.Y[0]*sd,rearHole=sideX+group.Y[1]*sd;\n       for(let j=0;j<group.count;j++){\n         const height=group.bottom+j*group.step;\n         const cy=fullBottom-height*s,rr=2.35;\n         svg+=`<circle cx=\"${frontHole}\" cy=\"${cy}\" r=\"${rr}\" fill=\"#5c8870\"/><circle cx=\"${rearHole}\" cy=\"${cy}\" r=\"${rr}\" fill=\"#5c8870\"/>`;\n       }\n     }\n   }\n }\n svg+=line(sideX,drawBottom+31,sideX+sideW,drawBottom+31)+line(sideX,drawBottom+23,sideX,drawBottom+39)+line(sideX+sideW,drawBottom+23,sideX+sideW,drawBottom+39);\n svg+=text(sideX+sideW/2,drawBottom+49,fmt(p.d)+' mm',12);\n return svg;\n}\n// Választható / szabadon forgatható elölről induló 3D nézet.\n// A kamera elölnézetnél az y=0 oldalon áll, ezért a nyitott szekrény eleje néz felénk.\nlet viewYaw=-32, viewElev=25;\nconst CAMERA_PRESETS={\n 'front-left':[-32,25,'Elöl – bal'],\n 'front-right':[32,25,'Elöl – jobb']\n};\nfunction isoDrawing(p,levels){\n // A szoftveres Z-puffer minden képpontnál eldönti, melyik TÖMÖR bútorlap\n // van a kamerához legközelebb. Nincs réteg- vagy sorrendhiba forgatáskor.\n const canvas=$('isoDrawing'),ctx=canvas.getContext('2d',{alpha:false});\n if(!ctx)return;\n const W=520,H=570;\n const img=ctx.createImageData(W,H),px=img.data;\n const zbuf=new Float32Array(W*H);zbuf.fill(-Infinity);\n for(let k=0;k<W*H;k++){\n   const i=4*k;px[i]=244;px[i+1]=247;px[i+2]=242;px[i+3]=255;\n }\n const yaw=viewYaw*Math.PI/180,elev=viewElev*Math.PI/180;\n const c=Math.cos(yaw),si=Math.sin(yaw),ce=Math.cos(elev),se=Math.sin(elev);\n const legH=p.hasLegs?100:0;\n const sx=Math.min(190/p.w,.46),sy=Math.min(145/p.d,.40),sz=Math.min(318/(p.h+legH),.2);\n function project(v){\n   const xx=(v[0]-p.w/2)*sx,yy=(v[1]-p.d/2)*sy,zz=(v[2]-(p.h-legH)/2)*sz;\n   const horiz=xx*c+yy*si,front=xx*si-yy*c;\n   return [260+horiz,279-zz*ce+front*se,front*ce+zz*se];\n }\n const rgb=hex=>[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];\n const material={top:rgb('#dbbd96'),front:rgb('#b89265'),back:rgb('#ab8358'),left:rgb('#c19e72'),right:rgb('#b28c61'),bottom:rgb('#94724f')};\n const backMat={top:rgb('#a0cad0'),front:rgb('#69a3ad'),back:rgb('#5b929b'),left:rgb('#82b3bc'),right:rgb('#71a5ae'),bottom:rgb('#4b7e88')};\n const shelfMat={top:rgb('#d5b18a'),front:rgb('#a47b4d'),back:rgb('#987044'),left:rgb('#b58f61'),right:rgb('#b58f61'),bottom:rgb('#8f6a40')};\n const legMat={top:rgb('#778d7f'),front:rgb('#687e72'),back:rgb('#566f62'),left:rgb('#5e7466'),right:rgb('#6b8174'),bottom:rgb('#4f6356')};\n function triangle(v0,v1,v2,color){\n   const a=project(v0),b=project(v1),d=project(v2);\n   const den=(b[1]-d[1])*(a[0]-d[0])+(d[0]-b[0])*(a[1]-d[1]);\n   if(Math.abs(den)<.000001)return;\n   const minx=Math.max(0,Math.floor(Math.min(a[0],b[0],d[0]))),maxx=Math.min(W-1,Math.ceil(Math.max(a[0],b[0],d[0])));\n   const miny=Math.max(0,Math.floor(Math.min(a[1],b[1],d[1]))),maxy=Math.min(H-1,Math.ceil(Math.max(a[1],b[1],d[1])));\n   for(let y=miny;y<=maxy;y++)for(let x=minx;x<=maxx;x++){\n     const w0=((b[1]-d[1])*(x+.5-d[0])+(d[0]-b[0])*(y+.5-d[1]))/den;\n     if(w0<-.000001)continue;\n     const w1=((d[1]-a[1])*(x+.5-d[0])+(a[0]-d[0])*(y+.5-d[1]))/den;\n     const w2=1-w0-w1;\n     if(w1<-.000001||w2<-.000001)continue;\n     const z=w0*a[2]+w1*b[2]+w2*d[2];const ii=y*W+x;\n     if(z<=zbuf[ii])continue;\n     zbuf[ii]=z;\n     const j=ii*4;px[j]=color[0];px[j+1]=color[1];px[j+2]=color[2];\n   }\n }\n function quad(a,b,c,d,color){triangle(a,b,c,color);triangle(a,c,d,color);}\n function hexa(vertices,colors){\n   // 8 csúcs: elöl-alul bal/jobb, hátul-alul bal/jobb, elöl-felül, hátul-felül.\n   const v=vertices;\n   quad(v[4],v[5],v[7],v[6],colors.top);\n   quad(v[0],v[1],v[5],v[4],colors.front);\n   quad(v[3],v[2],v[6],v[7],colors.back);\n   quad(v[2],v[0],v[4],v[6],colors.left);\n   quad(v[1],v[3],v[7],v[5],colors.right);\n   quad(v[2],v[3],v[1],v[0],colors.bottom);\n }\n function board(x1,x2,y1,y2,z1,z2,colors=material){\n   hexa([[x1,y1,z1],[x2,y1,z1],[x1,y2,z1],[x2,y2,z1],\n         [x1,y1,z2],[x2,y1,z2],[x1,y2,z2],[x2,y2,z2]],colors);\n }\n // Falcos vagy teljes hát: mindkettő színezett tömör test.\n if(p.fullBack){\n   const bottom=p.bodyBottomOffset+(p.hasBottom?p.t:0),top=p.hasTop?p.h-p.t:p.h;\n   const rear=Math.max(0,p.d-p.fullBackSetback);\n   board(p.t,p.w-p.t,Math.max(0,rear-p.t),rear,bottom,top,backMat);\n }else if(p.rabbet){\n   const rearStart=Math.max(0,p.d-Math.max(p.rabbetWidth,4));\n   board(5.5,p.w-5.5,rearStart,Math.min(p.d,rearStart+4),p.hdfBottomOffset,p.h-p.hdfTopOffset,backMat);\n }\n for(const piece of fixedDividerPieces(p)){\n   const x1=piece.x1,x2=piece.x2,y1=piece.y0,y2=piece.y1,lo=piece.z1,hi=piece.z2;\n   if(piece.kind==='shelf'){\n     // 2D oldalnézet: hátul feljebb = képernyő Y negatív;\n     // 3D fizikai Z pozitív, ezért itt a dőlés ELŐJELE pozitív.\n     const tilt=Math.tan(piece.angle*Math.PI/180)*(y2-y1);\n     hexa([[x1,y1,lo],[x2,y1,lo],[x1,y2,lo+tilt],[x2,y2,lo+tilt],\n           [x1,y1,hi],[x2,y1,hi],[x1,y2,hi+tilt],[x2,y2,hi+tilt]],shelfMat);\n   }else board(x1,x2,y1,y2,lo,hi,piece.kind==='v'?shelfMat:material);\n }\n if(p.hasBottom){const x1=p.bottom==='between'?p.t:0,x2=p.bottom==='between'?p.w-p.t:p.w;board(x1,x2,0,p.d,p.bodyBottomOffset,p.bodyBottomOffset+p.t);}\n if(p.hasBottom&&p.falseBottom)board(-.5,p.w+.5,0,p.d,0,p.t);\n if(p.hasTop){const x1=p.top==='between'?p.t:0,x2=p.top==='between'?p.w-p.t:p.w;board(x1,x2,0,p.d,p.h-p.t,p.h);}\n // Oldallapok mindig megvannak; a Z-puffer takarja az oldal mögötti polcokat.\n const sideZ0=p.bodyBottomOffset+(p.hasBottom&&p.bottom==='full'?p.t:0);\n const sideZ1=p.h-(p.hasTop&&p.top==='full'?p.t:0);\n board(0,p.t,0,p.d,sideZ0,sideZ1);\n board(p.w-p.t,p.w,0,p.d,sideZ0,sideZ1);\n // Négy külön, kizárólag vizuális bútorláb; nem gyártandó alkatrész.\n if(p.hasLegs)for(const cx of [59,p.w-59])for(const cy of [59,p.d-59])\n   board(cx-14,cx+14,cy-14,cy+14,-100,0,legMat);\n ctx.putImageData(img,0,0);\n ctx.font='700 14px Segoe UI,Arial,sans-serif';ctx.textAlign='center';ctx.fillStyle='#336345';\n ctx.fillText('FORGATHATÓ 3D SZEKRÉNY · TÖMÖR LAPOK',260,30);\n ctx.font='11px Segoe UI,Arial,sans-serif';ctx.fillStyle='#718475';\n ctx.fillText(`Nézet: ${$('viewName').textContent} · felülről ${fmt(viewElev)}° · külmagasság ${fmt(p.h+legH)} mm`,260,546);\n}\nfunction set3DView(name){\n if(name==='reset')name='front-left';\n const preset=CAMERA_PRESETS[name];if(!preset)return;\n [viewYaw,viewElev]=preset;\n document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===name));\n $('viewName').textContent=preset[2];\n render();\n}\nfunction install3DRotation(){\n const el=$('isoDrawing');let dragging=false,lastX=0,lastY=0;\n el.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;dragging=true;lastX=e.clientX;lastY=e.clientY;el.classList.add('dragging');el.setPointerCapture?.(e.pointerId);});\n el.addEventListener('pointermove',e=>{\n   if(!dragging)return;\n   const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;\n   viewYaw=((viewYaw-dx*.5+180)%360+360)%360-180;\n   viewElev=clamp(viewElev+dy*.35,8,85);\n   document.querySelectorAll('[data-view]').forEach(b=>b.classList.remove('active'));\n   $('viewName').textContent='Egyedi nézet';\n   render();\n });\n const stop=e=>{dragging=false;el.classList.remove('dragging');try{if(el.hasPointerCapture?.(e.pointerId))el.releasePointerCapture(e.pointerId);}catch{}};\n el.addEventListener('pointerup',stop);el.addEventListener('pointercancel',stop);\n document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>set3DView(b.dataset.view)));\n}\nfunction fixedDividerPieces(p){\n // Minden alkatrész geometriai testét egyetlen helyen állítjuk elő: ugyanazt\n // használja az elölnézet, a 3D előnézet és a továbbadott alkatrészlista.\n const boards=[];\n const x0=p.t,x3=p.w-p.t,t=p.t;\n const z0=p.bodyBottomOffset+(p.hasBottom?t:0),z3=p.h-(p.hasTop?t:0);\n const y0=p.front,y1=p.d-baseShelfBack(p),minSize=.01;\n const levels=horizontalLayout(p).map(el=>({...el,z:z0+el.level,key:el.kind+'-'+el.index}));\n const refs=new Map(levels.map(el=>[el.key,el.z]));\n const issues=[];\n const fLocations=fPositions(p).map(item=>{\n  // Az egyedi hézagok egymás után következnek. A túlfutó F-osztót\n  // NEM rajzoljuk a bútoron kívülre, és nem adjuk CNC gyártásba.\n  if(item.center-t/2<x0-minSize||item.center+t/2>x3+minSize){\n   issues.push('F-osztó '+(item.index+1)+': a megadott bal oldali hézaggal kilógna a szekrényből. Csökkentsd a szabad hézagokat.');\n   return null;\n  }\n  const lower=fStarts[item.index]||'bottom',upper=fEnds[item.index]||'top';\n  const validLow=lower==='bottom'||refs.has(lower);\n  const validHigh=upper==='top'||refs.has(upper);\n  const low=lower==='bottom'?z0:refs.get(lower)+t/2;\n  const high=upper==='top'?z3:refs.get(upper)-t/2;\n  if(!validLow||!validHigh||!(high-low>minSize)){\n   issues.push('F-osztó '+(item.index+1)+': az alsó csatlakozásnak a felső alatt kell lennie, létező polcon vagy V-osztón.');\n   return null;\n  }\n  return {...item,x1:item.center-t/2,x2:item.center+t/2,z1:low,z2:high};\n }).filter(Boolean);\n const fByIndex=new Map(fLocations.map(item=>[item.index,item]));\n const vRanges=new Map();\n for(const v of levels.filter(el=>el.kind==='v')){\n  const left=(typeof vLefts==='undefined'?null:vLefts[v.index])||'left';\n  const right=(typeof vRights==='undefined'?null:vRights[v.index])||'right';\n  const fLeft=/^f-(\\d+)$/.exec(left),fRight=/^f-(\\d+)$/.exec(right);\n  const l=left==='left'?x0:fLeft?fByIndex.get(Number(fLeft[1])):null;\n  const r=right==='right'?x3:fRight?fByIndex.get(Number(fRight[1])):null;\n  const touches=f=>f&&v.z>=f.z1-minSize&&v.z<=f.z2+minSize;\n  const lx=typeof l==='number'?l:touches(l)?l.x2:NaN;\n  const rx=typeof r==='number'?r:touches(r)?r.x1:NaN;\n  if(!Number.isFinite(lx)||!Number.isFinite(rx)||!(rx-lx>minSize)){\n   issues.push('V-osztó '+(v.index+1)+': a bal csatlakozásnak a jobb előtt kell lennie, és az F-osztónak el kell érnie a V-osztó magasságát.');\n  }else vRanges.set(v.index,{x1:lx,x2:rx});\n }\n // F-osztó csak akkor támaszkodhat V-osztóra, ha a V ténylegesen\n // az F teljes vastagsága alatt/fölött halad át.\n for(const f of fLocations){\n  for(const key of [fStarts[f.index]||'bottom',fEnds[f.index]||'top']){\n   const vMatch=/^v-(\\d+)$/.exec(key);\n   if(!vMatch)continue;\n   const span=vRanges.get(Number(vMatch[1]));\n   if(!span||span.x1>f.x1+minSize||span.x2<f.x2-minSize)\n    issues.push('F-osztó '+(f.index+1)+': a választott V-osztó nem ér az F-osztó alá/fölé.');\n  }\n }\n function emit(kind,index,x1,x2,z1,z2,depth,angle,segment,total){\n  if(x2-x1<=minSize||z2-z1<=minSize||depth<=minSize)return;\n  const id=kind==='shelf'?'shelf-':kind==='v'?'v-divider-':'f-divider-';\n  const main=id+(index+1);\n  const key=total>1?main+'-section-'+(segment+1):main;\n  const title=kind==='shelf'?'Polc ':kind==='v'?'V-osztó ':'F-osztó ';\n  const name=title+(index+1)+(total>1?' · '+(segment+1)+'. rész':'');\n  const front=kind==='shelf'?shelfFrontAt(p,index):kind==='v'?p.vSetback:p.fSetback;\n  boards.push({key,name,kind,index,x1,x2,y0:front,y1:front+depth,z1,z2,angle:angle||0,\n   a:kind==='f'?z2-z1:x2-x1,b:kind==='shelf'?depth/Math.cos((angle||0)*Math.PI/180):depth,\n   undercutDegrees:kind==='shelf'?Math.abs(angle||0):0,\n   drilling:kind==='v'||kind==='shelf'&&Math.abs(angle||0)>.001?'fixed':p.drilling,\n   thickness:t});\n }\n // A polcok mindig átmenő vízszintes lapok az F-osztókhoz képest;\n // a V-osztó átmenő vagy megszakított a felhasználó választása szerint.\n for(const item of levels){\n  const isShelf=item.kind==='shelf';\n  const span=isShelf?{x1:x0,x2:x3}:vRanges.get(item.index);\n  if(!span)continue;\n  const split=isShelf||p.dividerThrough!=='v'||!p.fCount;\n  const fCuts=split?fLocations.filter(f=>item.z>=f.z1-.001&&item.z<=f.z2+.001\n   &&f.x1>=span.x1-minSize&&f.x2<=span.x2+minSize)\n   .sort((a,b)=>a.center-b.center):[];\n  const limits=[];\n  let x=span.x1;\n  for(const cut of fCuts){\n   if(cut.x1-x>minSize)limits.push([x,cut.x1]);\n   x=Math.max(x,cut.x2);\n  }\n  if(span.x2-x>minSize)limits.push([x,span.x2]);\n  const depth=isShelf?shelfDepthAt(p,item.index):Math.max(0,y1-p.vSetback);\n  const angle=isShelf?shelfAngleAt(item.index):0;\n  limits.forEach(([left,right],j)=>emit(item.kind,item.index,left,right,item.z-t/2,item.z+t/2,\n    depth,angle,j,limits.length));\n }\n // F-osztók: V-osztó végigmenő beállításnál a V-k síkjánál külön darabok.\n for(const f of fLocations){\n  const intersect=p.vCount&&p.dividerThrough==='v'\n   ?levels.filter(el=>el.kind==='v'&&el.z>f.z1&&el.z<f.z2\n     &&vRanges.has(el.index)&&vRanges.get(el.index).x1<f.x1+minSize\n     &&vRanges.get(el.index).x2>f.x2-minSize).sort((a,b)=>a.z-b.z):[];\n  const limits=[];\n  let z=f.z1;\n  for(const v of intersect){\n   if(v.z-t/2-z>minSize)limits.push([z,v.z-t/2]);\n   z=Math.max(z,v.z+t/2);\n  }\n  if(f.z2-z>minSize)limits.push([z,f.z2]);\n  limits.forEach(([bottom,top],j)=>emit('f',f.index,f.x1,f.x2,bottom,top,Math.max(0,y1-p.fSetback),0,j,limits.length));\n }\n boards.connectionIssues=issues;\n // A különálló CNC-geometriai egységtesztek csak a gyártási\n // függvényeket emelik ki; vizuális szerkesztő nélkül a régi modell él.\n return typeof visualApplyParts==='function'\n  ?visualApplyParts(p,boards,{horizontals:levels,f:fPositions(p),x0,x3,z0,z3})\n  :boards;\n}\n\n\nfunction cncSupportRegions(p,boards,which){\n  if(p.drilling==='fixed')return {segments:[],issues:[]};\n  const t=Number(p.t),eps=.08;\n  const bottomOrigin=Number(p.bodyBottomOffset||0)+\n    (p.hasBottom&&p.bottom==='full'?t:0);\n  // A REF BX=0 a saját oldallap alsó CNC-nullpontja, nem a fenék\n  // lapvastagságának felső síkja. A felhasználói 609→600 példa így igaz.\n  const innerTop=Number(p.h)-(p.hasTop?t:0);\n  const first=0,last=innerTop-bottomOrigin;\n  const sideEdge=which==='left'?t:Number(p.w)-t;\n  const touches=q=>which==='left'?Math.abs(q.x1-sideEdge)<eps:\n    Math.abs(q.x2-sideEdge)<eps;\n  const vBlocks=boards.filter(q=>q.kind==='v'&&touches(q))\n    .map(q=>({lo:q.z1-bottomOrigin,hi:q.z2-bottomOrigin}))\n    .sort((a,b)=>a.lo-b.lo);\n  const unique=[];\n  for(const v of vBlocks){\n    if(!unique.length||Math.abs(unique[unique.length-1].lo-v.lo)>.1)\n      unique.push(v);\n  }\n  const issues=[],segments=[];\n  const gapBottom=Number(p.cncGapBottom??0),gapTop=Number(p.cncGapTop??0),\n    gapV=Number(p.cncGapDivider??0),step=Number(p.raster??32),\n    inset=Number(p.supportInset??50);\n  if(![gapBottom,gapTop,gapV,inset,step,first,last].every(Number.isFinite)||\n     [gapBottom,gapTop,gapV,inset].some(x=>x<0||x>300)||\n     step<8||step>200||!(last>first))\n    return {segments:[],issues:['Érvénytelen REF furathatár vagy kihagyás']};\n  if(unique.some(v=>v.lo<first-.01||v.hi>last+.01||v.hi<=v.lo)){\n    return {segments:[],issues:['A V-osztó a CNC belső magasságán kívül van']};\n  }\n  let low=first;\n  const regions=[...unique.map(v=>({to:v.lo,next:v.hi})),{to:last,next:last}];\n  for(let i=0;i<regions.length;i++){\n    const upper=regions[i].to;\n    const bx=low+(i===0?gapBottom:gapV);\n    const top=upper+(0)-(i===regions.length-1?gapTop:gapV);\n    if(!(top>bx+.01)){\n      issues.push((i+1)+'. CNC rekesz: a kihagyások nagyobbak a szabad magasságnál');\n      low=regions[i].next;continue;\n    }\n    const shelves=boards.filter(q=>q.kind==='shelf'&&touches(q)&&\n      (q.z1+q.z2)/2-bottomOrigin>low+.01&&\n      (q.z1+q.z2)/2-bottomOrigin<upper-.01);\n    const count=new Set(shelves.map(x=>x.index)).size;\n    if(p.drilling==='local'&&!count){low=regions[i].next;continue;}\n    // Az egyedi V-osztó magasság megengedett. Q>0-nál azonban\n    // az adott rekesz polcainak tényleg egyenletesnek kell lenniük.\n    // Ellenkező esetben a POLC makró rossz polcmagasságnál fúrna.\n    if(p.drilling==='local'&&p.distribution==='manual'){\n      const levels=[...new Map(shelves.map(q=>[q.index,\n        (q.z1+q.z2)/2-bottomOrigin])).values()].sort((x,y)=>x-y);\n      const ideal=levels.map((_,j)=>bx+(j+1)*(top-bx)/(levels.length+1));\n      if(levels.some((v,j)=>Math.abs(v-ideal[j])>0.5)){\n        issues.push((i+1)+'. CNC rekesz: a nem egyenletes polcmagasság nem alakítható POLC Q kiosztássá');\n        low=regions[i].next;continue;\n      }\n    }\n    const front=Math.max(Number(p.front)||0,...shelves.map(q=>q.y0));\n    const back=Math.min(Number(p.d)-baseShelfBack(p),...shelves.map(q=>q.y1));\n    const yFront=front+inset,yBack=back-inset;\n    if(!(yFront>=0&&yBack>yFront+.01&&yBack<=Number(p.d))){\n      issues.push((i+1)+'. CNC rekesz: nincs két biztonságos polctartó-furatvonal');\n      low=regions[i].next;continue;\n    }\n    segments.push({index:i,DX:Number((top-bx).toFixed(3)),\n      BX:Number(bx.toFixed(3)),Y:[Number(yFront.toFixed(3)),Number(yBack.toFixed(3))],\n      Q:p.drilling==='full'?0:count,s:step});\n    low=regions[i].next;\n  }\n  return {segments,issues};\n}\n\n\n// Az egyedi polctartó-furatok közös, rajz/CNC geometriája:\n// a referenciamagasság a polc ALSÓ síkja mínusz 2,5 mm.\n// Hármas furatnál az alsó furat további 32 mm-rel lejjebb van.\n// Xilog oldallap X nullpontja viszont FELÜL van: az XBO X-et ezért\n// a fizikailag LEGELSŐ, legmagasabban fekvő furatra adjuk meg, hogy\n// a pozitív x raszter a helyes, lefelé haladó furatokat képezze.\nfunction cncShelfHoleGroup(p,shelf){\n  const count=Number(p.holes),step=Number(p.raster),inset=Number(p.supportInset);\n  const t=Number(p.t),sideBottom=Number(p.bodyBottomOffset||0)+\n    (p.hasBottom&&p.bottom==='full'?t:0);\n  const sideTop=Number(p.h)-(p.hasTop&&p.top==='full'?t:0);\n  const bottom=Number(shelf.z1)-2.5-(count-1)*step/2;\n  const top=bottom+(count-1)*step;\n  const yFront=Number(shelf.y0)+inset,yRear=Number(shelf.y1)-inset;\n  const issues=[];\n  if(!Number.isInteger(count)||count<1||count>9||\n     ![step,inset,bottom,top,yFront,yRear,sideBottom,sideTop].every(Number.isFinite)||\n     step<8||step>200||inset<0||inset>200){\n    issues.push('Érvénytelen egyedi polctartó furatszám/raszter/eltolás.');\n  }else{\n    if(bottom<sideBottom-.001||top>sideTop+.001)\n      issues.push('Az egyedi polctartó XBO furatcsoportja túllépné az oldallap hosszát.');\n    if(yFront<0||yRear>Number(p.d)||yRear<=yFront+.001)\n      issues.push('Az egyedi polctartó első/hátsó furatsora a lap mélységén kívül van.');\n    if(t<13)issues.push('Az XBO z=13 mm-hez legalább 13 mm-es oldallap szükséges.');\n  }\n  return {issues,X:Number((sideTop-top).toFixed(3)),\n    Y:[Number(yFront.toFixed(3)),Number(yRear.toFixed(3))],\n    bottom,top,count,step,z:13,V:1,D:5,N:'P',F:1};\n}\n// Egyedi kiosztás: polconként és oldalanként KÉT XBO sor, a rajzon\n// használt tényleges első/hátsó polcvisszaállás alapján.\nfunction cncIndividualShelfXbo(p,boards,which){\n  const t=Number(p.t),eps=.07;\n  const edge=which==='left'?t:Number(p.w)-t;\n  const touches=shelf=>which==='left'?\n    Math.abs(shelf.x1-edge)<eps:Math.abs(shelf.x2-edge)<eps;\n  const shelves=boards.filter(shelf=>shelf.kind==='shelf'&&touches(shelf));\n  const barriers=boards.filter(board=>board.kind==='v'&&touches(board));\n  const operations=[],issues=[],dedupe=new Set();\n  for(const shelf of shelves){\n    if(Math.abs(Number(shelf.angle)||0)>.001||Math.abs(Number(shelf.undercutDegrees)||0)>.001){\n      issues.push(shelf.name+': a döntött polc egyedi XBO polctartófúrása nincs hitelesítve.');\n      continue;\n    }\n    const group=cncShelfHoleGroup(p,shelf);\n    if(group.issues.length){issues.push(...group.issues.map(x=>shelf.name+': '+x));continue;}\n    for(const barrier of barriers){\n      let overlap=false;\n      for(let k=0;k<group.count;k++){\n        const height=group.bottom+k*group.step;\n        if(height>barrier.z1-eps&&height<barrier.z2+eps)overlap=true;\n      }\n      if(overlap)issues.push(shelf.name+': az XBO furatcsoport egy V-osztó csatlakozását metszené.');\n    }\n    for(const Y of group.Y){\n      const key=group.X+'|'+Y+'|'+group.count+'|'+group.step;\n      if(dedupe.has(key))continue;dedupe.add(key);\n      operations.push({macro:'XBO',X:group.X,Y,z:13,V:1,R:group.count,\n        x:group.step,y:0,D:5,N:'P',F:1,face:'primary'});\n    }\n  }\n  return {operations,issues};\n}\n\nfunction buildCncInstancesForParts(p,records){\n // Minden furat a fixedDividerPieces() tényleges szerkezeti testéről származik.\n // A makró az x/y szakasz kezdete és hossza alapján szerszámkiosztást\n // végzi; itt SEMMIFÉLE egyedi átmérőt vagy távolságot nem találunk ki.\n const t=p.t,eps=.07,boards=fixedDividerPieces(p),horiz=boards.filter(q=>q.kind==='shelf'||q.kind==='v');\n const vertical=boards.filter(q=>q.kind==='f'),byKey=new Map(),overlap=(a,b,c,d)=>[Math.max(a,c),Math.min(b,d)];\n const near=(a,b)=>Math.abs(a-b)<=eps,positive=n=>Number.isFinite(n)&&n>eps;\n // Az F-osztók tényleges fizikai X helye szerinti balról jobbra sorrend.\n // Egy osztó több függőleges részre is eshet, mindegyik ugyanazt a\n // -IJ/-LK felrakási térfelet örökli.\n const fColumns=[...new Set(vertical.map(f=>f.index))].sort((i,j)=>\n   vertical.find(f=>f.index===i).x1-vertical.find(f=>f.index===j).x1);\n const fRank=f=>fColumns.indexOf(f.index);\n const stagger=15; // A 3 beküldött Xilog .pgm minta: Y=15, y=DY-30.\n function make(key,name,dx,dy,side='IJ'){\n   const e={key,name,dx,dy,dz:t,side,operations:[],issues:[]};\n   byKey.set(key,e);return e;\n }\n function op(entry,macro,fields,joint='fixed',face='primary'){\n   if(!entry)return;\n   const o={macro,face,joint,...fields};\n   const vals=['X','Y','x','y'].filter(k=>o[k]!==undefined).map(k=>o[k]);\n   if(vals.some(v=>!Number.isFinite(v)||v<-.001)||('x'in o)&&o.x<=eps||('y'in o)&&o.y<=eps){\n     entry.issues.push('Érvénytelen csatlakozási kezdőpont vagy szakaszhossz');\n   }else entry.operations.push(o);\n }\n function fJoint(entry,macro,fields,shifted=false,face='primary'){\n   // Az első bal oldali polc G=1 teljes mélységű, a jobb szekció\n   // ELF3 furata Y=15, y=DY-30, G=2. A köztes polc mindkét\n   // F-hez csatlakozó rövid élén ugyanilyen eltolás szükséges.\n   const margin=shifted?stagger:0;\n   const len=fields.y-2*margin;\n   if(!Number.isFinite(len)||len<=eps){\n     entry.issues.push('Az F-osztóhoz tartozó eltolt furatsornak legalább 30 mm mélység kell');\n     return;\n   }\n   const args={...fields,Y:fields.Y+margin,y:len};\n   if(shifted){\n     args.shiftedF=true;\n     if(macro==='ELF2'||macro==='ELF3')args.gOverride=2;\n   }\n   op(entry,macro,args,'divider',face);\n }\n // Az oldalak egy sorban, de KÜLÖN fizikai IJ és LK XXL-programban mennek ki.\n // X = oldallap felső élétől LEFELÉ, Y = elülső élétől a hátfal irányába.\n const topZ=p.h-(p.hasTop&&p.top==='full'?t:0);\n const left=make('side-left','Bal oldal',p.sideH,p.d,'IJ');\n const right=make('side-right','Jobb oldal',p.sideH,p.d,'LK');\n if(boards.connectionIssues?.length)left.issues.push(...boards.connectionIssues);\n for(const h of horiz){\n   // Az állítható polc oldallapján a fix kötésfurat helyett\n   // kizárólag a REF / POLC polctartó készül.\n   if(h.kind==='shelf'&&p.drilling!=='fixed')continue;\n   const yy=h.y1-h.y0,x=topZ-(h.z1+h.z2)/2;\n   if(!positive(yy))continue;\n   if(near(h.x1,t)){\n     if(h.undercutDegrees>0.001)left.issues.push('Döntött polc: ferde fixfúrás CNC-makrója nem hitelesített');\n     else op(left,'LAPA',{X:x,Y:h.y0,y:yy});\n   }\n   if(near(h.x2,p.w-t)){\n     if(h.undercutDegrees>0.001)right.issues.push('Döntött polc: ferde fixfúrás CNC-makrója nem hitelesített');\n     else op(right,'LAPA',{X:x,Y:h.y0,y:yy});\n   }\n }\n // Közémenő tető/fenék: oldallapi középvonali lapfurat.\n // Végigmenőnél az oldallap élén a referencia ELF3/ELF2 Y-irányú.\n for(const [name,flag,join,z] of [\n   ['top',p.hasTop,p.top,p.h-t/2],\n   ['bottom',p.hasBottom,p.bottom,p.bodyBottomOffset+t/2]\n ]){\n   if(!flag)continue;\n   for(const side of [left,right]){\n     if(join==='between')op(side,'LAPA',{X:topZ-z,Y:0,y:p.d});\n     else if(join==='full')op(side,name==='top'?'ELF3':'ELF2',{Y:0,y:p.d});\n   }\n }\n // Végigfúrt polctartósor: a meglévő, hitelesített REF/POLC makró megmarad.\n // Egyedi magassági kiosztás: MINDEN polc első és hátsó XBO furatcsoportja\n // külön, a polc tényleges alsó síkjához és a 2,5 mm-es eltéréshez kötve.\n for(const [which,entry] of [['left',left],['right',right]]){\n   if(p.drilling==='local'){\n     const groups=cncIndividualShelfXbo(p,boards,which);\n     entry.issues.push(...groups.issues);\n     entry.operations.push(...groups.operations);\n   }else if(p.drilling==='full'){\n     const support=cncSupportRegions(p,boards,which);\n     entry.issues.push(...support.issues);\n     for(const section of support.segments){\n       entry.operations.push({macro:'REF',DX:section.DX,BX:section.BX,face:'primary'});\n       for(const Y of section.Y)entry.operations.push({macro:'POLC',Y,\n         Q:section.Q,s:section.s,face:'primary'});\n       entry.operations.push({macro:'REF',face:'primary'});\n     }\n   }\n }\n // A vízszintes lapok és a függőleges F-osztók saját CNC-koordinátái.\n const flat=boards.filter(q=>q.kind==='shelf'||q.kind==='v');\n const upper=p.hasTop?make('top','Tető',p.top==='full'?p.w:p.innerW,p.d):null;\n const lower=p.hasBottom?make('bottom','Fenék',p.bottom==='full'?p.w:p.innerW,p.d):null;\n if(p.hasLegs){\n   // A LAB négy 59/59 mm-es lábfurat a tényleges tartólapra tartozik,\n   // nem a bal oldallapra. A jó oldallap CNC-je ettől még menthető.\n   const target=p.falseBottom\n     ?make('false-bottom','Pótfenék',p.w+1,p.d):lower;\n   if(target)target.issues.push('A 4 bútorláb LAB-furata (59 × 59 mm) még nincs hitelesített Xilog makróval megvalósítva.');\n   // Végigmenő fenék és pótfenék együtt külön ellenőrizetlen kötés.\n   if(p.falseBottom&&p.bottom==='full'&&lower)\n     lower.issues.push('Végigmenő fenék + pótfenék kapcsolata CNC-n még nem hitelesített.');\n }\n if(upper&&p.top==='full'){\n   op(upper,'LAPA',{X:t/2,Y:0,y:p.d});\n   op(upper,'LAPA',{X:p.w-t/2,Y:0,y:p.d});\n   upper.issues.push('Végigmenő tető alsó megmunkálási oldalának gépi felrakása ellenőrzendő');\n }\n if(lower&&p.bottom==='full'){\n   op(lower,'LAPA',{X:t/2,Y:0,y:p.d});\n   op(lower,'LAPA',{X:p.w-t/2,Y:0,y:p.d});\n }\n if(upper&&p.top==='between'){\n   op(upper,'ELF3',{Y:0,y:p.d});\n   op(upper,'ELF2',{Y:0,y:p.d});\n }\n if(lower&&p.bottom==='between'){\n   op(lower,'ELF3',{Y:0,y:p.d});\n   op(lower,'ELF2',{Y:0,y:p.d});\n }\n for(const h of flat){\n   const entry=make(h.key,h.name,h.a,h.b);\n   if(h.kind==='shelf'&&p.drilling!=='fixed'){\n     // Az állítható polcon nincsen fix tipli/excenter/csavarfurat.\n     // CNC nélkül is teljes értékű gyártandó polc, ne blokkoljon ZIP-et.\n     entry.noCnc=true;\n     continue;\n   }\n   if(h.undercutDegrees>0.001){\n     entry.issues.push('A döntött polc fix furatának ferdesége nem igazolt a Xilog A=0 mintákkal');\n     continue;\n   }\n   // ELF3: bal, ELF2: jobb rövid él, a tényleges helyi mélység szerint.\n   if(near(h.x1,t))op(entry,'ELF3',{Y:0,y:h.y1-h.y0});\n   if(near(h.x2,p.w-t))op(entry,'ELF2',{Y:0,y:h.y1-h.y0});\n   for(const f of vertical){\n     const [yA,yB]=overlap(h.y0,h.y1,f.y0,f.y1),len=yB-yA;\n     if(!positive(len))continue;\n     const center=(h.z1+h.z2)/2;\n     const sideContact=center>=f.z1-eps&&center<=f.z2+eps;\n     if(sideContact&&near(h.x2,f.x1))\n       fJoint(entry,'ELF2',{Y:yA-h.y0,y:len},fRank(f)>0);\n     if(sideContact&&near(h.x1,f.x2))\n       fJoint(entry,'ELF3',{Y:yA-h.y0,y:len},true);\n     const fEndsOnLower=near(f.z2,h.z1);\n     const fStartsOnUpper=near(f.z1,h.z2);\n     if((fEndsOnLower||fStartsOnUpper)&&f.x1>=h.x1-eps&&f.x2<=h.x2+eps)\n       op(entry,'LAPA',{X:(f.x1+f.x2)/2-h.x1,Y:yA-h.y0,y:len},\n         'divider',fStartsOnUpper?'primary':'reverse');\n   }\n }\n for(const f of vertical){\n   const entry=make(f.key,f.name,f.a,f.b,fRank(f)%2===0?'IJ':'LK'),front=f.y0;\n   if(p.drilling!=='fixed'){\n     entry.issues.push('Állítható polcnál az F-osztó oldalainak polctartó REF/POLC fúrása még nincs hitelesítve.');\n   }\n   // A saját deszka X tengelye felülről lefelé, Y a homloktól hátra.\n   // Az F két oldallapja külön felrakási térfél: második oldal FORDIT.\n   for(const h of horiz){\n     if(h.kind==='shelf'&&p.drilling!=='fixed')continue;\n     const [yA,yB]=overlap(f.y0,f.y1,h.y0,h.y1),len=yB-yA;\n     if(!positive(len))continue;\n     if(h.undercutDegrees>0.001&&\n         (near(h.x2,f.x1)||near(h.x1,f.x2)||near(h.z1,f.z2)||near(h.z2,f.z1))){\n       entry.issues.push('Döntött polc és F-osztó ferde csatlakozása nincs gépen hitelesítve');\n       continue;\n     }\n     const center=(h.z1+h.z2)/2,x=f.z2-center;\n     // Az F bal és jobb lapoldala önálló megmunkálási térfél.\n     // Balról a legelső sor teljes mélységű; a többi F-oldali\n     // csatlakozás 15-15 mm-rel eltolva, FORDIT után készül.\n     const sideContact=center>=f.z1-eps&&center<=f.z2+eps;\n     if(sideContact&&near(h.x2,f.x1))\n       fJoint(entry,'LAPA',{X:x,Y:yA-front,y:len},fRank(f)>0,'primary');\n     if(sideContact&&near(h.x1,f.x2))\n       fJoint(entry,'LAPA',{X:x,Y:yA-front,y:len},true,'reverse');\n     if(near(f.z1,h.z2))op(entry,'ELF2',{Y:yA-front,y:len},'divider');\n     if(near(f.z2,h.z1))op(entry,'ELF3',{Y:yA-front,y:len},'divider');\n   }\n   if(upper&&near(f.z2,p.h-t)){\n     op(entry,'ELF3',{Y:0,y:f.y1-f.y0},'divider');\n     op(upper,'LAPA',{X:(f.x1+f.x2)/2-(p.top==='between'?t:0),\n       Y:f.y0,y:f.y1-f.y0},'divider','reverse');\n   }\n   if(lower&&near(f.z1,p.bodyBottomOffset+t)){\n     op(entry,'ELF2',{Y:0,y:f.y1-f.y0},'divider');\n     op(lower,'LAPA',{X:(f.x1+f.x2)/2-(p.bottom==='between'?t:0),\n       Y:f.y0,y:f.y1-f.y0},'divider','primary');\n   }\n }\n // A szabászminta hátfal-/pótfenék-munkafázisát nem feltételezhetjük CNC-ként.\n for(const record of records){\n   const keys=Array.isArray(record.sourceKeys)&&record.sourceKeys.length\n     ?record.sourceKeys:[record.key];\n   record.cncInstances=keys.map(key=>byKey.get(key)).filter(Boolean);\n }\n}\n\nfunction getStructuredParts(p){\n // Az egyedi polcok külön rekordot kapnak, hogy az élzárásuk később külön megadható legyen.\n const sideH=p.sideH;\n const records=[];\n const add=(key,name,a,b,qty=1,remark='',ready=true,thickness=p.t)=>records.push({key,name,a:Math.round(a*10)/10,b:Math.round(b*10)/10,qty,thickness,edge:'0-0',remark,ready});\n add('side-left','Oldal',sideH,p.d,2);\n records[records.length-1].sourceKeys=['side-left','side-right'];\n if(p.hasTop)add('top','Tető',p.top==='full'?p.w:p.innerW,p.d,1,p.top==='full'?'Végigmenő':'Oldalak közé');\n if(p.hasBottom)add('bottom','Fenék',p.bottom==='full'?p.w:p.innerW,p.d,1,p.bottom==='full'?'Végigmenő':'Oldalak közé');\n if(p.hasBottom&&p.falseBottom)add('false-bottom','Pótfenék',p.w+1,p.d,1,'Mindkét oldalon 0,5 mm túlnyúlás');\n if(p.fullBack)add('back-full','Teli hátlap',p.innerW,p.innerH,1,`Vastagság: ${fmt(p.t)} mm; hátulról: ${fmt(p.fullBackSetback)} mm`);\n const dividers=[];\n const dividerBoards=fixedDividerPieces(p);\n for(const item of dividerBoards){\n  const remark=item.kind==='shelf'\n    ?'Dőlés: '+fmt(item.angle)+'°; hátsó visszaállás: '+fmt(shelfBackAt(p,item.index))+' mm'\n    :'Fix '+(item.kind==='v'?'vízszintes':'függőleges')+' osztó · automatikus méretezés';\n  if(item.kind==='shelf'){\n   add(item.key,item.name,item.a,item.b,1,\n     'Fixen befúrt'+(Math.abs(item.angle)>0.001?'; alávágás: '+fmt(Math.abs(item.angle))+'°; hosszabb él: '+fmt(item.b)+' mm':'')+\n     '; hátsó sík: '+fmt(baseShelfBack(p))+' mm');\n   records[records.length-1].shelfTiltDegrees=item.angle;\n   records[records.length-1].shelfBevelDegrees=item.undercutDegrees;\n   records[records.length-1].fixedDrilling=Math.abs(item.angle)>0.001||p.drilling==='fixed';\n  }\n  else{\n   const a=Math.round(item.a*10)/10,b=Math.round(item.b*10)/10;\n   const group=dividers.find(d=>d.kind===item.kind&&d.a===a&&d.b===b);\n   if(group){group.qty++;group.sourceKeys.push(item.key);}\n   else dividers.push({key:item.key,kind:item.kind,a,b,qty:1,remark,sourceKeys:[item.key],fixedDrilling:true});\n  }\n }\n for(const kind of ['f','v']){\n  const groups=dividers.filter(d=>d.kind===kind);\n  groups.forEach((d,i)=>{add(d.key,(kind==='f'?'F-osztó':'V-osztó')+(groups.length>1?' '+(i+1):''),d.a,d.b,d.qty,d.remark);records[records.length-1].sourceKeys=d.sourceKeys;\n    records[records.length-1].fixedDrilling=d.fixedDrilling;});\n }\n if(dividerBoards.connectionIssues?.length){\n  records[0].ready=false;\n  records[0].remark=dividerBoards.connectionIssues.join(' ');\n }\n if(p.rabbet)add('back-rabbet','Falcos hátfal · HDF',p.hdfW,p.hdfH,1,\n  '4 mm HDF; W−11; tető −'+fmt(p.topHdfDeduction)+' mm; fenék −'+fmt(p.bottomHdfDeduction)+' mm',true,4);\n if(typeof buildCncInstancesForParts==='function')buildCncInstancesForParts(p,records);\n return records;\n}\nlet currentParts=[];\nfunction updateParts(p){\n currentParts=getStructuredParts(p);\n $('partsRows').innerHTML=currentParts.map(r=>`<tr><td>${r.name}</td><td>${r.qty}</td><td>${fmt(r.a)} × ${fmt(r.b)}</td><td>${r.ready?r.remark:'⚠ Ellenőrzendő méret'}</td></tr>`).join('');\n}\nconst themes={light:{background:'#f3f6f2',text:'#24342d',button:'#2d6b50',surface:'#ffffff'},dark:{background:'#151d1a',text:'#edf7f0',button:'#4a9673',surface:'#25342d'}};\nfunction setTheme(mode,colors){\n const base={...(themes[mode]||themes.light),...(colors||{})};\n const root=document.documentElement;\n root.classList.toggle('theme-dark',mode==='dark');\n const entries={background:'--canvas',text:'--ink',button:'--pine-2',surface:'--surface'};\n for(const [key,css] of Object.entries(entries))if(/^#[0-9a-fA-F]{6}$/.test(base[key]||''))root.style.setProperty(css,base[key]);\n if(/^#[0-9a-fA-F]{6}$/.test(base.button||'')){root.style.setProperty('--pine',base.button);const rgb=[1,3,5].map(i=>parseInt(base.button.slice(i,i+2),16));root.style.setProperty('--button-contrast',(rgb[0]*299+rgb[1]*587+rgb[2]*114)/1000>=150?'#12231b':'#ffffff');}\n for(const [k,id] of [['background','themeBackground'],['text','themeText'],['button','themeButton']])if(base[k]&&$(id))$(id).value=base[k];\n if($('themeMode'))$('themeMode').value=mode==='dark'?'dark':mode==='light'?'light':'custom';\n}\n\nfunction visualSnapshot(){\n return {maskF:visualMaskF,maskH:visualMaskH,edits:visualPieceEdits,cuts:visualCuts,removed:visualRemoved,edited:visualEdited};\n}\nfunction visualRestore(data){\n if(!data||typeof data!=='object'){\n  visualMaskF=[];visualMaskH={};visualPieceEdits={};visualCuts={};visualRemoved={};visualEdited=false;\n }else{\n  const p=read(),cols=p.fCount+1,rows=p.n+p.vCount+1;\n  visualMaskF=Array.from({length:p.fCount},(_,i)=>\n   Array.isArray(data.maskF?.[i])?Array.from({length:rows},(_,j)=>data.maskF[i][j]!==false):[]);\n  visualMaskH={};\n  for(const q of horizontalLayout(p)){\n   const key=q.kind+'-'+q.index,arr=data.maskH?.[key];\n   if(Array.isArray(arr))visualMaskH[key]=Array.from({length:cols},(_,i)=>arr[i]!==false);\n  }\n  visualPieceEdits={};\n  for(const [key,obj] of Object.entries(data.edits||{}).slice(0,150)){\n   if(!/^[a-z0-9-]{1,100}$/.test(key)||!obj||typeof obj!=='object')continue;\n   const edit={};\n   for(const field of ['start','end','shift']){\n    const n=Number(obj[field]);\n    if(Number.isFinite(n)&&Math.abs(n)<=3500)edit[field]=field==='shift'?n:Math.max(0,n);\n   }\n   visualPieceEdits[key]=edit;\n  }\n  visualCuts={};visualRemoved={};\n  for(const [key,cut] of Object.entries(data.cuts||{}).slice(0,130)){\n    if(!/^(?:f-divider-|v-divider-)[a-z0-9-]{1,90}$/.test(key)||!cut||typeof cut!=='object')continue;\n    const ratio=Number(cut.ratio),gap=Number(cut.gap);\n    if(Number.isFinite(ratio)&&ratio>=.2&&ratio<=.8&&Number.isFinite(gap)&&gap>=2&&gap<=100)\n      visualCuts[key]={ratio,gap};\n  }\n  for(const [key,value] of Object.entries(data.removed||{}).slice(0,200))\n    if(/^(?:f-divider-|v-divider-)[a-z0-9-]{1,90}$/.test(key)&&value===true)\n      visualRemoved[key]=true;\n  visualEdited=Boolean(data.edited)||visualMaskF.some(a=>a.includes(false))||\n    Object.values(visualMaskH).some(a=>a.includes(false))||\n    Object.keys(visualPieceEdits).length>0||Object.keys(visualCuts).length>0||\n    Object.keys(visualRemoved).length>0;\n }\n visualSelected=null;visualRender(read());\n}\nfunction visualEditingMode(){return document.querySelector('input[name=\"visualMode\"]:checked')?.value||'row';}\nfunction visualCoords(p){\n const legH=p.hasLegs?100:0;\n const scale=Math.min(850/Math.max(1,p.w),710/Math.max(1,p.h+legH));\n const fx=86+(840-p.w*scale)/2,fy=73+(706-(p.h+legH)*scale)/2;\n return {scale,fx,fy,X:x=>fx+x*scale,Y:z=>fy+(p.h-z)*scale};\n}\nfunction visualSvgText(x,y,value,size=12,color='#315e46',other=''){\n return '<text x=\"'+x+'\" y=\"'+y+'\" font-size=\"'+size+'\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" fill=\"'+color+'\" '+other+'>'+value+'</text>';\n}\nfunction visualRender(p){\n const holder=$('visualScroll'),svg=$('visualSvg');\n if(!holder||!svg)return;\n svg.style.width=Math.round(Math.max(750,holder.clientWidth-5)*visualZoom/100)+'px';\n $('visualZoomValue').textContent=visualZoom+'%';\n const layout=visualLayout(p),f=layout.f,h=layout.horizontals;\n const C=visualCoords(p),X=C.X,Y=C.Y;\n const boards=fixedDividerPieces(p),removedBoards=boards.visualRemoved||[];\n let drawing='<rect width=\"1100\" height=\"850\" fill=\"#eaf0e9\"/>';\n drawing+='<rect x=\"19\" y=\"16\" width=\"1062\" height=\"821\" rx=\"13\" fill=\"#f4f7f1\" stroke=\"#dce8dd\"/>';\n drawing+=visualSvgText(560,40,'KATTINTHATÓ KÖZMÉRETEK · F/V-OSZTÓK · ÁLLÍTHATÓ POLCOK',14);\n drawing+='<rect x=\"'+X(0)+'\" y=\"'+Y(p.h)+'\" width=\"'+(p.w*C.scale)+'\" height=\"'+(p.h*C.scale)+'\" fill=\"#d3e2dc\" stroke=\"#88a999\" stroke-width=\"1.3\"/>';\n const sideY=Y(p.h),sideBottom=Y(p.bodyBottomOffset);\n const bar=(x,z1,z2,width,fill)=>'<rect x=\"'+X(x)+'\" y=\"'+Y(z2)+'\" width=\"'+(width*C.scale)+'\" height=\"'+((z2-z1)*C.scale)+'\" fill=\"'+fill+'\" stroke=\"#9b7b53\" stroke-width=\"1\"/>';\n // Tető/fenék: a közémenő lapok ténylegesen az oldalak között vannak.\n const sideLo=p.bodyBottomOffset+(p.hasBottom&&p.bottom==='full'?p.t:0);\n const sideHi=p.h-(p.hasTop&&p.top==='full'?p.t:0);\n drawing+=bar(0,sideLo,sideHi,p.t,'#d4b187');\n drawing+=bar(p.w-p.t,sideLo,sideHi,p.t,'#d4b187');\n if(p.hasTop)drawing+=bar(p.top==='between'?p.t:0,p.h-p.t,p.h,p.top==='between'?p.w-2*p.t:p.w,'#d4b187');\n if(p.hasBottom)drawing+=bar(p.bottom==='between'?p.t:0,p.bodyBottomOffset,p.bodyBottomOffset+p.t,p.bottom==='between'?p.w-2*p.t:p.w,'#d4b187');\n if(p.hasBottom&&p.falseBottom)drawing+=bar(-.5,0,p.t,p.w+1,'#b28e5e');\n // A láb szélessége 28 mm, közepe 59 mm-re mindkét oldaltól.\n if(p.hasLegs)for(const cx of [59,p.w-59]){\n   drawing+=bar(cx-14,-100,0,28,'#617669');\n   drawing+='<title>Első/hátsó lábak a külső szélektől 59 mm-re</title>';\n }\n\n const fillOf=piece=>piece.kind==='f'?'#6da388':piece.kind==='v'?'#d1a26c':'#8bb5c0';\n for(const piece of boards){\n  drawing+='<rect x=\"'+X(piece.x1)+'\" y=\"'+Y(piece.z2)+'\" width=\"'+Math.max(1,(piece.x2-piece.x1)*C.scale)+'\" height=\"'+Math.max(1,(piece.z2-piece.z1)*C.scale)+'\" fill=\"'+fillOf(piece)+'\" stroke=\"#6d806e\" stroke-width=\"1.3\"/>';\n }\n // A kivett saját F/V-darabok halványan visszaállíthatók; nem gyártandók.\n for(const piece of removedBoards){\n  drawing+='<rect class=\"visual-ghost\" x=\"'+X(piece.x1)+'\" y=\"'+Y(piece.z2)+\n   '\" width=\"'+Math.max(1,(piece.x2-piece.x1)*C.scale)+\n   '\" height=\"'+Math.max(1,(piece.z2-piece.z1)*C.scale)+\n   '\" fill=\"#91aa9b\" stroke=\"#578a73\" stroke-dasharray=\"5 6\" stroke-width=\"1.2\"/>';\n }\n // A kilógó/már eltávolított egységek csak halvány, kattintható helyőrzők.\n for(let i=0;i<f.length;i++)for(let j=0;j<=h.length;j++){\n  if(visualMaskValue('f',i,j))continue;\n  const lo=j? h[j-1].z+p.t/2:layout.z0,hi=j<h.length?h[j].z-p.t/2:layout.z3;\n  drawing+='<rect class=\"visual-ghost\" x=\"'+X(f[i].center-p.t/2)+'\" y=\"'+Y(hi)+'\" width=\"'+Math.max(2,p.t*C.scale)+'\" height=\"'+Math.max(2,(hi-lo)*C.scale)+'\" fill=\"#96b3a0\" stroke=\"#326f50\" stroke-width=\"2\"/>';\n }\n for(let j=0;j<h.length;j++)for(let i=0;i<=f.length;i++){\n  if(visualMaskValue('h',h[j].kind+'-'+h[j].index,i))continue;\n  const lo=i?f[i-1].center+p.t/2:layout.x0,hi=i<f.length?f[i].center-p.t/2:layout.x3;\n  drawing+='<rect class=\"visual-ghost\" x=\"'+X(lo)+'\" y=\"'+Y(h[j].z+p.t/2)+'\" width=\"'+Math.max(2,(hi-lo)*C.scale)+'\" height=\"'+Math.max(2,p.t*C.scale)+'\" fill=\"#a2afae\" stroke=\"#4b8274\" stroke-width=\"2\"/>';\n }\n // Hézagok: az 1. F a bal oldallap belső szélétől, a továbbiak az előző F jobb élétől.\n const fg=fixedFGaps(p).gaps;\n for(let i=0;i<=f.length&&f.length;i++){\n  const a=i===0?layout.x0:f[i-1].center+p.t/2;\n  const b=i===f.length?layout.x3:f[i].center-p.t/2;\n  const center=X((a+b)/2),y=Y(p.h)+33;\n  const label=fmt(Math.max(0,b-a));\n  drawing+='<g data-vis-gap=\"f\" data-idx=\"'+i+'\" role=\"button\" tabindex=\"0\" aria-label=\"F-osztó szabad közméret: '+label+' milliméter. Kattints a pontos mérethez.\">';\n  drawing+='<rect x=\"'+(center-30)+'\" y=\"'+(y-12)+'\" width=\"60\" height=\"23\" rx=\"6\" fill=\"#fff\" stroke=\"#9dbba7\"/>';\n  drawing+=visualSvgText(center,y+3,label,11,'#276046')+'</g>';\n }\n const hg=calculateGaps(p).gaps;\n for(let j=0;j<=h.length&&h.length;j++){\n  const lo=j? h[j-1].z+p.t/2:layout.z0;\n  const hi=j===h.length?layout.z3:h[j].z-p.t/2;\n  const center=Y((lo+hi)/2),x=X(p.w)+58;\n  const label=fmt(Math.max(0,hi-lo));\n  drawing+='<g data-vis-gap=\"h\" data-idx=\"'+j+'\" role=\"button\" tabindex=\"0\" aria-label=\"V-osztó vagy polc szabad közméret: '+label+' milliméter. Kattints a pontos mérethez.\">';\n  drawing+='<rect x=\"'+(x-34)+'\" y=\"'+(center-12)+'\" width=\"68\" height=\"23\" rx=\"6\" fill=\"#fff\" stroke=\"#9dbba7\"/>';\n  drawing+=visualSvgText(x,center+4,label,1   // Zárt, tengelyekkel párhuzamos négyszögek felismerése mm koordinátákból.
  // A DXF egyszerű LINE és zárt LWPOLYLINE elemei támogatottak.
  function recognizeDxfRectangles(segments){
    const q=x=>Math.round(Number(x)*100)/100;
    const tolerance=.02,horiz=[],vertical=[],candidates=new Map();

        horiz.push({a:Math.min(x1,x2),b:Math.max(x1,x2),y:q((y1+y2)/2)});
