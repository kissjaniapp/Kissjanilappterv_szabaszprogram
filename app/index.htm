    projectName:'Új bútorprojekt',
    active:'furniture',
    selectedFurniture:null,
    furnitures:[],
    boards:[],
    kerf:5,trim:10,cutDirection:'auto',layoutMode:'machine',selectedBoard:0,
    labelWidth:48.5,labelHeight:25.4,labelMarginX:8,labelMarginY:8.8,labelFormatV2:true
  });
  const parse = str => { try { return JSON.parse(str); } catch { return null; } };
  // Négy fizikai él: a két X-szálirányú és a két Y-keresztirányú oldal.
  function sidesFromCode(code){
    const m=String(code||'0-0').match(/^([012])-([012])$/);
    const x=m?Number(m[1]):0,y=m?Number(m[2]):0;
    return {x1:x>=1,x2:x===2,y1:y>=1,y2:y===2};
  }
  function codeFromSides(s){
    return `${Number(!!s.x1)+Number(!!s.x2)}-${Number(!!s.y1)+Number(!!s.y2)}`;
  }
  let loaded=null;
  try { loaded=parse(localStorage.getItem('lapterv-project-v2')); } catch { /* Egyes file:// böngészők letilthatják a tárhelyet. */ }
  const state = loaded && Array.isArray(loaded.furnitures) && Array.isArray(loaded.boards) ? loaded : defaultState();
  // A régi adatokat csak migráljuk a választólistába. Induláskor soha nem nyitjuk meg őket.
  let projectScreen='library',currentProjectId=null;
  const libraryKey='lapterv-library-v1',migratedKey='lapterv-library-migrated-v1';
  let library=[];
  try{const data=parse(localStorage.getItem(libraryKey));if(Array.isArray(data))library=data.filter(p=>p&&p.id&&p.data&&Array.isArray(p.data.furnitures));}catch{}
  try{
    if(localStorage.getItem(migratedKey)!=='yes'){
      if(loaded&&Array.isArray(loaded.furnitures)&&loaded.furnitures.length){
        library.unshift({id:uuid(),createdAt:Date.now(),updatedAt:Date.now(),data:JSON.parse(JSON.stringify(loaded)),legacy:true});
      }
      localStorage.setItem(libraryKey,JSON.stringify(library));
      localStorage.setItem(migratedKey,'yes');
    }
  }catch{}

  // A korábbi prototípus 3,2 mm-es alapértékét egyszer migráljuk 5 mm-re.
  if(loaded && state.kerf===3.2 && !state.kerfDefaultMigrated){state.kerf=5;state.kerfDefaultMigrated=true;}
  function normalizeEdgeSettings(furnitures){
    for(const f of furnitures){
      if(!Array.isArray(f.parts))continue;
      for(const part of f.parts){
        // A régi 1 mm-es alapértéket a két választható élzáró közül 2 mm-re állítjuk.
        if(![2,0.4].includes(Number(part.edgeThickness)))part.edgeThickness=2;
        if(!part.edgeSides)part.edgeSides=sidesFromCode(part.edge);
        // Korábbi „Forg.” jelölésből visszaállítjuk a szálirányhoz kötöttséget.
        if(part.grainRequired==null)part.grainRequired=!part.rot;
        // A régebbi, beállított marásértéket meghagyjuk, ha létezik.
        if(part.mill==null)part.mill=Number(part.edgeThickness)===2;
        part.mill=Number(part.edgeThickness)===2&&!!part.mill;
      }
    }
  }
  function normalizeFurnitureMeta(furnitures,project){
    // Régebbi projektben a célhely és az anyag a közös matricabeállításban volt.
    // Egyetlen alkalommal átvezetjük ezeket a bútorok saját adataihoz.
    for(const f of furnitures){
      if(f.destination==null)f.destination=String(project.labelCompany||'');
      if(f.materialColor==null)f.materialColor=String(project.labelMaterial||'');
    }
  }
  function normalizeFurnitureSizes(furnitures){
    // A korábban üresen hagyott külső méretek is használható alapértéket kapnak.
    for(const f of furnitures){
      for(const [key,value] of [['w',1000],['ht',910],['d',600]]){
        if(f[key]==null||String(f[key]).trim()==='')f[key]=value;
      }
    }
  }
  function normalizeLabelSettings(project){
    // A régi alapértelmezett 70 × 40 mm-t egyszer átállítjuk az új 44-es A4 címkére.
    // Ha valaki eltérő egyedi méretet adott meg, azt megőrizzük.
    if(!project.labelFormatV2){
      if(Number(project.labelWidth??70)===70&&Number(project.labelHeight??40)===40){
        project.labelWidth=48.5;project.labelHeight=25.4;
      }
      project.labelFormatV2=true;
    }
    if(project.labelMarginX==null)project.labelMarginX=8;
    if(project.labelMarginY==null)project.labelMarginY=8.8;
  }
  normalizeEdgeSettings(state.furnitures);
  normalizeFurnitureMeta(state.furnitures,state);
  normalizeFurnitureSizes(state.furnitures);
  normalizeLabelSettings(state);
  if(!['machine','auto','mosaic','rows'].includes(state.layoutMode))state.layoutMode='machine';
  if (!paneNames[state.active]) state.active = 'furniture';
  if (!state.selectedFurniture || !state.furnitures.some(f=>f.id===state.selectedFurniture)) state.selectedFurniture=state.furnitures[0]?.id || null;
  let result=null;
  let notice='';
  // A bútoradatok a böngészőprofilban, különálló, helyi projektként maradnak meg.
  // A telepítő / eltávolító ezt nem törli. A választólistából kell megnyitni.
  function save(){
    if(projectScreen!=='editor'||!currentProjectId)return;
    try{
      const entry=library.find(x=>x.id===currentProjectId);
      if(!entry)return;
      entry.data=JSON.parse(JSON.stringify(state));entry.updatedAt=Date.now();
      localStorage.setItem(libraryKey,JSON.stringify(library));
      localStorage.setItem('lapterv-project-v2',JSON.stringify(state));
    }catch(error){console.warn('A helyi mentés sikertelen:',error);}
  }
  function freshProject(){
    Object.assign(state,defaultState());
    const f={id:uuid(),name:'',destination:'',materialColor:'Feya',w:1000,ht:910,d:600,t:18,s:0,
      qty:1,partsOpen:false,parts:[]};
    state.furnitures.push(f);state.selectedFurniture=f.id;
    currentProjectId=uuid();
    library.push({id:currentProjectId,createdAt:Date.now(),updatedAt:Date.now(),data:JSON.parse(JSON.stringify(state))});
    projectScreen='editor';result=null;notice='';render();
  }
  function openSavedProject(id,furnitureId){
    const entry=library.find(x=>x.id===id);
    if(!entry)return;
    Object.assign(state,defaultState(),JSON.parse(JSON.stringify(entry.data)));
    normalizeEdgeSettings(state.furnitures);
    normalizeFurnitureMeta(state.furnitures,state);
    normalizeFurnitureSizes(state.furnitures);
    normalizeLabelSettings(state);
    if(!['machine','auto','mosaic','rows'].includes(state.layoutMode))state.layoutMode='machine';
    state.selectedFurniture=state.furnitures.some(f=>f.id===furnitureId)?furnitureId:state.furnitures[0]?.id||null;
    state.active='furniture';currentProjectId=entry.id;projectScreen='editor';
    result=null;notice='';render();
  }

      '<p>Indításkor nem nyitjuk meg automatikusan az előző munkát. Válassz az elmentett bútorok közül, vagy hozz létre újat. Az adatok a számítógépen maradnak.</p></div>'+

  function showNotice(s){notice=s;render();}
  function getFurniture(){return state.furnitures.find(f=>f.id===state.selectedFurniture) || state.furnitures[0];}
  function numField(scope,id,key,val,min=0,max=99999){return `<div class="unit"><label>${h(key)}</label><div class="input-unit"><input type="number" data-scope="${scope}" data-id="${id}" data-key="${val[0]}" value="${h(val[1])}" min="${min}" max="${max}" step="1"><span>mm</span></div></div>`;}

  // Expression parser: only numbers, W H D T S, + - * / and parentheses are accepted.
  function calc(formula,vars){
    const src=String(formula ?? '').replace(/,/g,'.').replace(/\s+/g,'').toUpperCase();
    const tokens=src.match(/(?:\d+(?:\.\d*)?|\.\d+)|[WHDTS]|[()+\-*/]/g) || [];
    if (!src || tokens.join('')!==src) throw Error('Érvénytelen képlet');
    let i=0;
    function atom(){
      const t=tokens[i++];
      if(t==='+' || t==='-')return (t==='-'?-1:1)*atom();
      if(t==='('){const v=expr();if(tokens[i++]!==')')throw Error('Hiányzó zárójel');return v;}
      if(t in vars)return vars[t];
      if(t && /^(?:\d|\.)/.test(t))return Number(t);
      throw Error('Hibás képlet');
    }
    function term(){let v=atom();while(tokens[i]==='*'||tokens[i]==='/'){const op=tokens[i++],x=atom();v=op==='*'?v*x:v/x;}return v;}
    function expr(){let v=term();while(tokens[i]==='+'||tokens[i]==='-'){const op=tokens[i++],x=term();v=op==='+'?v+x:v-x;}return v;}
    const value=expr();if(i!==tokens.length || !Number.isFinite(value))throw Error('Hibás képlet');return value;
  }
  function getParts(){
    let rows=[],errors=[];
    for(const f of state.furnitures){
      const thickness=Number(f.t)||18;
      const vars={W:+f.w,H:+f.ht,D:+f.d,T:thickness,S:+f.s};
      for(const part of f.parts){
        if(!String(part.name||'').trim()||!String(part.a||'').trim()||!String(part.b||'').trim()||!String(part.q||'').trim()){
          rows.push({furniture:f,part,skipped:true,qty:0});
          continue;
        }
        try{
          const originalA=calc(part.a,vars),originalB=calc(part.b,vars),q=calc(part.q,vars),qty=q*Number(f.qty);
          const edge=String(part.edge||'0-0').trim().replace(/\s+/g,'');
          const match=edge.match(/^([012])-([012])$/);
          if(!match)throw Error('Az élzárás formátuma 0-0, 1-0, 0-1, 2-0, 0-2 vagy 2-2 lehet');
          const edgeThickness=part.edgeThickness==null||part.edgeThickness===''?2:pnum(part.edgeThickness);
          if(![2,0.4].includes(edgeThickness))throw Error('Csak 2 vagy 0,4 mm-es élzáró választható');
          // A 0,4 mm-es élzárónál marást soha nem számolunk.
          const mill=edgeThickness===2&&!!part.mill;
          const netEdge=edgeThickness-(mill?1:0);
          // X-szálirány menti él(ek) a keresztirányú B méretet csökkentik.
          // Y-keresztirány menti él(ek) a szálirányú A méretet csökkentik.
          // 1 mm-es előmarás esetén a felragasztott él vastagságából 1 mm-t kompenzálunk.
          const a=originalA-Number(match[2])*netEdge;
          const b=originalB-Number(match[1])*netEdge;
          if(!(a>0&&b>0&&originalA<=10000&&originalB<=10000&&q>=0&&Number.isInteger(q)&&Number.isInteger(qty)&&qty>=0&&qty<=300)) throw Error('Érvénytelen méret/darabszám');
          const canRotate=part.grainRequired===false||(part.grainRequired==null&&!!part.rot);
          rows.push({furniture:f,part,a:Math.round(a*10)/10,b:Math.round(b*10)/10,originalA,originalB,edge,edgeThickness,mill,thickness,q,qty,rot:canRotate,grainRequired:!canRotate});
        }catch(e){errors.push(`${f.name} / ${part.name}: ${e.message}`);rows.push({furniture:f,part,error:e.message,qty:0});}
      }
    }
    return {rows,errors,total:rows.reduce((s,r)=>s+r.qty,0),area:rows.reduce((s,r)=>s+(r.a||0)*(r.b||0)*r.qty,0)};
  }
  function intro(eyebrow,title,desc,actions=''){

  }

  function cabinet(f){

          <div><label>Hány ilyen bútor készül?</label><input type="number" min="1" max="300" step="1" data-scope="furniture" data-id="${f.id}" data-key="qty" value="${h(f.qty)}"></div>

      </div>
    </div>`:`<div class="panel empty"><div class="empty-icon">▤</div><h3>Még nincs bútorod</h3><p>Adj hozzá egy szériát, és kezdheted a méretezést.</p><button class="btn primary" data-action="new-furniture">＋ Új bútor</button></div>`;
    const rows=f?f.parts.map(part=>{
      const r=summary.rows.find(r=>r.part===part);
      const computed=r.skipped?`<span class="pill gray">Hiányos · kimarad</span>`:r.error?`<span class="td-val err">Hiba</span><span class="inline-err">${h(r.error)}</span>`:`<span class="td-val num">${nfmt(r.a)} × ${nfmt(r.b)}</span><div class="tiny muted">${nfmt(r.qty)} db · vágási méret${r.edge!=='0-0'?' · élzárva':''}${r.mill&&r.edge!=='0-0'?' · marva 1 mm':''}</div>`;

rgatható." aria-label="Szálirány kötelező" type="checkbox" data-scope="part" data-id="${part.id}" data-key="grainRequired" ${part.grainRequired!==false?'checked':''}></td><td><button class="btn icon ghost danger" title="Sor törlése" data-action="remove-part" data-id="${part.id}">✕</button></td></tr>`;

    const right=`<div class="panel"><div class="panel-head"><div><div class="panel-title">Alkatrészek <span class="pill gray">${f?f.parts.length:0} sor</span></div><div class="panel-sub">X = szálirány, Y = keresztirány. Az X1/X2 és Y1/Y2 négyzetekkel kijelölheted, melyik éleket zárjuk.</div></div><button class="btn sm" data-action="add-part" ${!f?'disabled':''}>＋ Alkatrész</button></div><div class="table-wrap"><table><thead><tr><th>Megnevezés</th><th>X · szál ↔</th><th>Y · kereszt ↕</th><th>Db</th><th>Élzárás · 2+2 él</th><th>Élvastagság</th><th title="Élzárás előtt 1 mm-t marunk le">Marás 1 mm</th><th title="Kikapcsolva: alkatrész 90 fokkal forgatható">Szál kötelező</th><th></th></tr></thead><tbody>${rows||`<tr><td colspan="9" class="muted">Nincs még alkatrész.</td></tr>`}</tbody></table></div><div class="formula-bar"><strong>Képlet nélkül is használható:</strong> <code>W</code> szélesség · <code>H</code> magasság · <code>D</code> mélység · <code>T</code> lapvastagság<br><span style="color:#8a9b8f">Példa: W-2*T = két oldallap közé kerülő polc. Élzárás: X1/X2 = a két szálirányú él (az Y méretből vonunk le), Y1/Y2 = a két keresztirányú él (az X méretből vonunk le). A négy pipa száma adja a régi <b>1-0</b>, <b>0-2</b> vagy <b>2-2</b> kódot. Alapélzáró: <b>2 mm</b>. <b>2 mm-es élzárónál a marás alapból bekapcsolt</b>: ilyenkor élenként 1 mm-t vonunk le, de a jelölés kikapcsolható. A <b>0,4 mm-es élzárónál nincs marás</b>: mindig pontosan 0,4 mm-t vonunk le élenként. A „Szál kötelező” alapból be van pipálva. Ha kikapcsolod, a program keresztbe is elforgathatja az alkatrészt.</span></div><div class="panel-body" style="padding-top:15px"><div class="toolbar"><div><strong class="num">${nfmt(summary.total)} db</strong><div class="part-summary">${nfmt(summary.area/1e6)} m² nettó alkatrészterület · összes bútor</div></div><button class="btn primary" data-action="page" data-page="stock">Anyagkészlet →</button></div></div></div>`;
    return intro('01 / BÚTOROK','Bútorok és alkatrészek','Adj meg egy bútorcsaládot, módosítsd a külméretet vagy építs saját alkatrészlistát.',actions)+`<div class="two-col">${left}${f&&f.partsOpen!==false?right:''}</div>${f&&f.partsOpen!==false?`<div class="section-bottom"><div class="muted small">${state.furnitures.length} bútortípus a projektben · a teljes nesting mindegyiket figyelembe veszi</div><div class="actions"></div></div>`:''}`+(summary.errors.length?`<div class="notice error top-gap">${h(summary.errors[0])}${summary.errors.length>1?' · további hibák: '+(summary.errors.length-1):''}</div>`:'');
  }

ság</label><div class="input-unit"><input type="number" min="1" max="100" step="1" data-scope="board" data-id="${b.id}" data-key="thickness" value="${h(b.thickness??18)}"><span>mm</span></div></div><div class="unit"><label>Darab</label><input type="number" min="0" max="100" step="1" data-scope="board" data-id="${b.id}" data-key="qty" value="${h(b.qty)}"></div></div><button class="btn icon ghost danger remove" title="Tábla törlése" data-action="remove-board" data-id="${b.id}">✕</button></div>`).join('')||'<div class="empty">Még nincs megadott maradék. A nesting automatikusan korlátlan 2800 × 2070 × 18 mm-es alaptáblákkal dolgozik.</div>'}</div><div class="section-bottom"><button class="btn sm soft" data-action="add-board">＋ További méret hozzáadása</button><span class="muted small">A táblának mindkét irányban legalább 5 mm-rel nagyobbnak kell lennie az alkatrésznél; a beállított szélezés ezen felül számít.</span></div></div></div><div class="panel top-gap"><div class="panel-head"><div><div class="panel-title">Vágási beállítások</div><div class="panel-sub">Alapérték: 5 mm vágásrés, 10 mm szélezés oldalanként; mindkettő módosítható.</div></div></div><div class="panel-body"><div class="settings"><div><label>Vágásrés</label><div class="input-unit"><input type="number" min="0" max="20" step="0.1" data-scope="settings" data-key="kerf" value="${h(state.kerf)}"><span>mm</span></div></div><div><label>Szélezés / oldal</label><div class="input-unit"><input type="number" min="0" max="100" step="1" data-scope="settings" data-key="trim" value="${h(state.trim)}"><span>mm</span></div></div><div class="callout" style="flex:1;min-width:230px"><strong>Szálirány:</strong> X = a tábla száliránya (első méret); Y = a keresztirány (második méret). A „Szál kötelező” jelölésből kivett darabokat a program 90°-kal is elforgathatja.</div><button class="btn primary" data-action="run-nesting">Nesting készítése →</button></div></div></div>`;

  // Guillotine cutting: every cut spans the entire CURRENT separated rectangle.
  // Free regions never overlap. A cut is recorded when its child regions are made,
  // so its sequence always precedes cuts within those child regions.
  function guillotinePlace(bin,choice,kerf){
    const {freeIndex,part,realW:a,realH:b,turned,axis,xSide,ySide}=choice;
    const original=bin.free[freeIndex],next=[],eps=.0001;
    // Minden új leválasztott darab saját azonosítót kap. A további vágás már
    // csak ezen a résztáblán történhet, nem vághat bele egy másik alkatrészbe.
    function split(region,direction,partSize,keepSide){
      const length=direction==='y'?region.w:region.h;
      if(length-partSize<eps)return {piece:region};
      const before=keepSide==='start'?partSize:length-partSize-kerf;
      const after=length-before-kerf;
      const aRegion={...region,id:'S'+bin.nextSection++};
      const bRegion={...region,id:'S'+bin.nextSection++};
      if(direction==='y'){
        aRegion.w=before;
        bRegion.x=region.x+before+kerf;bRegion.w=after;
      }else{
        aRegion.h=before;
        bRegion.y=region.y+before+kerf;bRegion.h=after;
      }
      const cutCenter=before+kerf/2;
      const pos=(direction==='y'?region.x:region.y)+cutCenter;
      const cut=direction==='y'?
        {x1:pos,y1:region.y,x2:pos,y2:region.y+region.h,length:region.h}:
        {x1:region.x,y1:pos,x2:region.x+region.w,y2:pos,length:region.w};
      bin.cuts.push({...cut,order:bin.cuts.length+1,axis:direction,
        section:region.id,sectionX:region.x,sectionY:region.y,sectionW:region.w,sectionH:region.h,
        offset:cutCenter,fromEdge:before,kerf,partSide:keepSide,
        pieceSize:partSize,beforeSection:aRegion.id,afterSection:bRegion.id,
        beforeSize:before,afterSize:after});
      return keepSide==='start'?{piece:aRegion,rest:bRegion}:{piece:bRegion,rest:aRegion};
    }
    const first=axis==='y'?['y',a,xSide]:['x',b,ySide];
    const second=axis==='y'?['x',b,ySide]:['y',a,xSide];
    const s1=split(original,...first);
    if(s1.rest&&s1.rest.w>eps&&s1.rest.h>eps)next.push(s1.rest);
    const s2=split(s1.piece,...second);
    if(s2.rest&&s2.rest.w>eps&&s2.rest.h>eps)next.push(s2.rest);
    bin.free.splice(freeIndex,1,...next);
    const f=s2.piece;
    bin.placements.push({x:f.x,y:f.y,w:a,h:b,part,turned,realW:a,realH:b,section:f.id});
    bin.used+=part.a*part.b;
  }
  const STANDARD_BOARD={a:2800,b:2070,thickness:18};
  const MIN_BOARD_EXTRA=5;
  function createBin(b,index,automatic=false){
    const trim=Math.max(0,Number(state.trim)||0);
    const a=Number(b.a),height=Number(b.b),thickness=Number(b.thickness??18);
    if(!Number.isFinite(a)||!Number.isFinite(height)||!Number.isFinite(thickness)||a<=2*trim||height<=2*trim||thickness<=0)return null;
    return {id:b.id||'standard',index,name:b.name||'Maradék tábla',a,b:height,thickness,automatic,trim,
      free:[{id:'S1',x:trim,y:trim,w:a-2*trim,h:height-2*trim}],nextSection:2,placements:[],cuts:[],used:0};
  }
  function prepareBins(){
    const bins=[];
    for(const b of state.boards){
      for(let i=0;i<Math.max(0,Math.min(100,Number(b.qty)||0));i++){
        const bin=createBin(b,i+1);
        if(bin)bins.push(bin);
      }
    }
    return bins;
  }
  function bestPlacement(item,candidates,kerf,firstAxis,variant,corner,upcoming=[]){
    let best=null;
    for(const bin of candidates){
      if(Math.abs(bin.thickness-item.thickness)>.001)continue;
      const orientations=[{a:item.a,b:item.b,turned:false}];
      if(item.rot&&item.a!==item.b)orientations.push({a:item.b,b:item.a,turned:true});
      for(const o of orientations){
        // Az anyag TÉNYLEGES külmérete legalább 5 mm-rel nagyobb legyen mindkét irányban.
        if(bin.a+1e-5<o.a+MIN_BOARD_EXTRA||bin.b+1e-5<o.b+MIN_BOARD_EXTRA)continue;
        for(let freeIndex=0;freeIndex<bin.free.length;freeIndex++){
          const free=bin.free[freeIndex];
          const needsX=free.w>o.a+.0001,needsY=free.h>o.b+.0001;
          const w=o.a+(needsX?kerf:0),height=o.b+(needsY?kerf:0);
          if(w>free.w+.0001||height>free.h+.0001)continue;
          // A tábla első vágásának tengelye kötött, a leválasztott részeken
          // viszont a mozaikos keresés X/Y irányban külön is folytatható.
          const axes=!bin.cuts.length||variant===0?[firstAxis]:['x','y'];
          for(const axis of axes){
            const remW=Math.max(0,free.w-w),remH=Math.max(0,free.h-height);
            const fragments=axis==='y'?
              [{w:remW,h:free.h},{w:o.a,h:remH}]:
              [{w:free.w,h:remH},{w:remW,h:o.b}];
            const open=fragments.filter(r=>r.w>.0001&&r.h>.0001);
            const remainderArea=open.reduce((s,r)=>s+r.w*r.h,0);
            let local=(free.w*free.h-o.a*o.b)*.0005+Math.min(remW,remH);
            if(variant===1)local-=Math.max(0,...open.map(r=>r.w*r.h))*.0015;
            if(variant===2){
              let fit=0;
              for(const next of upcoming.slice(0,8)){
                if(Math.abs(next.thickness-bin.thickness)>.001)continue;
                if(open.some(r=>(r.w>=next.a&&r.h>=next.b)||
                   (next.rot&&r.w>=next.b&&r.h>=next.a)))fit+=Math.sqrt(next.a*next.b);
              }
              local-=fit*10;
            }
            if(variant===3){
              local+=open.reduce((s,r)=>s+(Math.min(r.w,r.h)<180?r.w*r.h*.002:0),0);
              local+=remainderArea*.0002;
            }
            // Meglévő kisebb maradék előnyben; azonos táblán négy lehetséges sarok.
            const score=bin.a*bin.b*100000+(bin.placements.length?0:10000)+local;
            if(!best||score<best.score)best={bin,score,choice:{
              freeIndex,part:item,turned:o.turned,realW:o.a,realH:o.b,
              axis,xSide:corner.x,ySide:corner.y}};
          }
        }
      }
    }
    return best;
  }
  function makePlan(mode,parts,axis){
    const kerf=Math.max(0,+state.kerf||0);
    const bins=prepareBins(),standardBins=[];
    const corners=[
      {x:'start',y:'start'},{x:'end',y:'start'},
      {x:'start',y:'end'},{x:'end',y:'end'}
    ];
    const corner=corners[Math.floor(mode/24)%4],variant=Math.floor(mode/6)%4;
    const items=[];
    for(const r of parts.rows){
      if(r.error)continue;
      for(let i=0;i<r.qty;i++)items.push({name:r.part.name,source:r.furniture.name,
        destination:r.furniture.destination||'',materialColor:r.furniture.materialColor||'',a:r.a,b:r.b,
        originalA:r.originalA,originalB:r.originalB,edge:r.edge,edgeThickness:r.edgeThickness,mill:r.mill,
        thickness:r.thickness,rot:r.rot,number:i+1,uid:r.part.id});
    }
    const sorters=[(a,b)=>b.a*b.b-a.a*a.b || Math.max(b.a,b.b)-Math.max(a.a,a.b),
      (a,b)=>Math.max(b.a,b.b)-Math.max(a.a,a.b)||b.a*b.b-a.a*a.b,
      (a,b)=>b.a-a.a || b.b-a.b,(a,b)=>b.b-a.b||b.a-a.a,
      (a,b)=>b.a+b.b-a.a-a.b||b.a*b.b-a.a*a.b,
      (a,b)=>Math.abs(b.a-b.b)-Math.abs(a.a-a.b)||b.a*b.b-a.a*a.b];
    items.sort(sorters[mode%sorters.length]);
    const failed=[];
    for(let i=0;i<items.length;i++){
      const item=items[i],upcoming=items.slice(i+1,i+9);
      // Készleten megadott maradékok MINDIG megelőzik a korlátlan alaptáblát.
      let best=bestPlacement(item,bins,kerf,axis,variant,corner,upcoming);
      if(!best)best=bestPlacement(item,standardBins,kerf,axis,variant,corner,upcoming);
      if(!best&&Math.abs(item.thickness-STANDARD_BOARD.thickness)<.001){
        const next=createBin({id:'standard',name:'Alaptábla · automatikus (2800 × 2070 × 18)',...STANDARD_BOARD},standardBins.length+1,true);
        if(next){
          const candidate=bestPlacement(item,[next],kerf,axis,variant,corner,upcoming);
          if(candidate){standardBins.push(next);best=candidate;}
        }
      }
      if(best)guillotinePlace(best.bin,best.choice,kerf);else failed.push(item);
    }
    const used=[...bins,...standardBins].filter(b=>b.placements.length);
    return {bins:used,failed,items,usedArea:used.reduce((s,b)=>s+b.used,0),sheetArea:used.reduce((s,b)=>s+b.a*b.b,0)};
  }
  // A szabászgép kétütemű programja: előbb MINDEN csíkot leválaszt,
  // majd a csíkokat visszakéri, és egyenként hosszra/keresztbe vágja őket.
  // X gépállás: 2070-es oldal a behúzás; Y: 2800-as oldal a behúzás.
  function makeStripPlan(mode,parts,feed){
    const kerf=Math.max(0,Number(state.kerf)||0),eps=.0001;
    const bins=prepareBins(),standardBins=[],failed=[],items=[];
    for(const r of parts.rows)if(!r.error)for(let i=0;i<r.qty;i++){
      items.push({name:r.part.name,source:r.furniture.name,
        destination:r.furniture.destination||'',materialColor:r.furniture.materialColor||'',a:r.a,b:r.b,
        originalA:r.originalA,originalB:r.originalB,edge:r.edge,
        edgeThickness:r.edgeThickness,mill:r.mill,thickness:r.thickness,
        rot:r.rot,number:i+1,uid:r.part.id});
    }
    const breadth=p=>feed==='x'?p.b:p.a;
    const along=p=>feed==='x'?p.a:p.b;
    const sorters=[
      (a,b)=>breadth(b)-breadth(a)||along(b)-along(a),
      (a,b)=>b.a*b.b-a.a*a.b||breadth(b)-breadth(a),
      (a,b)=>along(b)-along(a)||breadth(b)-breadth(a),
      (a,b)=>Math.max(b.a,b.b)-Math.max(a.a,a.b)||breadth(b)-breadth(a),
      (a,b)=>breadth(b)-breadth(a)||along(a)-along(b),
      (a,b)=>b.a+b.b-a.a-a.b||breadth(b)-breadth(a)
    ];
    items.sort(sorters[mode%sorters.length]);
    const isValidRemainder=value=>value>=-eps&&(value<eps||value+eps>=kerf);
    function bestOn(item,pool){
      let best=null;
      for(const bin of pool){
        if(Math.abs(bin.thickness-item.thickness)>.001)continue;
        if(!bin.machine)bin.machine={feed,feedUsed:0,strips:[],
          // A gép a táblavég - szélezés pozíciónál kezd. A vágásrés fele
          // a megmaradó lapon marad, majd a csíkok a beadás ellenében fogyasztanak.
          feedSize:(feed==='x'?bin.b:bin.a)-2*bin.trim-(bin.trim?kerf/2:0),
          crossSize:(feed==='x'?bin.a:bin.b)-2*bin.trim-(bin.trim?kerf/2:0)};
        const m=bin.machine;
        const orientations=[{a:item.a,b:item.b,turned:false}];
        if(item.rot&&item.a!==item.b)orientations.push({a:item.b,b:item.a,turned:true});
        for(const o of orientations){
          if(bin.a+eps<o.a+MIN_BOARD_EXTRA||bin.b+eps<o.b+MIN_BOARD_EXTRA)continue;
          const bw=breadth(o),len=along(o);
          if(bw>m.feedSize+eps||len>m.crossSize+eps)continue;
          for(const strip of m.strips){
            const gap=strip.width-bw;
            const addition=(strip.usedLength?kerf:0)+len;
            const left=m.crossSize-strip.usedLength-addition;
            if(gap<-eps||!isValidRemainder(gap)||!isValidRemainder(left))continue;
            const score=bin.a*bin.b*1e5+gap*len*.05+left*.005;
            if(!best||score<best.score)best={bin,strip,score,orientation:o,bw,len};
          }
          const separator=m.strips.length?kerf:0;
          const remaining=m.feedSize-m.feedUsed-separator-bw;
          const longRemaining=m.crossSize-len;
          if(isValidRemainder(remaining)&&isValidRemainder(longRemaining)){
            // Már megkezdett tábla új csíkja előzze meg egy azonos méretű,
            // bontatlan tábla felhasználását.
            const score=bin.a*bin.b*1e5+(m.strips.length?3000:10000)+remaining*.01;
            if(!best||score<best.score)best={bin,strip:null,score,orientation:o,bw,len};
          }

      }
      return best;
    }
    for(const item of items){
      let choice=bestOn(item,bins);
      if(!choice)choice=bestOn(item,standardBins);
      if(!choice&&Math.abs(item.thickness-STANDARD_BOARD.thickness)<.001){
        const bin=createBin({id:'standard',name:'Alaptábla · automatikus (2800 × 2070 × 18)',...STANDARD_BOARD},
          standardBins.length+1,true);
        if(bin){
          const fit=bestOn(item,[bin]);
          if(fit){standardBins.push(bin);choice=fit;}
        }
      }
      if(!choice){failed.push(item);continue;}
      const {bin,orientation,bw,len}=choice,m=bin.machine;
      let strip=choice.strip;
      if(!strip){
        if(m.strips.length)m.feedUsed+=kerf;
        strip={index:m.strips.length+1,width:bw,usedLength:0,items:[]};
        m.strips.push(strip);m.feedUsed+=bw;
      }
      if(strip.usedLength)strip.usedLength+=kerf;
      strip.items.push({item,turned:orientation.turned,realW:orientation.a,
        realH:orientation.b,breadth:bw,along:len});

    }
    function finalize(bin){
      const m=bin.machine;
      if(!m?.strips.length)return;
      const stripAxis=feed==='x'?'x':'y',crossAxis=feed==='x'?'y':'x';
      const dimension=(rect,axis)=>axis==='y'?rect.w:rect.h;
      // Az első vágás a TELJES tábla beadási mérete - szélezés:
      // pl. Y gépállásban 2800 - 10 = 2790 mm a fűrész középvonala.
      // A gép innen visszafelé halad, a levágott csík pedig kitolható.
      let remaining={id:bin.trim?'R0':'S1',x:0,y:0,w:bin.a,h:bin.b};
      bin.nextSection=bin.trim?1:2;
      function splitAt(parent,axis,before,stage,stripNo,options={}){
        const total=dimension(parent,axis),after=total-before-kerf,pos=before+kerf/2;
        if(before<-eps||after<-eps)throw Error('Túl kicsi vágásrés a gépi csíktervben');
        const first={...parent,id:'S'+bin.nextSection++};
        const second={...parent,id:'S'+bin.nextSection++};
        if(axis==='y'){first.w=before;second.x+=before+kerf;second.w=Math.max(0,after);}
        else{first.h=before;second.y+=before+kerf;second.h=Math.max(0,after);}

          x2:axis==='y'?at:parent.x+parent.w,y2:axis==='x'?at:parent.y+parent.h,
          order:bin.cuts.length+1,length:axis==='y'?parent.h:parent.w,
          section:parent.id,sectionX:parent.x,sectionY:parent.y,
          sectionW:parent.w,sectionH:parent.h,offset:pos,fromEdge:before,
          kerf,partSide:options.side||'start',pieceSize:options.size??before,
          beforeSection:first.id,afterSection:second.id,beforeSize:before,afterSize:after,
          kind:options.trim?'trim':'part',edge:options.edge||'',stage,stripIndex:stripNo
        });
        return {start:first,end:second};
      }
      if(bin.trim){
        const fullFeed=dimension(remaining,stripAxis);
        const firstCut=splitAt(remaining,stripAxis,fullFeed-bin.trim-kerf/2,
          'head-trim',0,{trim:true,size:bin.trim,side:'end',edge:'beadási vég'});
        remaining=firstCut.start;
        m.firstCutPosition=fullFeed-bin.trim;
      }
      // 1. menet: az összes csík a tábla végétől visszafelé válik le.
      for(const strip of m.strips){
        const before=dimension(remaining,stripAxis)-strip.width-kerf;
        if(before<eps){
          strip.section=remaining;
          remaining=null;
        }else{
          const s=splitAt(remaining,stripAxis,before,'strip',strip.index,
            {side:'end',size:strip.width});
          strip.section=s.end;
          remaining=s.start;

      }
      // 2. menet: a visszafordított TELJES HOSSZÚ csíkon is először
      // csíkhossz - szélezés pozíciónál vágunk (2070 -> 2060).
      // Onnan visszafelé készülnek a darabok: nem vágjuk le külön a
      // közeli szél hulladékát, így a maradék egyben, nagyobban megmarad.
      for(const strip of m.strips){
        let segment=strip.section;
        if(bin.trim){
          const fullCross=dimension(segment,crossAxis);
          const first=splitAt(segment,crossAxis,fullCross-bin.trim-kerf/2,
            'cross-head-trim',strip.index,{trim:true,size:bin.trim,side:'end',edge:'csíkvég'});
          segment=first.start;
          strip.firstCutPosition=fullCross-bin.trim;
        }
        for(const entry of strip.items){
          const crossRemaining=dimension(segment,crossAxis)-entry.along-kerf;

            completionStep:bin.cuts.length,finishCutIndex:bin.cuts.length-1

      }

  }
  // Gyártási sorrend: minden tábla teljes sávozása után csíkok visszaadása.
  // Ellenőrző modell, NEM hitelesített gépi parancssor.
  // MINDEN TÁBLÁHOZ KÜLÖN VÁGÁSI SORREND: 1,2,3...
  // Egy táblán: összes fő sávozás, majd az adott tábla csíkjai
  // visszakérve, előbb a fő darabolás, majd az alábontás.
  // Kizárólag ellenőrző gyártási sorrend, nem hitelesített gépi parancs.
  function buildProductionSequence(bins){
    const events=[],boards=[],round=n=>Math.round(Number(n)*1000)/1000;
    const stages=['cross-head-trim','cross-trim','cross','rip'];
    let totalCuts=0,pairedGroups=0;
    const cutSignature=c=>JSON.stringify([c.stage,c.axis,round(c.offset),
      round(c.pieceSize),round(c.length),round(c.kerf),c.partSide,c.kind]);
    const stripSignature=job=>{
      const {bin,strip,cuts}=job;
      return JSON.stringify([round(bin.thickness),round(bin.trim),round(strip.width),
        round(bin.machine.crossSize),bin.machine.feed,
        [...new Set(strip.items.map(p=>String(p.item.materialColor||'').trim().toLowerCase()))].sort(),
        strip.items.map(p=>[round(p.along),round(p.breadth),p.turned]),
        cuts.map(cutSignature)]);
    };
    const cutsInNumberOrder=job=>{
      const rotated=job.bin.machine.feed==='y';
      const visualX=c=>rotated?
        job.bin.b-(c.axis==='x'?c.y1:c.sectionY+c.sectionH):
        (c.axis==='y'?c.x1:c.sectionX);
      const ascending=(a,b)=>visualX(a)-visualX(b)||(a.order||0)-(b.order||0);
      return [
        ...job.cuts.filter(c=>c.stage==='cross-head-trim'||c.stage==='cross-trim'),
        ...job.cuts.filter(c=>c.stage==='cross').sort(ascending),
        ...job.cuts.filter(c=>c.stage==='rip').sort(ascending)
      ];
    };
    for(let boardIndex=0;boardIndex<bins.length;boardIndex++){
      const bin=bins[boardIndex],board=boardIndex+1;
      let order=0,boardPairs=0;
      for(const cut of bin.cuts){
        delete cut.globalOrder;delete cut.boardOrder;delete cut.stackCount;
      }
      if(!bin.machine){
        boards.push({board,cutCount:0,pairedGroups:0});
        continue;
      }
      // 1. Az adott tábla teljes felsávozása: minden csík elkészül.
      for(const cut of bin.cuts.filter(c=>c.stage==='head-trim'||c.stage==='strip')){
        cut.boardOrder=cut.globalOrder=++order;cut.stackCount=1;
        events.push({type:'cut',phase:'savozas',group:'foves',
          order,board,strip:cut.stripIndex,stage:cut.stage,stackCount:1,cut});
      }
      const jobs=bin.machine.strips.map(strip=>({
        bin,board,strip,
        cuts:bin.cuts.filter(c=>stages.includes(c.stage)&&c.stripIndex===strip.index)
      }));
      // 2. Csíkok visszakérése; azonos csíkokat csak EGY táblán belül
      // párosítunk. A következő tábla számozása újra 1-től indul.
      const used=new Set();
      for(let i=0;i<jobs.length;i++){
        if(used.has(i))continue;
        const first=jobs[i],group=[first];used.add(i);
        for(let j=i+1;j<jobs.length;j++){
          if(!used.has(j)&&stripSignature(first)===stripSignature(jobs[j])){
            group.push(jobs[j]);used.add(j);break;
          }
        }
        if(group.length===2){pairedGroups++;boardPairs++;}
        const strips=group.map(g=>({board,index:g.strip.index,
          section:g.strip.section?.id,width:g.strip.width,
          length:g.bin.machine.crossSize,thickness:g.bin.thickness}));
        events.push({type:'refeed',phase:'hosszvagas',board,
          stackCount:group.length,requiresMachineStackVerification:group.length===2,
          strips});
        const groupCuts=group.map(cutsInNumberOrder),ordered=groupCuts[0];
        for(let k=0;k<ordered.length;k++){
          if(ordered[k].stage==='rip'&&(k===0||ordered[k-1].stage!=='rip')){
            events.push({type:'refeed-detail',phase:'hosszvagas',group:'alabontas',
              board,stackCount:group.length,strips,
              note:'A levágott alkatrészek további alábontása; a gépi átadás hitelesítendő.'});
          }
          const cutOrder=++order;
          for(const cuts of groupCuts)if(cuts[k]){
            cuts[k].boardOrder=cuts[k].globalOrder=cutOrder;
            cuts[k].stackCount=group.length;
          }
          events.push({type:'cut',phase:'hosszvagas',board,order:cutOrder,
            group:ordered[k].stage==='rip'?'alabontas':'fo_darabolas',
            stackCount:group.length,stage:ordered[k].stage,strips,
            cuts:groupCuts.map(cuts=>cuts[k])});
        }
      }
      for(const part of bin.placements){
        const cut=bin.cuts[part.finishCutIndex];
        if(cut?.boardOrder)part.completionStep=cut.boardOrder;
      }
      totalCuts+=order;
      boards.push({board,cutCount:order,pairedGroups:boardPairs});
    }
    return {format:'lapterv-production-review-v5',machineExecutable:false,
      numbering:'táblánként 1-től: fő sávozás → fő darabolás → alábontás',
      phases:['savozas','hosszvagas'],maxSuggestedStack:2,
      note:'A két rétegű visszakérés csak ellenőrző javaslat. Az xPrg gépi végrehajtása nem hitelesített.',
      totalCuts,pairedGroups,boards,events};
  }
  function computeNesting(){
    const parts=getParts();
    if(state.layoutMode==='machine'&&Number(state.trim)>0&&Number(state.trim)<Number(state.kerf))
      return {error:'A gépi szélezési ráhagyás nem lehet kisebb a vágásrésnél.'};
    if(parts.errors.length)return {error:'Előbb javítsd a képlethibákat. '+parts.errors[0]};
    if(parts.total>700)return {error:'A program egy tervben legfeljebb 700 alkatrészt kezel. Csökkentsd a darabszámot.'};
    if(!parts.total)return {error:'Nincsenek vágható alkatrészek. Adj meg legalább egy darabot.'};
    let best=null;
    const axes=state.cutDirection==='x'||state.cutDirection==='y'?[state.cutDirection]:['x','y'];
    const machineMode=state.layoutMode==='machine';
    const effort=machineMode?6:parts.total<=80?96:parts.total<=200?48:24;
    const modes=Array.from({length:effort},(_,i)=>i)
      .filter(i=>state.layoutMode!=='rows'||Math.floor(i/6)%4===0)
      .filter(i=>state.layoutMode!=='mosaic'||Math.floor(i/6)%4!==0);
    for(const axis of axes)for(const mode of modes){
      const trial=machineMode?makeStripPlan(mode,parts,axis):makePlan(mode,parts,axis);
      const cuts=trial.bins.flatMap(b=>b.cuts);
      const score=trial.failed.length*1e18+trial.sheetArea*1e5+
        trial.bins.length*1e7+cuts.length*1000+cuts.reduce((s,c)=>s+c.length,0)*.01;
      if(!best||score<best.score){best={...trial,score,cutAxis:axis};}
    }
    if(machineMode&&best&&!best.error)best.production=buildProductionSequence(best.bins);
    return best;
  }
  const colors=['#dcebdd','#e4ece2','#d8e8de','#e9e8d7','#d8e4ea','#eadfda','#dde6d3','#e9e1ea'];

  function trimmingSteps(bin){

    const operations=[
      {axis:'y',section:'R0',sectionX:0,sectionY:0,sectionW:a,sectionH:b,
        offset:trim-kerf/2,beforeSize:strip,afterSize:a-trim,partSide:'start',
        beforeSection:'E1',afterSection:'R1',edge:'bal'},
      {axis:'y',section:'R1',sectionX:trim,sectionY:0,sectionW:a-trim,sectionH:b,
        offset:a-2*trim+kerf/2,beforeSize:a-2*trim,afterSize:strip,partSide:'end',
        beforeSection:'R2',afterSection:'E2',edge:'jobb'},
      {axis:'x',section:'R2',sectionX:trim,sectionY:0,sectionW:a-2*trim,sectionH:b,
        offset:trim-kerf/2,beforeSize:strip,afterSize:b-trim,partSide:'start',
        beforeSection:'E3',afterSection:'R3',edge:'felső'},
      {axis:'x',section:'R3',sectionX:trim,sectionY:trim,sectionW:a-2*trim,sectionH:b-trim,
        offset:b-2*trim+kerf/2,beforeSize:b-2*trim,afterSize:strip,partSide:'end',
        beforeSection:'S1',afterSection:'E4',edge:'alsó'}
    ];
    return operations.map((c,i)=>{
      const position=(c.axis==='y'?c.sectionX:c.sectionY)+c.offset;
      return {...c,kind:'trim',order:i+1,pieceSize:trim,kerf,fromEdge:c.beforeSize,
        x1:c.axis==='y'?position:c.sectionX,
        y1:c.axis==='x'?position:c.sectionY,
        x2:c.axis==='y'?position:c.sectionX+c.sectionW,
        y2:c.axis==='x'?position:c.sectionY+c.sectionH,
        length:c.axis==='y'?c.sectionH:c.sectionW};
    });
  }

  function suggestedBoardSize(bin){
    if(!bin?.placements?.length)return null;
    const trim=Math.max(0,Number(bin.trim)||0),kerf=Math.max(0,Number(state.kerf)||0);
    let neededX,neededY;
    if(bin.machine?.strips?.length){
      // A TÉNYLEGES csíktervvel számolunk: csíkszélességek + közöttük a vágásrés,
      // és a leghosszabb csík darabjai + keresztvágások. Így a javasolt tábla
      // az első és a második gépi menetet is elbírja, nem csupán a rajzi határolót.
      const feedUsed=bin.machine.feedUsed;
      const crossUsed=Math.max(...bin.machine.strips.map(s=>s.usedLength));
      const allowance=2*trim+(trim?kerf/2:0)+kerf;
      neededX=bin.machine.feed==='y'?feedUsed+allowance:crossUsed+allowance;
      neededY=bin.machine.feed==='x'?feedUsed+allowance:crossUsed+allowance;
    }else{
      const xs=bin.placements.map(p=>p.x),ys=bin.placements.map(p=>p.y);
      const spanX=Math.max(...bin.placements.map(p=>p.x+p.realW))-Math.min(...xs);
      const spanY=Math.max(...bin.placements.map(p=>p.y+p.realH))-Math.min(...ys);
      neededX=spanX+2*trim+kerf;
      neededY=spanY+2*trim+kerf;
    }
    // Praktikus 10 mm-es méretlépcső; a plusz vágásrés elkerüli a gépben
    // visszamaradó, már le nem vágható néhány mm-es csíkot.
    const a=Math.min(bin.a,Math.ceil((neededX-0.00001)/10)*10);
    const b=Math.min(bin.b,Math.ceil((neededY-0.00001)/10)*10);
    const saved=1-a*b/(bin.a*bin.b),util=bin.used/(bin.a*bin.b);
    if(saved<.25||util>.60)return null;
    return {a,b,saved};
  }

  // Offline, valódi .xlsx export: egyszerű, tárolt ZIP/OOXML. Nem kell hozzá internet.
  function xlsxZip(files,mime='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'){
    const encoder=new TextEncoder(),chunks=[],directory=[];
    let offset=0;
    const crc32=bytes=>{
      let crc=0xFFFFFFFF;
      for(const byte of bytes){
        crc^=byte;
        for(let n=0;n<8;n++)crc=(crc>>>1)^((crc&1)?0xEDB88320:0);
      }
      return (crc^0xFFFFFFFF)>>>0;
    };
    const head=(size,signature)=>{
      const bytes=new Uint8Array(size),view=new DataView(bytes.buffer);
      view.setUint32(0,signature,true);
      return {bytes,view};
    };
    for(const [filename,contents] of files){
      const name=encoder.encode(filename),data=ArrayBuffer.isView(contents)?
        new Uint8Array(contents.buffer,contents.byteOffset,contents.byteLength):encoder.encode(contents),crc=crc32(data);
      const local=head(30+name.length,0x04034B50);
      local.view.setUint16(4,20,true);
      local.view.setUint32(14,crc,true);
      local.view.setUint32(18,data.length,true);
      local.view.setUint32(22,data.length,true);
      local.view.setUint16(26,name.length,true);
      local.bytes.set(name,30);
      chunks.push(local.bytes,data);
      const central=head(46+name.length,0x02014B50);
      central.view.setUint16(4,20,true);
      central.view.setUint16(6,20,true);
      central.view.setUint32(16,crc,true);
      central.view.setUint32(20,data.length,true);
      central.view.setUint32(24,data.length,true);
      central.view.setUint16(28,name.length,true);
      central.view.setUint32(42,offset,true);
      central.bytes.set(name,46);
      directory.push(central.bytes);
      offset+=local.bytes.length+data.length;
    }
    const dirLength=directory.reduce((sum,entry)=>sum+entry.length,0);
    const end=head(22,0x06054B50);
    end.view.setUint16(8,files.length,true);
    end.view.setUint16(10,files.length,true);
    end.view.setUint32(12,dirLength,true);
    end.view.setUint32(16,offset,true);
    return new Blob([...chunks,...directory,end.bytes],{type:mime});
  }
  function partsWorkbook(){
    const list=getParts();

      '<sheetFormatPr defaultRowHeight="25"/><cols>'+cols+'</cols><sheetData>'+dataRows+'</sheetData>'+
      '<mergeCells count="3"><mergeCell ref="A1:E1"/><mergeCell ref="A2:E2"/><mergeCell ref="A3:E3"/></mergeCells>'+

      '<pageSetup orientation="landscape" paperSize="9" fitToWidth="1" fitToHeight="0"/></worksheet>';
    const styles='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+

      '<font><b/><sz val="10"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font>'+
      '<font><b/><sz val="15"/><color rgb="FF214834"/><name val="Calibri"/></font></fonts>'+
      '<fills count="4"><fill><patternFill patternType="none"/></fill>'+      '<fill><patternFill patternType="gray125"/></fill>'+
      '<fill><patternFill patternType="solid"><fgColor rgb="FF214834"/></patternFill></fill>'+

      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+

      '<xf numFmtId="0" fontId="0" fillId="3" borderId="0" applyFill="1"><alignment horizontal="left" indent="1" vertical="center" wrapText="1"/></xf>'+
      '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" applyNumberFormat="1"><alignment horizontal="right" indent="1" vertical="center"/></xf>'+
      '<xf numFmtId="164" fontId="0" fillId="3" borderId="0" applyNumberFormat="1" applyFill="1"><alignment horizontal="right" indent="1" vertical="center"/></xf>'+
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="0"><alignment horizontal="center" vertical="center"/></xf>'+
      '<xf numFmtId="0" fontId="0" fillId="3" borderId="0" applyFill="1"><alignment horizontal="center" vertical="center"/></xf></cellXfs></styleSheet>';
    return xlsxZip([

  // Az Edge/Chrome Windows-alkalmazásablakában közvetlen Mentés másként ablakot nyitunk.
  // A régi, sokszor észrevétlen böngészős letöltés csak tartalék módszer.
  async function saveFileToDisk(blob,filename,extension,mime){
    if(typeof window.showSaveFilePicker==='function'){
      try{
        const handle=await window.showSaveFilePicker({
          suggestedName:filename,
          types:[{description:extension.toUpperCase()+' fájl',accept:{[mime]:[extension]}}]
        });
        const writable=await handle.createWritable();
        try{await writable.write(blob);}finally{await writable.close();}
        return true;
      }catch(err){
        if(err?.name==='AbortError')return false;
        console.warn('A fájlmentési ablak nem érhető el, letöltéssel próbálkozunk.',err);
      }
    }
    downloadBlob(blob,filename);
    return true;
  }
  async function downloadPartsXlsx(){
