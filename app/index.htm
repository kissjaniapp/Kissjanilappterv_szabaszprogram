    /* Egysoros felső munkafolyamat: nincs oldalsáv, a három lépés mindig elérhető. */
    .app{display:block}
    .main{max-width:1660px;padding:0 30px 70px}
    .topbar{min-height:80px;height:auto;padding:12px 0}
    .topbar .brand{display:flex;align-items:center;gap:11px;padding:0}
    .topbar .brand-logo{background:#e2f0e8;color:var(--pine)}
    .topbar .brand-name{color:var(--pine)}
    .topbar .brand-sub{color:#698d79}
    .top-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}

  // A szokli darabszáma és képletei kizárólag a bútorparaméterekből

  function rebuildPlinthParts(f){

  // Saját igen/nem kapcsolók, mindegyikhez tetszőleges számú,

  // Ezek kizárólag a bútor/munka adataiban vannak; a gépi vágó

  function makeCustomPartDefinition(){

  // A feltétel kizárólag az aktuális bútor W/H/D/T/S/O változóival számolható.
  // Példák: H>=1200, W>600 && D>=400, H<900 || W>1000.
  function customConditionState(f,rule){
    if(!rule.enabled)return {active:false,error:''};
    const condition=String(rule.condition||'').trim();
    if(!condition)return {active:true,error:''};
    try{
      const vars={W:Number(f.w),H:Number(f.ht),D:Number(f.d),T:Number(f.t)||18,
        S:effectiveShelves(f),O:effectiveDivider(f)};
      if(Object.values(vars).some(v=>!Number.isFinite(v)))throw Error('Hibás bútoradat');
      const active=condition.split(/\s*\|\|\s*/).some(group=>
        group.split(/\s*&&\s*/).every(test=>{
          const m=test.match(/^(.+?)\s*(>=|<=|==|!=|>|<)\s*(.+)$/);
          if(!m)throw Error('Használj összehasonlítást, pl. H>=1200');
          const a=calc(m[1],vars),b=calc(m[3],vars);
          switch(m[2]){
            case '>=':return a>=b;
            case '<=':return a<=b;
            case '>':return a>b;
            case '<':return a<b;
            case '==':return a===b;
            case '!=':return a!==b;
          }
          return false;
        }));
      return {active,error:''};
    }catch(e){return {active:false,error:e.message||'Hibás feltétel'};}
  }
  function customRuleStatus(f,rule){

  function refreshCustomRuleStatuses(f){

  // Az első alkatrész neve – ha nincs külön megadva – a paraméter neve.
  // A további alkatrészeknél külön nevet várunk, hogy ne legyen duplikáció.
  function customPartName(rule,spec){

      ((rule.parts||[])[0]===spec?String(rule.name||'').trim():'');
  }
  function syncCustomParameterParts(f){
    if(!Array.isArray(f.customParameters))f.customParameters=[];
    const definitions=new Map();
    for(const rule of f.customParameters)for(const spec of rule.parts||[])
      definitions.set(rule.id+':'+spec.id,{rule,spec});
    // Az eltávolítás/kikapcsolás előtt megőrizzük az esetleg már
    // kézzel átírt alkatrészméreteket a paraméterben is.
    for(const part of f.parts||[]){
      if(!part.customParameterId)continue;
      const def=definitions.get(part.customParameterId+':'+part.customPartId);
      if(def&&!customConditionState(f,def.rule).active)
        for(const key of ['name','a','b','q']){
          if(key==='name'&&part.customNameInherited)continue;
          def.spec[key]=part[key];
        }
    }
    f.parts=(f.parts||[]).filter(part=>{
      if(!part.customParameterId)return true;
      const def=definitions.get(part.customParameterId+':'+part.customPartId);
      return !!(def&&customConditionState(f,def.rule).active);
    });
    for(const rule of f.customParameters){
      if(!customConditionState(f,rule).active)continue;
      for(const spec of rule.parts||[]){
        const exists=f.parts.find(p=>p.customParameterId===rule.id&&p.customPartId===spec.id);
        if(exists){
          // Régebbi mentésben még nem volt öröklésjelző. Csak az üres
          // alkatrészneveket kapcsoljuk át, a kézzel megadottakat nem.
          if(!exists.customNameInherited&&!String(exists.name||'').trim()&&
             !String(spec.name||'').trim()&&(rule.parts||[])[0]===spec)
            exists.customNameInherited=true;
          if(exists.customNameInherited)exists.name=customPartName(rule,spec);
          continue;
        }
        f.parts.push({id:uuid(),customParameterId:rule.id,customPartId:spec.id,
          name:customPartName(rule,spec),
          customNameInherited:!String(spec.name||'').trim()&&(rule.parts||[])[0]===spec,
          a:spec.a,b:spec.b,q:spec.q,
          edge:'0-0',edgeSides:sidesFromCode('0-0'),
          filingSides:{x1:false,x2:false,y1:false,y2:false},
          edgeThickness:2,mill:true,millDepth:1,
          grainRequired:true,rot:false,materialId:'',materialColor:''});
      }
    }

  // A régi szériákban a paraméterhez közvetlen alkatrész tartozott.
  // Az adatvesztés elkerüléséhez ezeket egyszer független alkatrésszé
  // alakítjuk, a korábbi feltételt átvisszük az új IF mezőbe.
  // Az új, üres paraméterekből önmaguktól NEM keletkezik alkatrész.
  function migrateLegacyCustomParts(f){
    if(!Array.isArray(f.parts))f.parts=[];
    for(const rule of f.customParameters||[]){
      if(!Array.isArray(rule.parts)||!rule.parts.length)continue;
      for(const spec of rule.parts){
        let part=f.parts.find(p=>p.customParameterId===rule.id&&p.customPartId===spec.id);
        if(!part){
          part={id:uuid(),name:customPartName(rule,spec),
            a:spec.a,b:spec.b,q:spec.q,
            edge:'0-0',edgeSides:sidesFromCode('0-0'),
          filingSides:{x1:false,x2:false,y1:false,y2:false},
            edgeThickness:2,mill:true,millDepth:1,
            grainRequired:true,rot:false,materialId:'',materialColor:''};
          f.parts.push(part);
        }
        if(part.ifCondition==null){
          part.ifCondition=rule.enabled===false?'0':
            String(rule.name||'').trim()?'['+String(rule.name).trim()+']':
              String(rule.condition||'').trim();
        }
        delete part.customParameterId;
        delete part.customPartId;
        delete part.customNameInherited;
      }
      // A régi szerkesztő alkatrészdefiníciói az önálló alkatrészekbe
      // kerültek; ismételt megnyitás nem duplikálhatja őket.
      rule.parts=[];
      rule.enabled=true;
    }
  }
  // A bútornak vannak önálló, névvel hivatkozható IF-paraméterei.
  // [paraméter neve] minden méret-/darabszámképletben 1 vagy 0 értéket ad.
  // A hivatkozás csak az AKTUÁLIS bútor saját paramétereit keresheti.
  // Minden projektben létező, alapból rejtett paraméter. Alapértéke 0.
  // Ha a tulajdonos létrehoz egy saját 'munkalap' paramétert, annak 1-es
  // értéke kifejezetten engedélyezheti a 38 mm-es munkalapokat.
  function worktopFlag(f){
    const matches=(f?.customParameters||[]).filter(p=>
      String(p.name||'').trim().toLocaleLowerCase('hu-HU')==='munkalap');
    if(matches.length>1)throw Error('Nem egyértelmű munkalap paraméter');
    if(matches.length){
      const value=String(matches[0].value??'').trim();
      if(!/^[01]$/.test(value))throw Error('A munkalap paraméter értéke csak 0 vagy 1 lehet');
      return Number(value);
    }
    return 0;
  }
  function ensureWorktopPartIf(part,thickness){
    if(!part)return;
    const current=String(part.ifCondition||'').trim();
    if(Number(thickness)===38){
      if(!/(?:^|&&)\s*(?:\[munkalap\]|munkalap)\s*(?:==|=)\s*1\s*(?:&&|$)/i.test(current)){
        part.ifCondition=current?current+'&&munkalap=1':'munkalap=1';
        part.autoWorktopIf=true;
      }
    }else if(part.autoWorktopIf){
      part.ifCondition=current.replace(/&&\s*munkalap\s*=\s*1\s*$/i,'').replace(/^munkalap\s*=\s*1$/i,'').trim();
      part.autoWorktopIf=false;
    }
  }
  function namedFurnitureParameter(name,vars,f,visited=[]){
    const needle=String(name||'').trim().toLocaleLowerCase('hu-HU');
    const matches=(f?.customParameters||[]).filter(p=>
      String(p.name||'').trim().toLocaleLowerCase('hu-HU')===needle&&needle);
    if(!matches.length&&needle==='munkalap')return worktopFlag(f);
    // A polc=0 alapból elérhető, saját paraméter felvétele nélkül is.
    if(!matches.length&&needle==='polc')return Math.max(0,Math.round(Number(f?.s)||0));
    if(!matches.length){
      const imported=(f?.fusionParameters||[]).filter(p=>String(p.name||'').trim().toLocaleLowerCase('hu-HU')===needle);
      if(imported.length===1&&imported[0].type==='number'&&
        ['length','unitless'].includes(imported[0].dimension)&&Number.isFinite(imported[0].value))
        return imported[0].value;
      if(imported.length>1)throw Error('Nem egyértelmű Fusion-paraméter: '+name);
      if(imported.length===1)throw Error('A Fusion-paraméter nem hosszúság vagy egység nélküli szám: '+name);
    }
    if(!matches.length)throw Error('Ismeretlen bútorparaméter: '+name);
    if(matches.length>1)throw Error('Nem egyértelmű bútorparaméter: '+name);
    const rule=matches[0],id='parameter:'+rule.id;
    if(visited.includes(id))throw Error('Körkörös bútorparaméter-hivatkozás: '+name);
    // Az új paraméterek értéke szám (például szokli = 1, 2 vagy 3).
    // A régi, képletes feltételeket külön érték hiányában megőrizzük.
    if(Object.prototype.hasOwnProperty.call(rule,'value')){
      const text=String(rule.value??'').trim();
      const number=Number(text.replace(',','.'));
      if(!text||!Number.isSafeInteger(number)||number<0||number>99)
        throw Error('A(z) '+name+' paraméter 0 és 99 közötti egész szám lehet');
      return number;
    }
    if(rule.enabled===false&&(rule.parts||[]).length)return 0;
    return evaluateFurnitureIf(rule.condition,vars,f,null,[...visited,id])?1:0;
  }
  function expandFurnitureParameters(formula,vars,f,visited=[]){
    return String(formula??'').replace(/\[([^\[\]]+)\]/g,(_,name)=>
      '('+namedFurnitureParameter(name,vars,f,visited)+')');
  }
  function evaluateFurnitureIf(formula,vars,f,part=null,visited=[]){
    const condition=String(formula??'').trim();
    if(!condition)return true; // A feltétel nélküli alkatrész mindig szerepel.
    const exact=(f?.customParameters||[]).filter(p=>
      String(p.name||'').trim().toLocaleLowerCase('hu-HU')===
        condition.toLocaleLowerCase('hu-HU'));
    if(exact.length||condition.toLocaleLowerCase('hu-HU')==='polc')return namedFurnitureParameter(condition,vars,f,visited)!==0;
    return condition.split(/\s*\|\|\s*/).some(group=>
      group.split(/\s*&&\s*/).every(original=>{
        let expression=original.trim(),negated=false;
        while(expression.startsWith('!')){negated=!negated;expression=expression.slice(1).trim();}
        if(!expression)throw Error('Üres IF feltétel');
        // Az IF elfogadja a [szokli]==2 és a rövid szokli=2 alakot is.
        const m=expression.match(/^(.+?)\s*(>=|<=|==|!=|=|>|<)\s*(.+)$/);
        const numeric=value=>{
          const term=String(value).trim();
          const parameters=(f?.customParameters||[]).filter(p=>
            String(p.name||'').trim().toLocaleLowerCase('hu-HU')===
            term.toLocaleLowerCase('hu-HU')&&term);
          if(parameters.length===1||['munkalap','polc'].includes(term.toLocaleLowerCase('hu-HU')))
            return namedFurnitureParameter(term,vars,f,visited);
          if(parameters.length>1)throw Error('Nem egyértelmű bútorparaméter: '+term);
          return calcPartFormula(term,vars,f,
            part||{id:'parameter-definition:'+visited.join(':'),name:'Paraméter'},'if',visited);
        };
        let active;
        if(m){
          const a=numeric(m[1]);
          // Az "szokli=1-2-3" számértéklista: az alkatrész minden felsorolt
          // paraméterértéknél bekerül (1 VAGY 2 VAGY 3). A 0 nem egyezik.
          // Csak névvel hivatkozott SAJÁT bútorparaméter egyenlőségi vizsgálatánál
          // használjuk: a W=100-20 típusú aritmetikai kifejezés megmarad.
          const lhs=String(m[1]).trim();
          const paramName=lhs.startsWith('[')&&lhs.endsWith(']')?
            lhs.slice(1,-1).trim():lhs;
          const isNamedParam=(f?.customParameters||[]).some(param=>
            String(param.name||'').trim().toLocaleLowerCase('hu-HU')===
              paramName.toLocaleLowerCase('hu-HU')&&paramName);
          const choices=String(m[3]).trim();
          const choiceList=(m[2]==='='||m[2]==='==')&&isNamedParam&&
            /^\d+(?:\s*-\s*\d+)+$/.test(choices);
          if(choiceList){
            active=choices.split(/\s*-\s*/).some(number=>a===Number(number));
          }else{
            const b=numeric(m[3]);
            switch(m[2]){
              case '>=':active=a>=b;break;
              case '<=':active=a<=b;break;
              case '>':active=a>b;break;
              case '<':active=a<b;break;
              case '==':case '=':active=a===b;break;
              case '!=':active=a!==b;break;
            }
          }
        }else{
          // IF=1 vagy IF=[paraméter] is működik, puszta szöveg nem.
          active=numeric(expression)!==0;
        }
        return negated?!active:active;
      }));
  }
  function partIfState(part,f,thickness){
    try{
      ensureWorktopPartIf(part,thickness);
      // A munkalap-engedély akkor is kötelező, ha az egyéni IF-ben OR szerepel.
      if(Number(thickness)===38&&worktopFlag(f)!==1)return {active:false,error:''};
      const vars={W:+f.w,H:+f.ht,D:+f.d,T:thickness,
        S:effectiveShelves(f),O:effectiveDivider(f)};
      return {active:evaluateFurnitureIf(part.ifCondition,vars,f,part),error:''};
    }catch(e){return {active:false,error:e.message||'Érvénytelen IF képlet'};}
  }
  function partIfText(part,f){
    const condition=String(part.ifCondition||'').trim();
    if(!condition)return 'IF nélkül: mindig bekerül';
    const state=partIfState(part,f,materialForPart(part,f).thickness);
    return state.error?'IF hiba: '+state.error:
      state.active?'IF igaz: bekerül a szabásba':'IF hamis: most kimarad';
  }
  function customParameterStatus(f,rule){
    if(!String(rule.name||'').trim())return 'Add meg a paraméter nevét';
    try{
      const vars={W:+f.w,H:+f.ht,D:+f.d,T:Number(f.t)||18,
        S:effectiveShelves(f),O:effectiveDivider(f)};
      const value=namedFurnitureParameter(rule.name,vars,f);
      return Object.prototype.hasOwnProperty.call(rule,'value')?
        'Értéke: '+value+' · ezt használják az alkatrészek képletei':
        value?'Régi feltétel igaz · értéke 1':'Régi feltétel hamis · értéke 0';
    }catch(e){return 'Paraméterhiba: '+e.message;}
  }
  function customParametersPanel(f){
    const rules=f.customParameters||[];
    const rows=rules.map(rule=>`

        </div>

            ${rule.value==null&&String(rule.condition||'').trim()?
              '<div class="tiny muted">Régi feltétel: <code>'+h(rule.condition)+'</code>. Szám megadásáig ez marad érvényben.</div>':''}

  function deleteFolderFurniture(kind,id,furnitureId){
    if(kind==='series'){
      const source=seriesCatalog.find(x=>x.id===id);

      seriesCatalog=seriesCatalog.filter(x=>x.id!==id);
      storeCatalog(seriesKey,seriesCatalog);render();return;
    }
    const entry=library.find(x=>x.id===id);
    const original=entry?.data.furnitures?.find(x=>x.id===furnitureId);
    if(!original)return;
    const last=entry.data.furnitures.length===1;

      ' bútort a mentett munkából?'+(last?' A munka is törlődik.':'')))return;

  function startSelectedFurnitureCut(){
    const chosen=[];
    for(const [key,entry] of furnitureCutSelection){
      if(!entry.selected)continue;
      if(!Number.isSafeInteger(entry.qty)||entry.qty<1){
        showNotice('Minden kijelölt bútornál pozitív egész darabszámot adj meg.');return;
      }
      const [kind,id,furnitureId='']=key.split(':');
      const template=kind==='series'?seriesCatalog.find(x=>x.id===id)?.furniture:
        library.find(x=>x.id===id)?.data.furnitures.find(x=>x.id===furnitureId);
      if(!template)continue;
      for(let i=0;i<entry.qty;i++){
        const copy=copyFurniture(template);
        copy.qty=1;copy.collectionPosition=i+1;copy.collectionCount=entry.qty;
        chosen.push(copy);
      }
    }
    if(!chosen.length){showNotice('Pipáld be a leszabandó bútorokat a mappákban.');return;}
    freshProject();
    state.furnitures=chosen;
    state.selectedFurniture=chosen[0].id;
    state.projectName='Közös szabás · '+chosen.map(x=>x.name||'Bútor').join(' + ');
    state.active='collector';result=null;furnitureCutSelection.clear();

    if(typeof currentProjectId!=='undefined'){
      const job=library.find(e=>e.id===currentProjectId);
      if(job)job.selectionWorkspace=true;
    }
    save();render();
  }

  function save(){
    if(projectScreen!=='editor'||!currentProjectId)return false;
    try{
      const entry=library.find(x=>x.id===currentProjectId);
      if(!entry)return false;
      entry.data=JSON.parse(JSON.stringify(state));entry.updatedAt=Date.now();
      localStorage.setItem(libraryKey,JSON.stringify(library));
      localStorage.setItem('lapterv-project-v2',JSON.stringify(state));

    }catch(error){
      console.warn('A helyi mentés sikertelen:',error);
      return false;
    }

  // A testreszabás kizárólag a program helyi projektjében/szériatárában
  // mentődik. Sem xMix, sem xPrg gépi fájlt nem készít.
  // A Mentés előtt a nyitott IF input legfrissebb értékét is beolvassuk.
  function captureVisibleFurnitureEdits(){
    const sharedDestination=document.querySelector?.('[data-scope="collector-destination"]');
    if(sharedDestination)for(const furniture of state.furnitures)furniture.destination=sharedDestination.value;
    for(const el of document.querySelectorAll('[data-scope="part"][data-key], [data-scope="custom-param"][data-key], [data-scope="furniture"][data-key]')){
      const scope=el.dataset.scope,key=el.dataset.key;
      if(scope==='part'&&['name','a','b','q','ifCondition'].includes(key)&&el.tagName==='INPUT'){
        const part=state.furnitures.flatMap(f=>f.parts||[]).find(p=>p.id===el.dataset.id);
        if(part)part[key]=el.value;
      }else if(scope==='custom-param'&&['name','value','condition'].includes(key)&&el.tagName==='INPUT'){
        const owner=state.furnitures.find(f=>(f.customParameters||[]).some(p=>p.id===el.dataset.id));
        const rule=owner?.customParameters?.find(p=>p.id===el.dataset.id);
        if(rule)rule[key]=el.value;
      }else if(scope==='furniture'&&['name','destination'].includes(key)&&el.tagName==='INPUT'){
        const f=state.furnitures.find(x=>x.id===el.dataset.id);
        if(f)f[key]=el.value;
      }
    }
  }
  function saveFurnitureCustomization(){
    captureVisibleFurnitureEdits();
    if(projectScreen==='editor')
      return save()?
        {ok:true,message:'A bútor paraméterei és alkatrészei elmentve a programban.'}:
        {ok:false,message:'Nem sikerült a belső mentés. Ellenőrizd a program helyi tárhelyét.'};
    if(projectScreen==='series-edit'){
      const f=getFurniture();

      try{
        const copy=JSON.parse(JSON.stringify(f));

        const entry={id:editingSeriesId||uuid(),
          folderId:idx>=0?(seriesCatalog[idx].folderId||'series'):'series',

  // Expression parser: only numbers, W H D T S, + - * / and parentheses are accepted.
  function calc(formula,vars){
    const src=String(formula ?? '').replace(/,/g,'.').replace(/\s+/g,'').toUpperCase();
    const tokens=src.match(/(?:\d+(?:\.\d*)?|\.\d+)|[WHDTSO]|[()+\-*/]/g) || [];
    if (!src || tokens.join('')!==src) throw Error('Érvénytelen képlet');
    let i=0;
    function atom(){
      const t=tokens[i++];
      if(t==='+' || t==='-')return (t==='-'?-1:1)*atom();
      if(t==='('){const v=expr();if(tokens[i++]!==')')throw Error('Hiányzó zárójel');return v;}
      if(t in vars)return vars[t];
      if(t && /^(?:\d|\.)/.test(t))return Number(t);
      throw Error('Hibás képlet');
    }
    function term(){let v=atom();while(tokens[i]==='*'||tokens[i]==='/'){const op=tokens[i++],x=atom();v=op==='*'?v*x:v/x;}return v;}
    function expr(){let v=term();while(tokens[i]==='+'||tokens[i]==='-'){const op=tokens[i++],x=term();v=op==='+'?v+x:v-x;}return v;}
    const value=expr();if(i!==tokens.length || !Number.isFinite(value))throw Error('Hibás képlet');return value;
  }
  // Névképlet: az alkatrész szövegébe írható pl. „Polc {W-2*T} mm”,
  // vagy kizárólag képletként „=W-2*T”. Az eredeti beírt nevet nem
  // írjuk felül, csak a megjelenítésben és a gépi alkatrészlistában
  // használjuk a kiszámított eredményt.
  function resolvedPartName(name,vars,f,part){
    const raw=String(name??'');
    const fmt=value=>String(Math.round(value*10)/10).replace('.',',');
    const evaluate=formula=>f&&part?
      calcPartFormula(formula,vars,f,part,'name'):calc(formula,vars);
    if(raw.trim().startsWith('='))return fmt(evaluate(raw.trim().slice(1)));
    return raw.replace(/\{([^{}]+)\}/g,(_,formula)=>fmt(evaluate(formula)));
  }
  // Más alkatrész KÉSZ méretének név szerinti hivatkozása:
  // "Oldal"x = az Oldal első / szálirányú mérete,
  // "Oldal"y = az Oldal második / keresztirányú mérete.
  // A keresés bútoronként történik. Ismeretlen, duplikált, illetve
  // körkörös hivatkozást hibának tekintünk, soha nem tippelünk méretet.
  function calcPartFormula(formula,vars,f,part,axis='x',visited=[]){
    const key=String(part?.id??part?.name??'névtelen')+':'+axis;
    if(visited.includes(key))throw Error('Körkörös alkatrészméret-hivatkozás');
    const chain=[...visited,key];
    // Alkatrésznév + X/Y (kis-/nagybetű független), pl. Pótfenékx.
    // A korábbi "Pót fenék"x forma is működik. A [paraméterek] szövegét
    // soha nem értelmezzük véletlenül alkatrészhivatkozásnak.
    const lookup=(name,dir)=>{
      const matches=(f?.parts||[]).filter(p=>
        String(p.name||'').trim().toLocaleLowerCase('hu-HU')===
        name.trim().toLocaleLowerCase('hu-HU'));
      if(!matches.length)throw Error('Ismeretlen alkatrésznév: '+name);
      if(matches.length>1)throw Error('Nem egyértelmű alkatrésznév: '+name);
      const referenced=matches[0],refAxis=dir.toLowerCase()==='x'?'a':'b';
      const refT=materialForPart(referenced,f).thickness;
      const refVars={...vars,T:refT};
      const value=calcPartFormula(referenced[refAxis],refVars,f,referenced,
        dir.toLowerCase(),chain);
      return '('+value+')';
    };
    const quoted=String(formula??'').replace(/"([^"]+)"\s*([xy])/gi,
      (_,name,dir)=>lookup(name,dir));
    const expression=quoted.replace(/\[[^\]]*\]|"[^"]*"|(^|[^\p{L}\p{N}_])([\p{L}_][\p{L}\p{N}_]*)/gu,
      (full,prefix,token)=>{
        if(token==null)return full;
        const dir=token.slice(-1).toLowerCase();
        if(dir!=='x'&&dir!=='y')return full;
        const name=token.slice(0,-1);
        if(!name||!((f?.parts||[]).some(p=>
          String(p.name||'').trim().toLocaleLowerCase('hu-HU')===
          name.toLocaleLowerCase('hu-HU'))))return full;
        return (prefix||'')+lookup(name,dir);
      });
    return calc(f?.customParameters?.length||/\[(?:polc|munkalap)\]/i.test(expression)?
      expandFurnitureParameters(expression,vars,f,chain):expression,vars);
  }
  function getParts(){
    let rows=[],errors=[];
    for(const f of state.furnitures){
      if(typeof normalizeImportedSideNames==='function')normalizeImportedSideNames(f);
      // Migráció csak a régi, beágyazott paraméteres alkatrészeknél kell.
      // Az egyszerű alkatrészlista az eddigi kiszámítóval is működőképes.
      if(Array.isArray(f.customParameters)&&f.customParameters.some(rule=>
        Array.isArray(rule.parts)&&rule.parts.length))migrateLegacyCustomParts(f);
      const thickness=Number(f.t)||18;
      const vars={W:+f.w,H:+f.ht,D:+f.d,T:thickness,S:effectiveShelves(f),O:effectiveDivider(f)};
      for(const part of f.parts){
        if(part.scnRemoved||part.scnCutEnabled===false)continue;
        if(part.threeMfGenerated&&!threeMfPartMeetsMinimum(f,part))continue;
        if(typeof cleanFilingForAbs==='function'&&typeof partEdgeThicknesses==='function')cleanFilingForAbs(part);
        const material=materialForPart(part,f),thickness=material.thickness;
        vars.T=thickness;
        if(!String(part.name||'').trim()||!String(part.a||'').trim()||!String(part.b||'').trim()||!String(part.q||'').trim()){
          rows.push({furniture:f,part,skipped:true,qty:0});
          continue;
        }
        try{
          if(part.dxfUnverified)throw Error('DXF: nincs ellenőrzött oldalnézeti méret');
          // A szabásba kizárólag az IF nélküli VAGY igaz IF-es alkatrész
          // kerülhet. Hamis IF és hibás képlet nem hoz létre gépi darabot.
          // A korábbi IF nélküli, képletes működés változatlan.
          const ifState=(Number(thickness)===38||String(part.ifCondition??'').trim())?
            partIfState(part,f,thickness):{active:true,error:''};
          if(ifState.error)throw Error('IF: '+ifState.error);
          if(!ifState.active){
            rows.push({furniture:f,part,skipped:true,ifSkipped:true,qty:0});
            continue;
          }
          const originalA=calcPartFormula(part.a,vars,f,part,'x'),
                originalB=calcPartFormula(part.b,vars,f,part,'y'),
                q=calcPartFormula(part.q,vars,f,part,'q'),qty=q*Number(f.qty);
          const resolvedName=resolvedPartName(part.name,vars,f,part);
          const edge=String(part.edge||'0-0').trim().replace(/\s+/g,'');
          const match=edge.match(/^([012])-([012])$/);
          if(!match)throw Error('Az élzárás formátuma 0-0, 1-0, 0-1, 2-0, 0-2 vagy 2-2 lehet');
          const edgeThickness=part.edgeThickness==null||part.edgeThickness===''?2:pnum(part.edgeThickness);
          if(![2,0.4].includes(edgeThickness))throw Error('Csak 2 vagy 0,4 mm-es élzáró választható');
          // Helyi kiszámítás, hogy a régi, külön tesztelt szabászati
          // képlet és a négyélű új ABS is önállóan működjön.
          const enabledSides=part.edgeThicknesses&&part.edgeSides?part.edgeSides:{
            x1:Number(match[1])>=1,x2:Number(match[1])===2,
            y1:Number(match[2])>=1,y2:Number(match[2])===2
          };
          const sideNames=['x1','x2','y1','y2'];
          const edgeThicknesses=Object.fromEntries(sideNames.map(side=>{
            const configured=Number(part.edgeThicknesses?.[side]);
            return [side,enabledSides[side]?([2,0.4].includes(configured)?configured:edgeThickness):0];
          }));
          const mill=!!part.mill&&sideNames.some(side=>edgeThicknesses[side]===2);
          const configuredDepth=part.millDepth==null||part.millDepth===''?1:pnum(part.millDepth);
          if(!Number.isFinite(configuredDepth)||configuredDepth<0||configuredDepth>2)throw Error('Az előmarás 0–2 mm között állítható');
          const millDepth=mill?configuredDepth:0;
          // Az élenkénti ABS nettó hozzájárulása külön számítódik.
          // A 2 mm-es ABS előmarása beállítható; a 0,4-esnél nincs előmarás.
          // A getParts önállóan is kiértékelhető (régi gépi tesztek).
          // Az egyedi élmarás csak 2 mm ABS mellett érvényes.
          const sideMill=side=>{
            if(!mill||edgeThicknesses[side]!==2)return 0;
            const override=part.millDepthSides?.[side];
            if(override==null||override==='')return millDepth;
            const value=Number(override);
            if(!Number.isFinite(value)||value<0||value>2)
              throw Error('Az élenkénti élmarás 0–2 mm lehet');
            return value;
          };
          const net=side=>edgeThicknesses[side]===2?
            2-sideMill(side):edgeThicknesses[side];
          const a=originalA-net('y1')-net('y2');
          const b=originalB-net('x1')-net('x2');
          if(!(a>0&&b>0&&originalA<=10000&&originalB<=10000&&q>=0&&Number.isSafeInteger(q)&&Number.isSafeInteger(qty)&&qty>=0)) throw Error('Érvénytelen méret/darabszám');
          const canRotate=part.grainRequired===false||(part.grainRequired==null&&!!part.rot);
          rows.push({furniture:f,part,resolvedName,a:Math.round(a*10)/10,b:Math.round(b*10)/10,originalA,originalB,edge,edgeThickness,edgeThicknesses,mill,millDepth,thickness,materialColor:material.color,materialId:part.materialId||f.materialId||'',q,qty,rot:canRotate,grainRequired:!canRotate});
        }catch(e){errors.push(`${f.name} / ${part.name}: ${e.message}`);rows.push({furniture:f,part,error:e.message,qty:0});}
      }
    }
    return {rows,errors,total:rows.reduce((s,r)=>s+r.qty,0),area:rows.reduce((s,r)=>s+(r.a||0)*(r.b||0)*r.qty,0)};
  }

  // A képlet mindvégig szerkeszthető szövegként tárolódik. Az eredmény
  // az élzárás és előmarás után ténylegesen szabandó méretet mutatja.
  function isFormulaText(value){
    const raw=String(value??'').trim();
    return /"[^"]+"\s*[xy]/i.test(raw)||/[WHDTSO()+*/]/i.test(raw)||/\d\s*[-+]\s*\d/.test(raw);
  }
  function partDimensionPreview(part,f,axis){
    const raw=String(part[axis]??'').trim();
    if(!raw)return '–';
    try{
      // A bútor és az alkatrész bevitelénél mindig a KÉSZ MÉRET látszik.
      // A levonás kizárólag getParts() szabásméretét érinti.
      const t=materialForPart(part,f).thickness;
      const finished=calcPartFormula(raw,{W:+f.w,H:+f.ht,D:+f.d,T:t,S:effectiveShelves(f),O:effectiveDivider(f)},f,part,axis);
      if(!Number.isFinite(finished)||finished<=0||finished>10000)throw Error('Érvénytelen készméret');
      return nfmt(finished);
    }catch{return '–';}
  }
  function partDimensionInput(part,f,axis,label){
    const formula=String(part[axis]??'');
    const hasFormula=isFormulaText(formula);
    const value=partDimensionPreview(part,f,axis);
    const count=dimensionUnderline(part,axis);
    const visible=String(hasFormula?value:formula);
    const markWidth=Math.min(105,Math.max(8,visible.length*(hasFormula?10.8:8.7)));
    return `<div class="expr-cell ${hasFormula?'has-formula':''}" data-expr-part="${h(part.id)}" data-expr-axis="${axis}"><input class="expr" style="text-decoration:none" aria-label="${label}" autocomplete="off" spellcheck="false" data-scope="part" data-id="${part.id}" data-key="${axis}" value="${h(formula)}"><output class="expr-result ${value==='–'?'invalid':''}" style="text-decoration:none" aria-label="Kiszámolt készméret milliméterben" title="Kiszámolt készméret · ABS és marás levonása nélkül">${h(value)}</output><span class="dimension-mark-slot mark-${count}" data-mark-for="${axis}" aria-hidden="true" style="width:${markWidth}px"></span></div>`;
  }
  // Gépeléskor nem rajzoljuk újra az egész oldalt. Csak az eredményt
  // és az összesítést frissítjük, így megmarad a kurzor és a kijelölés.
  function refreshLiveFormulaValues(){
    if(!state.furnitures.length)return;
    for(const wrapper of document.querySelectorAll('[data-expr-part]')){
      const current=state.furnitures.find(f=>(f.parts||[]).some(p=>p.id===wrapper.dataset.exprPart));
      const part=current?.parts.find(p=>p.id===wrapper.dataset.exprPart);
      if(!part)continue;
      const key=wrapper.dataset.exprAxis;
      const active=isFormulaText(part[key]);
      wrapper.classList.toggle('has-formula',active);
      const count=dimensionUnderline(part,key);
      const mark=wrapper.querySelector('.dimension-mark-slot');
      if(mark){
        mark.className='dimension-mark-slot mark-'+count;
        const visible=String(active?partDimensionPreview(part,current,key):part[key]??'');
        mark.style.width=Math.min(105,Math.max(8,visible.length*(active?10.8:8.7)))+'px';
      }
      const output=wrapper.querySelector('.expr-result');
      if(output){
        const value=partDimensionPreview(part,current,key);
        output.textContent=value;
        output.classList.toggle('invalid',value==='–');
      }
    }
    const summary=getParts();
    for(const hint of document.querySelectorAll('[data-part-if-status]')){
      const f=state.furnitures.find(item=>(item.parts||[]).some(p=>p.id===hint.dataset.partIfStatus));
      const part=f?.parts.find(p=>p.id===hint.dataset.partIfStatus);
      if(part)hint.textContent=partIfText(part,f);
    }
    for(const output of document.querySelectorAll('[data-name-preview]')){
      const r=summary.rows.find(row=>row.part?.id===output.dataset.namePreview);
      output.textContent=r?.resolvedName&&r.resolvedName!==r.part.name?r.resolvedName:'';
    }
    const total=document.querySelector('[data-live-part-total]');
    if(total)total.textContent=nfmt(summary.total)+' db';
    const area=document.querySelector('[data-live-part-area]');

  const partColumnStorageKey='gatterka-parts-column-widths-v1';
  const partColumnDefaults=[42,210,145,145,60,215,195,120,185,94,215,125,46];
  const partColumnMinimum=[32,100,88,88,48,105,125,78,145,76,164,95,40];
  const partColumnTitles=[
    ['⠿','Alkatrészek sorrendje'],['Megnevezés','Alkatrész megnevezése'],
    ['X · szál ↔','Szálirányú méret'],['Y · kereszt ↕','Keresztirányú méret'],
    ['Db','Darabszám'],['IF · megmunkálási feltétel','IF feltétel'],
    ['Anyag · szín · vastagság','Alapanyag'],['Élzárás (szál-kereszt)','Élzárás'],
    ['ABS vastagság · X1 X2 Y1 Y2','ABS élvastagságok'],['Reszelés','Reszelés'],
    ['Élmarás (mm)','Élmarás'],['Szálirány kötelező','Szálirány kikötése'],
    ['','Alkatrész törlése']
  ];
  function loadPartColumnWidths(){
    let stored=null;
    try{stored=JSON.parse(localStorage.getItem(partColumnStorageKey));}catch{}
    return partColumnDefaults.map((v,i)=>{
      const n=Array.isArray(stored)?Number(stored[i]):NaN;
      return Number.isFinite(n)?Math.max(partColumnMinimum[i],Math.min(650,Math.round(n))):v;
    });
  }
  let partColumnWidths=loadPartColumnWidths();
  function partTableTotalWidth(){return partColumnWidths.reduce((sum,w)=>sum+w,0);}
  function partTableColgroup(){return '<colgroup>'+partColumnWidths.map((width,i)=>'<col data-part-col-index="'+i+'" style="width:'+width+'px">').join('')+'</colgroup>';}
  function partTableHeadings(){return '<thead><tr>'+partColumnTitles.map(([label,title],i)=>
    '<th data-part-col-index="'+i+'" title="'+title+'"><span class="parts-col-caption">'+label+'</span>'+
    '<span class="parts-col-resizer" data-part-column-resize="'+i+'" role="separator" aria-orientation="vertical"'+
    ' aria-label="Oszlopszélesség: '+title+'" tabindex="0" title="Az oszlop szélességét a jobb szélén húzva állíthatod"></span></th>').join('')+'</tr></thead>';}
  function setPartColumnWidth(i,width){
    if(!Number.isInteger(i)||i<0||i>=partColumnWidths.length)return;
    partColumnWidths[i]=Math.min(650,Math.max(partColumnMinimum[i],Math.round(width)));
    const table=document.querySelector('.parts-resizable-table');
    if(table){
      table.style.width=partTableTotalWidth()+'px';
      const col=table.querySelector('col[data-part-col-index="'+i+'"]');
      if(col)col.style.width=partColumnWidths[i]+'px';
    }
  }
  function savePartColumnWidths(){
    try{localStorage.setItem(partColumnStorageKey,JSON.stringify(partColumnWidths));}
    catch(error){console.warn('Oszlopszélességek mentési hibája:',error);}
  }
  document.addEventListener('pointerdown',event=>{
    const grip=event.target.closest?.('[data-part-column-resize]');
    if(!grip||(event.pointerType==='mouse'&&event.button!==0))return;
    const index=Number(grip.dataset.partColumnResize);
    if(!Number.isInteger(index)||index<0||index>=partColumnWidths.length)return;
    event.preventDefault();
    const pointer=event.pointerId,startX=event.clientX,initial=partColumnWidths[index];
    const move=e=>{if(e.pointerId===pointer)setPartColumnWidth(index,initial+e.clientX-startX);};
    const stop=e=>{
      if(e.pointerId!==pointer)return;
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',stop);
      window.removeEventListener('pointercancel',stop);
      savePartColumnWidths();
    };
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',stop);
    window.addEventListener('pointercancel',stop);
  });
  document.addEventListener('keydown',event=>{
    const grip=event.target.closest?.('[data-part-column-resize]');
    if(!grip||!['ArrowLeft','ArrowRight'].includes(event.key))return;
    event.preventDefault();
    const index=Number(grip.dataset.partColumnResize);
    setPartColumnWidth(index,partColumnWidths[index]+(event.key==='ArrowRight'?10:-10));
    savePartColumnWidths();
  });

  // A gépi kiosztóval azonos getParts() számítás eredménye alapján csak a
  // vágható, IF-szűrésen átment sorokat listázzuk; itt nincs szerkesztés.
  // Csak a kimutatás sorait egyesítjük: az egyedi polcok szerkeszthető
  // alkatrészei és a gépnek szánt CNC-/szabásrekordok változatlanok.
  function groupIdenticalShelfSummaryRows(rows){
    const output=[],seen=new Map();
    const sides=['x1','x2','y1','y2'];
    const rounded=n=>Math.round(Number(n)*1000)/1000;
    for(const row of rows){
      const part=row.part||{};
      if(!/^shelf-\d+(?:-section-\d+)?$/.test(String(part.cabinetDesignKey||''))){
        output.push(row);continue;
      }
      const originalName=String(row.resolvedName||part.name||'').trim();
      const generatedName=Boolean(part.autoCabinetName)&&String(part.name)===String(part.autoCabinetName);
      const name=generatedName?'Polc':originalName;
      const cnc=Array.isArray(part.cncInstances)?part.cncInstances.map(entry=>{
        const {key,name:unusedName,...machining}=entry;
        return machining;
      }):[];
      const sig=JSON.stringify({
        furniture:row.furniture?.id,
        name,
        finished:[rounded(row.originalA),rounded(row.originalB)],
        cutting:[rounded(row.a),rounded(row.b)],
        thickness:row.thickness,
        materialId:row.materialId||'',
        color:row.materialColor||'',
        edge:row.edge||'0-0',
        edgeSides:sides.map(side=>Boolean(part.edgeSides?.[side])),
        abs:sides.map(side=>Number(row.edgeThicknesses?.[side])||0),
        filing:sides.map(side=>Boolean(part.filingSides?.[side])),
        mill:Boolean(row.mill),
        millDepth:row.millDepth,
        sideMills:sides.map(side=>part.millDepthSides?.[side]??null),
        grain:row.grainRequired,
        rot:row.rot,
        tilted:Number(part.shelfTiltDegrees)||0,
        bevel:Number(part.shelfBevelDegrees)||0,
        fixed:Boolean(part.fixedDrilling),
        cnc,
        ifCondition:String(part.ifCondition||'')
      });
      const grouped=seen.get(sig);
      if(grouped){
        grouped.qty+=row.qty;
        grouped.sourceParts.push(part);
        grouped.displayName=name;
        grouped.resolvedName=name;
      }else{
        const copy={...row,sourceParts:[part]};
        seen.set(sig,copy);output.push(copy);
      }
    }
    return output;
  }

se →</button></div></div></div>`;
  }

  // Guillotine cutting: every cut spans the entire CURRENT separated rectangle.
  // Free regions never overlap. A cut is recorded when its child regions are made,
  // so its sequence always precedes cuts within those child regions.
  function guillotinePlace(bin,choice,kerf){
    const {freeIndex,part,realW:a,realH:b,turned,axis,xSide,ySide}=choice;
    const original=bin.free[freeIndex],next=[],eps=.0001;
    // Minden új leválasztott darab saját azonosítót kap. A további vágás már
    // csak ezen a résztáblán történhet, nem vághat bele egy másik alkatrészbe.
    function split(region,direction,partSize,keepSide){
      const length=direction==='y'?region.w:region.h;
      if(length-partSize<eps)return {piece:region};
      const before=keepSide==='start'?partSize:length-partSize-kerf;
      const after=length-before-kerf;
      const aRegion={...region,id:'S'+bin.nextSection++};
      const bRegion={...region,id:'S'+bin.nextSection++};
      if(direction==='y'){
        aRegion.w=before;
        bRegion.x=region.x+before+kerf;bRegion.w=after;
      }else{
        aRegion.h=before;
        bRegion.y=region.y+before+kerf;bRegion.h=after;
      }
      const cutCenter=before+kerf/2;
      const pos=(direction==='y'?region.x:region.y)+cutCenter;
      const cut=direction==='y'?
        {x1:pos,y1:region.y,x2:pos,y2:region.y+region.h,length:region.h}:
        {x1:region.x,y1:pos,x2:region.x+region.w,y2:pos,length:region.w};
      bin.cuts.push({...cut,order:bin.cuts.length+1,axis:direction,
        section:region.id,sectionX:region.x,sectionY:region.y,sectionW:region.w,sectionH:region.h,
        offset:cutCenter,fromEdge:before,kerf,partSide:keepSide,
        pieceSize:partSize,beforeSection:aRegion.id,afterSection:bRegion.id,
        beforeSize:before,afterSize:after});
      return keepSide==='start'?{piece:aRegion,rest:bRegion}:{piece:bRegion,rest:aRegion};
    }
    const first=axis==='y'?['y',a,xSide]:['x',b,ySide];
    const second=axis==='y'?['x',b,ySide]:['y',a,xSide];
    const s1=split(original,...first);
    if(s1.rest&&s1.rest.w>eps&&s1.rest.h>eps)next.push(s1.rest);
    const s2=split(s1.piece,...second);
    if(s2.rest&&s2.rest.w>eps&&s2.rest.h>eps)next.push(s2.rest);
    bin.free.splice(freeIndex,1,...next);
    const f=s2.piece;
    if(!bin.materialColor)bin.materialColor=String(part.materialColor||'').trim();
    bin.placements.push({x:f.x,y:f.y,w:a,h:b,part,turned,realW:a,realH:b,section:f.id});
    bin.used+=part.a*part.b;
  }
  const STANDARD_BOARD={a:2800,b:2070,thickness:18};
  // A 38 mm munkalap alapértelmezése marad 4100×600 vagy 4100×900.
  // Ha az anyagadatbázis adott színű/vastagságú anyagához mindkét
  // táblaméret be van írva, azokat használjuk a saját, változatlan
  // EGYSOROS, teljes szélességű keresztvágás-tervezéséhez.
  // A bútorlap vágási algoritmusa és táblamérete továbbra is FIX.
  const WORKTOP_38_LENGTH=4100,WORKTOP_38_WIDTHS=[600,900];
  const isWorktop38=thickness=>Math.abs(Number(thickness)-38)<.001;
  const worktop38CatalogSize=item=>{
    if(typeof materialCatalog==='undefined'||!Array.isArray(materialCatalog))return null;
    const id=String(item.materialId||'').trim();
    const color=String(item.materialColor||'').trim().toLocaleLowerCase('hu-HU');
    const matchingById=id?materialCatalog.find(m=>m.id===id&&isWorktop38(m.thickness)):null;
    const material=matchingById||materialCatalog.find(m=>
      isWorktop38(m.thickness)&&
      String(m.color||'').trim().toLocaleLowerCase('hu-HU')===color&&color);
    if(!material)return null;
    const a=Number(material.boardA),b=Number(material.boardB);
    // Az üres űrlapmező '' a JS Number szerint 0, ezért érvénytelen.
    if(!Number.isFinite(a)||!Number.isFinite(b)||a<=0||b<=0||a>10000||b>10000)
      return null;
    return {a,b};
  };
  const validWorktop38Stock=b=>{
    if(!isWorktop38(b.thickness))return true;
    const size=worktop38CatalogSize(b);
    const fullLength=size?.a??WORKTOP_38_LENGTH;
    const widthOk=size?Math.abs(Number(b.b)-size.b)<.001:
      WORKTOP_38_WIDTHS.some(w=>Math.abs(Number(b.b)-w)<.001);
    // A maradék munkalap rövidebb is lehet, de a TELJES
    // színhez rögzített szélességét meg kell őriznie. Teljes
    // alaptábla méretét nem lazítjuk, és nem keletkezik U/X vágás.
    return widthOk&&(b.isRemnant?
      Number(b.a)>0&&Number(b.a)<=fullLength+.001:
      Math.abs(Number(b.a)-fullLength)<.001);
  };
  const validWorktop38Part=p=>{
    if(!isWorktop38(p.thickness))return true;
    const size=worktop38CatalogSize(p);
    const kerf=Math.max(0,Number(state.kerf)||0);
    // 38 mm munkalap: az első menet a TELJES 600/900 vagy
    // anyagadatbázisban megadott szélességet keresztben vágja.
    // Keskenyebb darab esetén a visszaadott részen U alábontás
    // szükséges; a fűrészrésnél kisebb U-maradék nem gyártható.
    const widthFits=width=>{
      const gap=width-Number(p.b);
      return Number(p.b)>0&&gap>=-.0001&&(gap<=.0001||gap+.0001>=kerf);
    };
    return size?(Number(p.a)>0&&Number(p.a)<=size.a+.0001&&widthFits(size.b)):
      (Number(p.a)>0&&Number(p.a)<=WORKTOP_38_LENGTH+.0001&&
        WORKTOP_38_WIDTHS.some(widthFits));
  };
  const MIN_BOARD_EXTRA=5;
  function createBin(b,index,automatic=false){
    // Munkalapnál az eredeti 600/900 mm szélességet nem vágjuk keskenyebbre,
    // ezért nem alkalmazzuk az általános négyoldali szélezést.
    if(!validWorktop38Stock(b))return null;
    const thickness=Number(b.thickness??18);
    const trim=isWorktop38(thickness)?0:Math.max(0,Number(state.trim)||0);
    // A 600/900 mm-es gyári szélesség változatlan, a munkalap
    // egyszeri VÉGszélezése külön adat (nem a négyoldali bin.trim).
    const worktopEdgeTrim=isWorktop38(thickness)?Math.max(0,Number(state.trim)||0):0;
    const a=Number(b.a),height=Number(b.b);
    if(!Number.isFinite(a)||!Number.isFinite(height)||!Number.isFinite(thickness)||a<=2*trim||height<=2*trim||thickness<=0)return null;
    return {id:b.id||'standard',index,name:b.name||'Maradék tábla',a,b:height,thickness,automatic,
      isRemnant:!!b.isRemnant,trim,worktopEdgeTrim,
      materialColor:String(b.materialColor||'').trim(),
      free:[{id:'S1',x:trim,y:trim,w:a-2*trim,h:height-2*trim}],nextSection:2,placements:[],cuts:[],used:0};
  }
  function prepareBins(){
    const bins=[];
    // A bepipált, szabad maradékok ugyanúgy készlettáblák. Az előnézet
    // soha nem fogyasztja el őket.
    const checked=(typeof remnantCatalog==='undefined'?[]:remnantCatalog).filter(r=>
      (state.selectedRemnantIds||[]).includes(r.id)&&Number(r.qty)>0);
    // Kijelölt maradékok előbb kapnak alkatrészt, a teljes táblák
    // viszont a maradékok felhasználása UTÁN továbbra is engedélyezettek.
    for(const b of [...checked.map(r=>({...r,isRemnant:true})),...(state.boards||[])]){
      const available=Number(b.qty);
      if(!Number.isSafeInteger(available)||available<0)continue;
      for(let i=0;i<available;i++){
        const bin=createBin(b,i+1);
        if(bin)bins.push(bin);
      }
    }
    return bins;
  }
  function bestPlacement(item,candidates,kerf,firstAxis,variant,corner,upcoming=[]){
    let best=null;
    for(const bin of candidates){
      if(Math.abs(bin.thickness-item.thickness)>.001)continue;
        if(bin.materialColor&&bin.materialColor.toLocaleLowerCase('hu-HU')!==
          String(item.materialColor||'').trim().toLocaleLowerCase('hu-HU'))continue;
      const orientations=[{a:item.a,b:item.b,turned:false}];
      if(item.rot&&item.a!==item.b)orientations.push({a:item.b,b:item.a,turned:true});
      for(const o of orientations){
        // Az anyag TÉNYLEGES külmérete legalább 5 mm-rel nagyobb legyen mindkét irányban.
        if(bin.a+1e-5<o.a+MIN_BOARD_EXTRA||bin.b+1e-5<o.b+MIN_BOARD_EXTRA)continue;
        for(let freeIndex=0;freeIndex<bin.free.length;freeIndex++){
          const free=bin.free[freeIndex];
          const needsX=free.w>o.a+.0001,needsY=free.h>o.b+.0001;
          const w=o.a+(needsX?kerf:0),height=o.b+(needsY?kerf:0);
          if(w>free.w+.0001||height>free.h+.0001)continue;
          // A tábla első vágásának tengelye kötött, a leválasztott részeken
          // viszont a mozaikos keresés X/Y irányban külön is folytatható.
          const axes=!bin.cuts.length||variant===0?[firstAxis]:['x','y'];
          for(const axis of axes){
            const remW=Math.max(0,free.w-w),remH=Math.max(0,free.h-height);
            const fragments=axis==='y'?
              [{w:remW,h:free.h},{w:o.a,h:remH}]:
              [{w:free.w,h:remH},{w:remW,h:o.b}];
            const open=fragments.filter(r=>r.w>.0001&&r.h>.0001);
            const remainderArea=open.reduce((s,r)=>s+r.w*r.h,0);
            let local=(free.w*free.h-o.a*o.b)*.0005+Math.min(remW,remH);
            if(variant===1)local-=Math.max(0,...open.map(r=>r.w*r.h))*.0015;
            if(variant===2){
              let fit=0;
              for(const next of upcoming.slice(0,8)){
                if(Math.abs(next.thickness-bin.thickness)>.001)continue;
                if(bin.materialColor&&bin.materialColor!==next.materialColor)continue;
                if(open.some(r=>(r.w>=next.a&&r.h>=next.b)||
                   (next.rot&&r.w>=next.b&&r.h>=next.a)))fit+=Math.sqrt(next.a*next.b);
              }
              local-=fit*10;
            }
            if(variant===3){
              local+=open.reduce((s,r)=>s+(Math.min(r.w,r.h)<180?r.w*r.h*.002:0),0);
              local+=remainderArea*.0002;
            }
            // Meglévő kisebb maradék előnyben; azonos táblán négy lehetséges sarok.
            const score=bin.a*bin.b*100000+(bin.placements.length?0:10000)+local;
            if(!best||score<best.score)best={bin,score,choice:{
              freeIndex,part:item,turned:o.turned,realW:o.a,realH:o.b,
              axis,xSide:corner.x,ySide:corner.y}};
          }
        }
      }
    }
    return best;
  }
  function makePlan(mode,parts,axis){
    const kerf=Math.max(0,+state.kerf||0);
    const bins=prepareBins(),standardBins=[];
    const corners=[
      {x:'start',y:'start'},{x:'end',y:'start'},
      {x:'start',y:'end'},{x:'end',y:'end'}
    ];
    const corner=corners[Math.floor(mode/24)%4],variant=Math.floor(mode/6)%4;
    const items=[];
    for(const r of parts.rows){
      if(r.error)continue;
      for(let i=0;i<r.qty;i++)items.push({name:r.resolvedName||r.part.name,source:r.furniture.name,
        destination:r.furniture.destination||'',materialColor:r.materialColor||r.furniture.materialColor||'',a:r.a,b:r.b,
        originalA:r.originalA,originalB:r.originalB,edge:r.edge,filingSides:r.part.filingSides,edgeThickness:r.edgeThickness,edgeThicknesses:r.edgeThicknesses,mill:r.mill,millDepth:r.millDepth,millDepthSides:r.part.millDepthSides,
        thickness:r.thickness,rot:r.rot,number:i+1,uid:r.part.id});
    }
    const sorters=[(a,b)=>b.a*b.b-a.a*a.b || Math.max(b.a,b.b)-Math.max(a.a,a.b),
      (a,b)=>Math.max(b.a,b.b)-Math.max(a.a,a.b)||b.a*b.b-a.a*a.b,
      (a,b)=>b.a-a.a || b.b-a.b,(a,b)=>b.b-a.b||b.a-a.a,
      (a,b)=>b.a+b.b-a.a-a.b||b.a*b.b-a.a*a.b,
      (a,b)=>Math.abs(b.a-b.b)-Math.abs(a.a-a.b)||b.a*b.b-a.a*a.b];
    items.sort(sorters[mode%sorters.length]);
    const failed=[];
    for(let i=0;i<items.length;i++){
      const item=items[i],upcoming=items.slice(i+1,i+9);
      // Készleten megadott maradékok MINDIG megelőzik a korlátlan alaptáblát.
      let best=bestPlacement(item,bins,kerf,axis,variant,corner,upcoming);
      if(!best)best=bestPlacement(item,standardBins,kerf,axis,variant,corner,upcoming);
      if(!best&&Math.abs(item.thickness-STANDARD_BOARD.thickness)<.001){
        const next=createBin({id:'standard',name:'Alaptábla · automatikus (2800 × 2070 × 18)',...STANDARD_BOARD,
          materialColor:String(item.materialColor||'').trim()},standardBins.length+1,true);
        if(next){
          const candidate=bestPlacement(item,[next],kerf,axis,variant,corner,upcoming);
          if(candidate){standardBins.push(next);best=candidate;}
        }
      }
      if(best)guillotinePlace(best.bin,best.choice,kerf);else failed.push(item);
    }
    const used=[...bins,...standardBins].filter(b=>b.placements.length);
    return {bins:used,failed,items,usedArea:used.reduce((s,b)=>s+b.used,0),sheetArea:used.reduce((s,b)=>s+b.a*b.b,0)};
  }
  // A biztonságos parancslimit fizikai táblánként (nem munkánként) értendő.
  // A vágási sorrendet és a védett xMix/xPrg exportőrt nem változtatjuk.
  const MAX_SAFE_XPRG_COMMANDS=99;
  // A szabászgép kétütemű programja: előbb MINDEN csíkot leválaszt,
  // majd a csíkokat visszakéri, és egyenként hosszra/keresztbe vágja őket.
  // X gépállás: 2070-es oldal a behúzás; Y: 2800-as oldal a behúzás.
  function makeStripPlan(mode,parts,feed){
    const kerf=Math.max(0,Number(state.kerf)||0),eps=.0001;
    // Több gépi keresési stratégia: az eddigi rendezések mellett a már
    // leválasztott széles csíkok szabad hosszának újrafelhasználását is próbáljuk.
    const strategy=Math.floor(mode/6);
    const bins=prepareBins(),standardBins=[],failed=[],items=[];
    for(const r of parts.rows)if(!r.error)for(let i=0;i<r.qty;i++){
      items.push({name:r.resolvedName||r.part.name,source:r.furniture.name,
        destination:r.furniture.destination||'',materialColor:r.materialColor||r.furniture.materialColor||'',materialId:r.materialId||'',a:r.a,b:r.b,
        originalA:r.originalA,originalB:r.originalB,edge:r.edge,
        filingSides:r.part.filingSides,edgeThickness:r.edgeThickness,edgeThicknesses:r.edgeThicknesses,mill:r.mill,millDepth:r.millDepth,millDepthSides:r.part.millDepthSides,thickness:r.thickness,
        rot:r.rot,number:i+1,uid:r.part.id});
    }
    // Régi x/y gépállások és új, táblánként értelmezett hosszú/rövid él.
    // auto esetén a gépállás táblánként külön választódik ki,
    // nem egyetlen globális beállítás mindegyik táblára.
    const sortingFeed=['auto','long','short'].includes(feed)?(mode%2?'x':'y'):feed;
    const breadth=(p,axis=sortingFeed)=>axis==='x'?p.b:p.a;
    const along=(p,axis=sortingFeed)=>axis==='x'?p.a:p.b;
    const feedCandidates=bin=>{
      // A 38 mm-es munkalap nem forgatható: egyetlen, az
      // anyagadatbázisban megadott teljes szélességű vágássor,
      // P/Lunghezza = bin.b. A bútorlap gépállása változatlan.
      if(isWorktop38(bin.thickness))return !bin.machine||bin.machine.feed==='x'?['x']:[];
      if(bin.machine)return [bin.machine.feed];
      if(feed==='auto')return ['x','y'];
      // Az ütköztetett ÉL hosszát választjuk, NEM a beadott méretet.
      // x = bin.a él a gépnél; y = bin.b él a gépnél.
      if(feed==='long')return [bin.a>=bin.b?'x':'y'];
      if(feed==='short')return [bin.a>=bin.b?'y':'x'];
      return [feed]; // régi mentett projektek x/y beállítása
    };
    const sorters=[
      (a,b)=>breadth(b)-breadth(a)||along(b)-along(a),
      (a,b)=>b.a*b.b-a.a*a.b||breadth(b)-breadth(a),
      (a,b)=>along(b)-along(a)||breadth(b)-breadth(a),
      (a,b)=>Math.max(b.a,b.b)-Math.max(a.a,a.b)||breadth(b)-breadth(a),
      (a,b)=>breadth(b)-breadth(a)||along(a)-along(b),
      (a,b)=>b.a+b.b-a.a-a.b||breadth(b)-breadth(a)
    ];
    items.sort(sorters[mode%sorters.length]);
    const isValidRemainder=value=>value>=-eps&&(value<eps||value+eps>=kerf);
    function bestOn(item,pool){
      let best=null;
      for(const bin of pool){
        if(Math.abs(bin.thickness-item.thickness)>.001)continue;
        const worktop=isWorktop38(item.thickness);
        if(worktop&&!validWorktop38Stock(bin))continue;
        if(bin.materialColor&&bin.materialColor.toLocaleLowerCase('hu-HU')!==
          String(item.materialColor||'').trim().toLocaleLowerCase('hu-HU'))continue;
        // A táblát az első alkatrész elhelyezése rögzíti az adott
        // gépállásban; a próbaként vizsgált, de nem használt táblák
        // gépállását nem rögzítjük idő előtt.
        for(const localFeed of feedCandidates(bin)){
        const m=bin.machine||{feed:localFeed,feedUsed:0,strips:[],
          feedSize:(localFeed==='x'?bin.b:bin.a)-2*bin.trim-(bin.trim?kerf/2:0),
          // Egyazon kétmenetes csíkmodell számolja a bútorlapot és a
          // munkalapot is. A munkalap egyszeri VÉGszélezése kizárólag
          // a csík visszaforgatása UTÁNI X darabolási keretet szűkíti.
          // Két teljes fűrészrésnyi biztonság szükséges az első RX és
          // a kész X vágások helyének, a 600/900 mm szélesség érintetlen.
          crossSize:(localFeed==='x'?bin.a:bin.b)-2*bin.trim-(bin.trim?kerf/2:0)-
            (worktop?(Number(bin.worktopEdgeTrim)||0)+2*kerf+.01:0)};
        const orientations=[{a:item.a,b:item.b,turned:false}];
        // Munkalap forgatása vagy hosszirányú keskenyítése tilos.
        if(!worktop&&item.rot&&item.a!==item.b)orientations.push({a:item.b,b:item.a,turned:true});
        for(const o of orientations){
          if(worktop){
            if(!validWorktop38Part({...o,thickness:item.thickness,
                 materialId:item.materialId||'',materialColor:item.materialColor||''})||
               o.b>bin.b+eps||o.a>bin.a+eps||
               (bin.b-o.b>eps&&bin.b-o.b+eps<kerf))continue;
            // A többi munkalapdarabbal közös, teljes szélességű
            // első keresztvágás után következik a szélességi U.
            const used=m.strips.reduce((n,st)=>n+(st.items||[]).reduce(
              (z,p)=>z+4+(st.width-p.breadth>eps?1:0),0),0);
            if(2+used+4+(bin.b-o.b>eps?1:0)>MAX_SAFE_XPRG_COMMANDS)continue;
          }else if(bin.a+eps<o.a+MIN_BOARD_EXTRA||bin.b+eps<o.b+MIN_BOARD_EXTRA)continue;
          const bw=worktop?bin.b:breadth(o,localFeed),len=along(o,localFeed);
          if(bw>m.feedSize+eps||len>m.crossSize+eps)continue;
          for(const strip of m.strips){
            const gap=strip.width-bw;
            if(worktop&&Math.abs(gap)>eps)continue; // Az első menetben csak egy TELJES szélességű munkalap-sor.
            const addition=(strip.usedLength?kerf:0)+len;
            const left=m.crossSize-strip.usedLength-addition;
            if(gap<-eps||!isValidRemainder(gap)||!isValidRemainder(left))continue;
            // A meglévő xPrg export X, szükség esetén U, majd F
            // parancsot készít alkatrészenként. Megelőzzük a 100. parancsot.
            const extraCommands=2+(gap>0.001&&gap+0.001>=kerf?1:0);
            if((m.commandCount??2)+extraCommands>MAX_SAFE_XPRG_COMMANDS)continue;
            // Egy szélesebb csíkban a darabot utólagos rip vágással
            // kiszabhatjuk; a maradékba NEM kell új teljes hosszú csíkot nyitni.
            // A legjobb tervet minden próbálkozás végén tényleges táblaarea alapján
            // választjuk: egy lokálisan több hulladékot hagyó döntés is spórolhat táblát.
            const ripLoss=gap*len;
            const gapWeight=[.05,.08,.025,.12,.035,.075,.015,.16,.20,.015,.25,.008,.12,.003,.10,.30][strategy]??.05;
            const endWeight=[.005,.002,.008,.001,.012,.006,.002,.003,.02,.0005,.03,.001,.015,.0002,.008,.05][strategy]??.005;
            const score=bin.a*bin.b*1e5+ripLoss*gapWeight+left*endWeight;
            if(!best||score<best.score)best={bin,strip,score,orientation:o,bw,len,machine:m};
          }
          const separator=m.strips.length?kerf:0;
          const remaining=m.feedSize-m.feedUsed-separator-bw;
          const longRemaining=m.crossSize-len;
          // Az utolsó 5 mm-es rés a változatlan végigvágó modellben
          // külön hosszanti 'rip' műveletet válthatna ki. Munkalapnál
          // ilyenkor inkább következő táblát kell nyitni.
          if(worktop&&remaining>eps&&remaining<=kerf+eps)continue;
          if(isValidRemainder(remaining)&&isValidRemainder(longRemaining)&&
             (m.commandCount??2)+4<=MAX_SAFE_XPRG_COMMANDS){
            // Új csík: Y, RX, X, F, plusz a táblánkénti P, RY.
            // Már megkezdett tábla új csíkja előzze meg egy azonos méretű,
            // bontatlan tábla felhasználását.
            // Új csík a tábla teljes keresztméretét lefoglalja. Ennek
            // valós területi költsége legyen nagyobb a meglévő csíkok
            // esetleges utólagos szélességre vágásánál.
            // Változatos súlyokkal keresünk, mert a teljes lapkihasználás
            // a hátralévő alkatrészek alakjától is függ.
            const openStripPenalty=[3000,12000,24000,42000,65000,9500,80000,30000,2000,140000,500,210000,75000,300000,18000,400000][strategy]??3000;
            const firstStripPenalty=[10000,12000,16000,20000,24000,11000,20000,17000,3000,1000,50000,1500,60000,2500,90000,600][strategy]??10000;
            const feedAreaPenalty=(m.strips.length?
              [0,.004,.009,.016,.025,.002,.03,.012,.05,.001,.09,.002,.12,.0002,.06,.15][strategy]:0)*bw*m.crossSize;
            const score=bin.a*bin.b*1e5+
              (m.strips.length?openStripPenalty:firstStripPenalty)+
              feedAreaPenalty+remaining*.01;
            if(!best||score<best.score)best={bin,strip:null,score,orientation:o,bw,len,machine:m};
          }
        }
        } // következő lehetséges gépállás
      }
      return best;
    }
    function commitPlacement(item,choice){
      const {bin,orientation,bw,len}=choice,m=bin.machine||(bin.machine=choice.machine);
      const addedCommands=isWorktop38(item.thickness)?
        4+(bin.b-item.b>eps?1:0):
        choice.strip?
          2+(choice.strip.width-bw>0.001&&choice.strip.width-bw+0.001>=kerf?1:0):4;
      m.commandCount=(m.commandCount??2)+addedCommands;
      if(!bin.materialColor)bin.materialColor=String(item.materialColor||'').trim();
      let strip=choice.strip;
      if(!strip){
        if(m.strips.length)m.feedUsed+=kerf;
        strip={index:m.strips.length+1,width:bw,usedLength:0,items:[]};
        m.strips.push(strip);m.feedUsed+=bw;
      }
      if(strip.usedLength)strip.usedLength+=kerf;
      strip.items.push({item,turned:orientation.turned,realW:orientation.a,
        realH:orientation.b,breadth:isWorktop38(item.thickness)?orientation.b:bw,along:len});
      strip.usedLength+=len;
    }
    // A "Bevonni" MOST KÖTELEZŐ felhasználás. Minden bejelölt
    // maradékfajtából először egy alkatrészt lefoglalunk, és csak
    // a fennmaradóknál engedjük a teljes / automatikus alaptáblát.
    // Ha valamelyik maradékhoz nincs megfelelő alkatrész, a
    // computeNesting megtiltja a hiányos terv gépi mentését.
    const reserved=new Set();
    const requiredIds=[...new Set(state.selectedRemnantIds||[])];
    for(const id of requiredIds){
      const chosenBins=bins.filter(b=>b.isRemnant&&b.id===id);
      let selected=null;
      for(const item of items){
        if(reserved.has(item))continue;
        const choice=bestOn(item,chosenBins);
        if(choice&&(!selected||choice.score<selected.choice.score))
          selected={item,choice};
      }
      if(selected){
        commitPlacement(selected.item,selected.choice);
        reserved.add(selected.item);
      }
    }
    for(const item of items){
      if(reserved.has(item))continue;
      let choice=null;
      // A később megnyitott táblák helyett több keresési változatban
      // először a legkorábbi megkezdett táblákba próbálunk visszatölteni.
      // Csak teljes, gépileg vágható csíkokba helyezhetünk alkatrészt.
      if(!choice&&strategy>=8){
        for(const bin of bins){
          choice=bestOn(item,[bin]);
          if(choice)break;
        }
      }
      if(!choice)choice=bestOn(item,bins);
      if(!choice&&strategy>=8){
        for(const bin of standardBins){
          choice=bestOn(item,[bin]);
          if(choice)break;
        }
      }
      if(!choice)choice=bestOn(item,standardBins);
      if(!choice){
        // A normál 18 mm-es alaptábla mellett a felhasználó által az
        // Anyagadatbázisban meghatározott más vastagságú/színű teljes
        // táblákból is nyithatunk újakat. Ismeretlen táblaadatot sosem
        // találunk ki: az ilyen alkatrész megmarad a hiánylistában.
        const stock=(Math.abs(item.thickness-STANDARD_BOARD.thickness)<.001)?
          {...STANDARD_BOARD,name:'Alaptábla · automatikus (2800 × 2070 × 18)'}:
          (()=>{
            const catalog=typeof materialCatalog==='undefined'?[]:materialCatalog;
            const color=String(item.materialColor||'').trim().toLocaleLowerCase('hu-HU');
            const matches=catalog.filter(m=>Math.abs(Number(m.thickness)-item.thickness)<.001&&
              String(m.color||'').trim().toLocaleLowerCase('hu-HU')===color);
            // Az adatbázisban szereplő bútorlap korlátlan nagytáblás
            // alapanyag, darabszám nélkül. Egyedi X/Y esetén azt használjuk;
            // egyébként az alap 2800 × 2070 mm-es gyári táblát.
            // 38 mm munkalapra a külön, védett szabály érvényes.
            const material=matches.find(m=>Number(m.boardA)>0&&Number(m.boardB)>0)||matches[0];
            if(!material||isWorktop38(item.thickness))return null;
            const a=Number(material.boardA)>0?Number(material.boardA):STANDARD_BOARD.a;
            const b=Number(material.boardB)>0?Number(material.boardB):STANDARD_BOARD.b;
            return {a,b,thickness:item.thickness,
              name:'Alaptábla · automatikus ('+a+' × '+b+' × '+item.thickness+')'};
          })();
        if(stock){
          const bin=createBin({...stock,id:'standard-'+item.thickness,
            materialColor:String(item.materialColor||'').trim()},
            standardBins.length+1,true);
          if(bin){
            const fit=bestOn(item,[bin]);
            if(fit){standardBins.push(bin);choice=fit;}
          }
        }
      }
      if(!choice&&isWorktop38(item.thickness)&&validWorktop38Part(item)){
        // Régi munkalap-kód: csak kompatibilitás céljából marad.
        // A computeNesting a 38 mm munkalapos munkát letiltja.
        const configured=worktop38CatalogSize(item);
        const stockA=configured?.a??WORKTOP_38_LENGTH;
        const stockB=configured?.b??WORKTOP_38_WIDTHS.find(w=>
          w>=item.b-.0001&&(w-item.b<.0001||w-item.b+.0001>=kerf));
        const bin=createBin({id:'worktop-38',name:'Munkalap · '+stockA+' × '+stockB+' × 38',
          a:stockA,b:stockB,thickness:38,materialId:item.materialId||'',
          materialColor:String(item.materialColor||'').trim()},
          standardBins.length+1,true);
        if(bin){
          const fit=bestOn(item,[bin]);
          if(fit){standardBins.push(bin);choice=fit;}
        }
      }
      if(!choice){failed.push(item);continue;}
      commitPlacement(item,choice);
    }
    function finalize(bin){
      const m=bin.machine;
      if(!m?.strips.length)return;

      // A két menet táblánként az adott ütköztetési élt használja.
      const boardFeed=m.feed;
      const stripAxis=boardFeed==='x'?'x':'y',crossAxis=boardFeed==='x'?'y':'x';
      const dimension=(rect,axis)=>axis==='y'?rect.w:rect.h;
      // ÚJ FIX SZABÁLY: A NAGY ALAPTÁBLÁNÁL IS FELÜLRE IGAZÍTUNK,
      // ha a felrakott alkatrészek kevesebben vannak és a táblán
      // felhasználatlan, egyben leválasztható alsó terület marad.
      // A közel teljes tábla korábban bevált kezdőszélezése marad.
      // 38 mm munkalap és kisebb/maradék tábla: mindig az új elv.
      // Ez a tényleges vágási pozíciót módosítja, nem pusztán a rajzot.
      const fullFeedExtent=dimension({x:0,y:0,w:bin.a,h:bin.b},stripAxis);
      const lowerRemainder=fullFeedExtent-bin.trim-m.feedUsed;
      const substantialLowerRemainder=lowerRemainder>=Math.max(
        kerf+eps,bin.trim+kerf+eps);
      const topAligned=isWorktop38(bin.thickness)||
        (!bin.automatic&&bin.a*bin.b<STANDARD_BOARD.a*STANDARD_BOARD.b-eps)||
        substantialLowerRemainder;
      m.topAligned=topAligned;
      let remaining={id:bin.trim?'R0':'S1',x:0,y:0,w:bin.a,h:bin.b};
      bin.nextSection=bin.trim?1:2;
      function splitAt(parent,axis,before,stage,stripNo,options={}){
        const total=dimension(parent,axis),after=total-before-kerf,pos=before+kerf/2;
        if(before<-eps||after<-eps)throw Error('Túl kicsi vágásrés a gépi csíktervben');
        const first={...parent,id:'S'+bin.nextSection++};
        const second={...parent,id:'S'+bin.nextSection++};
        if(axis==='y'){first.w=before;second.x+=before+kerf;second.w=Math.max(0,after);}
        else{first.h=before;second.y+=before+kerf;second.h=Math.max(0,after);}
        const at=(axis==='y'?parent.x:parent.y)+pos;
        bin.cuts.push({
          axis,x1:axis==='y'?at:parent.x,y1:axis==='x'?at:parent.y,
          x2:axis==='y'?at:parent.x+parent.w,y2:axis==='x'?at:parent.y+parent.h,
          order:bin.cuts.length+1,length:axis==='y'?parent.h:parent.w,
          section:parent.id,sectionX:parent.x,sectionY:parent.y,
          sectionW:parent.w,sectionH:parent.h,offset:pos,fromEdge:before,
          kerf,partSide:options.side||'start',pieceSize:options.size??before,
          beforeSection:first.id,afterSection:second.id,beforeSize:before,afterSize:after,
          kind:options.trim?'trim':'part',edge:options.edge||'',stage,stripIndex:stripNo
        });
        return {start:first,end:second};
      }
      const fullFeed=dimension(remaining,stripAxis);
      // A felsőre húzott csíkok teljes helyigénye, a felső ráhagyással.
      // A leválasztott alsó rész egyben marad, nem kapunk külön
      // szükségtelen csíkot. A kerf középvonala a szakasz határától
      // fél vágásrésnyire esik, ezt az exportnak is átadjuk.
      const firstStageTopCut=bin.trim+m.feedUsed;
      const canCutBottom=topAligned&&
        fullFeed-firstStageTopCut>=kerf+eps;
      if(canCutBottom){
        const cut=splitAt(remaining,stripAxis,firstStageTopCut,
          'head-trim',0,{trim:true,size:fullFeed-firstStageTopCut-kerf,
            side:'end',edge:'alsó egyben maradó maradék'});
        remaining=cut.start;
        m.firstCutPosition=firstStageTopCut+kerf/2;
        m.firstTrimDistance=fullFeed-m.firstCutPosition;
        m.firstCutRule='top-aligned-bottom';
      }else if(bin.trim){
        const firstCut=splitAt(remaining,stripAxis,fullFeed-bin.trim-kerf/2,
          'head-trim',0,{trim:true,size:bin.trim,side:'end',edge:'beadási vég'});
        remaining=firstCut.start;
        m.firstCutPosition=fullFeed-bin.trim;
      }
      // 1. menet: az összes csík a tábla végétől visszafelé válik le.
      for(const strip of m.strips){
        const before=dimension(remaining,stripAxis)-strip.width-kerf;
        if(before<eps){
          strip.section=remaining;
          remaining=null;
        }else{
          const s=splitAt(remaining,stripAxis,before,'strip',strip.index,
            {side:'end',size:strip.width});
          strip.section=s.end;
          remaining=s.start;
        }
      }
      // 2. menet: a visszafordított TELJES HOSSZÚ csíkon is először
      // csíkhossz - szélezés pozíciónál vágunk (2070 -> 2060).
      // Onnan visszafelé készülnek a darabok: nem vágjuk le külön a
      // közeli szél hulladékát, így a maradék egyben, nagyobban megmarad.
      for(const strip of m.strips){
        let segment=strip.section;
        // A 90°-kal elforgatott csíkon a darabok összhosszát
        // felülre igazítjuk. A legalsó darab alatti első vágás
        // választja le az egyben megmaradó alsó maradékot.
        const fullCross=dimension(segment,crossAxis);
        // Munkalapnál is P → RY → Y → RX → X → F a gépi menet.
        // Az egyetlen teljes szélességű csík X darabolásánál az
        // egyszeri végszélezést a felülre igazított alkatrészmező
        // ELEJÉN tartjuk fenn; nem írunk rá külön RY/Y gépi sort.
        const worktopEndTrim=isWorktop38(bin.thickness)?
          (Number(bin.worktopEdgeTrim)||0)+kerf:0;
        const wantedCut=bin.trim+strip.usedLength+worktopEndTrim;
        const canCutBelowParts=topAligned&&
          fullCross-wantedCut>=kerf+eps;
        if(canCutBelowParts){
          const first=splitAt(segment,crossAxis,wantedCut,
            'cross-head-trim',strip.index,
            {trim:true,size:fullCross-wantedCut-kerf,
              side:'end',edge:'csík alsó maradéka'});
          segment=first.start;
          strip.firstCutPosition=wantedCut+kerf/2;
          strip.firstTrimDistance=fullCross-strip.firstCutPosition;
          strip.firstCutRule='top-aligned-bottom';
        }else if(bin.trim){
          const first=splitAt(segment,crossAxis,fullCross-bin.trim-kerf/2,
            'cross-head-trim',strip.index,{trim:true,size:bin.trim,side:'end',edge:'csíkvég'});
          segment=first.start;
          strip.firstCutPosition=fullCross-bin.trim;
        }
        for(const entry of strip.items){
          const crossRemaining=dimension(segment,crossAxis)-entry.along-kerf;
          let piece;
          if(crossRemaining<-eps){
            piece=segment;segment=null;
          }else{
            const cut=splitAt(segment,crossAxis,Math.max(0,crossRemaining),'cross',strip.index,
              {side:'end',size:entry.along});
            segment=cut.start;piece=cut.end;
          }
          const ripRemaining=dimension(piece,stripAxis)-entry.breadth;
          if(ripRemaining>=kerf-eps&&ripRemaining>eps){
            piece=splitAt(piece,stripAxis,entry.breadth,'rip',strip.index).start;
          }
          const final=piece;
          bin.placements.push({
            x:final.x,y:final.y,w:entry.realW,h:entry.realH,
            realW:entry.realW,realH:entry.realH,part:entry.item,
            turned:entry.turned,section:final.id,stripIndex:strip.index,
            completionStep:bin.cuts.length,finishCutIndex:bin.cuts.length-1
          });
          bin.used+=entry.item.a*entry.item.b;
        }
        strip.leftover=segment?{x:segment.x,y:segment.y,w:segment.w,h:segment.h,
          feedWidth:dimension(segment,stripAxis),length:dimension(segment,crossAxis)}:null;
      }
    }
    const used=[...bins,...standardBins].filter(b=>b.machine?.strips.length);
    used.forEach(finalize);
    return {bins:used,failed,items,usedArea:used.reduce((s,b)=>s+b.used,0),
      sheetArea:used.reduce((s,b)=>s+b.a*b.b,0),machineReady:true,feed};
  }
  // Gyártási sorrend: minden tábla teljes sávozása után csíkok visszaadása.
  // Ellenőrző modell, NEM hitelesített gépi parancssor.
  // MINDEN TÁBLÁHOZ KÜLÖN VÁGÁSI SORREND: 1,2,3...
  // Egy táblán: összes fő sávozás, majd az adott tábla csíkjai
  // visszakérve, előbb a fő darabolás, majd az alábontás.
  // Kizárólag ellenőrző gyártási sorrend, nem hitelesített gépi parancs.
  function buildProductionSequence(bins){
    const events=[],boards=[],round=n=>Math.round(Number(n)*1000)/1000;
    const stages=['cross-head-trim','cross-trim','cross','rip'];
    let totalCuts=0,pairedGroups=0;
    const cutSignature=c=>JSON.stringify([c.stage,c.axis,round(c.offset),
      round(c.pieceSize),round(c.length),round(c.kerf),c.partSide,c.kind]);
    const stripSignature=job=>{
      const {bin,strip,cuts}=job;
      return JSON.stringify([round(bin.thickness),round(bin.trim),round(strip.width),
        round(bin.machine.crossSize),bin.machine.feed,
        [...new Set(strip.items.map(p=>String(p.item.materialColor||'').trim().toLowerCase()))].sort(),
        strip.items.map(p=>[round(p.along),round(p.breadth),p.turned,
          String(p.item.uid||p.item.name||''),String(p.item.edge||''),
          round(p.item.edgeThickness||0),Boolean(p.item.mill),round(p.item.millDepth||0)]),
        cuts.map(cutSignature)]);
    };
    // A gép először a teljes táblát sávozza fel. A visszaadott csík
    // összes vágását az eredeti, a csík végétől a nullpont felé haladó
    // geometriai sorrendben hajtjuk végre; a rajz X-koordinátája szerinti
    // újrarendezés az ellenkező irányt eredményezheti.
    const stagePriority={'cross-head-trim':0,'cross-trim':1,cross:2,rip:3};
    const cutsInNumberOrder=job=>job.cuts.slice().sort((a,b)=>
      (stagePriority[a.stage]??4)-(stagePriority[b.stage]??4)||
      (a.order||0)-(b.order||0));
    for(let boardIndex=0;boardIndex<bins.length;boardIndex++){
      const bin=bins[boardIndex],board=boardIndex+1;
      let order=0,boardPairs=0;
      for(const cut of bin.cuts){
        delete cut.globalOrder;delete cut.boardOrder;delete cut.stackCount;
      }
      if(!bin.machine){
        boards.push({board,cutCount:0,pairedGroups:0});
        continue;
      }
      // 1. Az adott tábla teljes felsávozása: minden csík elkészül.
      for(const cut of bin.cuts.filter(c=>c.stage==='head-trim'||c.stage==='strip')){
        cut.boardOrder=cut.globalOrder=++order;cut.stackCount=1;
        events.push({type:'cut',phase:'savozas',group:'foves',
          order,board,strip:cut.stripIndex,stage:cut.stage,stackCount:1,cut});
      }
      const jobs=bin.machine.strips.map(strip=>({
        bin,board,strip,
        cuts:bin.cuts.filter(c=>stages.includes(c.stage)&&c.stripIndex===strip.index)
      }));
      // 2. Csíkok visszakérése; azonos csíkokat csak EGY táblán belül

      phases:['savozas','hosszvagas'],maxSuggestedStack:2,
      note:'A két rétegű visszakérés csak ellenőrző javaslat. Az xPrg gépi végrehajtása nem hitelesített.',

  function computeNesting(){

    // A régi 38 mm munkalapos projekt és anyag adatai megmaradnak,
    // de sem tervet, sem gépi XML/XMix fájlt nem készíthetünk belőlük.
    const rejectedWorktop=(parts.rows||[]).find(r=>

      // csökkenti a szétszórt, használhatatlan üres helyeket.
      const earlyFill=trial.bins.reduce((sum,bin,index)=>
        sum+bin.used/(index+1),0);

        trial.failed.length*1e18+trial.sheetArea*1e5+
        trial.bins.length*1e7+machineStripArea*.025+
        cuts.length*1000+cuts.reduce((s,c)=>s+c.length,0)*.01+

          (state.layoutMode==='rows'?'Polcos':state.layoutMode==='mosaic'?'Mozaikos':'Szabad')+

        largestReusableArea:largestReusable};}

      const labels=best.missingMandatory.map(id=>{
        const r=requiredCatalog.find(x=>x?.id===id);
        return (r?.name||'Maradéktábla')+' ('+(r?.a||'?')+' × '+(r?.b||'?')+' mm)';
      });
      return {error:'A Bevonni jelölés kötelező, de nem sikerült alkatrészt '+
        'elhelyezni a következő maradékon: '+labels.join(', ')+'. '+
        'Ellenőrizd a színt, a vastagságot, a méretet és az alkatrészek darabszámát. '+
        'Egyetlen kijelölt maradékot sem hagyhatunk ki észrevétlenül.'};

  function trimmingSteps(bin){
    const trim=Number(bin.trim)||0,kerf=Math.max(0,Number(state.kerf)||0);
    if(!trim)return [];
    if(trim+1e-6<kerf)return null; // A szélezési ráhagyásnak fedeznie kell a fűrészrést.
    const a=bin.a,b=bin.b,strip=trim-kerf;
    const operations=[
      {axis:'y',section:'R0',sectionX:0,sectionY:0,sectionW:a,sectionH:b,
        offset:trim-kerf/2,beforeSize:strip,afterSize:a-trim,partSide:'start',
        beforeSection:'E1',afterSection:'R1',edge:'bal'},
      {axis:'y',section:'R1',sectionX:trim,sectionY:0,sectionW:a-trim,sectionH:b,
        offset:a-2*trim+kerf/2,beforeSize:a-2*trim,afterSize:strip,partSide:'end',
        beforeSection:'R2',afterSection:'E2',edge:'jobb'},
      {axis:'x',section:'R2',sectionX:trim,sectionY:0,sectionW:a-2*trim,sectionH:b,
        offset:trim-kerf/2,beforeSize:strip,afterSize:b-trim,partSide:'start',
        beforeSection:'E3',afterSection:'R3',edge:'felső'},
      {axis:'x',section:'R3',sectionX:trim,sectionY:trim,sectionW:a-2*trim,sectionH:b-trim,
        offset:b-2*trim+kerf/2,beforeSize:b-2*trim,afterSize:strip,partSide:'end',
        beforeSection:'S1',afterSection:'E4',edge:'alsó'}
    ];
    return operations.map((c,i)=>{
      const position=(c.axis==='y'?c.sectionX:c.sectionY)+c.offset;
      return {...c,kind:'trim',order:i+1,pieceSize:trim,kerf,fromEdge:c.beforeSize,
        x1:c.axis==='y'?position:c.sectionX,
        y1:c.axis==='x'?position:c.sectionY,
        x2:c.axis==='y'?position:c.sectionX+c.sectionW,
        y2:c.axis==='x'?position:c.sectionY+c.sectionH,
        length:c.axis==='y'?c.sectionH:c.sectionW};
    });
  }

    if(bin.machine)return bin.cuts.map((c,i)=>({...c,order:c.boardOrder||c.globalOrder||i+1})).sort((a,b)=>a.order-b.order);
