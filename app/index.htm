        'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
      if(ok)console.info('Excel alkatrészlista mentés kezdeményezve:',file);
    }catch(err){
      showNotice('Az Excel-fájl nem készült el: '+(err?.message||'ismeretlen mentési hiba'));
    }
  }
  function selectedBin(){return result && !result.error?result.bins[state.selectedBoard]:null;}
  function fileName(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'_').slice(0,70);}
  function cutExportData(bin){
    const cuts=allCuttingSteps(bin),machine=bin.machine;
    const strips=machine?.strips.map(s=>({
      index:s.index,section:s.section.id,feedWidth:s.width,
      longLength:machine.feed==='x'?bin.a:bin.b,
      firstCrossTrimPosition:s.firstCutPosition??null,
      reusableRemainder:s.leftover,partNames:s.items.map(p=>p.item.name),
      crosscuts:s.items.map(p=>p.along),
      crossSawPositions:cuts.filter(c=>c.stripIndex===s.index&&c.stage==='cross')
        .map(c=>c.axis==='y'?c.x1:c.y1)
    }))||[];
    const machineEvents=machine&&cuts?[
      ...cuts.filter(c=>c.stage==='head-trim'||c.stage==='strip').map(c=>({type:'cut',...c})),
      ...machine.strips.flatMap(s=>[
        {type:'refeed',stripIndex:s.index,section:s.section.id,
          feedWidth:s.width,feedAxis:'x',length:machine.crossSize},
        ...cuts.filter(c=>c.stage!=='strip'&&c.stage!=='head-trim'&&c.stripIndex===s.index)
          .map(c=>({type:'cut',...c}))
      ])
    ]:null;
    return {
      kind:'Lapterv guillotine cutting instructions — pre-machine review',
      project:getFurniture()?.name||state.projectName,
      board:{name:bin.name,index:state.selectedBoard+1,x:bin.a,y:bin.b,thickness:bin.thickness,trim:bin.trim},
      kerf:Number(state.kerf),
      reference:machine?
        'All millimetres. First saw centre: full board feed length minus edge trim. Strip cuts retreat toward the origin. After refeed each detached strip, saw its far end at strip length minus trim and crosscut parts backwards; leave the near-side remainder intact. X along grain, Y across grain. Offsets are blade centres on each section.':
        'All millimetres; X along grain, Y across grain. Steps first trim edges (R0–R3), then cut parts from S1. Offsets measure blade centre from each section top/left edge.',
      cuts,
      machine:machine?{readyForReview:true,stockFeedAxis:machine.feed,
        initialFeedDimension:machine.feed==='x'?bin.b:bin.a,
        initialCutPosition:machine.firstCutPosition??null,
        initialCrossDimension:machine.feed==='x'?bin.a:bin.b,
        trimmedStripLength:machine.crossSize,strips,events:machineEvents}:null,
      finishedParts:bin.placements.map(p=>({
        section:p.section,name:p.part.name,furniture:p.part.source,number:p.part.number,
        cutX:p.realW,cutY:p.realH,finishedX:p.part.originalA,finishedY:p.part.originalB,
        edge:p.part.edge,edgeThickness:p.part.edgeThickness,milling:p.part.mill,
        rotated:p.turned,thickness:bin.thickness
      }))
    };
  }
  function downloadMachineReview(){
    if(!result || result.error || result.failed.length || state.layoutMode!=='machine'){
      showNotice('A gépi előkészítéshez hibátlan, teljes gépi csíkos nesting szükséges.');return;
    }
    const files=[],all=[];
    for(let i=0;i<result.bins.length;i++){
      const bin=result.bins[i];
      if(!bin.machine){showNotice('Az egyik táblához nem készült gépi csíkterv.');return;}
      const plan=cutExportData(bin);
      if(!plan.cuts || !Array.isArray(plan.machine?.events) || !plan.machine.events.length){
        showNotice('Nem teljes az egyik tábla vágási leírása.');return;
      }
      // Az aktuális tábla indexe külön szerepel az összesített tervben.
      plan.board.index=i+1;
      const base='tabla_'+String(i+1).padStart(2,'0');
      files.push([base+'_ellenorzo_vagasok.json',JSON.stringify(plan,null,2)]);
      all.push({file:base+'_ellenorzo_vagasok.json',board:plan.board,cuts:plan.cuts.length,parts:plan.finishedParts.length});
    }
    const manifest={format:'lapterv-machine-review-v1',machineExecutable:false,
      note:'NEM xMix és NEM xPrg. Gépbe betölteni tilos. A vágások értelmezését az eredeti xPrg fájlokkal még igazolni kell.',
      project:String(getFurniture()?.name||state.projectName||'Lapterv'),boards:all,
      settings:{kerfMm:Number(state.kerf),trimMm:Number(state.trim),cutDirection:state.cutDirection,layoutMode:state.layoutMode}};
    if(result.production){
      files.push(['gyartasi_sorrend_ellenorzes.json',JSON.stringify(result.production,null,2)]);
      manifest.productionSchedule='gyartasi_sorrend_ellenorzes.json';
      manifest.pairedStripGroups=result.production.pairedGroups;
    }
    files.unshift(['manifest.json',JSON.stringify(manifest,null,2)]);
    files.push(['OLVASSEL.txt','LAPTERV - GÉPI ELŐKÉSZÍTŐ CSOMAG\r\n\r\nEz NEM végrehajtható gépi program.\r\nNem tartalmaz xMix vagy xPrg fájlokat.\r\nA *.json állományokat kizárólag ellenőrzésre és a későbbi hiteles gépi export fejlesztéséhez használd.\r\nÉles gépi futtatás előtt igazolni kell a gép valódi xPrg parancsformátumát.\r\n']);
    downloadBlob(xlsxZip(files,'application/zip'),(fileName(manifest.project)||'lapterv')+'_gepi_elokeszites_NEM_gepi_program.zip');
  }
  // Kísérleti XML-állományok az eredeti XPrg/XMix minták megfigyelt alakjában.
  // Csak OFFLINE szimulációhoz: a gép által végrehajtott sorrend NEM igazolt!
  // Egy projekt = egy .xMix + táblánként egy .xPrg ugyanabban a ZIP-ben.
  // A formátumot csak a kapott minták támasztják alá, a gépi futtatás NINCS igazolva.
  function buildOfflineXprgProject(bins,project,materialCode,kerf,date){
    if(!Array.isArray(bins)||!bins.length)throw Error('Nincsenek táblák a gépi csomaghoz.');
    const esc=t=>String(t??'').replace(/[&<>"']/g,
      c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
    const num=n=>{
      if(!Number.isFinite(Number(n)))throw Error('Hibás méret az .xPrg adatban.');
      return Number(n).toFixed(2);
    };
    if(!/^[A-Za-z0-9_.-]{2,40}$/.test(materialCode))
      throw Error('Hibás ellenőrző anyagkód.');
    const root=(fileName(project)||'Lapterv').slice(0,48);
    const names=[],files=[],summary=[];
    bins.forEach((bin,i)=>{
      const m=bin.machine;
      if(!m?.strips?.length)throw Error((i+1)+'. tábla: nincs gépi csíkterv.');
      const length=m.feed==='x'?bin.b:bin.a;
      const width=m.feed==='x'?bin.a:bin.b;
      const file=root+'_tabla_'+String(i+1).padStart(2,'0')+'_OFFLINE.xPrg';
      names.push(file);
      const complex=m.strips.some(strip=>(strip.items||[]).some(p=>
        !Number.isFinite(p.along)||!Number.isFinite(p.breadth)||
        Math.abs(p.breadth-strip.width)>.01));
      const cuts=[],add=(type,val)=>cuts.push('    <Cut T="'+type+'" Dim="'+num(val)+
        '" Rip="1" ID="'+cuts.length+'" />');
      add('P',length);add('RY',bin.trim);
      for(const strip of m.strips){
        add('Y',strip.width);add('RX',bin.trim);
        for(const part of strip.items||[]){add('X',part.along);add('F',0);}
      }
      const boardParts=m.strips.map(strip=>
        '    <Strip Index="'+strip.index+'" Width="'+num(strip.width)+'">'+
        (strip.items||[]).map(piece=>
          '<Part Name="'+esc(piece.item?.name||'')+'" Length="'+num(piece.along)+
          '" Width="'+num(piece.breadth)+'" />').join('')+'</Strip>').join('\n');
      let xml;
      if(complex){
        // Az U/V alábontást nem találjuk ki: a fájl szándékosan NEM SchemaDoc,
        // így a gép nem fogadhatja el kész vágóprogramként.
        xml='<?xml version="1.0" encoding="utf-8"?>\n'+
          '<LaptervOfflineReview MachineExecutable="false" Board="'+(i+1)+'">\n'+
          '  <Warning>Ez a tabla U/V alabontast igenyel. Nem hitelesitett XPrg, csak ellenorzo geometria.</Warning>\n'+
          '  <Board Length="'+num(length)+'" Width="'+num(width)+'" Thickness="'+num(bin.thickness)+
          '" Kerf="'+num(kerf)+'" Trim="'+num(bin.trim)+'" />\n'+
          '  <Strips>\n'+boardParts+'\n  </Strips>\n'+
          '  <KnownCommandsForComparison>\n'+cuts.join('\n')+
          '\n  </KnownCommandsForComparison>\n</LaptervOfflineReview>\n';
      }else{
        xml='<?xml version="1.0" encoding="utf-8"?>\n'+
          '<!-- LAPTERV OFFLINE MINTA: NEM HITELESITETT GEPI PROGRAM; TILOS GEPEN FUTTATNI -->\n'+
          '<SchemaDoc>\n  <Header NumFogliPacco="1.00" Descrizione="'+esc(materialCode)+
          '" Spessore="'+num(bin.thickness)+'" Date="'+esc(date)+
          '" Lunghezza="'+num(length)+'" Larghezza="'+num(width)+
          '" SpessoreLama="'+num(kerf)+'" />\n'+
          '  <Material Tipologia="" Codice="'+esc(materialCode)+'" />\n'+
          '  <Pattern>\n'+cuts.join('\n')+'\n  </Pattern>\n</SchemaDoc>\n';
      }
      files.push(['xPrg/'+file,xml]);
      summary.push({tabla:i+1,file,anyag:bin.name,meret:[bin.a,bin.b,bin.thickness],
        stripCount:m.strips.length,complex,executable:false});
    });
    const namesOfMaterial=[...new Set(bins.flatMap(bin=>bin.machine.strips.flatMap(strip=>
      (strip.items||[]).map(part=>String(part.item?.materialColor||'').trim()).filter(Boolean)))];
    const material=namesOfMaterial.join(' / ')||'Nem megadott anyag';
    const mix='<?xml version="1.0" encoding="utf-8"?>\r\n<xMix>\r\n'+
      '  <Header Descrizione="'+esc(project)+'" Import="" Date="'+esc(date)+'" />\r\n'+
      '  <Materials><Material Tipologia="'+esc(material)+'" Codice="'+esc(materialCode)+
      '" Quantita="999" /></Materials>\r\n'+
      '  <RigheMix>\r\n'+names.map(file=>
      '    <RigaMix File=".\\xPrg\\'+esc(file)+
      '" Rep="1" Pacco="1" CambioMateriale="0" />').join('\r\n')+
      '\r\n  </RigheMix>\r\n</xMix>\r\n';
    const mixName=root+'_OFFLINE.xMix';
    files.unshift([mixName,mix]);
    files.push(['FONTOS_OLVASD_EL.txt',
      'LAPTERV - NEM HITELESITETT XPRG/XMIX ELLENORZO CSOMAG\r\n'+
      'Projekt: '+project+'\r\n'+
      'A .xMix a csomag xPrg/ almappajaban levo osszes .xPrg fajlra hivatkozik.\r\n'+
      'A .xPrg fajlok nem igazoltak a szabaszgep vezerlojen.\r\n'+
      'Az osszetett, U/V alabontasos tablakat LaptervOfflineReview jeloli: ezek nem gepprogramok.\r\n'+
      'A tobbi tabla SchemaDoc szerkezete is CSAK MINTA. Fizikai gepre NE toltsd fel!\r\n'+
      'Ket retegu vagas: nincs kodolva. Rip=1, Pacco=1.\r\n'+
      'A fajlok vizsgalatra es offline elemzesre keszultek, valos vagasi munka nem vegezheto veluk.\r\n']);
    files.push(['ELLENORZO_OSSZESITO.json',JSON.stringify({
      format:'lapterv-xmix-xprg-offline-project-v1',machineExecutable:false,
      project,boardCount:bins.length,mixFile:mixName,materialCode,boards:summary
    },null,2)]);
    return {files,mixName,names,complexBoards:summary.filter(x=>x.complex).length};
  }
  async function downloadXprgProject(){
    try{
      if(!result||result.error||state.layoutMode!=='machine'||!result.bins?.length)
        throw Error('Előbb készíts gépi csíkos nestinget.');
      if(result.failed?.length)
        throw Error('Van ki nem táblásított alkatrész. Előbb javítsd a nestinget a teljes projekt mentéséhez.');
      const now=new Date();
      const date=String(now.getDate()).padStart(2,'0')+'/'+String(now.getMonth()+1).padStart(2,'0')+'/'+now.getFullYear();
      const project=String(getFurniture()?.name||state.projectName||'Lapterv').trim()||'Lapterv';
      // Valódi gépi anyagkód nélkül szándékosan csak ellenőrző azonosítóval mentünk.
      const bundle=buildOfflineXprgProject(result.bins,project,'LAPTERV_OFFLINE',
        Number(state.kerf),date);
      const zip=xlsxZip(bundle.files,'application/zip');
      const name=(fileName(project)||'Lapterv')+'_XPRG_XMIX_OFFLINE.zip';
      const ok=await saveFileToDisk(zip,name,'.zip','application/zip');
      if(ok)console.info('XPrg/XMix projektcsomag mentés kezdeményezve:',bundle.names.length,'tábla.');
    }catch(err){showNotice('Gépi ellenőrző csomag: '+(err?.message||'a mentés nem sikerült'));}
  }
  function downloadCutList(format){
    const bin=selectedBin();if(!bin)return;
    const data=cutExportData(bin),prefix=fileName(data.project||'Lapterv')||'lapterv';
    if(!data.cuts){showNotice('A szélezési méret nem lehet kisebb a vágásrésnél, ha gépi vágáslistát kérsz.');return;}
    const filename=`${prefix}_tabla_${state.selectedBoard+1}_vagaslista`;
    if(format==='json'){
      download(JSON.stringify(data,null,2),filename+'.json','application/json;charset=utf-8');
      return;
    }
    const header=['Tábla','Lépés','Művelet','Szélezési oldal','Résztábla','Résztábla X (mm)','Résztábla Y (mm)',
      'Résztábla bal X (mm)','Résztábla felső Y (mm)','Vágás tengelye',
      'Levágandó tiszta méret / szélezési ráhagyás (mm)','Levágandó oldal','Fűrész középvonala a résztábla szélétől (mm)',
      'Vágáshossz (mm)','Vágásrés (mm)','Első új résztábla','Első új méret (mm)',
      'Második új résztábla','Második új méret (mm)'];
    const number=n=>String(Math.round(n*1000)/1000).replace('.',',');
    const safe=s=>`"${String(s).replace(/"/g,'""')}"`;
    const lines=[header,...data.cuts.map(c=>[
      data.board.name,c.order,c.kind==='trim'?'szélezés':c.stage||'szabás',c.edge||'',c.section,number(c.sectionW),number(c.sectionH),
      number(c.sectionX),number(c.sectionY),c.axis,
      number(c.pieceSize),c.partSide==='start'?'bal/felső':'jobb/alsó',
      number(c.offset),number(c.length),number(c.kerf),
      c.beforeSection,number(c.beforeSize),c.afterSection,number(c.afterSize)
    ]),[],...(data.machine?[['CSÍKOK VISSZAADÁSA AZ X TENGELYŰ KERESZTVÁGÁSHOZ'],
      ['Csík','Leválasztott résztábla','A gépnek megadandó csíkszélesség (mm)','Csík hossza (mm)','Keresztvágási méretek (mm)'],
      ...data.machine.strips.map(s=>[
        s.index,s.section,number(s.feedWidth),number(s.longLength),
        s.crosscuts.map(number).join(' / ')
      ]),[]]:[]),['ELKÉSZÜLT ALKATRÉSZEK'],[
      'Résztábla','Alkatrész','Bútor','Sorszám','Szabási X (mm)','Szabási Y (mm)',
      'Kész X (mm)','Kész Y (mm)','Élzárás','Élvastagság (mm)','Marás 1 mm','Forgatva'
    ],...data.finishedParts.map(p=>[
      p.section,p.name,p.furniture,p.number,number(p.cutX),number(p.cutY),
      number(p.finishedX),number(p.finishedY),p.edge,number(p.edgeThickness),
      p.milling?'igen':'nem',p.rotated?'igen':'nem'
    ])];
    download('\uFEFF'+lines.map(row=>row.map(safe).join(';')).join('\r\n'),
      filename+'.csv','text/csv;charset=utf-8');
  }
  function downloadBoardSvg(){const b=selectedBin();if(b)download(svgBoard(b),`lapterv_tabla_${state.selectedBoard+1}.svg`,'image/svg+xml;charset=utf-8');}
  function downloadBlob(blob,filename){
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
  }
  function downloadBoardImage(){
    const bin=selectedBin();if(!bin)return;
    const index=state.selectedBoard+1;
    const {width,height}=svgBoardSize(bin);
    const scale=Math.min(2,4000/Math.max(width,height));
    const svg=svgBoard(bin);
    const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
    const img=new Image();
    const ext='png',mime='image/png';
    img.onload=()=>{
      try{
        const canvas=document.createElement('canvas');
        canvas.width=Math.max(1,Math.round(width*scale));
        canvas.height=Math.max(1,Math.round(height*scale));
        const ctx=canvas.getContext('2d');
        if(!ctx)throw Error('Canvas nem elérhető');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        canvas.toBlob(blob=>{
          if(blob)downloadBlob(blob,`lapterv_tabla_${index}.${ext}`);
          else showNotice(`A ${ext.toUpperCase()} kép mentése nem sikerült. Próbáld az SVG mentést.`);
        },mime);
      }catch{showNotice(`A ${ext.toUpperCase()} kép mentése nem sikerült. Próbáld az SVG mentést.`);}
      finally{URL.revokeObjectURL(url);}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);showNotice(`A ${ext.toUpperCase()} kép mentése nem sikerült. Próbáld az SVG mentést.`);};
    img.src=url;
  }
  // Minden készre vágott fizikai alkatrészhez pontosan egy matrica.
  // A gépi tervben a készre vágás valódi műveletszáma határozza meg a sorrendet.
  function orderedLabels(){
    if(!result?.bins?.length||result.error)return [];
    const labels=[];
    result.bins.forEach((bin,boardIndex)=>{
      bin.placements.forEach((placement,index)=>{
        labels.push({bin,boardIndex,placement,index,
          completionStep:placement.completionStep??(index+1)});
      });
    });
    // A matricák is táblánként csoportosulnak; azon belül a készülési sorrend.
    labels.sort((a,b)=>a.boardIndex-b.boardIndex||
      a.completionStep-b.completionStep||a.index-b.index);
    return labels;
  }
  // Egyetlen SVG matricarajzot használunk előnézethez, A4 nyomtatáshoz és PNG-hez.
  // Emiatt a papírra kerülő sorrend és a mentett képen lévő elrendezés azonos.
  function labelSvgContent(label,x,y,width,height){
    const part=label.placement.part;
    const scale=Math.max(.55,Math.min(1.65,width/70,height/40));
    const margin=2*scale;
    const inset=3*scale; // Csak pár mm-rel kerüljenek beljebb, a sorrendjük nem változik.
    const line=(text,left,baseline,size,weight='400',extra='')=>
      `<text x="${left}" y="${baseline}" font-size="${size}" font-weight="${weight}" font-family="Arial,Helvetica,sans-serif" fill="#151515" ${extra}>${h(text)}</text>`;
    const fit=(value,size,available)=>{
      const text=String(value||'');
      const limit=Math.max(3,Math.floor(available/(size*.53)));
      return text.length>limit?text.slice(0,Math.max(1,limit-1))+'…':text;
    };
    const destination=String(part.destination||'').trim();
    const material=String(part.materialColor||'').trim();
    const dimensions=nfmt(part.originalA)+' × '+nfmt(part.originalB);
    const edge=String(part.edge||'0-0');
    const codeSize=5.1*scale;
    const dimensionSize=Math.min(5.7*scale,
      Math.max(2.5*scale,(width-2*(margin+inset)-(edge.length*.58*codeSize)-2*scale)/(Math.max(1,dimensions.length)*.56)));
    const band=(Number(part.edgeThickness)===0.4?'0,4':'2')+' mm élzáró'+(part.mill?' · 1 mm marás':'');
    return `<g><rect x="${x}" y="${y}" width="${width}" height="${height}" fill="white" stroke="#555" stroke-width=".25"/>`+
      line(fit(destination,2.3*scale,width-2*margin),x+margin,y+height*.115,2.3*scale,'400')+
      `<path d="M${x+margin} ${y+height*.16}H${x+width-margin}" stroke="#aaa" stroke-width=".2"/>`+
      line(dimensions,x+margin+inset,y+height*.37,dimensionSize,'800')+
      line(edge,x+width-margin-inset,y+height*.37,codeSize,'800','text-anchor="end"')+
      line(fit(part.name,3.6*scale,width-2*margin),x+margin,y+height*.535,3.6*scale,'700')+
      line(fit(part.source,2.6*scale,width-2*margin),x+margin,y+height*.68,2.6*scale,'400')+
      line(fit(material,2.5*scale,width-2*margin),x+margin,y+height*.81,2.5*scale,'400')+
      line(fit(band,2.3*scale,width-2*margin),x+margin,y+height*.92,2.3*scale,'400')+
      `</g>`;
  }
  const labelPaper={width:210,height:297};
  function labelPages(){
    const labels=orderedLabels();
    const width=Number(state.labelWidth),height=Number(state.labelHeight);
    const marginX=Number(state.labelMarginX),marginY=Number(state.labelMarginY);
    const printableW=labelPaper.width-2*marginX;
    const printableH=labelPaper.height-2*marginY;
    const cols=Math.floor((printableW+1e-6)/width);
    const rows=Math.floor((printableH+1e-6)/height);
    if(!Number.isFinite(width)||!Number.isFinite(height)||!Number.isFinite(marginX)||!Number.isFinite(marginY)||
        width<20||height<15||marginX<0||marginY<0||cols<1||rows<1)
      throw Error('A megadott matrica nem fér el az A4 nyomtatható részén.');
    const pages=[];
    for(let offset=0;offset<labels.length;offset+=cols*rows){
      const batch=labels.slice(offset,offset+cols*rows);
      const drawing=batch.map((label,index)=>labelSvgContent(label,
        marginX+(index%cols)*width,
        marginY+Math.floor(index/cols)*height,width,height)).join('');
      pages.push(`<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/>${drawing}</svg>`);
    }
    return {pages,cols,rows,width,height,marginX,marginY};
  }
  function labelSheetPreview(layout,filled){
    // A csatolt minta szerinti 4 × 11-es címkerács a papír belsejében kezdődik;
    // az üres helyek is látszanak az előnézetben, de a nyomtatásban nem.
    const slots=Array.from({length:layout.cols*layout.rows},(_,i)=>{
      const x=layout.marginX+(i%layout.cols)*layout.width;
      const y=layout.marginY+Math.floor(i/layout.cols)*layout.height;
      return `<rect x="${x}" y="${y}" width="${layout.width}" height="${layout.height}" fill="${i<filled?'#e4f2e9':'white'}" stroke="#687d6c" stroke-width=".25"/>`;
    }).join('');
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" role="img" aria-label="A4-es címkeív, ${layout.cols} oszlop, ${layout.rows} sor, a szélén ${nfmt(layout.marginX)} és ${nfmt(layout.marginY)} mm margó"><rect width="210" height="297" fill="white"/><rect x=".3" y=".3" width="209.4" height="296.4" fill="none" stroke="#657568" stroke-width=".5"/>${slots}</svg>`;
  }
  function labelPanelView(){
    const labels=orderedLabels();
    if(!labels.length)return '';
    const w=Number(state.labelWidth),ht=Number(state.labelHeight);
    const mx=Number(state.labelMarginX),my=Number(state.labelMarginY);
    let layout=null,layoutError='';
    try{layout=labelPages();}catch(err){layoutError=err.message;}
    const preview='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'mm" height="'+ht+
      'mm" viewBox="0 0 '+w+' '+ht+'">'+labelSvgContent(labels[0],0,0,w,ht)+'</svg>';
    return '<div class="panel top-gap"><div class="panel-head"><div>'+
      '<div class="panel-title">Alkatrészmatricák · '+labels.length+' db</div>'+
      '<div class="panel-sub">Alapív: A4 · 48,5 × 25,4 mm · 44 címke (4 oszlop × 11 sor), a lap szélétől beljebb kezdődik. Balra a kész méret, jobbra az élzárás; a „Hová készül?” és az anyagszín a bútor paramétereiből kerül ide.</div>'+
      '</div><div class="export-box"><button class="btn sm" data-action="download-labels-png">↓ A4 matricák PNG</button></div></div>'+
      '<div class="panel-body"><div class="toolbar" style="align-items:flex-start">'+
      '<div class="settings" style="flex:1;min-width:260px">'+
      '<div><label>Matrica szélesség (mm)</label><input type="number" min="20" max="190" step="0.1" data-scope="settings" data-key="labelWidth" value="'+h(w)+'"></div>'+
      '<div><label>Matrica magasság (mm)</label><input type="number" min="15" max="270" step="0.1" data-scope="settings" data-key="labelHeight" value="'+h(ht)+'"></div>'+
      '<div><label>Bal / jobb margó (mm)</label><input type="number" min="0" max="70" step="0.1" data-scope="settings" data-key="labelMarginX" value="'+h(mx)+'"></div>'+
      '<div><label>Felső / alsó margó (mm)</label><input type="number" min="0" max="70" step="0.1" data-scope="settings" data-key="labelMarginY" value="'+h(my)+'"></div></div>'+
      '<div class="label-preview"><div class="small muted" style="margin-bottom:8px">Első elkészülő alkatrész matricája:</div>'+preview+
      '<div class="tiny muted" style="margin-top:8px">'+(layout?'A4: '+layout.cols+' oszlop × '+layout.rows+' sor · '+layout.pages.length+' oldal. Nyomtatáskor 100% méretarányt, margó nélkül és próbalapot használj.':'Előbb javítsd a címke méreteit és a margókat.')+'</div></div>'+
      '<div class="label-sheet-preview"><div class="small muted" style="margin-bottom:8px">A teljes A4 címkeív elhelyezése:</div>'+
      (layout?labelSheetPreview(layout,Math.min(labels.length,layout.cols*layout.rows))+
        '<div class="tiny muted" style="margin-top:8px">Bal/jobb: '+nfmt(mx)+' mm · fent/lent: '+nfmt(my)+' mm. A zöld mezők a kitöltött címkék.</div>':
        '<div class="notice error">'+h(layoutError)+'</div>')+'</div></div></div></div>';
  }
  function printLabels(){
    if(!orderedLabels().length){showNotice('A matrica nyomtatása előtt készíts nesting tervet.');return;}
    let pages;
    try{pages=labelPages().pages;}catch(err){showNotice(err.message);return;}
    const popup=window.open('','_blank');
    if(!popup){showNotice('A böngésző blokkolta a nyomtatóablakot. Engedélyezd a felugró ablakokat.');return;}
    popup.document.open();
    popup.document.write('<!doctype html><html lang="hu"><head><meta charset="utf-8">'+
      '<title>'+h(getFurniture()?.name||state.projectName||'Lapterv')+' · alkatrészmatricák</title>'+
      '<style>@page{size:A4;margin:0}*{box-sizing:border-box}body{margin:0;padding:0;background:#fff}'+
      '.sheet{width:210mm;height:297mm;break-after:page;page-break-after:always;overflow:hidden}'+
      '.sheet svg{width:210mm;height:297mm;display:block}.sheet:last-child{break-after:auto;page-break-after:auto}'+
      '@media screen{body{background:#eee}.sheet{background:white;margin:8mm auto;box-shadow:0 1mm 5mm #888}}'+
      '</style></head><body>'+pages.map(svg=>'<div class="sheet">'+svg+'</div>').join('')+'</bo'+'dy></html>');
    popup.document.close();
    popup.focus();
    setTimeout(()=>popup.print(),350);
  }
  async function downloadLabelPng(){
    if(!orderedLabels().length){showNotice('Előbb készíts nesting tervet a matricákhoz.');return;}
    try{
      const pages=labelPages().pages,files=[];
      const project=fileName(getFurniture()?.name||state.projectName||'Lapterv')||'Lapterv';
      for(let page=0;page<pages.length;page++){
        const svgUrl=URL.createObjectURL(new Blob([pages[page]],{type:'image/svg+xml;charset=utf-8'}));
        try{
          const png=await new Promise((resolve,reject)=>{
            const picture=new Image();
            picture.onload=()=>{
              try{
                const canvas=document.createElement('canvas');
                canvas.width=Math.round(210/25.4*300);
                canvas.height=Math.round(297/25.4*300);
                const context=canvas.getContext('2d');
                if(!context)throw Error('Nem sikerült képet készíteni.');
                context.fillStyle='#fff';context.fillRect(0,0,canvas.width,canvas.height);
                context.drawImage(picture,0,0,canvas.width,canvas.height);
                canvas.toBlob(blob=>blob?resolve(blob):reject(Error('PNG létrehozási hiba')),'image/png');
              }catch(error){reject(error);}
            };
            picture.onerror=()=>reject(Error('Nem sikerült kirajzolni az A4-es lapot.'));
            picture.src=svgUrl;
          });
          if(pages.length===1){downloadBlob(png,project+'_matricak_A4.png');return;}
          files.push([project+'_matricak_A4_'+String(page+1).padStart(2,'0')+'.png',
            new Uint8Array(await png.arrayBuffer())]);
        }finally{URL.revokeObjectURL(svgUrl);}
      }
      // Több A4-es oldal esetén egyetlen letölthető ZIP-ben található minden PNG.
      downloadBlob(xlsxZip(files,'application/zip'),project+'_matricak_A4_PNG.zip');
    }catch(err){showNotice(err.message||'A matricák PNG-mentése nem sikerült.');}
  }
  function downloadOverview(){
    if(!result?.bins?.length)return;
    const margin=60,width=Math.max(...result.bins.map(b=>svgBoardSize(b).width))+2*margin;let y=75;
    const body=result.bins.map((bin,i)=>{const inner=svgBoard(bin).replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'');const {width:w,height}=svgBoardSize(bin);const section=`<text x="${margin}" y="${y-20}" font-family="Arial" font-weight="700" font-size="30" fill="#234335">Tábla ${i+1}: ${h(bin.name)}</text><svg x="${margin}" y="${y}" width="${w}" height="${height}" viewBox="0 0 ${w} ${height}">${inner}</svg>`;y+=height+90;return section;}).join('');
    download(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${y}" width="${width}" height="${y}"><rect width="100%" height="100%" fill="white"/>${body}</svg>`,'lapterv_osszes_tabla.svg','image/svg+xml;charset=utf-8');
  }
  document.addEventListener('click',e=>{
    const el=e.target.closest('[data-action]');if(!el)return;
    const action=el.dataset.action;
    if(action==='library-home'){save();projectScreen='library';result=null;notice='';render();window.scrollTo(0,0);}
    else if(action==='create-project')freshProject();
    else if(action==='open-saved-project')openSavedProject(el.dataset.project,el.dataset.furniture);
    else if(action==='delete-saved-project'){
      const entry=library.find(x=>x.id===el.dataset.project);
      if(entry&&confirm('Biztosan törlöd ezt a mentett projektet és a benne lévő bútorokat?')){
        library=library.filter(x=>x.id!==entry.id);
        try{localStorage.setItem(libraryKey,JSON.stringify(library));}catch{}
        render();
      }
    }
    else if(action==='page'){state.active=el.dataset.page;notice='';render();window.scrollTo({top:0,behavior:'smooth'});}
    else if(action==='new-furniture'){const f={id:uuid(),name:'',destination:'',materialColor:'Feya',w:1000,ht:910,d:600,t:18,s:0,qty:1,partsOpen:false,parts:[]};state.furnitures.push(f);state.selectedFurniture=f.id;state.active='furniture';result=null;render();}
    else if(action==='open-parts'){
      const f=state.furnitures.find(x=>x.id===el.dataset.id);
      if(!f)return;
      if(!['w','ht','d','t','qty'].every(k=>Number(f[k])>0)){showNotice('Ellenőrizd a bútor méreteit és darabszámát.');return;}
      f.partsOpen=true;notice='';render();
    }
    else if(action==='remove-furniture'){
      if(!confirm('Biztosan törlöd ezt a bútorszériát?'))return;
      state.furnitures=state.furnitures.filter(f=>f.id!==el.dataset.id);state.selectedFurniture=state.furnitures[0]?.id||null;result=null;render();
    }
    else if(action==='add-part'){
      const f=getFurniture();if(!f)return;f.parts.push({id:uuid(),name:'',a:'',b:'',q:'',edge:'0-0',edgeSides:sidesFromCode('0-0'),edgeThickness:2,mill:true,rot:false,grainRequired:true});result=null;render();
    }
    else if(action==='remove-part'){
      const f=getFurniture();if(f)f.parts=f.parts.filter(p=>p.id!==el.dataset.id);result=null;render();
    }
    else if(action==='add-board'){state.boards.push({id:uuid(),name:'Maradék tábla',a:'',b:'',thickness:18,qty:1});result=null;render();}
    else if(action==='remove-board'){state.boards=state.boards.filter(b=>b.id!==el.dataset.id);result=null;render();}
    else if(action==='run-nesting'){result=computeNesting();state.selectedBoard=0;state.active='nesting';notice='';render();window.scrollTo({top:0,behavior:'smooth'});}
    else if(action==='select-board'){state.selectedBoard=Number(el.dataset.index);render();}
    else if(action==='clear-notice'){notice='';render();}
    else if(action==='export-json'){
      const title=String(getFurniture()?.name||state.projectName||'Lapterv').trim();
      download(JSON.stringify({...state,projectName:title,active:'furniture'},null,2),
        `${fileName(title)||'lapterv'}_projekt.json`,'application/json');
    }
    else if(action==='import-json'){$('#import-input').click();}
    else if(action==='download-parts-xlsx')downloadPartsXlsx();
    else if(action==='print-labels')printLabels();
    else if(action==='download-labels-png')downloadLabelPng();
    else if(action==='download-svg')downloadBoardSvg();
    else if(action==='download-cuts-csv')downloadCutList('csv');
    else if(action==='download-cuts-json')downloadCutList('json');
    else if(action==='download-machine-review')downloadMachineReview();
    else if(action==='download-xprg-project')downloadXprgProject();
    else if(action==='download-png')downloadBoardImage();
    else if(action==='download-overview')downloadOverview();
  });
  document.addEventListener('change',e=>{
    const el=e.target,scope=el.dataset.scope;if(!scope)return;
    const key=el.dataset.key;
    const wasNesting=!!result && state.active==='nesting';
    if(scope==='ui'){state[key]=el.value;}
    else {
      let target=scope==='furniture'?state.furnitures.find(f=>f.id===el.dataset.id):scope==='part'?state.furnitures.flatMap(f=>f.parts).find(p=>p.id===el.dataset.id):scope==='board'?state.boards.find(b=>b.id===el.dataset.id):scope==='settings'?state:null;
      if(!target)return;
      const value=el.type==='checkbox'?el.checked:el.type==='number'?pnum(el.value):el.value;
      if(el.type==='number'&&(!Number.isFinite(value)||value<+el.min||(el.max && value>+el.max))){showNotice('Érvénytelen szám. Kérlek, ellenőrizd a megadott értéket.');return;}
      if(scope==='part'&&key==='edgeSide'){
        if(!['x1','x2','y1','y2'].includes(el.dataset.side))return;
        target.edgeSides={...(target.edgeSides||sidesFromCode(target.edge)),[el.dataset.side]:value};
        target.edge=codeFromSides(target.edgeSides);
      }else{
        const previous=target[key];
        target[key]=value;
        if(scope==='part'&&key==='edgeThickness'&&Number(value)===2&&Number(previous)!==2)target.mill=true;
        if(scope==='part' && (key==='edgeThickness'||key==='mill') && Number(target.edgeThickness)===0.4)target.mill=false;
        if(scope==='part'&&key==='grainRequired')target.rot=!value;
      }
      if(scope==='settings'&&key.startsWith('label')){
        // Nyomtatási beállítás ne érvénytelenítse az elkészült szabástervet.
        notice='';render();return;
      }
      result=null;
      if((key==='cutDirection'||key==='layoutMode') && wasNesting)result=computeNesting();
    }
    notice='';render();
  });
  $('#import-input').addEventListener('change',async e=>{
    const file=e.target.files?.[0];if(!file)return;
    try{
      const obj=JSON.parse(await file.text());
      if(!Array.isArray(obj.furnitures)||!Array.isArray(obj.boards))throw Error('Hibás projektfájl');
      if(!confirm('A betöltött projekt lecseréli a jelenlegi adatokat. Folytatod?'))return;
      const fresh=defaultState();Object.assign(state,fresh,obj);normalizeEdgeSettings(state.furnitures);normalizeFurnitureMeta(state.furnitures,state);normalizeFurnitureSizes(state.furnitures);normalizeLabelSettings(state);state.active='furniture';state.selectedFurniture=state.furnitures[0]?.id||null;result=null;showNotice('Projekt betöltve.');
    }catch(err){showNotice('Nem sikerült betölteni a projektet: '+err.message);}finally{e.target.value='';}
  });
  render();
})();
