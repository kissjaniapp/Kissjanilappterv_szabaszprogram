    /* Egysoros felső munkafolyamat: nincs oldalsáv, a három lépés mindig elérhető. */
    .app{display:block}
    .main{max-width:1660px;padding:0 30px 70px}
    .topbar{min-height:80px;height:auto;padding:12px 0}
    .topbar .brand{display:flex;align-items:center;gap:11px;padding:0}
    .topbar .brand-logo{background:#e2f0e8;color:var(--pine)}
    .topbar .brand-name{color:var(--pine)}
    .topbar .brand-sub{color:#698d79}
    .top-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
    /* Bútoradatok felül, az alkatrésztábla csak a továbblépés után, teljes szélességben. */
    .two-col{grid-template-columns:minmax(0,1fr)}
    .furniture-next{grid-column:1/-1;display:flex;justify-content:flex-end;align-items:center;gap:14px;flex-wrap:wrap}
    .furniture-next .muted{max-width:480px}
    #top-steps{position:sticky;top:0;z-index:35;background:var(--bg);padding:10px 0 12px;border-bottom:1px solid var(--line)}
    .label-preview{padding:12px;border:1px solid var(--line);background:#f6f7f4;border-radius:12px;max-width:350px;overflow:auto;flex-shrink:0}
    .label-preview svg{display:block;max-width:100%;height:auto;background:white}
    .label-sheet-preview{padding:12px;border:1px solid var(--line);background:#f6f7f4;border-radius:12px;max-width:260px;flex-shrink:0}
    .label-sheet-preview svg{display:block;width:100%;max-width:220px;height:auto;margin:auto;background:white;box-shadow:0 2px 8px #263c3020}
    /* A rajz mindig a megjelenítésre jutó helyhez igazodik: nem nyúlik túl és nem nő óriásira. */
    .drawing-area{height:clamp(360px,65vh,730px);display:flex;align-items:center;justify-content:center}
    .drawing-area svg{width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain}
    #top-steps .steps{margin:0}
    .intro{padding-top:25px}
    @media(max-width:760px){.main{padding:0 13px 45px}.topbar{min-height:64px}.topbar .brand-name{font-size:17px}.topbar .brand-logo{width:30px;height:30px}.top-actions .status{display:none}.top-actions .btn{padding:7px 8px;font-size:11px}#top-steps{padding:8px 0}.step{min-height:55px}.intro{padding-top:17px}.drawing-area{height:clamp(310px,56vh,560px);padding:10px}.two-col>.panel:first-child .job-info{grid-template-columns:minmax(0,1fr)}}

    /* Világos, sötét és egyénileg színezhető megjelenés. */
    :root{--surface:#fff;--control-bg:#fff;--soft-bg:#f1f6f1;--primary-text:#fff;--table-head:#f8faf8;--table-hover:#f6faf7}
    html[data-gatterka-base="dark"]{color-scheme:dark;--white:#21312a;--surface:#21312a;--control-bg:#1a2922;--soft-bg:#2b4135;--line:#425b4d;--muted:#a9beb0;--leaf:#294235;--table-head:#263b30;--table-hover:#2a4035;--shadow:0 5px 20px #00000024}
    html[data-gatterka-base="dark"] .panel,html[data-gatterka-base="dark"] .stat,
    html[data-gatterka-base="dark"] .step,html[data-gatterka-base="dark"] .library-row,
    html[data-gatterka-base="dark"] .board-meta,html[data-gatterka-base="dark"] .res-card,
    html[data-gatterka-base="dark"] .stock-card,html[data-gatterka-base="dark"] .label-preview,
    html[data-gatterka-base="dark"] .label-sheet-preview,html[data-gatterka-base="dark"] .settings-dialog{
      background:var(--surface)!important;border-color:var(--line)!important;color:var(--ink)}
    html[data-gatterka-base="dark"] input:not([type="checkbox"]):not([type="color"]),
    html[data-gatterka-base="dark"] select,html[data-gatterka-base="dark"] .expr-cell.has-formula{
      background:var(--control-bg)!important;border-color:var(--line)!important;color:var(--ink)!important}
    html[data-gatterka-base="dark"] .expr-cell.has-formula .expr{background:transparent!important;color:var(--muted)!important}
    html[data-gatterka-base="dark"] .expr-cell.has-formula .expr-result{color:var(--ink)!important}
    html[data-gatterka-base="dark"] .drawing-area,html[data-gatterka-base="dark"] .cabinet-visual,
    html[data-gatterka-base="dark"] .mini-info,html[data-gatterka-base="dark"] .formula-bar,
    html[data-gatterka-base="dark"] .edge-tick,html[data-gatterka-base="dark"] .notice,
    html[data-gatterka-base="dark"] .tag,html[data-gatterka-base="dark"] .callout,
    html[data-gatterka-base="dark"] .step.active{background:var(--soft-bg)!important;border-color:var(--line)!important;color:var(--ink)!important}
    html[data-gatterka-base="dark"] .edge-tick:has(input:checked){background:#355844!important}
    html[data-gatterka-base="dark"] th{background:var(--table-head)!important;color:var(--muted)!important}
    html[data-gatterka-base="dark"] tbody tr:hover{background:var(--table-hover)!important}
    html[data-gatterka-base="dark"] td,html[data-gatterka-base="dark"] th,
    html[data-gatterka-base="dark"] .panel-head,html[data-gatterka-base="dark"] .topbar{border-color:var(--line)!important}
    html[data-gatterka-base="dark"] .btn:not(.primary):not(.orange),
    html[data-gatterka-base="dark"] .board-tab:not(.active){background:var(--surface);border-color:var(--line)}
    html[data-gatterka-base="dark"] .btn:not(.primary):not(.orange):hover{background:var(--soft-bg)}
    html[data-gatterka-base="dark"] .board-contents div{color:var(--muted);border-color:var(--line)}
    html[data-gatterka-base="dark"] #top-steps{background:var(--bg)}
    html .btn.primary,html .board-tab.active,html .step.active .step-number{
      background:var(--pine)!important;border-color:var(--pine)!important;color:var(--primary-text)!important}
    html .btn:not(.primary):not(.orange){color:var(--pine)}
    html .btn.primary:hover{filter:brightness(1.14)}
    html .panel-title,html .intro h1,html .library-info strong,html .stat .value,
    html .board-contents strong,html .empty h3,html .topbar .brand-name{color:var(--ink)}
    html[data-gatterka-base="dark"] .muted,html[data-gatterka-base="dark"] .panel-sub,
    html[data-gatterka-base="dark"] .stat .label,html[data-gatterka-base="dark"] .stat .detail,
    html[data-gatterka-base="dark"] .field-hint,html[data-gatterka-base="dark"] .part-summary,
    html[data-gatterka-base="dark"] .topbar .brand-sub,html[data-gatterka-base="dark"] .crumb,
    html[data-gatterka-base="dark"] .formula-bar code{color:var(--muted)!important}
    html[data-gatterka-base="dark"] label{color:var(--muted)}
    html[data-gatterka-base="dark"] .topbar .brand-logo{background:var(--soft-bg);color:var(--ink)}
    html[data-gatterka-base="dark"] .label-sheet-preview,html[data-gatterka-base="dark"] .label-preview{background:var(--surface)!important}
    html[data-gatterka-base="dark"] .label-sheet-preview svg,html[data-gatterka-base="dark"] .label-preview svg{background:#fff!important}
    .settings-overlay{position:fixed;inset:0;z-index:150;background:#071710a8;display:flex;align-items:center;justify-content:center;padding:18px}
    .settings-dialog{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;width:min(510px,100%);max-height:calc(100vh - 36px);overflow-y:auto;box-shadow:0 20px 80px #0004;padding:23px}
    .settings-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}
    .settings-header h2{margin:0}
    .theme-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0 19px}
    .theme-choice{padding:18px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:750;cursor:pointer;display:grid;gap:9px;justify-items:center}
    .theme-choice.active{border-color:var(--pine);box-shadow:0 0 0 2px color-mix(in srgb,var(--pine) 15%,transparent)}
    .theme-swatch{width:100%;max-width:140px;height:40px;border-radius:8px;border:1px solid #8fa99b;display:flex;align-items:center;justify-content:center;font-size:11px}
    .theme-swatch.light{background:#f5f7f4;color:#17392f}.theme-swatch.dark{background:#131e19;color:#e6f0e8}
    .theme-colors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin:12px 0 17px}
    .theme-color-field{display:block;min-width:0}
    .theme-color-field span{display:block;color:var(--muted);font-size:12px;font-weight:650;margin-bottom:7px}
    .theme-color-field input[type="color"]{width:100%;height:43px;padding:3px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface)}
    .theme-note{font-size:12px;color:var(--muted);line-height:1.6}
    .settings-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}
    @media(max-width:500px){.theme-colors{grid-template-columns:1fr 1fr}.settings-dialog{padding:16px}}
    /* Hét, végig látható lépés – a fejléc mobilon is több sorba törhet. */
    .steps{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:15px}
    .step{min-width:0;padding:9px 7px;gap:6px}
    .step-number{flex:0 0 27px;width:27px;height:27px;font-size:11px}

    @media(max-width:1100px){.steps{grid-template-columns:repeat(4,minmax(0,1fr))}}
    @media(max-width:640px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
    .material-sort-row{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface)}
    .material-sort-row.dragging{opacity:.42}
    .material-sort-row.drop-before{border-top:3px solid var(--pine)}
    .material-sort-row.drop-after{border-bottom:3px solid var(--pine)}
    .material-sort-handle{display:inline-flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;font-size:25px;padding:5px 10px;color:var(--pine);user-select:none}
    .material-sort-handle:active{cursor:grabbing}
    .folder-columns{display:grid;grid-template-columns:minmax(0,1fr);gap:15px}
    .folder-box{border:2px dashed var(--line);border-radius:14px;padding:11px;min-height:116px;background:var(--soft-bg)}
    .folder-box.drop-active{border-color:var(--pine);background:#e4f4e8}
    .folder-heading{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:9px;flex-wrap:wrap}
    .folder-furniture{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin:7px 0;flex-wrap:wrap}
    .folder-furniture[draggable="true"]{cursor:grab}
    .folder-furniture:active{cursor:grabbing}
    .folder-grip{font-size:23px;color:var(--pine);padding:0 6px}
    .folder-furniture .library-info{flex:1;min-width:130px}
    .step:focus-visible,.folder-furniture:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
    .part-add-bottom{text-align:center;padding:16px;background:var(--soft-bg);border-top:1px solid var(--line)}
    .part-add-bottom .btn{font-size:17px;min-width:280px;padding:14px 25px;background:#82bfa6!important;color:#153d30!important;font-weight:800;border:2px solid #348b68}
    .part-ref-suggestions{position:absolute;top:100%;left:0;z-index:120;min-width:220px;max-height:240px;overflow-y:auto;border:1px solid var(--pine);box-shadow:0 9px 22px #0003;background:var(--surface);border-radius:8px;padding:4px}
    .part-ref-option{display:block;width:100%;padding:9px 12px;text-align:left;background:transparent;border:0;border-radius:5px;cursor:pointer;font-size:13px;color:var(--ink)}
    .part-ref-option:hover,.part-ref-option.suggestion-active{background:#dcece4;color:#163b2d}
    .expr-cell{position:relative}
    .furniture-part-group td{background:#dcece4!important;color:#163b2d;font-weight:700;padding:13px!important;border-top:2px solid #7ba68c}
    .part-materials-compact{display:flex;flex-direction:column;gap:4px}
    .part-materials-compact select,.part-materials-compact input{width:126px!important;min-width:0!important;max-width:126px;min-height:29px;padding:3px 6px;font-size:12px}

    /* Teljes szélességű sajátparaméter-szerkesztő, a többi funkciót nem érinti. */
    .two-col>.panel.furniture-editor:first-child .panel-body{
      display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
      gap:16px;align-items:start
    }
    .two-col>.panel.furniture-editor:first-child .panel-body > .furniture-select,
    .two-col>.panel.furniture-editor:first-child .panel-body > .furniture-name,
    .two-col>.panel.furniture-editor:first-child .panel-body > .mini-info,
    .two-col>.panel.furniture-editor:first-child .panel-body > .field-grid,
    .two-col>.panel.furniture-editor:first-child .panel-body > .custom-parameters-panel,
    .two-col>.panel.furniture-editor:first-child .panel-body > .job-info,
    .two-col>.panel.furniture-editor:first-child .panel-body > [data-live-cabinet],
    .two-col>.panel.furniture-editor:first-child .panel-body > .furniture-next{
      grid-column:1/-1;grid-row:auto;min-width:0
    }
    .two-col>.panel.furniture-editor:first-child .field-grid{
      grid-template-columns:repeat(4,minmax(0,1fr))
    }
    .two-col>.panel.furniture-editor:first-child .job-info{
      display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px
    }
    .two-col>.panel.furniture-editor:first-child .furniture-select{margin-bottom:0}
    .two-col>.panel.furniture-editor:first-child .furniture-name{margin-bottom:0!important}
    .two-col>.panel.furniture-editor:first-child .mini-info{margin-top:0}
    .two-col>.panel.furniture-editor:first-child .cabinet-visual{margin:0}
    .custom-parameters-panel{width:100%;max-width:none;margin-top:0}
    .custom-parameters-panel > .toolbar{gap:12px}
    .custom-parameters-panel > .muted{line-height:1.55;margin-top:8px}
    .custom-parameter-rule{margin-top:14px}
    .custom-parameter-head{
      display:grid;grid-template-columns:minmax(250px,2.5fr) minmax(170px,1fr) auto;
      gap:12px;align-items:end
    }
    .custom-parameter-head > div,.custom-parameter-condition > div{min-width:0}
    .custom-parameter-head .btn{justify-self:end;align-self:end;min-height:41px}
    .custom-parameter-condition{
      display:grid;grid-template-columns:minmax(300px,2fr) minmax(220px,1fr);
      gap:12px;align-items:end;margin:12px 0
    }
    .custom-parameter-condition [data-custom-status]{
      padding-bottom:12px;line-height:1.4;overflow-wrap:anywhere
    }
    .custom-parameter-part-row{
      display:grid;grid-template-columns:minmax(200px,2fr) minmax(120px,1fr) minmax(120px,1fr) minmax(100px,.8fr) 40px;
      gap:12px;align-items:end;margin:12px 0
    }
    .custom-parameter-part-field{min-width:0}
    .custom-parameter-part-field .expr-cell{width:100%;min-width:0}
    .custom-parameter-part-row .btn{min-height:41px;min-width:40px;justify-self:end}
    .custom-parameter-part-row label{margin-bottom:7px}
    @media(max-width:980px){
      .two-col>.panel.furniture-editor:first-child .field-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .custom-parameter-head{grid-template-columns:minmax(0,2fr) minmax(155px,1fr)}
      .custom-parameter-head .btn{grid-column:1/-1;justify-self:end}
      .custom-parameter-condition{grid-template-columns:minmax(0,1fr)}
      .custom-parameter-part-row{grid-template-columns:repeat(2,minmax(0,1fr))}
      .custom-parameter-part-row .btn{grid-column:2;justify-self:end}
    }
    @media(max-width:560px){
      .two-col>.panel.furniture-editor:first-child .field-grid,
      .two-col>.panel.furniture-editor:first-child .job-info,
      .custom-parameter-head,.custom-parameter-part-row{
        grid-template-columns:minmax(0,1fr)
      }
      .custom-parameter-head .btn,.custom-parameter-part-row .btn{grid-column:1}
    }
  </style>
</head>
<body>
<div class="app">
  <main class="main">
    <header class="topbar"><div class="brand"><div class="brand-logo">▥</div><div><div class="brand-name">Gatterka<span style="color:#d69b72">.</span></div><div class="brand-sub">BÚTOR • SZABÁSTERV • WINDOWS</div></div></div><div class="top-actions"><span class="status"><span class="dot"></span> Saját gépen mentve</span><button class="btn sm" data-action="library-home">▤ Bútorválasztó</button><button class="btn sm settings-gear" data-action="open-settings" title="Megjelenés és színek beállítása" aria-label="Beállítások megnyitása">⚙ Beállítások</button></div></header>
    <nav id="top-steps" aria-label="Munkafolyamat lépései"></nav>
    <div id="content"></div>
    <div class="footer"><strong>Gatterka</strong> · A programot készítette: <strong>Kiss János</strong> · A program Kiss János tulajdona.<div class="tiny muted" style="margin-top:5px">A szabástervet gyártás előtt ellenőrizd.</div></div>
  </main>
</div>
<div id="settings-overlay" class="settings-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title"></div>
<input class="file-input" type="file" id="import-input" accept="application/json,.json">
<script>
(() => {
  'use strict';
  const $ = sel => document.querySelector(sel);
  const h = val => String(val ?? '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  const uuid = () => (globalThis.crypto?.randomUUID?.() || 'id'+Date.now()+Math.random().toString(36).slice(2));
  const nfmt = value => Number(value).toLocaleString('hu-HU',{maximumFractionDigits:1});
  const pnum = value => Number(String(value).replace(',','.'));
  const paneNames = {furniture:'Bútor adatai',parts:'Alkatrészek',stock:'Anyagkészlet',nesting:'Szabásterv',labels:'Matricák',save:'Gépi mentés',materials:'Anyagadatbázis'};
  const defaultXmixMachineRoot='X:\\JANI\\szabas_programmal\\Legujabb_mentessel';
  // A Windowsos Gatterka indító munkamenetenként saját, helyi mappamentő
  // szolgáltatást nyit. Ez csak az EXE-vel futtatott felületen érhető el.
  const nativeLaunch=/^#gatterka-native=(\d{1,5})\.([A-Za-z0-9_-]{32,})$/.exec(location.hash||'');
  const nativeBridge=nativeLaunch?{
    url:'http://127.0.0.1:'+nativeLaunch[1],
    token:nativeLaunch[2]
  }:null;
  // Jelzés a Windows indítónak, hogy az ablak még él: addig marad futva a helyi mentő.
  if(nativeBridge){
    const pingBridge=()=>fetch(nativeBridge.url+'/native/ping',{method:'POST',
      headers:{'Content-Type':'application/json','X-Gatterka-Token':nativeBridge.token},
      body:'{}',mode:'cors',cache:'no-store'}).catch(()=>{});
    pingBridge();setInterval(pingBridge,5000);
  }
  // A választott gépi gyökérmappát új bútoroknál is megjegyezzük.
  const savedMachineRoot=(()=>{
    try{return localStorage.getItem('gatterka-machine-root-v1')||defaultXmixMachineRoot;}
    catch{return defaultXmixMachineRoot;}
  })();

  // A téma minden bútorprojektben azonos, külön felhasználói beállításként tárolva.
  const themeKey='gatterka-theme-v1';
  const themePalettes={
    light:{text:'#23322c',button:'#17392f',background:'#f5f7f4'},
    dark:{text:'#e6f0e8',button:'#3c8064',background:'#131e19'}
  };
  const isHexColor=x=>/^#[0-9a-fA-F]{6}$/.test(String(x));
  function loadTheme(){
    const initial={mode:'light',base:'light',colors:{...themePalettes.light}};
    try{
      const saved=JSON.parse(localStorage.getItem(themeKey)||'null');
      if(!saved||!['light','dark','custom'].includes(saved.mode))return initial;
      if(!['light','dark'].includes(saved.base))return initial;
      const base=saved.mode==='custom'?saved.base:saved.mode;
      const colors={...themePalettes[base]};
      if(saved.mode==='custom'){
        for(const key of Object.keys(colors))
          if(isHexColor(saved.colors?.[key]))colors[key]=saved.colors[key];
      }
      return {mode:saved.mode,base,colors};
    }catch{return initial;}
  }
  let themeSettings=loadTheme();
  function buttonTextColor(hex){
    const rgb=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));
    return (rgb[0]*299+rgb[1]*587+rgb[2]*114)/1000>=150?'#12231b':'#ffffff';
  }
  function applyTheme(){
    const root=document.documentElement;
    root.dataset.gatterkaBase=themeSettings.base;
    root.style.setProperty('--ink',themeSettings.colors.text);
    root.style.setProperty('--pine',themeSettings.colors.button);
    root.style.setProperty('--bg',themeSettings.colors.background);
    root.style.setProperty('--primary-text',buttonTextColor(themeSettings.colors.button));
    const meta=document.querySelector('meta[name="theme-color"]');
    if(meta)meta.setAttribute('content',themeSettings.colors.background);
  }
  function persistTheme(){
    try{localStorage.setItem(themeKey,JSON.stringify(themeSettings));}
    catch(e){console.warn('A téma mentése nem sikerült:',e);}
  }
  function settingsPanel(){
    const choice=mode=>`<button type="button" class="theme-choice ${themeSettings.mode===mode?'active':''}" data-action="theme-preset" data-mode="${mode}" aria-pressed="${themeSettings.mode===mode}">
      <span class="theme-swatch ${mode}">${mode==='light'?'Világos előnézet':'Sötét előnézet'}</span>${mode==='light'?'☀ Világos téma':'☾ Sötét téma'}</button>`;
    const fields=[
      ['text','Szöveg színe'],['button','Gombok színe'],['background','Háttér színe']
    ].map(([key,label])=>`<label class="theme-color-field"><span>${label}</span><input type="color" data-theme-color="${key}" value="${h(themeSettings.colors[key])}" aria-label="${label}"></label>`).join('');
    return `<div class="settings-dialog"><div class="settings-header"><h2 id="settings-title">⚙ Megjelenés beállításai</h2>
       <button class="btn sm" type="button" data-action="close-settings" aria-label="Beállítások bezárása">✕</button></div>
       <p class="theme-note">Válassz kész témát, vagy állítsd be a saját színeidet. A beállítás a következő indításkor is megmarad.</p>
       <div class="theme-choices">${choice('light')}${choice('dark')}</div>
       <h3>Egyéni színek ${themeSettings.mode==='custom'?'· saját téma':''}</h3>
       <div class="theme-colors">${fields}</div>
       <p class="theme-note">A színek azonnal módosítják a megjelenést. A mentett bútorokat nem érintik.</p>
       <div class="settings-actions"><button class="btn sm" data-action="theme-reset">Alapszínek visszaállítása</button>
         <button class="btn primary" data-action="close-settings">Kész</button></div></div>`;
  }
  function openSettings(){
    const overlay=$('#settings-overlay');
    overlay.innerHTML=settingsPanel();
    overlay.classList.remove('hidden');
    overlay.querySelector('[data-action="close-settings"]')?.focus();
  }
  function closeSettings(){
    const overlay=$('#settings-overlay');
    overlay.classList.add('hidden');
    overlay.innerHTML='';
    document.querySelector('[data-action="open-settings"]')?.focus();
  }
  function selectTheme(mode){
    if(!['light','dark'].includes(mode))return;
    themeSettings={mode,base:mode,colors:{...themePalettes[mode]}};
    persistTheme();applyTheme();
    if(!$('#settings-overlay').classList.contains('hidden'))
      $('#settings-overlay').innerHTML=settingsPanel();
  }
  function changeThemeColor(key,value){
    if(!['text','button','background'].includes(key)||!isHexColor(value))return;
    themeSettings.mode='custom';
    themeSettings.colors[key]=value;
    persistTheme();applyTheme();
    const overlay=$('#settings-overlay');
    overlay.querySelectorAll('[data-action="theme-preset"]').forEach(btn=>{
      btn.classList.remove('active');btn.setAttribute('aria-pressed','false');
    });
  }
  applyTheme();

  const defaultState = () => ({
    projectName:'Új bútorprojekt',
    active:'furniture',
    selectedFurniture:null,
    furnitures:[],
    boards:[],
    selectedRemnantIds:[],
    kerf:5,trim:12,cutDirection:'auto',layoutMode:'auto',selectedBoard:0,
    xprgMaterialCode:'BLAP003',xprgFolder:'.\\xPrg\\',xprgHeaderMode:'sample',
    xmixMachineRoot:savedMachineRoot,
    labelsEnabled:false,labelWidth:48.5,labelHeight:25.4,labelMarginX:8,labelMarginY:8.8,labelFormatV2:true
  });
  const parse = str => { try { return JSON.parse(str); } catch { return null; } };
  // Négy fizikai él: a két X-szálirányú és a két Y-keresztirányú oldal.
  function sidesFromCode(code){
    const m=String(code||'0-0').match(/^([012])-([012])$/);
    const x=m?Number(m[1]):0,y=m?Number(m[2]):0;
    return {x1:x>=1,x2:x===2,y1:y>=1,y2:y===2};
  }

  function effectiveShelves(f){
    if(f.shelfMode!=='auto')return Math.max(0,Math.round(Number(f.s)||0));
    try{const height=Number(f.ht)||0,threshold=Number(f.shelfThreshold)||1200;
      if(String(f.shelfFormula||'').trim()){
        const raw=String(f.shelfFormula).replace(/\s+/g,'').toUpperCase();
        // Korlátozott, átlátható szabály: H >= küszöb ? szám : szám
        // Egymásba ágyazott szabályok: H>=1800?4:H>=1200?3:2.
        // Nem használunk eval-t; kizárólag H, küszöb és darabszám engedett.
        const calculate=rule=>{
          const match=rule.match(/^H>=([0-9]+)\?([0-9]+):(.+)$/);
          if(match)return height>=Number(match[1])?Number(match[2]):calculate(match[3]);
          if(/^\d+$/.test(rule))return Number(rule);
          throw Error('Érvénytelen polcszabály');

  // A feltétel kizárólag az aktuális bútor W/H/D/T/S/O változóival számolható.
  // Példák: H>=1200, W>600 && D>=400, H<900 || W>1000.
  function customConditionState(f,rule){
    if(!rule.enabled)return {active:false,error:''};
    const condition=String(rule.condition||'').trim();
    if(!condition)return {active:true,error:''};
    try{
      const vars={W:Number(f.w),H:Number(f.ht),D:Number(f.d),T:Number(f.t)||18,
        S:effectiveShelves(f),O:effectiveDivider(f)};
      if(Object.values(vars).some(v=>!Number.isFinite(v)))throw Error('Hibás bútoradat');
      const active=condition.split(/\s*\|\|\s*/).some(group=>
        group.split(/\s*&&\s*/).every(test=>{
          const m=test.match(/^(.+?)\s*(>=|<=|==|!=|>|<)\s*(.+)$/);
          if(!m)throw Error('Használj összehasonlítást, pl. H>=1200');
          const a=calc(m[1],vars),b=calc(m[3],vars);
          switch(m[2]){
            case '>=':return a>=b;
            case '<=':return a<=b;
            case '>':return a>b;
            case '<':return a<b;
            case '==':return a===b;
            case '!=':return a!==b;
          }
          return false;
        }));

    for(const rule of f.customParameters)for(const spec of rule.parts||[])

    // Az eltávolítás/kikapcsolás előtt megőrizzük az esetleg már
    // kézzel átírt alkatrészméreteket a paraméterben is.
    for(const part of f.parts||[]){
      if(!part.customParameterId)continue;
      const def=definitions.get(part.customParameterId+':'+part.customPartId);
      if(def&&!customConditionState(f,def.rule).active)

  // Expression parser: only numbers, W H D T S, + - * / and parentheses are accepted.
  function calc(formula,vars){
    const src=String(formula ?? '').replace(/,/g,'.').replace(/\s+/g,'').toUpperCase();
    const tokens=src.match(/(?:\d+(?:\.\d*)?|\.\d+)|[WHDTSO]|[()+\-*/]/g) || [];
    if (!src || tokens.join('')!==src) throw Error('Érvénytelen képlet');
    let i=0;
    function atom(){
      const t=tokens[i++];
      if(t==='+' || t==='-')return (t==='-'?-1:1)*atom();
      if(t==='('){const v=expr();if(tokens[i++]!==')')throw Error('Hiányzó zárójel');return v;}
      if(t in vars)return vars[t];
      if(t && /^(?:\d|\.)/.test(t))return Number(t);
      throw Error('Hibás képlet');
    }
    function term(){let v=atom();while(tokens[i]==='*'||tokens[i]==='/'){const op=tokens[i++],x=atom();v=op==='*'?v*x:v/x;}return v;}
    function expr(){let v=term();while(tokens[i]==='+'||tokens[i]==='-'){const op=tokens[i++],x=term();v=op==='+'?v+x:v-x;}return v;}
    const value=expr();if(i!==tokens.length || !Number.isFinite(value))throw Error('Hibás képlet');return value;
  }
  // Névképlet: az alkatrész szövegébe írható pl. „Polc {W-2*T} mm”,
  // vagy kizárólag képletként „=W-2*T”. Az eredeti beírt nevet nem
  // írjuk felül, csak a megjelenítésben és a gépi alkatrészlistában
  // használjuk a kiszámított eredményt.
  function resolvedPartName(name,vars,f,part){
    const raw=String(name??'');
    const fmt=value=>String(Math.round(value*10)/10).replace('.',',');
    const evaluate=formula=>f&&part?
      calcPartFormula(formula,vars,f,part,'name'):calc(formula,vars);
    if(raw.trim().startsWith('='))return fmt(evaluate(raw.trim().slice(1)));
    return raw.replace(/\{([^{}]+)\}/g,(_,formula)=>fmt(evaluate(formula)));
  }
  // Más alkatrész KÉSZ méretének név szerinti hivatkozása:
  // "Oldal"x = az Oldal első / szálirányú mérete,
  // "Oldal"y = az Oldal második / keresztirányú mérete.
  // A keresés bútoronként történik. Ismeretlen, duplikált, illetve
  // körkörös hivatkozást hibának tekintünk, soha nem tippelünk méretet.
  function calcPartFormula(formula,vars,f,part,axis='x',visited=[]){
    const key=String(part?.id??part?.name??'névtelen')+':'+axis;
    if(visited.includes(key))throw Error('Körkörös alkatrészméret-hivatkozás');
    const chain=[...visited,key];
    const expression=String(formula??'').replace(/"([^"]+)"\s*([xy])/gi,(_,name,dir)=>{
      const matches=(f?.parts||[]).filter(p=>
        String(p.name||'').trim().toLocaleLowerCase('hu-HU')===
        name.trim().toLocaleLowerCase('hu-HU'));
      if(!matches.length)throw Error('Ismeretlen alkatrésznév: '+name);
      if(matches.length>1)throw Error('Nem egyértelmű alkatrésznév: '+name);
      const referenced=matches[0],refAxis=dir.toLowerCase()==='x'?'a':'b';
      const refT=materialForPart(referenced,f).thickness;
      const refVars={...vars,T:refT};
      const value=calcPartFormula(referenced[refAxis],refVars,f,referenced,
        dir.toLowerCase(),chain);
      return '('+value+')';
    });
    return calc(expression,vars);
  }
  function getParts(){
    let rows=[],errors=[];
    for(const f of state.furnitures){
      const thickness=Number(f.t)||18;
      const vars={W:+f.w,H:+f.ht,D:+f.d,T:thickness,S:effectiveShelves(f),O:effectiveDivider(f)};
      for(const part of f.parts){
        const material=materialForPart(part,f),thickness=material.thickness;
        vars.T=thickness;
        if(!String(part.name||'').trim()||!String(part.a||'').trim()||!String(part.b||'').trim()||!String(part.q||'').trim()){
          rows.push({furniture:f,part,skipped:true,qty:0});
          continue;
        }
        try{
          const originalA=calcPartFormula(part.a,vars,f,part,'x'),
                originalB=calcPartFormula(part.b,vars,f,part,'y'),
                q=calcPartFormula(part.q,vars,f,part,'q'),qty=q*Number(f.qty);
          const resolvedName=resolvedPartName(part.name,vars,f,part);
          const edge=String(part.edge||'0-0').trim().replace(/\s+/g,'');
          const match=edge.match(/^([012])-([012])$/);
          if(!match)throw Error('Az élzárás formátuma 0-0, 1-0, 0-1, 2-0, 0-2 vagy 2-2 lehet');
          const edgeThickness=part.edgeThickness==null||part.edgeThickness===''?2:pnum(part.edgeThickness);
          if(![2,0.4].includes(edgeThickness))throw Error('Csak 2 vagy 0,4 mm-es élzáró választható');
          // A 0,4 mm-es élzárónál marást soha nem számolunk.
          const mill=edgeThickness===2&&!!part.mill;
          const configuredDepth=part.millDepth==null||part.millDepth===''?1:pnum(part.millDepth);
          if(!Number.isFinite(configuredDepth)||configuredDepth<0||configuredDepth>2)throw Error('Az előmarás 0–2 mm között állítható');
          const millDepth=mill?configuredDepth:0;
          const netEdge=edgeThickness-millDepth;
          // X-szálirány menti él(ek) a keresztirányú B méretet csökkentik.
          // Y-keresztirány menti él(ek) a szálirányú A méretet csökkentik.
          // Az állítható előmarás értékét élenként kompenzáljuk.
          const a=originalA-Number(match[2])*netEdge;
          const b=originalB-Number(match[1])*netEdge;
          if(!(a>0&&b>0&&originalA<=10000&&originalB<=10000&&q>=0&&Number.isInteger(q)&&Number.isInteger(qty)&&qty>=0&&qty<=300)) throw Error('Érvénytelen méret/darabszám');
          const canRotate=part.grainRequired===false||(part.grainRequired==null&&!!part.rot);
          rows.push({furniture:f,part,resolvedName,a:Math.round(a*10)/10,b:Math.round(b*10)/10,originalA,originalB,edge,edgeThickness,mill,millDepth,thickness,materialColor:material.color,materialId:part.materialId||'',q,qty,rot:canRotate,grainRequired:!canRotate});
        }catch(e){errors.push(`${f.name} / ${part.name}: ${e.message}`);rows.push({furniture:f,part,error:e.message,qty:0});}
      }
    }
    return {rows,errors,total:rows.reduce((s,r)=>s+r.qty,0),area:rows.reduce((s,r)=>s+(r.a||0)*(r.b||0)*r.qty,0)};
  }

  function steps(){

  function isFormulaText(value){
    const raw=String(value??'').trim();
    return /"[^"]+"\s*[xy]/i.test(raw)||/[WHDTSO()+*/]/i.test(raw)||/\d\s*[-+]\s*\d/.test(raw);
  }
  function partDimensionPreview(part,f,axis){
    const raw=String(part[axis]??'').trim();
    if(!raw)return '–';
    try{
      // A bútor és az alkatrész bevitelénél mindig a KÉSZ MÉRET látszik.
      // A levonás kizárólag getParts() szabásméretét érinti.
      const t=materialForPart(part,f).thickness;
      const finished=calcPartFormula(raw,{W:+f.w,H:+f.ht,D:+f.d,T:t,S:effectiveShelves(f),O:effectiveDivider(f)},f,part,axis);
      if(!Number.isFinite(finished)||finished<=0||finished>10000)throw Error('Érvénytelen készméret');
      return nfmt(finished);
    }catch{return '–';}
  }
  function partDimensionInput(part,f,axis,label){
    const formula=String(part[axis]??'');

    return `<div class="expr-cell ${hasFormula?'has-formula':''}" data-expr-part="${h(part.id)}" data-expr-axis="${axis}"><input class="expr" aria-label="${label}" autocomplete="off" spellcheck="false" data-scope="part" data-id="${part.id}" data-key="${axis}" value="${h(formula)}"><output class="expr-result ${value==='–'?'invalid':''}" aria-label="Kiszámolt készméret milliméterben" title="Kiszámolt készméret · ABS és marás levonása nélkül">${h(value)}</output></div>`;
  }

  function refreshLiveFormulaValues(){
    if(!state.furnitures.length)return;
    for(const wrapper of document.querySelectorAll('[data-expr-part]')){
      const current=state.furnitures.find(f=>(f.parts||[]).some(p=>p.id===wrapper.dataset.exprPart));
      const part=current?.parts.find(p=>p.id===wrapper.dataset.exprPart);
      if(!part)continue;
      const key=wrapper.dataset.exprAxis;
      const active=isFormulaText(part[key]);
      wrapper.classList.toggle('has-formula',active);
      const output=wrapper.querySelector('.expr-result');
      if(output){
        const value=partDimensionPreview(part,current,key);
        output.textContent=value;
        output.classList.toggle('invalid',value==='–');
      }
    }
    const summary=getParts();
    for(const output of document.querySelectorAll('[data-name-preview]')){
      const r=summary.rows.find(row=>row.part?.id===output.dataset.namePreview);
      output.textContent=r?.resolvedName&&r.resolvedName!==r.part.name?r.resolvedName:'';
    }
    const total=document.querySelector('[data-live-part-total]');
    if(total)total.textContent=nfmt(summary.total)+' db';
    const area=document.querySelector('[data-live-part-area]');
    if(area)area.textContent=nfmt(summary.rows.reduce((sum,r)=>sum+(r.originalA||0)*(r.originalB||0)*(r.qty||0),0)/1e6)+' m² kész alkatrészterület · összes bútor';

      '<label>Db <input type="number" min="1" data-scope="remnant" data-id="'+h(r.id)+'" data-key="qty" value="'+h(r.qty||1)+'" style="width:65px"></label>'+

  // Guillotine cutting: every cut spans the entire CURRENT separated rectangle.
  // Free regions never overlap. A cut is recorded when its child regions are made,
  // so its sequence always precedes cuts within those child regions.
  function guillotinePlace(bin,choice,kerf){
    const {freeIndex,part,realW:a,realH:b,turned,axis,xSide,ySide}=choice;
    const original=bin.free[freeIndex],next=[],eps=.0001;
    // Minden új leválasztott darab saját azonosítót kap. A további vágás már
    // csak ezen a résztáblán történhet, nem vághat bele egy másik alkatrészbe.
    function split(region,direction,partSize,keepSide){
      const length=direction==='y'?region.w:region.h;
      if(length-partSize<eps)return {piece:region};
      const before=keepSide==='start'?partSize:length-partSize-kerf;
      const after=length-before-kerf;
      const aRegion={...region,id:'S'+bin.nextSection++};
      const bRegion={...region,id:'S'+bin.nextSection++};
      if(direction==='y'){
        aRegion.w=before;
        bRegion.x=region.x+before+kerf;bRegion.w=after;
      }else{
        aRegion.h=before;
        bRegion.y=region.y+before+kerf;bRegion.h=after;
      }
      const cutCenter=before+kerf/2;
      const pos=(direction==='y'?region.x:region.y)+cutCenter;
      const cut=direction==='y'?
        {x1:pos,y1:region.y,x2:pos,y2:region.y+region.h,length:region.h}:
        {x1:region.x,y1:pos,x2:region.x+region.w,y2:pos,length:region.w};
      bin.cuts.push({...cut,order:bin.cuts.length+1,axis:direction,
        section:region.id,sectionX:region.x,sectionY:region.y,sectionW:region.w,sectionH:region.h,
        offset:cutCenter,fromEdge:before,kerf,partSide:keepSide,
        pieceSize:partSize,beforeSection:aRegion.id,afterSection:bRegion.id,
        beforeSize:before,afterSize:after});
      return keepSide==='start'?{piece:aRegion,rest:bRegion}:{piece:bRegion,rest:aRegion};
    }
    const first=axis==='y'?['y',a,xSide]:['x',b,ySide];
    const second=axis==='y'?['x',b,ySide]:['y',a,xSide];
    const s1=split(original,...first);
    if(s1.rest&&s1.rest.w>eps&&s1.rest.h>eps)next.push(s1.rest);
    const s2=split(s1.piece,...second);
    if(s2.rest&&s2.rest.w>eps&&s2.rest.h>eps)next.push(s2.rest);
    bin.free.splice(freeIndex,1,...next);
    const f=s2.piece;
    if(!bin.materialColor)bin.materialColor=String(part.materialColor||'').trim();
    bin.placements.push({x:f.x,y:f.y,w:a,h:b,part,turned,realW:a,realH:b,section:f.id});
    bin.used+=part.a*part.b;
  }
  const STANDARD_BOARD={a:2800,b:2070,thickness:18};
  const MIN_BOARD_EXTRA=5;
  function createBin(b,index,automatic=false){
    const trim=Math.max(0,Number(state.trim)||0);
    const a=Number(b.a),height=Number(b.b),thickness=Number(b.thickness??18);
    if(!Number.isFinite(a)||!Number.isFinite(height)||!Number.isFinite(thickness)||a<=2*trim||height<=2*trim||thickness<=0)return null;
    return {id:b.id||'standard',index,name:b.name||'Maradék tábla',a,b:height,thickness,automatic,trim,
      materialColor:String(b.materialColor||'').trim(),
      free:[{id:'S1',x:trim,y:trim,w:a-2*trim,h:height-2*trim}],nextSection:2,placements:[],cuts:[],used:0};
  }
  function prepareBins(){
    const bins=[];
    // A bepipált, szabad maradékok ugyanúgy készlettáblák. Az előnézet
    // soha nem fogyasztja el őket.
    const checked=(typeof remnantCatalog==='undefined'?[]:remnantCatalog).filter(r=>
      (state.selectedRemnantIds||[]).includes(r.id)&&Number(r.qty)>0);
    for(const b of [...state.boards,...checked]){
      for(let i=0;i<Math.max(0,Math.min(100,Number(b.qty)||0));i++){
        const bin=createBin(b,i+1);
        if(bin)bins.push(bin);
      }
    }
    return bins;
  }
  function bestPlacement(item,candidates,kerf,firstAxis,variant,corner,upcoming=[]){
    let best=null;
    for(const bin of candidates){
      if(Math.abs(bin.thickness-item.thickness)>.001)continue;
        if(bin.materialColor&&bin.materialColor.toLocaleLowerCase('hu-HU')!==
          String(item.materialColor||'').trim().toLocaleLowerCase('hu-HU'))continue;
      const orientations=[{a:item.a,b:item.b,turned:false}];
      if(item.rot&&item.a!==item.b)orientations.push({a:item.b,b:item.a,turned:true});
      for(const o of orientations){
        // Az anyag TÉNYLEGES külmérete legalább 5 mm-rel nagyobb legyen mindkét irányban.
        if(bin.a+1e-5<o.a+MIN_BOARD_EXTRA||bin.b+1e-5<o.b+MIN_BOARD_EXTRA)continue;
        for(let freeIndex=0;freeIndex<bin.free.length;freeIndex++){
          const free=bin.free[freeIndex];
          const needsX=free.w>o.a+.0001,needsY=free.h>o.b+.0001;
          const w=o.a+(needsX?kerf:0),height=o.b+(needsY?kerf:0);
          if(w>free.w+.0001||height>free.h+.0001)continue;
          // A tábla első vágásának tengelye kötött, a leválasztott részeken
          // viszont a mozaikos keresés X/Y irányban külön is folytatható.
          const axes=!bin.cuts.length||variant===0?[firstAxis]:['x','y'];
          for(const axis of axes){
            const remW=Math.max(0,free.w-w),remH=Math.max(0,free.h-height);
            const fragments=axis==='y'?
              [{w:remW,h:free.h},{w:o.a,h:remH}]:
              [{w:free.w,h:remH},{w:remW,h:o.b}];
            const open=fragments.filter(r=>r.w>.0001&&r.h>.0001);
            const remainderArea=open.reduce((s,r)=>s+r.w*r.h,0);
            let local=(free.w*free.h-o.a*o.b)*.0005+Math.min(remW,remH);
            if(variant===1)local-=Math.max(0,...open.map(r=>r.w*r.h))*.0015;
            if(variant===2){
              let fit=0;
              for(const next of upcoming.slice(0,8)){
                if(Math.abs(next.thickness-bin.thickness)>.001)continue;
                if(bin.materialColor&&bin.materialColor!==next.materialColor)continue;
                if(open.some(r=>(r.w>=next.a&&r.h>=next.b)||
                   (next.rot&&r.w>=next.b&&r.h>=next.a)))fit+=Math.sqrt(next.a*next.b);
              }
              local-=fit*10;
            }
            if(variant===3){
              local+=open.reduce((s,r)=>s+(Math.min(r.w,r.h)<180?r.w*r.h*.002:0),0);
              local+=remainderArea*.0002;
            }
            // Meglévő kisebb maradék előnyben; azonos táblán négy lehetséges sarok.
            const score=bin.a*bin.b*100000+(bin.placements.length?0:10000)+local;
            if(!best||score<best.score)best={bin,score,choice:{
              freeIndex,part:item,turned:o.turned,realW:o.a,realH:o.b,
              axis,xSide:corner.x,ySide:corner.y}};
          }
        }
      }
    }
    return best;
  }
  function makePlan(mode,parts,axis){
    const kerf=Math.max(0,+state.kerf||0);
    const bins=prepareBins(),standardBins=[];
    const corners=[
      {x:'start',y:'start'},{x:'end',y:'start'},
      {x:'start',y:'end'},{x:'end',y:'end'}
    ];
    const corner=corners[Math.floor(mode/24)%4],variant=Math.floor(mode/6)%4;
    const items=[];
    for(const r of parts.rows){
      if(r.error)continue;
      for(let i=0;i<r.qty;i++)items.push({name:r.resolvedName||r.part.name,source:r.furniture.name,
        destination:r.furniture.destination||'',materialColor:r.materialColor||r.furniture.materialColor||'',a:r.a,b:r.b,
        originalA:r.originalA,originalB:r.originalB,edge:r.edge,edgeThickness:r.edgeThickness,mill:r.mill,millDepth:r.millDepth,
        thickness:r.thickness,rot:r.rot,number:i+1,uid:r.part.id});
    }
    const sorters=[(a,b)=>b.a*b.b-a.a*a.b || Math.max(b.a,b.b)-Math.max(a.a,a.b),
      (a,b)=>Math.max(b.a,b.b)-Math.max(a.a,a.b)||b.a*b.b-a.a*a.b,
      (a,b)=>b.a-a.a || b.b-a.b,(a,b)=>b.b-a.b||b.a-a.a,
      (a,b)=>b.a+b.b-a.a-a.b||b.a*b.b-a.a*a.b,
      (a,b)=>Math.abs(b.a-b.b)-Math.abs(a.a-a.b)||b.a*b.b-a.a*a.b];
    items.sort(sorters[mode%sorters.length]);
    const failed=[];
    for(let i=0;i<items.length;i++){
      const item=items[i],upcoming=items.slice(i+1,i+9);
      // Készleten megadott maradékok MINDIG megelőzik a korlátlan alaptáblát.
      let best=bestPlacement(item,bins,kerf,axis,variant,corner,upcoming);
      if(!best)best=bestPlacement(item,standardBins,kerf,axis,variant,corner,upcoming);
      if(!best&&Math.abs(item.thickness-STANDARD_BOARD.thickness)<.001){
        const next=createBin({id:'standard',name:'Alaptábla · automatikus (2800 × 2070 × 18)',...STANDARD_BOARD,
          materialColor:String(item.materialColor||'').trim()},standardBins.length+1,true);
        if(next){
          const candidate=bestPlacement(item,[next],kerf,axis,variant,corner,upcoming);
          if(candidate){standardBins.push(next);best=candidate;}
        }
      }
      if(best)guillotinePlace(best.bin,best.choice,kerf);else failed.push(item);
    }
    const used=[...bins,...standardBins].filter(b=>b.placements.length);
    return {bins:used,failed,items,usedArea:used.reduce((s,b)=>s+b.used,0),sheetArea:used.reduce((s,b)=>s+b.a*b.b,0)};
  }
  // A biztonságos parancslimit fizikai táblánként (nem munkánként) értendő.
  // A vágási sorrendet és a védett xMix/xPrg exportőrt nem változtatjuk.
  const MAX_SAFE_XPRG_COMMANDS=99;
  // A szabászgép kétütemű programja: előbb MINDEN csíkot leválaszt,
  // majd a csíkokat visszakéri, és egyenként hosszra/keresztbe vágja őket.
  // X gépállás: 2070-es oldal a behúzás; Y: 2800-as oldal a behúzás.
  function makeStripPlan(mode,parts,feed){
    const kerf=Math.max(0,Number(state.kerf)||0),eps=.0001;
    // Több gépi keresési stratégia: az eddigi rendezések mellett a már
    // leválasztott széles csíkok szabad hosszának újrafelhasználását is próbáljuk.
    const strategy=Math.floor(mode/6);
    const bins=prepareBins(),standardBins=[],failed=[],items=[];
    for(const r of parts.rows)if(!r.error)for(let i=0;i<r.qty;i++){
      items.push({name:r.resolvedName||r.part.name,source:r.furniture.name,
        destination:r.furniture.destination||'',materialColor:r.materialColor||r.furniture.materialColor||'',a:r.a,b:r.b,
        originalA:r.originalA,originalB:r.originalB,edge:r.edge,
        edgeThickness:r.edgeThickness,mill:r.mill,millDepth:r.millDepth,thickness:r.thickness,
        rot:r.rot,number:i+1,uid:r.part.id});
    }
    // Régi x/y gépállások és új, táblánként értelmezett hosszú/rövid él.
    // auto esetén a gépállás táblánként külön választódik ki,
    // nem egyetlen globális beállítás mindegyik táblára.
    const sortingFeed=['auto','long','short'].includes(feed)?(mode%2?'x':'y'):feed;
    const breadth=(p,axis=sortingFeed)=>axis==='x'?p.b:p.a;
    const along=(p,axis=sortingFeed)=>axis==='x'?p.a:p.b;
    const feedCandidates=bin=>{
      if(bin.machine)return [bin.machine.feed];
      if(feed==='auto')return ['x','y'];
      // Az ütköztetett ÉL hosszát választjuk, NEM a beadott méretet.
      // x = bin.a él a gépnél; y = bin.b él a gépnél.
      if(feed==='long')return [bin.a>=bin.b?'x':'y'];
      if(feed==='short')return [bin.a>=bin.b?'y':'x'];
      return [feed]; // régi mentett projektek x/y beállítása
    };
    const sorters=[
      (a,b)=>breadth(b)-breadth(a)||along(b)-along(a),
      (a,b)=>b.a*b.b-a.a*a.b||breadth(b)-breadth(a),
      (a,b)=>along(b)-along(a)||breadth(b)-breadth(a),
      (a,b)=>Math.max(b.a,b.b)-Math.max(a.a,a.b)||breadth(b)-breadth(a),
      (a,b)=>breadth(b)-breadth(a)||along(a)-along(b),
      (a,b)=>b.a+b.b-a.a-a.b||breadth(b)-breadth(a)
    ];
    items.sort(sorters[mode%sorters.length]);
    const isValidRemainder=value=>value>=-eps&&(value<eps||value+eps>=kerf);
    function bestOn(item,pool){
      let best=null;
      for(const bin of pool){
        if(Math.abs(bin.thickness-item.thickness)>.001)continue;
        if(bin.materialColor&&bin.materialColor.toLocaleLowerCase('hu-HU')!==
          String(item.materialColor||'').trim().toLocaleLowerCase('hu-HU'))continue;
        // A táblát az első alkatrész elhelyezése rögzíti az adott
        // gépállásban; a próbaként vizsgált, de nem használt táblák
        // gépállását nem rögzítjük idő előtt.
        for(const localFeed of feedCandidates(bin)){
        const m=bin.machine||{feed:localFeed,feedUsed:0,strips:[],
          feedSize:(localFeed==='x'?bin.b:bin.a)-2*bin.trim-(bin.trim?kerf/2:0),
          crossSize:(localFeed==='x'?bin.a:bin.b)-2*bin.trim-(bin.trim?kerf/2:0)};
        const orientations=[{a:item.a,b:item.b,turned:false}];
        if(item.rot&&item.a!==item.b)orientations.push({a:item.b,b:item.a,turned:true});
        for(const o of orientations){
          if(bin.a+eps<o.a+MIN_BOARD_EXTRA||bin.b+eps<o.b+MIN_BOARD_EXTRA)continue;
          const bw=breadth(o,localFeed),len=along(o,localFeed);
          if(bw>m.feedSize+eps||len>m.crossSize+eps)continue;
          for(const strip of m.strips){
            const gap=strip.width-bw;
            const addition=(strip.usedLength?kerf:0)+len;
            const left=m.crossSize-strip.usedLength-addition;
            if(gap<-eps||!isValidRemainder(gap)||!isValidRemainder(left))continue;
            // A meglévő xPrg export X, szükség esetén U, majd F
            // parancsot készít alkatrészenként. Megelőzzük a 100. parancsot.
            const extraCommands=2+(gap>0.001&&gap+0.001>=kerf?1:0);
            if((m.commandCount??2)+extraCommands>MAX_SAFE_XPRG_COMMANDS)continue;
            // Egy szélesebb csíkban a darabot utólagos rip vágással
            // kiszabhatjuk; a maradékba NEM kell új teljes hosszú csíkot nyitni.
            // A legjobb tervet minden próbálkozás végén tényleges táblaarea alapján
            // választjuk: egy lokálisan több hulladékot hagyó döntés is spórolhat táblát.
            const ripLoss=gap*len;
            const gapWeight=[.05,.08,.025,.12,.035,.075,.015,.16,.20,.015,.25,.008,.12,.003,.10,.30][strategy]??.05;
            const endWeight=[.005,.002,.008,.001,.012,.006,.002,.003,.02,.0005,.03,.001,.015,.0002,.008,.05][strategy]??.005;
            const score=bin.a*bin.b*1e5+ripLoss*gapWeight+left*endWeight;
            if(!best||score<best.score)best={bin,strip,score,orientation:o,bw,len,machine:m};
          }
          const separator=m.strips.length?kerf:0;
          const remaining=m.feedSize-m.feedUsed-separator-bw;
          const longRemaining=m.crossSize-len;
          if(isValidRemainder(remaining)&&isValidRemainder(longRemaining)&&
             (m.commandCount??2)+4<=MAX_SAFE_XPRG_COMMANDS){
            // Új csík: Y, RX, X, F, plusz a táblánkénti P, RY.
            // Már megkezdett tábla új csíkja előzze meg egy azonos méretű,
            // bontatlan tábla felhasználását.
            // Új csík a tábla teljes keresztméretét lefoglalja. Ennek
            // valós területi költsége legyen nagyobb a meglévő csíkok
            // esetleges utólagos szélességre vágásánál.
            // Változatos súlyokkal keresünk, mert a teljes lapkihasználás
            // a hátralévő alkatrészek alakjától is függ.
            const openStripPenalty=[3000,12000,24000,42000,65000,9500,80000,30000,2000,140000,500,210000,75000,300000,18000,400000][strategy]??3000;
            const firstStripPenalty=[10000,12000,16000,20000,24000,11000,20000,17000,3000,1000,50000,1500,60000,2500,90000,600][strategy]??10000;
            const feedAreaPenalty=(m.strips.length?
              [0,.004,.009,.016,.025,.002,.03,.012,.05,.001,.09,.002,.12,.0002,.06,.15][strategy]:0)*bw*m.crossSize;
            const score=bin.a*bin.b*1e5+
              (m.strips.length?openStripPenalty:firstStripPenalty)+
              feedAreaPenalty+remaining*.01;
            if(!best||score<best.score)best={bin,strip:null,score,orientation:o,bw,len,machine:m};
          }
        }
        } // következő lehetséges gépállás
      }
      return best;
    }
    for(const item of items){
      let choice=bestOn(item,bins);
      if(!choice)choice=bestOn(item,standardBins);
      if(!choice&&Math.abs(item.thickness-STANDARD_BOARD.thickness)<.001){
        const bin=createBin({id:'standard',name:'Alaptábla · automatikus (2800 × 2070 × 18)',...STANDARD_BOARD,
          materialColor:String(item.materialColor||'').trim()},
          standardBins.length+1,true);
        if(bin){
          const fit=bestOn(item,[bin]);

        }
      }
      if(!choice){failed.push(item);continue;}
      const {bin,orientation,bw,len}=choice,m=bin.machine||(bin.machine=choice.machine);
      const addedCommands=choice.strip?
        2+(choice.strip.width-bw>0.001&&choice.strip.width-bw+0.001>=kerf?1:0):4;
      m.commandCount=(m.commandCount??2)+addedCommands;
      if(!bin.materialColor)bin.materialColor=String(item.materialColor||'').trim();
      let strip=choice.strip;
      if(!strip){
        if(m.strips.length)m.feedUsed+=kerf;
        strip={index:m.strips.length+1,width:bw,usedLength:0,items:[]};
        m.strips.push(strip);m.feedUsed+=bw;
      }
      if(strip.usedLength)strip.usedLength+=kerf;
      strip.items.push({item,turned:orientation.turned,realW:orientation.a,
        realH:orientation.b,breadth:bw,along:len});
      strip.usedLength+=len;
    }
    function finalize(bin){
      const m=bin.machine;
      if(!m?.strips.length)return;
      // A két menet táblánként az adott ütköztetési élt használja.
      const boardFeed=m.feed;
      const stripAxis=boardFeed==='x'?'x':'y',crossAxis=boardFeed==='x'?'y':'x';
      const dimension=(rect,axis)=>axis==='y'?rect.w:rect.h;
      // Az első vágás a TELJES tábla beadási mérete - szélezés:
      // pl. Y gépállásban 2800 - 10 = 2790 mm a fűrész középvonala.
      // A gép innen visszafelé halad, a levágott csík pedig kitolható.
      let remaining={id:bin.trim?'R0':'S1',x:0,y:0,w:bin.a,h:bin.b};
      bin.nextSection=bin.trim?1:2;
      function splitAt(parent,axis,before,stage,stripNo,options={}){
        const total=dimension(parent,axis),after=total-before-kerf,pos=before+kerf/2;
        if(before<-eps||after<-eps)throw Error('Túl kicsi vágásrés a gépi csíktervben');
        const first={...parent,id:'S'+bin.nextSection++};
        const second={...parent,id:'S'+bin.nextSection++};
        if(axis==='y'){first.w=before;second.x+=before+kerf;second.w=Math.max(0,after);}
        else{first.h=before;second.y+=before+kerf;second.h=Math.max(0,after);}
        const at=(axis==='y'?parent.x:parent.y)+pos;
        bin.cuts.push({
          axis,x1:axis==='y'?at:parent.x,y1:axis==='x'?at:parent.y,
          x2:axis==='y'?at:parent.x+parent.w,y2:axis==='x'?at:parent.y+parent.h,
          order:bin.cuts.length+1,length:axis==='y'?parent.h:parent.w,
          section:parent.id,sectionX:parent.x,sectionY:parent.y,
          sectionW:parent.w,sectionH:parent.h,offset:pos,fromEdge:before,
          kerf,partSide:options.side||'start',pieceSize:options.size??before,
          beforeSection:first.id,afterSection:second.id,beforeSize:before,afterSize:after,
          kind:options.trim?'trim':'part',edge:options.edge||'',stage,stripIndex:stripNo
        });
        return {start:first,end:second};
      }
      if(bin.trim){
        const fullFeed=dimension(remaining,stripAxis);
        const firstCut=splitAt(remaining,stripAxis,fullFeed-bin.trim-kerf/2,
          'head-trim',0,{trim:true,size:bin.trim,side:'end',edge:'beadási vég'});
        remaining=firstCut.start;
        m.firstCutPosition=fullFeed-bin.trim;
      }
      // 1. menet: az összes csík a tábla végétől visszafelé válik le.
      for(const strip of m.strips){
        const before=dimension(remaining,stripAxis)-strip.width-kerf;
        if(before<eps){
          strip.section=remaining;
          remaining=null;
        }else{
          const s=splitAt(remaining,stripAxis,before,'strip',strip.index,
            {side:'end',size:strip.width});
          strip.section=s.end;
          remaining=s.start;
        }
      }
      // 2. menet: a visszafordított TELJES HOSSZÚ csíkon is először
      // csíkhossz - szélezés pozíciónál vágunk (2070 -> 2060).
      // Onnan visszafelé készülnek a darabok: nem vágjuk le külön a
      // közeli szél hulladékát, így a maradék egyben, nagyobban megmarad.
      for(const strip of m.strips){
        let segment=strip.section;
        if(bin.trim){
          const fullCross=dimension(segment,crossAxis);
          const first=splitAt(segment,crossAxis,fullCross-bin.trim-kerf/2,
            'cross-head-trim',strip.index,{trim:true,size:bin.trim,side:'end',edge:'csíkvég'});
          segment=first.start;
          strip.firstCutPosition=fullCross-bin.trim;
        }
        for(const entry of strip.items){
          const crossRemaining=dimension(segment,crossAxis)-entry.along-kerf;
          let piece;
          if(crossRemaining<-eps){
            piece=segment;segment=null;
          }else{
            const cut=splitAt(segment,crossAxis,Math.max(0,crossRemaining),'cross',strip.index,
              {side:'end',size:entry.along});
            segment=cut.start;piece=cut.end;
          }
          const ripRemaining=dimension(piece,stripAxis)-entry.breadth;
          if(ripRemaining>=kerf-eps&&ripRemaining>eps){
            piece=splitAt(piece,stripAxis,entry.breadth,'rip',strip.index).start;
          }
          const final=piece;
          bin.placements.push({
            x:final.x,y:final.y,w:entry.realW,h:entry.realH,
            realW:entry.realW,realH:entry.realH,part:entry.item,
            turned:entry.turned,section:final.id,stripIndex:strip.index,
            completionStep:bin.cuts.length,finishCutIndex:bin.cuts.length-1
          });
          bin.used+=entry.item.a*entry.item.b;
        }
        strip.leftover=segment?{x:segment.x,y:segment.y,w:segment.w,h:segment.h,
          feedWidth:dimension(segment,stripAxis),length:dimension(segment,crossAxis)}:null;
      }
    }
    const used=[...bins,...standardBins].filter(b=>b.machine?.strips.length);
    used.forEach(finalize);
    return {bins:used,failed,items,usedArea:used.reduce((s,b)=>s+b.used,0),
      sheetArea:used.reduce((s,b)=>s+b.a*b.b,0),machineReady:true,feed};
  }
  // Gyártási sorrend: minden tábla teljes sávozása után csíkok visszaadása.
  // Ellenőrző modell, NEM hitelesített gépi parancssor.
  // MINDEN TÁBLÁHOZ KÜLÖN VÁGÁSI SORREND: 1,2,3...
  // Egy táblán: összes fő sávozás, majd az adott tábla csíkjai
  // visszakérve, előbb a fő darabolás, majd az alábontás.
  // Kizárólag ellenőrző gyártási sorrend, nem hitelesített gépi parancs.
  function buildProductionSequence(bins){
    const events=[],boards=[],round=n=>Math.round(Number(n)*1000)/1000;
    const stages=['cross-head-trim','cross-trim','cross','rip'];
    let totalCuts=0,pairedGroups=0;
    const cutSignature=c=>JSON.stringify([c.stage,c.axis,round(c.offset),
      round(c.pieceSize),round(c.length),round(c.kerf),c.partSide,c.kind]);
    const stripSignature=job=>{
      const {bin,strip,cuts}=job;
      return JSON.stringify([round(bin.thickness),round(bin.trim),round(strip.width),
        round(bin.machine.crossSize),bin.machine.feed,
        [...new Set(strip.items.map(p=>String(p.item.materialColor||'').trim().toLowerCase()))].sort(),
        strip.items.map(p=>[round(p.along),round(p.breadth),p.turned,
          String(p.item.uid||p.item.name||''),String(p.item.edge||''),
          round(p.item.edgeThickness||0),Boolean(p.item.mill),round(p.item.millDepth||0)]),
        cuts.map(cutSignature)]);
    };
    // A gép először a teljes táblát sávozza fel. A visszaadott csík
    // összes vágását az eredeti, a csík végétől a nullpont felé haladó
    // geometriai sorrendben hajtjuk végre; a rajz X-koordinátája szerinti
    // újrarendezés az ellenkező irányt eredményezheti.
    const stagePriority={'cross-head-trim':0,'cross-trim':1,cross:2,rip:3};
    const cutsInNumberOrder=job=>job.cuts.slice().sort((a,b)=>
      (stagePriority[a.stage]??4)-(stagePriority[b.stage]??4)||
      (a.order||0)-(b.order||0));
    for(let boardIndex=0;boardIndex<bins.length;boardIndex++){
      const bin=bins[boardIndex],board=boardIndex+1;
      let order=0,boardPairs=0;
      for(const cut of bin.cuts){
        delete cut.globalOrder;delete cut.boardOrder;delete cut.stackCount;
      }
      if(!bin.machine){
        boards.push({board,cutCount:0,pairedGroups:0});
        continue;
      }
      // 1. Az adott tábla teljes felsávozása: minden csík elkészül.
      for(const cut of bin.cuts.filter(c=>c.stage==='head-trim'||c.stage==='strip')){
        cut.boardOrder=cut.globalOrder=++order;cut.stackCount=1;
        events.push({type:'cut',phase:'savozas',group:'foves',
          order,board,strip:cut.stripIndex,stage:cut.stage,stackCount:1,cut});
      }
      const jobs=bin.machine.strips.map(strip=>({
        bin,board,strip,
        cuts:bin.cuts.filter(c=>stages.includes(c.stage)&&c.stripIndex===strip.index)
      }));
      // 2. Csíkok visszakérése; azonos csíkokat csak EGY táblán belül
      // párosítunk. A következő tábla számozása újra 1-től indul.
      const used=new Set();
      for(let i=0;i<jobs.length;i++){
        if(used.has(i))continue;
        const first=jobs[i],group=[first];used.add(i);
        for(let j=i+1;j<jobs.length;j++){
          if(!used.has(j)&&stripSignature(first)===stripSignature(jobs[j])){
            group.push(jobs[j]);used.add(j);break;
          }
        }
        if(group.length===2){pairedGroups++;boardPairs++;}
        const strips=group.map(g=>({board,index:g.strip.index,
          section:g.strip.section?.id,width:g.strip.width,
          length:g.bin.machine.crossSize,thickness:g.bin.thickness}));
        events.push({type:'refeed',phase:'hosszvagas',board,
          stackCount:group.length,requiresMachineStackVerification:group.length===2,
          strips});
        const groupCuts=group.map(cutsInNumberOrder),ordered=groupCuts[0];
        for(let k=0;k<ordered.length;k++){
          if(ordered[k].stage==='rip'&&(k===0||ordered[k-1].stage!=='rip')){
            events.push({type:'refeed-detail',phase:'hosszvagas',group:'alabontas',
              board,stackCount:group.length,strips,
              note:'A levágott alkatrészek további alábontása; a gépi átadás hitelesítendő.'});
          }
          const cutOrder=++order;
          for(const cuts of groupCuts)if(cuts[k]){
            cuts[k].boardOrder=cuts[k].globalOrder=cutOrder;
            cuts[k].stackCount=group.length;
          }
          events.push({type:'cut',phase:'hosszvagas',board,order:cutOrder,
            group:ordered[k].stage==='rip'?'alabontas':'fo_darabolas',
            stackCount:group.length,stage:ordered[k].stage,strips,
            cuts:groupCuts.map(cuts=>cuts[k])});
        }
      }
      for(const part of bin.placements){
        const cut=bin.cuts[part.finishCutIndex];
        if(cut?.boardOrder)part.completionStep=cut.boardOrder;
      }
      totalCuts+=order;
      boards.push({board,cutCount:order,pairedGroups:boardPairs});
    }
    return {format:'lapterv-production-review-v5',machineExecutable:false,
      numbering:'táblánként 1-től: fő sávozás → fő darabolás → alábontás',
      phases:['savozas','hosszvagas'],maxSuggestedStack:2,
      note:'A két rétegű visszakérés csak ellenőrző javaslat. Az xPrg gépi végrehajtása nem hitelesített.',
      totalCuts,pairedGroups,boards,events};
  }
  function computeNesting(){
    const parts=getParts();
    // MINDEN választható elrendezés ugyanazt a gépen elfogadott
    // teljes szélességű, kétmenetes csíkos szabást alkalmazza.
    // A gépi és anyagtakarékos mód saját keresése változatlan.
    if(Number(state.trim)>0&&Number(state.trim)<Number(state.kerf))
      return {error:'A gépi szélezési ráhagyás nem lehet kisebb a vágásrésnél.'};
    if(parts.errors.length)return {error:'Előbb javítsd a képlethibákat. '+parts.errors[0]};
    if(parts.total>700)return {error:'A program egy tervben legfeljebb 700 alkatrészt kezel. Csökkentsd a darabszámot.'};
    if(!parts.total)return {error:'Nincsenek vágható alkatrészek. Adj meg legalább egy darabot.'};
    let best=null;
    const economyMode=state.layoutMode==='economy';
    const machineMode=true; // a szabad/mozaikos/polcos keresés is gépi csíkterv
    const selectedFeed=state.cutDirection||'auto';
    const axes=machineMode?
      (['long','short','x','y'].includes(selectedFeed)?[selectedFeed]:['auto']):
      (selectedFeed==='x'||selectedFeed==='y'?[selectedFeed]:['x','y']);
    // Gépi csíkos tervnél az eddigi 6 helyett 48 különböző sorrend/
    // újracsíkozási súlyozás közül választunk. Nagy feladatnál 24 próba.
    const effort=economyMode?(parts.total<=150?96:48):
      machineMode?(parts.total<=150?48:24):
      parts.total<=80?96:parts.total<=200?48:24;
    const modes=Array.from({length:effort},(_,i)=>i)
      .filter(i=>state.layoutMode!=='rows'||Math.floor(i/6)%4===0)
      .filter(i=>state.layoutMode!=='mosaic'||Math.floor(i/6)%4!==0);
    for(const axis of axes)for(const mode of modes){
      const trial=machineMode?makeStripPlan(mode,parts,axis):makePlan(mode,parts,axis);
      const cuts=trial.bins.flatMap(b=>b.cuts);
      // Azonos táblaszámnál is a kompaktabb csíkfoglalást részesítjük
      // előnyben: az egyben maradó üres sáv más alkatrészeket is fogadhat.
      const machineStripArea=machineMode?trial.bins.reduce((sum,bin)=>
        sum+(bin.machine?.strips||[]).reduce((area,strip)=>
          area+strip.width*bin.machine.crossSize,0),0):0;
      // A teljes átvágásos, egymás után sávozó megoldásokból a
      // gazdaságos mód a legnagyobb egybefüggő maradékot jutalmazza.
      // Csak keresési heurisztika: nem bizonyított globális optimum.
      const remnants=machineMode?trial.bins.flatMap(bin=>{
        const m=bin.machine;
        if(!m)return [];
        const freeWidth=Math.max(0,m.feedSize-m.feedUsed);
        const freeArea=freeWidth*m.crossSize;
        return [freeArea,...m.strips.map(strip=>
          Math.max(0,m.crossSize-strip.usedLength)*strip.width)]
          .filter(a=>a>=100*100);
      }):[];
      const largestReusable=remnants.length?Math.max(...remnants):0;
      const reuseConcentration=remnants.reduce((sum,area)=>sum+Math.pow(area/1e6,2),0);
      const score=trial.failed.length*1e18+trial.sheetArea*1e5+
        trial.bins.length*1e7+machineStripArea*.025+
        cuts.length*1000+cuts.reduce((s,c)=>s+c.length,0)*.01+
        (economyMode? -largestReusable*.06-reuseConcentration*8000:0);
      if(!best||score<best.score){best={...trial,score,cutAxis:axis,
        layoutDescription:economyMode?'Anyagtakarékos, teljes átvágásos csíkterv':
          state.layoutMode==='machine'?'Gépi csíkos':
          (state.layoutMode==='rows'?'Polcos':state.layoutMode==='mosaic'?'Mozaikos':'Szabad')+
          ' keresés · gépi, kétmenetes csíkterv',
        largestReusableArea:largestReusable};}
    }
    if(machineMode&&best&&!best.error)best.production=buildProductionSequence(best.bins);
    return best;
  }
  const colors=['#dcebdd','#e4ece2','#d8e8de','#e9e8d7','#d8e4ea','#eadfda','#dde6d3','#e9e1ea'];
  function svgBoardSize(bin,compact=false){
    const rotated=(bin.machine?.feed||result?.cutAxis||state.cutDirection)==='y';
    const pad=compact?40:80,top=rotated?(compact?90:140):pad,extra=compact?22:35;
    const boardWidth=rotated?bin.b:bin.a,boardHeight=rotated?bin.a:bin.b;
    return {rotated,pad,top,boardWidth,boardHeight,width:boardWidth+2*pad,height:boardHeight+top+pad+extra};
  }
  function svgBoard(bin,compact=false){
    const size=svgBoardSize(bin,compact),{rotated,boardWidth,boardHeight,width:w,height:hgt}=size;
    const tx=size.pad,ty=size.top;
    // A gépi képernyővel azonos irány: a vizuális rajzot a FÜGGŐLEGES
    // középvonalra tükrözzük, a valós vágási parancsok nem változnak.
    const originalPoint=(x,y)=>rotated?{x:tx+bin.b-y,y:ty+x}:{x:tx+x,y:ty+y};
    const originalRect=(x,y,a,b)=>rotated?{x:tx+bin.b-y-b,y:ty+x,a:b,b:a}:{x:tx+x,y:ty+y,a,b};
    const mirrorX=x=>2*tx+boardWidth-x;

    const rect=(x,y,a,b)=>{const r=originalRect(x,y,a,b);return {...r,x:mirrorX(r.x+r.a)};};
    const labelSize=Math.max(18,Math.min(40,boardWidth/30));
    const lineSize=Math.max(13,Math.min(27,boardWidth/45));

        `M${x+a*.9} ${y+b*.79}h-${Math.min(55,a*.14)} m10 -7l-10 7 10 7`;

      return `<g><title>${h(desc)}</title><rect x="${x}" y="${y}" width="${a}" height="${b}" fill="${colors[i%colors.length]}" stroke="#4b6e5a" stroke-width="2"/><text x="${x+a/2}" y="${y+b/2-(canShow?fsize*.35:0)}" fill="#253c31" font-size="${fsize}" text-anchor="middle" font-weight="700">${h(r.part.name.length>Math.max(10,a/22)?r.part.name.slice(0,Math.max(7,Math.floor(a/22)))+'…':r.part.name)}</text>${canShow?`<text x="${x+a/2}" y="${y+b/2+fsize*1.05}" text-anchor="middle" fill="#3b5f4e" font-size="${Math.min(lineSize,fsize*.82)}">${nfmt(r.part.a)} × ${nfmt(r.part.b)} mm</text><path d="${grainPath}" fill="none" stroke="#779c86" stroke-width="3"/>`:''}</g>`;
    }).join('');
    const cutLines=bin.cuts.map((cut,i)=>{
      const cutNum=bin.machine?(cut.boardOrder||cut.globalOrder||i+1):i+1;
      const start=point(cut.x1,cut.y1),end=point(cut.x2,cut.y2);
      const x=start.x,y=start.y,x2=end.x,y2=end.y,dx=x2-x,dy=y2-y;

  function trimmingSteps(bin){
    const trim=Number(bin.trim)||0,kerf=Math.max(0,Number(state.kerf)||0);
    if(!trim)return [];
    if(trim+1e-6<kerf)return null; // A szélezési ráhagyásnak fedeznie kell a fűrészrést.
    const a=bin.a,b=bin.b,strip=trim-kerf;
    const operations=[
      {axis:'y',section:'R0',sectionX:0,sectionY:0,sectionW:a,sectionH:b,
        offset:trim-kerf/2,beforeSize:strip,afterSize:a-trim,partSide:'start',
        beforeSection:'E1',afterSection:'R1',edge:'bal'},
      {axis:'y',section:'R1',sectionX:trim,sectionY:0,sectionW:a-trim,sectionH:b,
        offset:a-2*trim+kerf/2,beforeSize:a-2*trim,afterSize:strip,partSide:'end',
        beforeSection:'R2',afterSection:'E2',edge:'jobb'},
      {axis:'x',section:'R2',sectionX:trim,sectionY:0,sectionW:a-2*trim,sectionH:b,
        offset:trim-kerf/2,beforeSize:strip,afterSize:b-trim,partSide:'start',
        beforeSection:'E3',afterSection:'R3',edge:'felső'},
      {axis:'x',section:'R3',sectionX:trim,sectionY:trim,sectionW:a-2*trim,sectionH:b-trim,
        offset:b-2*trim+kerf/2,beforeSize:b-2*trim,afterSize:strip,partSide:'end',
        beforeSection:'S1',afterSection:'E4',edge:'alsó'}
    ];
    return operations.map((c,i)=>{
      const position=(c.axis==='y'?c.sectionX:c.sectionY)+c.offset;
      return {...c,kind:'trim',order:i+1,pieceSize:trim,kerf,fromEdge:c.beforeSize,
        x1:c.axis==='y'?position:c.sectionX,
        y1:c.axis==='x'?position:c.sectionY,
        x2:c.axis==='y'?position:c.sectionX+c.sectionW,
        y2:c.axis==='x'?position:c.sectionY+c.sectionH,
        length:c.axis==='y'?c.sectionH:c.sectionW};
    });
  }
  function allCuttingSteps(bin){
    // A gépi tervben a vágások sorrendje már fizikailag ki van dolgozva:
    // végszélezés, csíkok visszafelé, majd csíkonkénti szabás.
    if(bin.machine)return bin.cuts.map((c,i)=>({...c,order:c.boardOrder||c.globalOrder||i+1})).sort((a,b)=>a.order-b.order);
    const trimCuts=trimmingSteps(bin);
    if(trimCuts===null)return null;
    return [...trimCuts,...bin.cuts.map(c=>({...c,kind:'part',order:trimCuts.length+c.order}))];
  }

  function suggestedBoardSize(bin){
    if(!bin?.placements?.length)return null;
    const trim=Math.max(0,Number(bin.trim)||0),kerf=Math.max(0,Number(state.kerf)||0);
    let neededX,neededY;
    if(bin.machine?.strips?.length){
      // A TÉNYLEGES csíktervvel számolunk: csíkszélességek + közöttük a vágásrés,
      // és a leghosszabb csík darabjai + keresztvágások. Így a javasolt tábla
      // az első és a második gépi menetet is elbírja, nem csupán a rajzi határolót.
      const feedUsed=bin.machine.feedUsed;
      const crossUsed=Math.max(...bin.machine.strips.map(s=>s.usedLength));
      const allowance=2*trim+(trim?kerf/2:0)+kerf;
      neededX=bin.machine.feed==='y'?feedUsed+allowance:crossUsed+allowance;
      neededY=bin.machine.feed==='x'?feedUsed+allowance:crossUsed+allowance;
    }else{
      const xs=bin.placements.map(p=>p.x),ys=bin.placements.map(p=>p.y);
      const spanX=Math.max(...bin.placements.map(p=>p.x+p.realW))-Math.min(...xs);
      const spanY=Math.max(...bin.placements.map(p=>p.y+p.realH))-Math.min(...ys);
      neededX=spanX+2*trim+kerf;
      neededY=spanY+2*trim+kerf;
    }
    // Praktikus 10 mm-es méretlépcső; a plusz vágásrés elkerüli a gépben
    // visszamaradó, már le nem vágható néhány mm-es csíkot.
    const a=Math.min(bin.a,Math.ceil((neededX-0.00001)/10)*10);
    const b=Math.min(bin.b,Math.ceil((neededY-0.00001)/10)*10);
    // A kijelzett mennyiség az alkatrészekhez szükséges táblaanyag,
    // NEM a régi tábla után megmaradó felület.
    const originalArea=bin.a*bin.b;
    const neededArea=a*b;
    const netPartArea=bin.used;
    const neededShare=originalArea>0?neededArea/originalArea:0;
    const util=originalArea>0?netPartArea/originalArea:0;
    if(neededShare>.75||util>.60)return null;
    return {a,b,neededArea,netPartArea,neededShare};
  }

  // Offline ZIP-csomagolás a táblánkénti .xPrg és a közös .xMix letöltéséhez.
  function xlsxZip(files,mime='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'){
    const encoder=new TextEncoder(),chunks=[],directory=[];
    let offset=0;
    const crc32=bytes=>{
      let crc=0xFFFFFFFF;
      for(const byte of bytes){
        crc^=byte;
        for(let n=0;n<8;n++)crc=(crc>>>1)^((crc&1)?0xEDB88320:0);
      }
      return (crc^0xFFFFFFFF)>>>0;
    };
    const head=(size,signature)=>{
      const bytes=new Uint8Array(size),view=new DataView(bytes.buffer);
      view.setUint32(0,signature,true);
      return {bytes,view};
    };
    for(const [filename,contents] of files){
      const name=encoder.encode(filename),data=ArrayBuffer.isView(contents)?
        new Uint8Array(contents.buffer,contents.byteOffset,contents.byteLength):encoder.encode(contents),crc=crc32(data);
      const local=head(30+name.length,0x04034B50);
      local.view.setUint16(4,20,true);
      local.view.setUint32(14,crc,true);
      local.view.setUint32(18,data.length,true);
      local.view.setUint32(22,data.length,true);
      local.view.setUint16(26,name.length,true);
      local.bytes.set(name,30);
      chunks.push(local.bytes,data);
      const central=head(46+name.length,0x02014B50);
      central.view.setUint16(4,20,true);
      central.view.setUint16(6,20,true);
      central.view.setUint32(16,crc,true);
      central.view.setUint32(20,data.length,true);
      central.view.setUint32(24,data.length,true);
      central.view.setUint16(28,name.length,true);
      central.view.setUint32(42,offset,true);
      central.bytes.set(name,46);
      directory.push(central.bytes);
      offset+=local.bytes.length+data.length;
    }
    const dirLength=directory.reduce((sum,entry)=>sum+entry.length,0);
    const end=head(22,0x06054B50);
    end.view.setUint16(8,files.length,true);
    end.view.setUint16(10,files.length,true);
    end.view.setUint32(12,dirLength,true);
    end.view.setUint32(16,offset,true);
    return new Blob([...chunks,...directory,end.bytes],{type:mime});
  }
  // Önálló, nagy felbontású PNG alkatrészlista: anyag, célhely, készméret, db, élzárás.
  // Több alkatrészsor esetén lapozott PNG-ket készítünk; nem XLSX-et.
  function buildPartsPngPages(list,doc=document){
    if(list.errors?.length)throw Error('Először javítsd az alkatrészlista hibás méreteit: '+list.errors[0]);
    const rows=list.rows.filter(r=>!r.skipped&&!r.error&&r.qty>0);
    if(!rows.length)throw Error('Nincs exportálható alkatrész. Előbb add meg a méreteket és a darabszámot.');
    const unique=a=>[...new Set(a.map(v=>String(v||'').trim()).filter(Boolean))].join(' / ')||'Nincs megadva';
    const material=unique(rows.map(r=>r.materialColor||r.furniture.materialColor));
    const destination=unique(rows.map(r=>r.furniture.destination));
    const total=rows.reduce((sum,r)=>sum+r.qty,0);
    const format=n=>Number(n).toLocaleString('hu-HU',{maximumFractionDigits:1});
    const pages=[],perPage=100;
    const paintWrapped=(ctx,str,x,y,maxWidth,maxLines=2,lineHeight=26,singleLineShift=0)=>{
      const words=String(str||'').split(/\s+/).filter(Boolean),lines=[];
      let line='';
      for(const word of words){
        const t=line?line+' '+word:word;
        if(ctx.measureText(t).width<=maxWidth||!line){line=t;}
        else{lines.push(line);line=word;}
      }
      if(line)lines.push(line);
      const visibleLines=lines.slice(0,maxLines);
      visibleLines.forEach((text,i)=>{
        while(ctx.measureText(text).width>maxWidth&&text.length>1)
          text=text.slice(0,-2)+'…';
        ctx.fillText(text,x,y+i*lineHeight+(visibleLines.length===1?singleLineShift:0));
      });
    };
    for(let start=0;start<rows.length;start+=perPage){
      const section=rows.slice(start,start+perPage);
      const pageNumber=pages.length+1,pageCount=Math.ceil(rows.length/perPage);
      const width=1600,pad=60,head=350,rowHeight=70,foot=100;
      const canvas=doc.createElement('canvas');
      canvas.width=width;canvas.height=head+section.length*rowHeight+foot;
      const ctx=canvas.getContext('2d');
      if(!ctx)throw Error('A PNG rajzolás nem támogatott ebben a környezetben.');
      ctx.fillStyle='#ffffff';ctx.fillRect(0,0,width,canvas.height);
      ctx.fillStyle='#17392f';ctx.fillRect(0,0,width,172);
      ctx.fillStyle='#dcece4';ctx.font='700 22px "Segoe UI",Arial,sans-serif';
      ctx.fillText('GATTERKA  /  SZABÁSZTERVEZŐ',pad,50);
      ctx.fillStyle='#ffffff';ctx.font='700 49px "Segoe UI",Arial,sans-serif';
      ctx.fillText('ALKATRÉSZLISTA',pad,120);
      ctx.fillStyle='#587269';ctx.font='700 21px "Segoe UI",Arial,sans-serif';
      ctx.fillText('ANYAG',pad,205);ctx.fillText('HOVÁ KÉSZÜL',pad,280);
      ctx.fillStyle='#203e32';ctx.font='600 29px "Segoe UI",Arial,sans-serif';
      paintWrapped(ctx,material,230,204,1250,2,32);
      paintWrapped(ctx,destination,280,279,1200,2,32);
      ctx.fillStyle='#e8efeb';ctx.fillRect(pad,head-52,width-pad*2,50);
      const columns=[pad+14,pad+675,pad+1050,pad+1185];
      ctx.fillStyle='#244d3e';ctx.font='700 23px "Segoe UI",Arial,sans-serif';
      ['Alkatrész neve','Készméret (mm)','Darab','Élzárás'].forEach((label,i)=>
        ctx.fillText(label,columns[i],head-17));
      section.forEach((r,i)=>{
        const y=head+i*rowHeight;
        if(i%2===0){ctx.fillStyle='#f3f7f3';ctx.fillRect(pad,y,width-pad*2,rowHeight);}
        ctx.fillStyle='#e4eae6';ctx.fillRect(pad,y+rowHeight-1,width-pad*2,1);
        ctx.font='600 25px "Segoe UI",Arial,sans-serif';ctx.fillStyle='#213e32';
        paintWrapped(ctx,r.part.name,columns[0],y+32,630,2,27,10);
        ctx.font='600 25px "Segoe UI",Arial,sans-serif';
        ctx.fillText(format(r.originalA)+' × '+format(r.originalB),columns[1],y+42);
        ctx.fillText(String(r.qty),columns[2],y+42);
        ctx.font='21px "Segoe UI",Arial,sans-serif';
        const edge=r.edge==='0-0'?'Nincs élzárás':
          r.edge+' · '+format(r.edgeThickness)+' mm'+(r.mill?' · '+format(r.millDepth)+' mm előmarás':'');
        // Az X1/X2/Y1/Y2 azonosítók megmaradnak az alkatrész adataiban, de nem kerülnek a PNG-re.
        ctx.fillText(edge,columns[3],y+42);
      });
      const fy=head+section.length*rowHeight+50;
      ctx.fillStyle='#17392f';ctx.font='700 24px "Segoe UI",Arial,sans-serif';
      ctx.fillText('Összesen: '+total+' db',pad,fy);
      ctx.fillStyle='#567266';ctx.font='21px "Segoe UI",Arial,sans-serif';
      ctx.fillText('Készméretek · X szálirány / Y keresztirány',pad+325,fy);
      ctx.fillText(pageNumber+' / '+pageCount+'. oldal',width-230,fy);
      pages.push(canvas);
    }
    return pages;
  }
