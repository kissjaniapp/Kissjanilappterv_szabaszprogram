      showNotice('Az alkatrészlista PNG mentése sikertelen: '+(err?.message||'ismeretlen hiba'));
    }
  }
  function selectedBin(){return result && !result.error?result.bins[state.selectedBoard]:null;}
  function fileName(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'_').slice(0,70);}
  function cutExportData(bin){
    const cuts=allCuttingSteps(bin),machine=bin.machine;
    const strips=machine?.strips.map(s=>({
      index:s.index,section:s.section.id,feedWidth:s.width,
      longLength:machine.feed==='x'?bin.a:bin.b,
      firstCrossTrimPosition:s.firstCutPosition??null,
      reusableRemainder:s.leftover,partNames:s.items.map(p=>p.item.name),
      crosscuts:s.items.map(p=>p.along),
      crossSawPositions:cuts.filter(c=>c.stripIndex===s.index&&c.stage==='cross')
        .map(c=>c.axis==='y'?c.x1:c.y1)
    }))||[];
    const machineEvents=machine&&cuts?[
      ...cuts.filter(c=>c.stage==='head-trim'||c.stage==='strip').map(c=>({type:'cut',...c})),
      ...machine.strips.flatMap(s=>[
        {type:'refeed',stripIndex:s.index,section:s.section.id,
          feedWidth:s.width,feedAxis:'x',length:machine.crossSize},
        ...cuts.filter(c=>c.stage!=='strip'&&c.stage!=='head-trim'&&c.stripIndex===s.index)
          .map(c=>({type:'cut',...c}))
      ])
    ]:null;
    return {
      kind:'Gatterka guillotine cutting instructions — pre-machine review',
      project:getFurniture()?.name||state.projectName,
      board:{name:bin.name,index:state.selectedBoard+1,x:bin.a,y:bin.b,thickness:bin.thickness,trim:bin.trim},
      kerf:Number(state.kerf),
      reference:machine?
        'All millimetres. First saw centre: full board feed length minus edge trim. Strip cuts retreat toward the origin. After refeed each detached strip, saw its far end at strip length minus trim and crosscut parts backwards; leave the near-side remainder intact. X along grain, Y across grain. Offsets are blade centres on each section.':
        'All millimetres; X along grain, Y across grain. Steps first trim edges (R0–R3), then cut parts from S1. Offsets measure blade centre from each section top/left edge.',
      cuts,
      machine:machine?{readyForReview:true,stockFeedAxis:machine.feed,
        initialFeedDimension:machine.feed==='x'?bin.b:bin.a,
        initialCutPosition:machine.firstCutPosition??null,
        initialCrossDimension:machine.feed==='x'?bin.a:bin.b,
        trimmedStripLength:machine.crossSize,strips,events:machineEvents}:null,
      finishedParts:bin.placements.map(p=>({
        section:p.section,name:p.part.name,furniture:p.part.source,number:p.part.number,
        cutX:p.realW,cutY:p.realH,finishedX:p.part.originalA,finishedY:p.part.originalB,
        edge:p.part.edge,edgeThickness:p.part.edgeThickness,edgeThicknesses:p.part.edgeThicknesses||null,milling:p.part.mill,millingDepth:p.part.millDepth??0,
        rotated:p.turned,thickness:bin.thickness
      }))
    };
  }
  function downloadMachineReview(){
    if(!result || result.error || result.failed.length || state.layoutMode!=='machine'){
      showNotice('A gépi előkészítéshez hibátlan, teljes gépi csíkos nesting szükséges.');return;
    }
    const files=[],all=[];
    for(let i=0;i<result.bins.length;i++){
      const bin=result.bins[i];
      if(!bin.machine){showNotice('Az egyik táblához nem készült gépi csíkterv.');return;}
      const plan=cutExportData(bin);
      if(!plan.cuts || !Array.isArray(plan.machine?.events) || !plan.machine.events.length){
        showNotice('Nem teljes az egyik tábla vágási leírása.');return;
      }
      // Az aktuális tábla indexe külön szerepel az összesített tervben.
      plan.board.index=i+1;
      const base='tabla_'+String(i+1).padStart(2,'0');
      files.push([base+'_ellenorzo_vagasok.json',JSON.stringify(plan,null,2)]);
      all.push({file:base+'_ellenorzo_vagasok.json',board:plan.board,cuts:plan.cuts.length,parts:plan.finishedParts.length});
    }
    const manifest={format:'lapterv-machine-review-v1',machineExecutable:false,
      note:'NEM xMix és NEM xPrg. Gépbe betölteni tilos. A vágások értelmezését az eredeti xPrg fájlokkal még igazolni kell.',
      project:String(getFurniture()?.name||state.projectName||'Gatterka'),boards:all,
      settings:{kerfMm:Number(state.kerf),trimMm:Number(state.trim),cutDirection:state.cutDirection,layoutMode:state.layoutMode}};
    if(result.production){
      files.push(['gyartasi_sorrend_ellenorzes.json',JSON.stringify(result.production,null,2)]);
      manifest.productionSchedule='gyartasi_sorrend_ellenorzes.json';
      manifest.pairedStripGroups=result.production.pairedGroups;
    }
    files.unshift(['manifest.json',JSON.stringify(manifest,null,2)]);
    files.push(['OLVASSEL.txt','GATTERKA - GÉPI ELŐKÉSZÍTŐ CSOMAG\r\n\r\nEz NEM végrehajtható gépi program.\r\nNem tartalmaz xMix vagy xPrg fájlokat.\r\nA *.json állományokat kizárólag ellenőrzésre és a későbbi hiteles gépi export fejlesztéséhez használd.\r\nÉles gépi futtatás előtt igazolni kell a gép valódi xPrg parancsformátumát.\r\n']);
    downloadBlob(xlsxZip(files,'application/zip'),(fileName(manifest.project)||'lapterv')+'_gepi_elokeszites_NEM_gepi_program.zip');
  }
  // Kísérleti XML-állományok az eredeti XPrg/XMix minták megfigyelt alakjában.
  // Csak OFFLINE szimulációhoz: a gép által végrehajtott sorrend NEM igazolt!
  // Egy projekt = egy .xMix + táblánként egy .xPrg ugyanabban a ZIP-ben.
  // A formátumot csak a kapott minták támasztják alá, a gépi futtatás NINCS igazolva.
  function buildOfflineXprgProject(bins,project,materialCode,kerf,date,xprgFolder='.\\xPrg\\',headerMode='color',destination='',cabinetOverride=''){
    if(!Array.isArray(bins)||!bins.length)throw Error('Nincsenek táblák a gépi csomaghoz.');
    const esc=t=>String(t??'').replace(/[&<>"']/g,
      c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
    const num=n=>{
      if(!Number.isFinite(Number(n)))throw Error('Hibás méret az .xPrg adatban.');
      return Number(n).toFixed(2);
    };
    // A gépi anyagkód és a fejléc kizárólag a bútor elején megadott
    // anyagszínből származik. A régi projektmezők már nem módosítják.
    if(!Number.isFinite(Number(kerf))||Number(kerf)<0)
      throw Error('Hibás fűrészrés.');

    // A működő WinCut xMix XML relatív .\xPrg\ mappára mutat.
    // Megadható abszolút meghajtóútvonal vagy UNC megosztás is. Utóbbi
    // csak XML hivatkozás; a böngésző nem másolhat automatikusan a gépre.
    const parseXprgDirectory=(input)=>{
      const raw=String(input??'.\\xPrg\\').trim().replace(/\//g,'\\');
      if(!raw||raw.length>260||/[\x00-\x1f<>"|?*]/.test(raw))
        throw Error('Hibás XPrg mappaútvonal. Példa: .\\xPrg\\ vagy C:\\WinCut\\Prg\\');
      const relative=raw.startsWith('.\\');
      const drive=/^[A-Za-z]:\\/.test(raw);
      const unc=/^\\\\[^\\]+\\[^\\]+(?:\\|$)/.test(raw);
      if(!relative&&!drive&&!unc)
        throw Error('Az XPrg mappa relatív (.\\) vagy teljes Windows-útvonal legyen.');
      const pieces=raw.split('\\').filter(Boolean);
      const segments=relative?pieces.slice(1):drive?pieces.slice(1):pieces.slice(2);
      if(segments.some(segment=>segment==='.'||segment==='..'||segment.endsWith(' ')||
          segment.endsWith('.')||segment.includes(':')||/[^\S ]/.test(segment)))
        throw Error('Érvénytelen XPrg mappanév: pontpont (..) vagy tiltott karakter.');
      if(segments.some(segment=>/\.xprg$/i.test(segment)))
        throw Error('Itt mappát adj meg, ne egyetlen .xPrg fájlt.');
      const normalized=relative?'.\\'+(segments.length?segments.join('\\')+'\\':''):
        drive?pieces[0]+'\\'+(segments.length?segments.join('\\')+'\\':''):
        '\\\\'+pieces.slice(0,2).join('\\')+'\\'+(segments.length?segments.join('\\')+'\\':'');
      return {directory:normalized,relative,archiveSubdir:relative?segments.join('/'):'xPrg'};
    };
    const xprgLocation=parseXprgDirectory(xprgFolder);
    // WinCut fájlnevek: mai dátum + szekrény neve + tábla neve + egyedi táblasorszám.
    // Az eredeti date argumentum NN/HH/ÉÉÉÉ; az állománynév ÉÉÉÉ_HH_NN.
    const dateMatch=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(date));
    if(!dateMatch)throw Error('Érvénytelen exportdátum (NN/HH/ÉÉÉÉ).');
    const dateStamp=dateMatch[3]+'_'+dateMatch[2]+'_'+dateMatch[1];
    const safePart=(value,fallback,maxLength=40)=>{
      const cleaned=(fileName(String(value||''))||'').replace(/^_+|_+$/g,'').slice(0,maxLength);
      return cleaned||fallback;
    };
    const defaultCabinet=dateStamp+'_'+safePart(destination||project,'Butor',42);
    if(cabinetOverride&&(!/^[A-Za-z0-9_-]{1,90}$/.test(cabinetOverride)||
        !cabinetOverride.startsWith(defaultCabinet+'_')))
      throw Error('Érvénytelen egyedi gépi projektmappanév.');
    const cabinet=cabinetOverride||defaultCabinet;
    const root=dateStamp+'_'+safePart(project,'Szekreny',42);
    const names=[],files=[],summary=[],materials=[];
    bins.forEach((bin,i)=>{
      const m=bin.machine;
      if(!m?.strips?.length)throw Error((i+1)+'. tábla: nincs gépi csíkterv.');
      // KÖTELEZŐ GÉPI SZABÁLY: csak vízszintesen vágunk.
      // A P és Lunghezza a géphez vízszintesen felfekvő TELJES táblaél.
      // x gépállás: a (szálirányú) él vízszintes; y gépállás: b
      // (keresztirányú) él vízszintes, a táblát 90°-kal fordítjuk.
      // Az a mindig a szálirányú, b a keresztirányú méret, függetlenül
      // attól, melyik a hosszabb. A csíkterv és az XML vágássorrend FIX.
      if(m.feed!=='x'&&m.feed!=='y')
        throw Error((i+1)+'. tábla: ismeretlen gépi beadási irány.');
      // 38 mm-es munkalap: a jóváhagyott FORDÍTOTT KÉTMENETES próba.
      // Első menet: P=teljes vágáshossz (600/900 vagy egyedi bin.b),
      // RY=első maradékvágás, azután MINDEN rövidél / Y=darabhossz.
      // Második menet: a már levágott darabok 90°-os visszakérése,
      // darabonként RX=0, X=teljes szélesség, ha kell U=kész szélesség,
      // végül F. Teljes kész szélességnél NINCS U: egy X és F.
      // KÍSÉRLETI: WinCut elfogadását, Swap=1 jelentését, RX=0 és
      // a tábla szélére eső X vágás értelmezését ellenőrizni kell.
      // A gép által elfogadott 18 mm-es bútorlap XML továbbra is FIX.
      const worktop=Math.abs(Number(bin.thickness)-38)<.001;
      if(worktop&&bin.cuts.some(c=>c.stage==='strip'))
        throw Error((i+1)+'. tábla: a munkalap első menetéhez csak teljes szélességű keresztvágás engedett.');
      const feedLength=worktop?bin.b:(m.feed==='x'?bin.a:bin.b);
      const headerLength=feedLength;
      const headerWidth=worktop?bin.a:(m.feed==='x'?bin.b:bin.a);
      if(worktop&&(m.feed!=='x'||bin.cuts.some(c=>
           (c.stage==='cross'||c.stage==='cross-head-trim')&&c.length>0&&
           Math.abs(c.length-feedLength)>.001)))
        throw Error((i+1)+'. tábla: a munkalap keresztvágása nem a teljes táblaszélességen fut.');
      // A fejléc leírása az adott táblán elhelyezett alkatrészek anyagszíne,
      // NEM a készlettábla neve és NEM a gépi anyagkód.
      // Különböző anyagokat nem szabad egyetlen gépi táblaként megjelölni.
      const materialColors=[...new Set(m.strips.flatMap(strip=>
        (strip.items||[]).map(entry=>String(entry.item?.materialColor||'').trim())
      ).filter(Boolean))];
      if(materialColors.length>1)
        throw Error((i+1)+'. tábla: több eltérő anyagszín ('+
          materialColors.join(', ')+'). Egy .xPrg fejlécéhez egyetlen anyagszín szükséges.');
      const materialDescription=materialColors[0]||'';
      if(!materialDescription)
        throw Error((i+1)+'. tábla: az anyagszín hiányzik. A bútor adatainál add meg.');
      const headerDescription=materialDescription;
      if(!materials.includes(materialDescription))materials.push(materialDescription);
      const boardName=safePart(bin.name,'Tabla',30);
      const file=root+'_'+boardName+'_tabla_'+String(i+1).padStart(2,'0')+'.xPrg';
      names.push(file);
      // A kapott SCM xPrg minta pontos gyökere és fejlécszerkezete:
      // SchemaDoc > Header, Material, Pattern > Cut.
      // Az U a darabon belüli másodlagos szélességi levágás mintája.
      // Az U/F gépi sorrendje még nincs valós gépi vágással hitelesítve!
      const complex=m.strips.some(strip=>(strip.items||[]).some(p=>
        strip.width-Number(p.breadth) >= Math.max(kerf-.001,.001)));
      const cuts=[];
      const add=(type,val)=>{
        const value=Number(val);
        if(!Number.isFinite(value)||value<0)
          throw Error((i+1)+'. tábla: hibás '+type+' méret a gépi exportban.');
        cuts.push('\t\t<Cut T="'+type+'" Dim="'+num(value)+
          '" Rip="1" ID="'+cuts.length+'" />');
      };
      if(worktop){
        // A JÓVÁHAGYOTT GÉPI SZIMULÁCIÓ SORRENDJE:
        // P → RY → (az összes Y), MAJD a visszakért 964 mm-es
        // részeken egyenként RX → X → (szükség szerint U) → F.
        // A fizikai bin.cuts helyét és sorrendjét nem számoljuk át.
        const strip=m.strips[0];
        if(m.feed!=='x'||m.strips.length!==1||
           Math.abs(Number(strip.width)-Number(bin.b))>.001||
           (strip.items||[]).some(p=>!Number.isFinite(Number(p.breadth))||
              Number(p.breadth)<=0||Number(p.breadth)>bin.b+.001))
          throw Error((i+1)+'. tábla: a munkalap első menete egy teljes szélességű sor.');
        const physical=(bin.cuts||[]).slice().sort((a,b)=>a.order-b.order);
        if(!physical.length||
           physical.some(c=>!['cross-head-trim','cross','rip'].includes(c.stage)||
             (c.stage==='rip'?c.axis!=='x':
               c.axis!=='y'||Math.abs(Number(c.length)-bin.b)>.001))||
           physical[0].stage!=='cross-head-trim')
          throw Error((i+1)+'. tábla: a munkalap XPRG fizikai vágásai eltérnek a szabástérképtől.');
        const firstDistance=bin.a-Number(physical[0].x1);
        if(!Number.isFinite(firstDistance)||firstDistance<0||firstDistance>bin.a)
          throw Error((i+1)+'. tábla: hibás az első maradékleválasztás helye.');
        const realCross=physical.filter(c=>c.stage==='cross');
        if(realCross.length!==(strip.items||[]).length||
           realCross.some((c,k)=>Math.abs(Number(c.pieceSize)-
             Number(strip.items[k].along))>.001))
          throw Error((i+1)+'. tábla: a munkalap kész hosszvágásai nem egyeznek a fizikai tervvel.');
        add('P',feedLength);
        add('RY',firstDistance);
        // 1. MENET: minden 600/900 mm hosszúságú keresztvágás,
        // AZ ÖSSZES kész 964-es rész elválasztása a forgatás ELŐTT.
        for(const cut of realCross)add('Y',cut.pieceSize);
        // 2. MENET: csak ezután kérjük vissza a leválasztott részeket.
        for(const part of strip.items||[]){
          const partWidth=Number(part.breadth);
          const left=strip.width-partWidth;
          if(!Number.isFinite(partWidth)||partWidth<=0||
             left<-.001||(left>.001&&left+.001<kerf))
            throw Error((i+1)+'. tábla: hibás visszakért munkalap-szélesség.');
          add('RX',0); // 0 mm – kísérleti szélező / beállító parancs.
          add('X',strip.width); // egyetlen szélességi készrevágás.
          if(left>.001){
            if(!physical.some(c=>c.stage==='rip'&&c.stripIndex===strip.index))
              throw Error((i+1)+'. tábla: hiányzik a keskenyebb munkalap U keresztvágása.');
            add('U',partWidth);
          }
          add('F',0);
        }

      }else{
        // A bútorlap teljes, kétmenetes P/RY/Y/RX/X/U/F exportja
        // szándékosan, byte-ról byte-ra változatlan marad.
        add('P',feedLength);
        add('RY',m.firstTrimDistance??bin.trim);
        for(const strip of m.strips){
          if(!Number.isFinite(strip.width)||strip.width<=0)
            throw Error((i+1)+'. tábla: hibás csíkszélesség.');
          add('Y',strip.width);
          // A 90°-kal visszaadott csík első, alsó vágásának pozíciója.
          add('RX',strip.firstTrimDistance??bin.trim);
          for(const part of strip.items||[]){
            if(!Number.isFinite(part.along)||part.along<=0||
               !Number.isFinite(part.breadth)||part.breadth<=0||
               part.breadth>strip.width+.001)
              throw Error((i+1)+'. tábla: a darab nem fér el a gépi csíkban.');
            add('X',part.along);
            const remainder=strip.width-part.breadth;
            if(remainder>0.001&&remainder+0.001>=kerf)
              add('U',part.breadth);
            else if(remainder>0.001&&remainder+0.001<kerf)
              throw Error((i+1)+'. tábla: az U alábontás maradéka kisebb a fűrészrésnél.');
            add('F',0);
          }
        }
      }
      // A SCM Maestro Cut egyes változatai legfeljebb 99 vágási
      // parancsot fogadnak; az ismert _REP folytatás pontos viselkedése
      // nincs igazolva, ezért túl hosszú programot nem exportálunk.
      if(cuts.length>99)
        throw Error((i+1)+'. tábla: '+cuts.length+
          ' gépi parancs szükséges (99 a biztonságosan alkalmazott korlát). '+
          'A programot kisebb mintákra kell bontani, _REP parancsokat nem találunk ki.');
      const xml='<SchemaDoc>\r\n'+
        '\t<Header NumFogliPacco="1.00" Descrizione="'+esc(headerDescription)+
        '" Spessore="'+num(bin.thickness)+'" Date="'+esc(date)+
        '" Lunghezza="'+num(headerLength)+'" Larghezza="'+num(headerWidth)+
        '" SpessoreLama="'+num(kerf)+'" Swap="'+(worktop?'1':'0')+'" />\r\n'+
        '\t<Material Tipologia="" Codice="'+esc(materialDescription)+'" />\r\n'+
        '\t<Pattern>\r\n'+cuts.join('\r\n')+
        '\r\n\t</Pattern>\r\n</SchemaDoc>\r\n';
      // A Mix és minden XPrg ugyanabban a bútornév szerinti mappában lesz.
      files.push([cabinet+'/'+(xprgLocation.archiveSubdir?xprgLocation.archiveSubdir+'/':'')+file,xml]);
      summary.push({tabla:i+1,file,anyag:bin.name,meret:[bin.a,bin.b,bin.thickness],
        stripCount:m.strips.length,complex,commandCount:cuts.length,executable:false});
    });
    // A gépen működő XML-es xMix minta: Header, Materials, RigheMix.
    // A Relatív .\xPrg\ hivatkozás mellé ugyanilyen ZIP-almappát készítünk.
    // FIX anyagbeadási sorrend az XMix-ben: valamennyi bútorlap ELŐSZÖR,
    // az összes 38 mm-es munkalap UTOLJÁRA. Az eredeti sorrend
    // mindkét csoporton belül változatlan, az .xPrg fájlok tartalma,
    // neve és a mentés sorrendje továbbra is érintetlen.
    const xmixOrderedNames=names.map((file,index)=>({
      file,index,worktop:Math.abs(Number(bins[index].thickness)-38)<.001
    })).sort((a,b)=>Number(a.worktop)-Number(b.worktop)||a.index-b.index)
      .map(item=>item.file);
    const mix='<xMix>\r\n'+
      '\t<Header Descrizione="'+esc(project)+'" Import="" Date="'+esc(date)+'" />\r\n'+
      '\t<Materials>\r\n'+
      materials.map(color=>'\t\t<Material Tipologia="'+esc(color)+
        '" Codice="'+esc(color)+'" Quantita="999" />').join('\r\n')+
      '\r\n\t</Materials>\r\n'+
      '\t<RigheMix>\r\n'+
      xmixOrderedNames.map(file=>'\t\t<RigaMix File="'+esc(xprgLocation.directory+file)+
        '" Rep="1" Pacco="1" CambioMateriale="0" />').join('\r\n')+
      '\r\n\t</RigheMix>\r\n</xMix>\r\n';
    const mixName=root+'_'+bins.length+'_tablas.xMix';
    files.unshift([cabinet+'/'+mixName,mix]);
    return {files,mixName,names,cabinetFolder:cabinet,
      xprgDirectory:xprgLocation.directory,relativeXprgDirectory:xprgLocation.relative,
      archiveSubdir:xprgLocation.archiveSubdir,materials,
      complexBoards:summary.filter(x=>x.complex).length};
  }

  async function requestNativeMachine(action,payload){
    if(!nativeBridge)
      throw Error('Ehhez a Gatterka telepített Windowsos alkalmazása szükséges.');
    let response;
    try{
      response=await fetch(nativeBridge.url+'/native/'+action,{
        method:'POST',
        headers:{'Content-Type':'application/json','X-Gatterka-Token':nativeBridge.token},
        body:JSON.stringify(payload),
        mode:'cors',
        cache:'no-store'
      });
    }catch(err){
      throw Error('Nem érhető el a Windowsos mappamentő. Zárd be teljesen a Gatterkát (minden ablakát), majd indítsd újra a Start menüből vagy az asztali ikonról. Ha így is marad, ellenőrizd, hogy a legújabb telepítőt futtattad-e. ('+(err?.message||'kapcsolati hiba')+')');
    }
    let value;
    try{value=await response.json();}
    catch{throw Error('A Windowsos mappamentő érvénytelen választ adott.');}
    if(!response.ok)throw Error(value?.error||('Windows mentési hiba: '+response.status));
    return value;
  }
  // A Chromium showDirectoryPicker nem ad abszolút Windows-útvonalat.
  // Az elérési utat ezért a felhasználó egyszer megadja, és elmentjük.
  function machineRootPath(){
    const raw=String(state.xmixMachineRoot??defaultXmixMachineRoot).trim().replace(/\//g,'\\');
    const root=raw.replace(/\\+$/,'');
    const drive=/^[A-Za-z]:\\/.test(root);
    const unc=/^\\\\[^\\]+\\[^\\]+(?:\\|$)/.test(root);
    if((!drive&&!unc)||root.length>210||/[\x00-\x1f<>"|?*]/.test(root)||
      /(?:^|\\)\.\.?(?:\\|$)/.test(root)||
      root.split('\\').filter(Boolean).some(p=>p.endsWith(' ')||p.endsWith('.')||
        (p.includes(':')&&!/^[A-Za-z]:$/.test(p))))
      throw Error('Hibás teljes Windows-útvonal. Példa: X:\\JANI\\szabas_programmal\\Legujabb_mentessel');
    return root;
  }
  function machineExportBundle(options={}){
    // Mindhárom látható elrendezés UGYANAZT a rögzített kétmenetes
    // csíkos gépi tervet adja. A régi elnevezésekre szűrni tilos.
    if(!result||result.error||!result.machineReady||!result.bins?.length)
      throw Error('Előbb készíts hibamentes, teljes, gépi csíkos szabástervet.');
    if(result.failed?.length)
      throw Error('Van ki nem táblásított alkatrész. Előbb javítsd a szabástervet.');
    const now=new Date();
    const date=String(now.getDate()).padStart(2,'0')+'/'+
      String(now.getMonth()+1).padStart(2,'0')+'/'+now.getFullYear();
    const f=getFurniture();
    const project=String(f?.name||state.projectName||'Gatterka').trim()||'Gatterka';
    const destination=String(f?.destination||state.furnitures.find(x=>x.destination)?.destination||project).trim();
    const color=String(f?.materialColor||'').trim();
    if(!color)throw Error('Az anyag színét a Bútor adatai oldalon add meg.');
    const preview=buildOfflineXprgProject(result.bins,project,color,Number(state.kerf),
      date,'.\\xPrg\\','color',destination);
    if(options.relative)return preview;
    const cabinet=String(options.cabinetFolder||preview.cabinetFolder);
    const directory=machineRootPath()+'\\'+cabinet+'\\xPrg\\';
    return buildOfflineXprgProject(result.bins,project,color,Number(state.kerf),
      date,directory,'color',destination,
      cabinet===preview.cabinetFolder?'':cabinet);
  }

  async function saveXprgToSelectedFolder(){
    const button=document.querySelector('[data-action="save-xprg-folder"]');
    const status=document.getElementById('machine-save-status');
    const report=(message,error=false)=>{
      if(status){
        status.textContent=message;
        status.style.color=error?'#e78b74':'';
      }else showNotice(message);
    };
    if(!nativeBridge){
      report('A Windows Mentés másként csak a telepített Gatterka.exe indításakor működik. A böngészőben külön megnyitott index.htm nem rendelkezik Windows fájlmentési kapcsolattal.',true);
      return;
    }
    if(button?.disabled)return;
    const original=button?.textContent||'💾 Mentés másként';
    if(button){button.disabled=true;button.textContent='Mentés másként ablak megnyitása…';}
    report('A Windows Mentés másként ablak megnyitása…');
    try{
      // Előbb elkészül a teljes csomag, így a hiányzó anyagszín vagy hibás nesting
      // még az ablak megnyitása előtt hibaüzenetet ad.
      const bundle=machineExportBundle({relative:true});
      const mixEntry=bundle.files.find(([path])=>/\.xMix$/i.test(path));
      const programs=bundle.files.filter(([path])=>/\.xPrg$/i.test(path))
        .map(([path,content])=>({name:path.slice(path.lastIndexOf('/')+1),content}));
      if(!mixEntry||!programs.length)throw Error('Hiányzik az xMix vagy az xPrg tartalom.');
      // A Windows Mentés másként ablakban a felhasználó mappát és xMix nevet választ.
      const chosen=await requestNativeMachine('choose-save-as',{defaultName:bundle.mixName});
      if(chosen.cancelled){report('A mentést megszakítottad.');return;}
      report('xMix és xPrg fájlok mentése a kiválasztott mappába…');
      // A Go a kiválasztott mappába írja az xMix-et és az xPrg fájlokat, az xMix sorait
      // pedig a ténylegesen elmentett xPrg fájlok teljes útvonalára írja át.
      const saved=await requestNativeMachine('write-files',{mix:mixEntry[1],programs});
      if(!saved.mixPath||!Array.isArray(saved.programs)||
        saved.programs.length!==programs.length)throw Error('A mentés nem igazolható.');
      report('A mentés sikeres volt! Elmentve a következő mappába: '+saved.folder+' · 1 xMix ('+
        saved.mixPath.slice(saved.mixPath.lastIndexOf('\\')+1)+') és '+saved.programs.length+
        ' xPrg. Az xMix az xPrg fájlok teljes útvonalát tartalmazza.');
    }catch(err){
      report('A Mentés másként nem sikerült: '+(err?.message||'ismeretlen hiba'),true);
    }finally{
      if(button){button.disabled=false;button.textContent=original;}
    }
  }

  function downloadBoardImage(){
    const bin=selectedBin();if(!bin)return;
    const index=state.selectedBoard+1;
    const {width,height}=svgBoardSize(bin);
    const scale=Math.min(2,4000/Math.max(width,height));

    const img=new Image();
    const ext='png',mime='image/png';
    img.onload=()=>{
      try{
        const canvas=document.createElement('canvas');
        canvas.width=Math.max(1,Math.round(width*scale));
        canvas.height=Math.max(1,Math.round(height*scale));
        const ctx=canvas.getContext('2d');
        if(!ctx)throw Error('Canvas nem elérhető');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        canvas.toBlob(blob=>{
          if(blob)downloadBlob(blob,`gatterka_tabla_${index}.${ext}`);

      finally{URL.revokeObjectURL(url);}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);showNotice(`A ${ext.toUpperCase()} kép mentése nem sikerült. Próbáld az SVG mentést.`);};

  // Minden készre vágott fizikai alkatrészhez pontosan egy matrica.
  // A gépi tervben a készre vágás valódi műveletszáma határozza meg a sorrendet.
  function orderedLabels(){
    if(!result?.bins?.length||result.error)return [];
    const labels=[];
    result.bins.forEach((bin,boardIndex)=>{
      bin.placements.forEach((placement,index)=>{
        labels.push({bin,boardIndex,placement,index,
          completionStep:placement.completionStep??(index+1)});
      });
    });
    // A matricák is táblánként csoportosulnak; azon belül a készülési sorrend.
    labels.sort((a,b)=>a.boardIndex-b.boardIndex||
      a.completionStep-b.completionStep||a.index-b.index);
    return labels;
  }
  // Egyetlen SVG matricarajzot használunk előnézethez, A4 nyomtatáshoz és PNG-hez.
  // Emiatt a papírra kerülő sorrend és a mentett képen lévő elrendezés azonos.
  // Az alkatrészmatrica két rögzített méretoszlopot használ.
  // Minden ABS és reszelés jelzés kizárólag a saját mérete alá kerül.
  function labelAxisDetails(part,axis){
    const abs=partEdgeThicknesses(part),filing=part.filingSides||{};
    const sides=axis==='a'?['x1','x2']:['y1','y2'];
    const letter=axis==='a'?'H':'R';
    const groups=[];
    let filedCount=0;
    for(const side of sides){
      const thickness=abs[side];
      if(thickness!==2&&thickness!==0.4)continue;
      const group=groups.find(g=>g.thickness===thickness);
      if(group)group.count++;
      else groups.push({thickness,count:1});
      // 0,4 mm ABS-t sosem reszelünk, még hibásan mentett adat esetén sem.
      if(thickness===2&&filing[side])filedCount++;
    }
    return {
      abs:groups.map(g=>g.count+letter+' '+String(g.thickness).replace('.',',')+'mm ABS').join(' / '),
      filing:filedCount?filedCount+letter+'resz':''
    };
  }
  function labelSvgContent(label,x,y,width,height){
    const part=label.placement.part;
    const scale=Math.max(.55,Math.min(1.65,width/48.5,height/25.4));

    const line=(text,left,baseline,size,weight='400',extra='')=>
      '<text x="'+left+'" y="'+baseline+'" font-size="'+size+
      '" font-weight="'+weight+'" font-family="Arial,Helvetica,sans-serif" fill="#151515" '+extra+'>'+h(text)+'</text>';
    const fit=(value,size,available)=>{
      const valueText=String(value||'');
      const limit=Math.max(3,Math.floor(available/(size*.55)));
      return valueText.length>limit?valueText.slice(0,Math.max(1,limit-1))+'…':valueText;
    };
    const savedPart=(typeof state!=='undefined'&&Array.isArray(state.furnitures))?
      state.furnitures.flatMap(f=>f.parts||[]).find(p=>p.id===part.uid):null;
    const currentPart={...part,...savedPart,edge:savedPart?.edge??part.edge,
      edgeSides:savedPart?.edgeSides??part.edgeSides,
      edgeThicknesses:savedPart?.edgeThicknesses??part.edgeThicknesses,
      filingSides:savedPart?.filingSides??part.filingSides,
      mill:savedPart?.mill??part.mill,millDepth:savedPart?.millDepth??part.millDepth,
      millDepthSides:savedPart?.millDepthSides??part.millDepthSides};
    const destination=String(currentPart.destination||'').trim();
    const material=String(currentPart.materialColor||'').trim();
    const firstDimension=nfmt(currentPart.originalA??currentPart.a);
    const secondDimension=nfmt(currentPart.originalB??currentPart.b);
    const firstEdge=labelAxisDetails(currentPart,'a');
    const secondEdge=labelAxisDetails(currentPart,'b');
    const undercut=Number(currentPart.shelfBevelDegrees)||0;
    const undercutText=undercut>0.001?'Alávágás: '+nfmt(Math.abs(undercut))+'°':'';
    // A jelölőkód mindig két helyiértékű. Ha egy méret nincs aláhúzva,
    // annak számjegye 0; teljesen élzáratlan alkatrésznél 0-0 látszik.
    const edgeCode=dimensionUnderline(currentPart,'a')+'-'+dimensionUnderline(currentPart,'b');
    const millRows=['x1','x2','y1','y2'].flatMap((side)=>{
      const thickness=partEdgeThicknesses(currentPart)[side];
      if(!thickness)return [];
      const depth=partMillForSide(currentPart,side);
      const name=({x1:'H1',x2:'H2',y1:'R1',y2:'R2'})[side];
      const absText=String(thickness).replace('.',',')+'mm ABS';
      return [name+': '+absText+' – '+(depth>0?String(depth).replace('.',',')+'mm marás':'nincs marás')];
    });
    // Külön fix méretmezők: a négyjegyű szám sem érhet az × jelhez.
    // Az ABS-feliratok ugyanazon mezők alatt maradnak.
    const firstCenter=x+width*.355,secondCenter=x+width*.685;
    const dimensionSize=4.15*scale;
    const edgeSize=1.58*scale;

      // A felirat és aláhúzása együtt igazodik a rendelkezésre álló mezőbe.
      // 4+ számjegynél sem lóghat át a szorzásjelre vagy az élzáráskódra.
      const maxWidth=width*.225;
      const size=Math.min(dimensionSize,maxWidth/(Math.max(1,value.length)*.61));
      const estimatedWidth=value.length*size*.57;
      const baseline=dimBaseline+size*.22;

    const partNameLines=(name)=>{
      const words=String(name??'').trim().split(/\s+/).filter(Boolean);
      const first=[],second=[];
      for(const word of words){
        const target=second.length||((first.join(' ').length+(first.length?1:0)+word.length)>34&&first.length)?second:first;

      return [first.join(' '),second.join(' ')].filter(Boolean);

      const lines=partNameLines(currentPart.name);
      const font=lines.length>1?2.15*scale:2.65*scale;
      const available=millRows.length?width*.45:width-2*margin;

      line(fit(destination,2.0*scale,width*.52),x+margin,y+height*.115,2.0*scale)+
      (material?line(fit(material,1.7*scale,width*.42),x+width-margin,y+height*.115,1.7*scale,'600','text-anchor="end"'):'')+

      dimension(secondDimension,secondCenter,dimensionUnderline(currentPart,'b'))+

  const labelPaper={width:210,height:297};
  function labelPages(){
    const labels=orderedLabels();
    const width=Number(state.labelWidth),height=Number(state.labelHeight);
    const marginX=Number(state.labelMarginX),marginY=Number(state.labelMarginY);
    const printableW=labelPaper.width-2*marginX;
    const printableH=labelPaper.height-2*marginY;
    const cols=Math.floor((printableW+1e-6)/width);
    const rows=Math.floor((printableH+1e-6)/height);
    if(!Number.isFinite(width)||!Number.isFinite(height)||!Number.isFinite(marginX)||!Number.isFinite(marginY)||
        width<20||height<15||marginX<0||marginY<0||cols<1||rows<1)
      throw Error('A megadott matrica nem fér el az A4 nyomtatható részén.');
    const pages=[];
    for(let offset=0;offset<labels.length;offset+=cols*rows){
      const batch=labels.slice(offset,offset+cols*rows);
      const drawing=batch.map((label,index)=>labelSvgContent(label,
        marginX+(index%cols)*width,
        marginY+Math.floor(index/cols)*height,width,height)).join('');
      pages.push(`<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/>${drawing}</svg>`);
    }
    return {pages,cols,rows,width,height,marginX,marginY};
  }

  async function downloadLabelPng(){
    if(!orderedLabels().length){showNotice('Előbb készíts nesting tervet a matricákhoz.');return;}
    try{
      const pages=labelPages().pages,files=[];
      const project=fileName(getFurniture()?.name||state.projectName||'Gatterka')||'Gatterka';
      for(let page=0;page<pages.length;page++){
        const svgUrl=URL.createObjectURL(new Blob([pages[page]],{type:'image/svg+xml;charset=utf-8'}));
        try{
          const png=await new Promise((resolve,reject)=>{
            const picture=new Image();
            picture.onload=()=>{
              try{
                const canvas=document.createElement('canvas');
                canvas.width=Math.round(210/25.4*300);
                canvas.height=Math.round(297/25.4*300);
                const context=canvas.getContext('2d');
                if(!context)throw Error('Nem sikerült képet készíteni.');
                context.fillStyle='#fff';context.fillRect(0,0,canvas.width,canvas.height);
                context.drawImage(picture,0,0,canvas.width,canvas.height);
                canvas.toBlob(blob=>blob?resolve(blob):reject(Error('PNG létrehozási hiba')),'image/png');
              }catch(error){reject(error);}
            };
            picture.onerror=()=>reject(Error('Nem sikerült kirajzolni az A4-es lapot.'));
            picture.src=svgUrl;
          });
          if(pages.length===1){downloadBlob(png,project+'_matricak_A4.png');return;}
          files.push([project+'_matricak_A4_'+String(page+1).padStart(2,'0')+'.png',
            new Uint8Array(await png.arrayBuffer())]);
        }finally{URL.revokeObjectURL(svgUrl);}
      }
      // Több A4-es oldal esetén egyetlen letölthető ZIP-ben található minden PNG.
      downloadBlob(xlsxZip(files,'application/zip'),project+'_matricak_A4_PNG.zip');
    }catch(err){showNotice(err.message||'A matricák PNG-mentése nem sikerült.');}
  }
  function downloadOverview(){
    if(!result?.bins?.length)return;
    const margin=60,width=Math.max(...result.bins.map(b=>svgBoardSize(b).width))+2*margin;let y=75;
    const body=result.bins.map((bin,i)=>{const inner=svgBoard(bin).replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'');const {width:w,height}=svgBoardSize(bin);const section=`<text x="${margin}" y="${y-20}" font-family="Arial" font-weight="700" font-size="30" fill="#234335">Tábla ${i+1}: ${h(bin.name)}</text><svg x="${margin}" y="${y}" width="${w}" height="${height}" viewBox="0 0 ${w} ${height}">${inner}</svg>`;y+=height+90;return section;}).join('');
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${y}" width="${width}" height="${y}"><rect width="100%" height="100%" fill="white"/>${body}</svg>`;
    // Az összes tábla egyetlen PNG képre kerül. A méretek és a
    // táblánkénti rajzok ugyanazok, mint a korábbi SVG összesítőben.
    const scale=Math.min(2,12000/Math.max(width,y),Math.sqrt(32000000/(width*y)));
    const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
    const img=new Image();
    img.onload=()=>{
      try{
        const canvas=document.createElement('canvas');
        canvas.width=Math.max(1,Math.round(width*scale));
        canvas.height=Math.max(1,Math.round(y*scale));
        const ctx=canvas.getContext('2d');
        if(!ctx)throw Error('Nem érhető el a képrajzoló.');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        canvas.toBlob(blob=>{
          if(blob)downloadBlob(blob,'gatterka_osszes_tabla.png');
          else showNotice('A teljes táblakép PNG mentése nem sikerült.');
        },'image/png');
      }catch(error){showNotice('A teljes táblakép PNG mentése nem sikerült: '+error.message);}
      finally{URL.revokeObjectURL(url);}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);showNotice('A teljes táblakép rajzolása nem sikerült.');};
    img.src=url;
  }
  // HTML5 húzd és ejtsd: a megfogott bútor nem duplikálódik.

  function reorderPartWithinFurniture(partId,ownerId,targetId,targetOwnerId,after=false){
    if(ownerId!==targetOwnerId)return false;
    const owner=state.furnitures.find(f=>String(f.id)===String(ownerId));
    if(!owner||!Array.isArray(owner.parts))return false;
    const from=owner.parts.findIndex(p=>String(p.id)===String(partId));
    const to=owner.parts.findIndex(p=>String(p.id)===String(targetId));
    if(from<0||to<0||from===to)return false;
    captureVisibleFurnitureEdits();
    const moved=owner.parts.splice(from,1)[0];
    const at=owner.parts.findIndex(p=>String(p.id)===String(targetId));
    owner.parts.splice(at+(after?1:0),0,moved);
    result=null;
    const saved=saveFurnitureCustomization();
    if(!saved.ok)notice='Az új sorrend megjelent, de nem sikerült elmenteni: '+saved.message;
    return true;
  }
  function reorderMaterialCatalog(id,targetId,after=false){
    const from=materialCatalog.findIndex(m=>m.id===id);
    const to=materialCatalog.findIndex(m=>m.id===targetId);
    if(from<0||to<0||from===to)return false;
    const moved=materialCatalog.splice(from,1)[0];
    const insertion=materialCatalog.findIndex(m=>m.id===targetId);
    materialCatalog.splice(insertion+(after?1:0),0,moved);
    storeCatalog(materialKey,materialCatalog);
    return true;
  }

  // A méretképletek, darabszámok és bútorparaméterek élő frissítése.
  // Gépelés közben részleges alkatrésznévre Oldal X / Oldal Y
  // ajánlatokat jelenítünk meg. A beszúrás a készméretet idézi,
  // nem az élzárás/marás után korrigált gépi méretet.
  function closePartSuggestions(){
    document.querySelectorAll('.part-ref-suggestions').forEach(x=>x.remove());
  }
  function partReferenceSuggestions(el){
    closePartSuggestions();
    if(!el?.matches?.('[data-scope="part"][data-key="a"],[data-scope="part"][data-key="b"],[data-scope="part"][data-key="q"],[data-scope="part"][data-key="ifCondition"],[data-scope="custom-param"][data-key="condition"],[data-scope="custom-part"][data-key="a"],[data-scope="custom-part"][data-key="b"],[data-scope="custom-part"][data-key="q"]'))return;
    const custom=el.dataset.scope==='custom-part'||el.dataset.scope==='custom-param';
    // Kizárólag az aktuális bútor alkatrészeit és paramétereit ajánlhatja fel.
    const selected=custom?getFurniture():
      state.furnitures.find(f=>(f.parts||[]).some(p=>p.id===el.dataset.id));
    if(!selected)return;
    const position=el.selectionStart??String(el.value).length;
    const before=String(el.value).slice(0,position);
    const found=before.match(/(?:^|[^\p{L}\p{N}_"])([\p{L}][\p{L}\p{N}_]*)$/u);
    const paramFound=before.match(/(?:^|[^\p{L}\p{N}_-])([\p{L}][\p{L}\p{N}_-]*)$/u);
    const token=found?.[1]||'',offset=position-token.length;
    const paramToken=paramFound?.[1]||'';
    let paramOffset=position-paramToken.length;
    if(before[paramOffset-1]==='[')paramOffset--;
    if(token.length<2&&paramToken.length<2)return;
    const matches=token.length>=2?(selected.parts||[]).filter(p=>
      (custom?p.customPartId!==el.dataset.partId:p.id!==el.dataset.id)&&
      String(p.name||'').toLocaleLowerCase('hu-HU')
       .startsWith(token.toLocaleLowerCase('hu-HU'))&&
      !String(p.name||'').startsWith('=')&&!String(p.name||'').includes('{')).slice(0,8):[];
    const parameterMatches=paramToken.length>=2?(selected.customParameters||[]).filter(param=>
      String(param.name||'').toLocaleLowerCase('hu-HU')
        .startsWith(paramToken.toLocaleLowerCase('hu-HU'))).slice(0,8):[];
    if(!matches.length&&!parameterMatches.length)return;
    const container=el.closest('.expr-cell');if(!container)return;
    const pop=document.createElement('div');
    pop.className='part-ref-suggestions';pop.setAttribute('role','listbox');
    let options=[];
    for(const p of matches){
      for(const axis of ['x','y']){
        const btn=document.createElement('button');btn.type='button';
        btn.className='part-ref-option';
        btn.textContent=p.name+' '+axis.toUpperCase()+' · '+(axis==='x'?'szálirány':'keresztirány');
        btn.setAttribute('role','option');
        btn.addEventListener('mousedown',event=>event.preventDefault());
        const insert=()=>{
          const code=/^[\p{L}_][\p{L}\p{N}_]*$/u.test(p.name)?
            p.name+axis:'"'+p.name+'"'+axis;
          const value=String(el.value);
          el.value=value.slice(0,offset)+code+value.slice(position);
          el.setSelectionRange(offset+code.length,offset+code.length);
          el.dispatchEvent(new Event('input',{bubbles:true}));
          el.focus();
          closePartSuggestions();
        };
        btn.addEventListener('click',insert);
        pop.appendChild(btn);options.push({btn,insert});
      }
    }
    for(const param of parameterMatches){
      const btn=document.createElement('button');btn.type='button';
      btn.className='part-ref-option';
      btn.textContent=param.name+' · Bútorparaméter ('+
        (param.value==null?'régi 0/1':String(param.value))+')';
      btn.setAttribute('role','option');
      btn.addEventListener('mousedown',event=>event.preventDefault());
      const insert=()=>{
        const code='['+param.name+']';
        const value=String(el.value);
        el.value=value.slice(0,paramOffset)+code+value.slice(position);
        el.setSelectionRange(paramOffset+code.length,paramOffset+code.length);
        el.dispatchEvent(new Event('input',{bubbles:true}));
        el.focus();closePartSuggestions();
      };
      btn.addEventListener('click',insert);
      pop.appendChild(btn);options.push({btn,insert});
    }
    if(options.length){
      options[0].btn.classList.add('suggestion-active');
      container.appendChild(pop);
    }
  }
  document.addEventListener('pointerdown',event=>{
    if(!event.target.closest('.part-ref-suggestions,.expr-cell input'))closePartSuggestions();
  });

    const el=event.target;
    if(!el?.matches?.('[data-scope="furniture"],[data-scope="part"],[data-scope="custom-param"],[data-scope="custom-part"]'))return;
    captureVisibleFurnitureEdits();
    // A fő input/change feldolgozó lefutása UTÁN is mentünk: a W/H/D
    // és a beállítások legutolsó értéke is biztosan bekerül a projektbe.
    queueMicrotask(()=>{
      captureVisibleFurnitureEdits();
      if(projectScreen==='editor')save();
      else if(projectScreen==='series-edit'&&getFurniture()?.name?.trim())saveFurnitureCustomization();
    });
  }
  document.addEventListener('input',autoSaveFurnitureEdits);
  document.addEventListener('change',autoSaveFurnitureEdits);
  document.addEventListener('input',e=>{
    const el=e.target;
    if(el.dataset.scope==='collector-destination'){
      for(const furniture of state.furnitures)furniture.destination=el.value;
      save();return;
    }
    if(el.dataset.scope==='library-quantity'){
      const choice=furnitureCutSelection.get(el.dataset.choiceKey)||{selected:false,qty:1};
      const value=Number(el.value);
      choice.qty=Number.isFinite(value)?value:0;
      furnitureCutSelection.set(el.dataset.choiceKey,choice);
      return;
    }
    if(el.dataset.themeColor){changeThemeColor(el.dataset.themeColor,el.value);syncCabinetDesignerTheme();return;}
    const scope=el.dataset.scope,key=el.dataset.key;
    if(scope==='settings'&&key==='xmixMachineRoot'){
      rememberMachineRoot(el.value);
      return; // Gépelés közben nem bontjuk le az inputot és a gombokat.
    }
    if(scope==='custom-param'&&(key==='value'||key==='condition')){
      const f=getFurniture(),rule=f?.customParameters?.find(x=>x.id===el.dataset.id);
      if(!rule)return;
      rule[key]=el.value;
      syncCustomParameterParts(f);refreshCustomRuleStatuses(f);
      if(key==='condition')partReferenceSuggestions(el);
      refreshLiveFormulaValues();result=null;save();return;
    }
    if(scope==='custom-part'&&['name','a','b','q'].includes(key)){
      const f=getFurniture(),rule=f?.customParameters?.find(x=>x.id===el.dataset.id);
      const spec=rule?.parts?.find(x=>x.id===el.dataset.partId);
      if(!spec)return;
      spec[key]=el.value;
      const active=f.parts.find(p=>p.customParameterId===rule.id&&p.customPartId===spec.id);
      if(active){
        active[key]=key==='name'?customPartName(rule,spec):el.value;
        if(key==='name')
          active.customNameInherited=!String(spec.name||'').trim()&&(rule.parts||[])[0]===spec;
      }
      if(['a','b','q'].includes(key))partReferenceSuggestions(el);
      refreshLiveFormulaValues();result=null;save();return;
    }
    if(scope==='part'&&['a','b','q','name','materialColor','ifCondition'].includes(key)){
      const part=state.furnitures.flatMap(f=>f.parts).find(p=>p.id===el.dataset.id);
      if(!part)return;
      part[key]=el.value;
      if(key==='name'&&part.customParameterId){
        // A közös alkatrészlistában kézzel átírt név saját megnevezés.
        const owner=state.furnitures.find(f=>f.parts.some(p=>p.id===part.id));
        const rule=owner?.customParameters?.find(x=>x.id===part.customParameterId);
        const spec=rule?.parts?.find(x=>x.id===part.customPartId);
        if(spec)spec.name=el.value;
        part.customNameInherited=false;
      }
      if(['a','b','q','name','ifCondition'].includes(key))refreshLiveFormulaValues();
      if(['a','b','q','ifCondition'].includes(key))partReferenceSuggestions(el);
      // Az IF már gépeléskor a belső projektbe kerül, nem csak blur-kor.
      // Ez NEM a gépi xMix/xPrg mentése.
      if(key==='ifCondition')save();
      scheduleLiveNesting();
    }else if(scope==='furniture'&&['w','ht','d','t','qty','s','dividerThreshold'].includes(key)){
      const furniture=state.furnitures.find(f=>f.id===el.dataset.id);
      if(!furniture)return;
      const value=pnum(el.value);
      if(!el.value.trim()||!Number.isFinite(value)||value<0)return;
      furniture[key]=value;
      syncCustomParameterParts(furniture);refreshCustomRuleStatuses(furniture);
      refreshLiveFormulaValues();
      if(['w','ht','d','t'].includes(key))syncCabinetDesignerDimensions();
      scheduleLiveNesting();
    }
  });
  document.addEventListener('change',e=>{
    const el=e.target,scope=el.dataset.scope;if(!scope)return;

      if(qty)entry.qty=Number(qty.value);
      furnitureCutSelection.set(key,entry);return;
    }
    if(scope==='library-quantity')return;
    if(scope==='collector-destination'){
      for(const furniture of state.furnitures)furniture.destination=el.value;
      save();return;
    }
    const key=el.dataset.key;
    if(scope==='custom-param'||scope==='custom-part'){
      const f=getFurniture(),rule=f?.customParameters?.find(x=>x.id===el.dataset.id);
      if(!rule)return;
      const key=el.dataset.key;
      if(scope==='custom-param'){
        if(key==='name')rule.name=el.value;
        else if(key==='condition'||key==='value')rule[key]=el.value;
      }else{
        const spec=(rule.parts||[]).find(x=>x.id===el.dataset.partId);
        if(!spec||!['name','a','b','q'].includes(key))return;
        spec[key]=el.value;
        const active=(f.parts||[]).find(x=>x.customParameterId===rule.id&&x.customPartId===spec.id);
        if(active)active[key]=spec[key];
      }
      syncCustomParameterParts(f);result=null;
      refreshCustomRuleStatuses(f);refreshLiveFormulaValues();
      // A polc paraméter átírásakor a mindig látható polcválasztó értéke frissül.
      const frame=document.querySelector('.gatterka-cabinet-inline-frame');
      if(frame)applyCabinetShelfPolicy(frame,f);
      save();return; // A Tab minden képletmezőn és legördülőn továbblép.
    
    }
    if(scope==='remnant-selection'){
      const selected=new Set(state.selectedRemnantIds||[]);
      if(el.checked)selected.add(el.dataset.id);else selected.delete(el.dataset.id);
      state.selectedRemnantIds=[...selected];result=null;render();return;
    }
    if(scope==='material'||scope==='remnant'){
      const item=(scope==='material'?materialCatalog:remnantCatalog).find(x=>x.id===el.dataset.id);
      if(!item)return;
      const boardDimension=scope==='material'&&(key==='boardA'||key==='boardB');
      const emptyDimension=boardDimension&&String(el.value).trim()==='';
      const value=emptyDimension?'':el.type==='number'?Number(el.value):el.value;
      if(el.type==='number'&&!emptyDimension&&
         (!Number.isFinite(value)||value<=0||(boardDimension&&value>10000))){
        showNotice('Érvénytelen táblaméret. Adj meg 1–10000 mm közötti méretet, vagy hagyd üresen.');return;
      }
      item[key]=value;
      storeCatalog(scope==='material'?materialKey:remnantKey,scope==='material'?materialCatalog:remnantCatalog);
      result=null;
      if(el.tagName==='INPUT'||el.tagName==='SELECT')return; // Az anyagszín és vastagság Tab-sorrendje megmarad.
      render();return;
    }
    const hadNesting=!!result;
    if(scope==='ui'){state[key]=el.value;}
    else {
      let target=scope==='furniture'?state.furnitures.find(f=>f.id===el.dataset.id):scope==='part'?state.furnitures.flatMap(f=>f.parts).find(p=>p.id===el.dataset.id):scope==='board'?state.boards.find(b=>b.id===el.dataset.id):scope==='settings'?state:null;
      if(!target)return;
      const value=el.type==='checkbox'?el.checked:el.type==='number'?pnum(el.value):el.value;
      if(el.type==='number'&&(!Number.isFinite(value)||value<+el.min||(el.max && value>+el.max))){showNotice('Érvénytelen szám. Kérlek, ellenőrizd a megadott értéket.');return;}
      if(scope==='part'&&(key==='edge'||key==='filingCode')){
        const code=String(el.value||'').trim();
        if(!edgeCodeValid(code)){
          showNotice('A jelölés formátuma például 0-0, 1-0, 1-2 vagy 2-2 lehet.');
          el.value=key==='edge'?target.edge||'0-0':codeFromSides(target.filingSides||{});return;
        }
        if(key==='edge'){
          setPartEdgeCode(target,code);
          if(cleanFilingForAbs(target))showNotice('Reszelés csak 2 mm-es ABS-szel élzárt élen lehet.');
        }else{
          const requested=sidesFromCode(code),thicknesses=partEdgeThicknesses(target);
          if(allPartSides.some(side=>requested[side]&&thicknesses[side]!==2)){
            showNotice('Reszelést csak 2 mm-es ABS-szel ellátott élen jelölhetsz. A 0,4 mm-es él nem reszelhető.');
            el.value=codeFromSides(target.filingSides||{});
            return;
          }
          target.filingSides=requested;
        }
      }else if(scope==='part'&&key==='millSideDepth'){
        const side=el.dataset.side;
        if(!allPartSides.includes(side)||partEdgeThicknesses(target)[side]!==2)return;
        target.millDepthSides={...(target.millDepthSides||{}),[side]:Number(value)};
        target.mill=true;
      }else if(scope==='part'&&key==='edgeSideThickness'){
        if(!allPartSides.includes(el.dataset.side))return;
        const thickness=Number(value);
        if(![0,0.4,2].includes(thickness)){showNotice('Az ABS vastagsága 0, 0,4 vagy 2 mm lehet.');return;}
        const previous=partEdgeThicknesses(target);
        previous[el.dataset.side]=thickness;
        target.edgeThicknesses=previous;
        target.edgeSides=Object.fromEntries(allPartSides.map(side=>[side,previous[side]>0]));
        target.edge=codeFromSides(target.edgeSides);
        if(thickness===2){target.mill=true;target.millDepth??=1;}
        if(!allPartSides.some(side=>previous[side]===2))target.mill=false;
        if(cleanFilingForAbs(target))showNotice('A 0,4 mm-es ABS élről a reszelést töröltem; csak 2 mm-es ABS reszelhető.');
      }else if(scope==='part'&&key==='edgeSide'){
        if(!['x1','x2','y1','y2'].includes(el.dataset.side))return;
        target.edgeSides={...(target.edgeSides||sidesFromCode(target.edge)),[el.dataset.side]:value};
        target.edge=codeFromSides(target.edgeSides);
      }else if(scope==='part'&&key==='filingSide'){
        if(!['x1','x2','y1','y2'].includes(el.dataset.side))return;
        target.filingSides={...(target.filingSides||{}),[el.dataset.side]:value};
      }else{
        const previous=target[key];
        target[key]=value;
        if(scope==='furniture'&&key==='materialId'){
          const material=materialCatalog.find(x=>x.id===value);
          if(material){target.materialColor=material.color;target.t=material.thickness;}
        }
        if(scope==='part'&&key==='materialId'){
          // A korábbi egyéni szín nem írhatja felül az anyagadatbázist.
          target.materialColor='';
        }
        if(scope==='part'&&key==='edgeThickness'&&Number(value)===2&&Number(previous)!==2)target.mill=true;
        if(scope==='part' && (key==='edgeThickness'||key==='mill') &&
          !allPartSides.some(side=>partEdgeThicknesses(target)[side]===2))target.mill=false;
        if(scope==='part'&&key==='millDepth'){
          // A közös alapérték csak a még nem egyedileg módosított élekre érvényes.
          target.millDepth=Number(value);
        }
        if(scope==='part'&&key==='grainRequired')target.rot=!value;
        if(scope==='furniture'&&key==='dividerEnabled')target.dividerEnabled=value==='true'||value===true;
        if(scope==='furniture'&&['plinthMode','plinthHeight'].includes(key))
          rebuildPlinthParts(target);
      }
      if(scope==='settings'&&key==='xmixMachineRoot'){
        rememberMachineRoot(value);
        return;
      }
      if(scope==='settings'&&(key==='xprgMaterialCode'||key==='xprgFolder'||key==='xprgHeaderMode')){
        // Szövegmezőről a letöltés gombra váltáskor nem bontjuk le
        // a gomb DOM-ját: a blur utáni kattintás így nem vész el.
        save();return;
      }
      if(scope==='settings'&&key.startsWith('label')){
        // Nyomtatási beállítás ne érvénytelenítse az elkészült szabástervet.
        notice='';render();return;
      }
      // Ha már van szabásterv, a változás után automatikusan újraszámoljuk.
      // A képletmezőket nem töröljük le a DOM-ból a blur/change eseménynél.
      if(liveNestingTimer){clearTimeout(liveNestingTimer);liveNestingTimer=null;}
      result=hadNesting||state.active==='nesting'?computeNesting():null;
      // A két szabásterv-választó azonnal újrarajzolja az eredményt.
      if(scope==='settings'&&['cutDirection','layoutMode'].includes(key)){
        notice='';render();return;
      }
      if((scope==='part'&&['a','b','q','name','materialColor','ifCondition'].includes(key))||
         (scope==='furniture'&&['w','ht','d','t','qty','s','dividerThreshold'].includes(key))||
         (el.tagName==='INPUT'&&el.type!=='checkbox')||
         (el.tagName==='SELECT'&&scope!=='ui')){
        // A blur/change esemény ne bontsa le a táblázatot. Így a Tab
        // a színek, vastagságok és számmezők között is végigmegy.
        if(scope==='part'&&key==='materialId'){
          const owner=state.furnitures.find(f=>(f.parts||[]).some(p=>p.id===target.id));
          const small=el.closest('td')?.querySelector('.tiny');
          if(owner&&small)small.textContent=nfmt(materialForPart(target,owner).thickness)+' mm';
        }
        if(scope==='part'&&(key==='edgeThickness'||key==='edgeSideThickness'||key==='millSideDepth'||key==='mill')){
          const row=el.closest('tr'),mill=row?.querySelector('[data-key="mill"]'),
                depth=row?.querySelector('[data-key="millDepth"]');
          const anyTwo=allPartSides.some(side=>partEdgeThicknesses(target)[side]===2);
          if(mill){mill.disabled=!anyTwo;mill.checked=!!target.mill&&anyTwo;}
          if(depth)depth.disabled=!anyTwo||!target.mill;
          for(const field of row?.querySelectorAll('[data-key="millSideDepth"]')||[]){
            const side=field.dataset.side,enabled=partEdgeThicknesses(target)[side]===2;
            field.disabled=!enabled||!target.mill;
            if(!enabled)field.value='0';
          }
        }
        if(scope==='part'&&key==='edgeThickness'){
          const row=el.closest('tr'),mill=row?.querySelector('[data-key="mill"]'),
                depth=row?.querySelector('[data-key="millDepth"]');
          if(mill){mill.disabled=Number(target.edgeThickness)===0.4;mill.checked=!!target.mill&&Number(target.edgeThickness)!==0.4;}
          if(depth)depth.disabled=Number(target.edgeThickness)===0.4||!target.mill;
        }
        if(scope==='furniture'&&key==='materialId'){
          const label=document.querySelector('[data-material-thickness-view="'+target.id+'"]');
          if(label)label.textContent=nfmt(materialCatalog.find(m=>m.id===target.materialId)?.thickness??target.t??18)+' mm';
        }
        if(scope==='part'&&['edgeSideThickness','edge','edgeThickness'].includes(key)){
          result=null;save();render();return;
        }
        refreshLiveFormulaValues();save();return;
      }
    }
    notice='';render();
  });
  document.addEventListener('keydown',e=>{
    const popup=e.target.closest?.('.expr-cell')?.querySelector('.part-ref-suggestions');
    if(popup){
      const buttons=[...popup.querySelectorAll('.part-ref-option')];
      const current=buttons.findIndex(b=>b.classList.contains('suggestion-active'));
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){
        e.preventDefault();
        const next=(current+(e.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length;
        buttons.forEach((b,i)=>b.classList.toggle('suggestion-active',i===next));
        buttons[next]?.scrollIntoView?.({block:'nearest'});
        return;
      }
      if(e.key==='Enter'){
        const selected=buttons[Math.max(0,current)];
        if(selected){e.preventDefault();selected.click();return;}
      }
      if(e.key==='Tab'||e.key==='Escape')closePartSuggestions();
    }
    if(e.key==='Escape'&&!$('#settings-overlay').classList.contains('hidden'))closeSettings();
  });
  $('#import-input').addEventListener('change',async e=>{
    const file=e.target.files?.[0];if(!file)return;
    try{
      const obj=JSON.parse(await file.text());
      if(!Array.isArray(obj.furnitures)||!Array.isArray(obj.boards))throw Error('Hibás projektfájl');
      if(!confirm('A betöltött projekt lecseréli a jelenlegi adatokat. Folytatod?'))return;
      const fresh=defaultState();Object.assign(state,fresh,obj);normalizeEdgeSettings(state.furnitures);normalizeFurnitureMeta(state.furnitures,state);normalizeFurnitureSizes(state.furnitures);normalizeLabelSettings(state);state.active='furniture';state.selectedFurniture=state.furnitures[0]?.id||null;result=null;showNotice('Projekt betöltve.');
    }catch(err){showNotice('Nem sikerült betölteni a projektet: '+err.message);}finally{e.target.value='';}
  });
  render();
})();

<script>
'use strict';
/**
 * Gatterka CNC / Xilog XXL: ellenőrzött, explicit makrók exportja.
 * Nem automatikus furatkiosztó és nem helyettesíti az SCM gépi szimulációját.
 * A szabászati .xPrg/.xMix kódjától teljesen független.
 */
(function(root){
  const JOINT_G=Object.freeze({
    tipli:Object.freeze({lap:0,el:0}),
    excenter:Object.freeze({lap:1,el:1}),
    hosszuExcenter:Object.freeze({lap:1,el:2}),
    csavar:Object.freeze({lap:2,el:0})
  });
  const MACROS=new Set(['LAPA','LAPF','ELF2','ELF3','ELF5']);
  function number(value,name,allowZero){
    const n=Number(value);
    if(value==null||String(value).trim()===''||!Number.isFinite(n)||n<0||(!allowZero&&n===0)||n>10000)
      throw new Error('Érvénytelen '+name+' méret.');
    return n;
  }
  function fmt(value){
    const n=number(value,'numerikus',true);
    return Number(n.toFixed(3)).toString();
  }
  function centerline(start,thickness){
    return Number((number(start,'kezdőpont',true)+number(thickness,'anyagvastagság')/2).toFixed(3));
  }
  function mirroredX(width,x){
    const w=number(width,'szélesség'),p=number(x,'X',true);
    if(p>w)throw new Error('A tükrözött X a munkadarabon kívülre kerül.');
    return Number((w-p).toFixed(3));
  }
  function jointCodes(type){
    if(!Object.prototype.hasOwnProperty.call(JOINT_G,type))throw new Error('Ismeretlen kötésmód.');
    return {...JOINT_G[type]};
  }
  function parseMacro(line,dx,dy){
    const bits=line.trim().split(/\s+/);
    const macro=bits.shift().toUpperCase();
    if(!MACROS.has(macro))throw new Error('Nem támogatott CNC makró: '+macro);
    const fields={};
    for(const part of bits){
      const match=/^([XYxyAG])=(-?(?:\d+\.?\d*|\.\d+))$/.exec(part);
      if(!match||Object.prototype.hasOwnProperty.call(fields,match?.[1]))
        throw new Error('Érvénytelen vagy ismételt CNC makróparaméter: '+part);
      fields[match[1]]=number(match[2],match[1],true);
    }
    if(!Object.prototype.hasOwnProperty.call(fields,'A')||fields.A!==0)
      throw new Error('Az A forgásszög csak 0 lehet a jelenleg ellenőrzött mintákban.');
    if(!Object.prototype.hasOwnProperty.call(fields,'G')||
       !Number.isInteger(fields.G)||fields.G<0||fields.G>2)
      throw new Error('A CNC G paraméter csak 0, 1 vagy 2 lehet.');
    if(macro==='LAPA'&&(!('X'in fields)||!('Y'in fields)||!('y'in fields)||'x'in fields))
      throw new Error('LAPA: X, Y, A, y és G szükséges.');
    if(macro==='LAPF'&&(!('X'in fields)||!('Y'in fields)||!('x'in fields)||'y'in fields))
      throw new Error('LAPF: X, Y, A, x és G szükséges.');
    if(macro.startsWith('ELF')&&!('x'in fields)&&!('y'in fields))
      throw new Error('Élfurathoz x vagy y hossz szükséges.');
    if('X'in fields&&fields.X>dx || 'Y'in fields&&fields.Y>dy ||
       'x'in fields&&fields.x>dx || 'y'in fields&&fields.y>dy ||
       'X'in fields&&'x'in fields&&fields.X+fields.x>dx ||
       'Y'in fields&&'y'in fields&&fields.Y+fields.y>dy)
      throw new Error('A CNC makró mérete kilóg az alkatrészből.');
    const order=['X','Y','A','x','y','G'];
    return macro+' '+order.filter(key=>key in fields).map(key=>key+'='+fmt(fields[key])).join(' ');
  }

  // A csatolt Xilog3 .pgm referenciákból ellenőrzött formátum:
  // REF DX=491 BX=0; POLC Y=50 Q=0# s=32 G=1# F=1; REF (visszaállítás).
  function parseShelfMacro(line,dx,dy,state){
    const name=line.split(/\s+/)[0];
    if(name==='REF'){
      if(line==='REF'){
        if(!state.active)throw new Error('REF visszaállítás aktív szakasz nélkül.');
        state.active=false;
        return 'REF';
      }
      if(state.active)throw new Error('Az előző REF szakaszt előbb le kell zárni.');
      const fields={};
      for(const part of line.split(/\s+/).slice(1)){
        const m=/^(DX|BX)=((?:\d+\.?\d*|\.\d+))$/.exec(part);
        if(!m||Object.prototype.hasOwnProperty.call(fields,m[1]))
          throw new Error('Érvénytelen REF paraméter: '+part);
        fields[m[1]]=number(m[2],m[1],true);
      }
      if(!(fields.DX>0)||!(fields.BX>=0)||fields.BX+fields.DX>dx+.001)
        throw new Error('A REF szakasz kezdőpontja/hossza kilóg az oldallapból.');
      state.active=true;state.dx=fields.DX;state.bx=fields.BX;
      return 'REF DX='+fmt(fields.DX)+' BX='+fmt(fields.BX);
    }
    if(name==='POLC'){
      if(!state.active)throw new Error('POLC csak előzetes REF szakaszon belül használható.');
      const fields={};
      for(const part of line.split(/\s+/).slice(1)){
        const m=/^(Y|Q|s|G|F)=((?:\d+\.?\d*|\.\d+))#?$/.exec(part);
        if(!m||Object.prototype.hasOwnProperty.call(fields,m[1]))
          throw new Error('Érvénytelen POLC paraméter: '+part);
        fields[m[1]]=number(m[2],m[1],true);
      }
      if(!('Y'in fields)||fields.Y>dy||!Number.isInteger(fields.Q)||
          fields.Q<0||fields.Q>12||!Number.isFinite(fields.s)||
          fields.s<8||fields.s>200||fields.G!==1||fields.F!==1)
        throw new Error('Érvénytelen POLC Y/Q/s/G/F; a minták G=1 F=1 értéket használnak.');

  // CNC-felrakás szerinti legfelső furat, a pozitív x-raszter lefelé fut.
  // Ellenőrzött megengedett névleges paraméterek: z=13 V=1 D=5 N=P F=1.
  function parseXbo(line,dx,dy,dz){
    const fields={};

      const match=/^([XYzVRxyDNF])=(P|-?(?:\d+\.?\d*|\.\d+))$/.exec(bit);
      if(!match||Object.prototype.hasOwnProperty.call(fields,match[1]))
        throw new Error('Érvénytelen vagy ismétlődő XBO paraméter: '+bit);
      fields[match[1]]=match[1]==='N'?match[2]:Number(match[2]);
    }
    const names=['X','Y','z','V','R','x','y','D','N','F'];
    if(names.length!==Object.keys(fields).length||names.some(key=>!Object.prototype.hasOwnProperty.call(fields,key)))
      throw new Error('Az XBO X/Y/z/V/R/x/y/D/N/F paraméterei kötelezők.');
    if(fields.N!=='P'||fields.z!==13||fields.V!==1||fields.D!==5||fields.F!==1||
       !Number.isInteger(fields.R)||fields.R<1||fields.R>99||
       !Number.isFinite(fields.X)||fields.X<0||!Number.isFinite(fields.Y)||fields.Y<0||
       !Number.isFinite(fields.x)||fields.x<8||fields.x>200||fields.y!==0)
      throw new Error('Az XBO csak a jóváhagyott polctartó furatcsoporttal használható.');
    if(fields.z>dz||fields.X+(fields.R-1)*fields.x>dx+.001||
       fields.Y+(fields.R-1)*fields.y>dy+.001)
      throw new Error('Az XBO furatcsoport az alkatrész méretén kívülre kerül.');

  function cncToolCode(dx,combined){
    const length=number(dx,'DX');
    return (combined?16973824:196608)+(length>=620?1:0);
  }
  function cncHeader(dx,dy,requestedSide){
    const length=number(dx,'DX'),width=number(dy,'DY');
    const side=String(requestedSide||'IJ').replace(/^-/, '').toUpperCase();
    const left=['IJ','IL','AB','AD'].includes(side);
    const right=['LK','LI','DC','DA'].includes(side);
    if(!left&&!right)throw new Error('Nem támogatott Xilog térfél: '+side);
    const combined=length>=1350;
    const narrow=width<800;
    const target=narrow
      ?(combined?(left?'IL':'LI'):(left?'IJ':'LK'))
      :(combined?(left?'AD':'DA'):(left?'AB':'DC'));
    return {side:target,combined,tool:cncToolCode(length,combined)};
  }
  function compileXxl(spec){
    if(!spec||typeof spec!=='object')throw new Error('Hiányzó CNC programadatok.');
    const dx=number(spec.dx,'DX'),dy=number(spec.dy,'DY'),dz=number(spec.dz,'DZ');
    const header=cncHeader(dx,dy,spec.side);
    const text=String(spec.commands??'').replace(/\r/g,'');
    if(text.length>50000)throw new Error('Túl hosszú CNC makrólista.');
    const lines=text.split('\n').map(s=>s.trim()).filter(s=>s&&s!==';');
    if(!lines.length||lines.length>500)throw new Error('Adj meg 1–500 ellenőrzött CNC makrósort.');
    const out=['H DX='+fmt(dx)+' DY='+fmt(dy)+' DZ='+fmt(dz)+' -'+header.side+
      ' C=0 T='+header.tool+' R=100 *MM /"DEF" BX=0 BY=0 BZ=0 V=1'];
    let macrocnt=0,flips=0,justFlipped=false;
    const shelfRef={active:false,dx:0,bx:0};
    for(let i=0;i<lines.length;i++){
      if(lines[i]==='FORDIT'){
        if(shelfRef.active)throw new Error('A REF szakaszt FORDIT előtt le kell zárni.');
        if(!macrocnt||justFlipped||i===lines.length-1)
          throw new Error('A FORDIT csak két megmunkálási csoport között állhat.');
        if(++flips>1)throw new Error('A többfordításos CNC program még nincs hitelesítve.');
        out.push(';','VEGE','XMSG Q=1 N="FORDIT"',';');
        justFlipped=true;
      }else if(lines[i]==='REF'||lines[i].startsWith('REF ')||lines[i].startsWith('POLC ')){
        const line=parseShelfMacro(lines[i],dx,dy,shelfRef);
        out.push(line);
        if(lines[i].startsWith('POLC '))macrocnt++;
        justFlipped=false;
      }else{
        if(shelfRef.active)throw new Error('A REF szakaszba csak POLC-makró írható.');
        out.push(lines[i].startsWith('XBO ')?parseXbo(lines[i],dx,dy,dz):parseMacro(lines[i],dx,dy));
        macrocnt++;
        justFlipped=false;
      }
    }
    if(shelfRef.active)throw new Error('A REF szakaszból hiányzik a záró REF.');
    if(!macrocnt)throw new Error('Hiányzik a megmunkálási makró.');
    out.push(';','VEGE');
    return out.join('\r\n')+'\r\n';
  }
  const api={JOINT_G,jointCodes,centerline,mirroredX,parseMacro,parseXbo,cncToolCode,cncHeader,compileXxl};
  if(typeof module!=='undefined'&&module.exports)module.exports=api;
  if(root)root.GatterkaCnc=api;
})(typeof window!=='undefined'?window:null);

<script>
'use strict';
/**
 * KitchenDraw SDK2 OBJ -> Gatterka 3D jelenet, alkatrész és szekrényadatok.
 * Az SCN-t a KitchenDraw nyitja meg; a Gatterka NEM találgatja a zárt
 * bináris SCN geometriáját. Csak a tényleges OBJ háromszögek és az SDK
 * objektumjegyzék adják az eredményt.
 */
(function(root){

 function cabinetHint(name){
   const s=safeName(name);
   // Kizárólag explicit OBJ elnevezési hierarchia alapján csoportosítunk.
   const m=/^(?:(?:Bútor|Butor|Cabinet|Szekrény|Szekreny)\s*[-_#]?\s*\d+)[\\/|:]+/i.exec(s);
   return m?s.slice(0,m[0].length).replace(/[\\/|:]+$/,'').trim():'';

 function solidBox(vertices,faces,lo,hi){
   const dims=hi.map((v,i)=>v-lo[i]),eps=.025;
   if(faces.length<12||dims.some(v=>v<=0)||dims.filter(v=>v<=50).length!==1)return false;
   const long=dims.filter(v=>v>50);
   if(!long.length||dims.indexOf(Math.min(...dims))<0)return false;
   // Nem elegendő a befoglaló téglatest! A háromszögek ténylegesen
   // lefedjék mind a hat síkot, és ne legyen belső/ferde/hiányos felület.
   const planes=Array(6).fill(0);
   for(const tri of faces){
     const points=tri.map(i=>vertices[i]);
     if(points.some(v=>!v))return false;
     let plane=-1;
     for(let a=0;a<3;a++)for(let side=0;side<2;side++){
       const target=side?hi[a]:lo[a];
       if(points.every(p=>Math.abs(p[a]-target)<eps)){plane=a*2+side;break;}
     }
     if(plane<0)return false;
     const a=points[0],b=points[1],c=points[2],u=b.map((v,k)=>v-a[k]),v=c.map((x,k)=>x-a[k]);
     const area=Math.hypot(u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0])/2;
     if(!Number.isFinite(area)||area<.0001)return false;

   }
   return planes.every((area,i)=>{
     const axis=Math.floor(i/2),expected=dims.filter((_,k)=>k!==axis).reduce((a,b)=>a*b,1);
     return Math.abs(area-expected)<Math.max(.1,expected*.005);

   if(typeof text!=='string'||!text.length)fail('A KitchenDraw nem adott vissza OBJ geometriát.');
   if(text.length>24*1024*1024)fail('A KitchenDraw OBJ 24 MB-nál nagyobb.');
   const scale=Number(options.mmPerUnit??1);
   if(!Number.isFinite(scale)||scale<=0||scale>1000)fail('Az SCN OBJ méretaránya érvénytelen.');
   const source=text.split(/\r?\n/),vertices=[],groups=[],warnings=[];
   let group={name:'Ismeretlen objektum',faces:[],source:'obj'};
   const openGroup=name=>{
     if(group.faces.length)groups.push(group);
     group={name:safeName(name)||'Ismeretlen objektum',faces:[],source:'obj'};
   };
   for(const line of source){
     const trim=line.trim();
     if(trim.startsWith('v ')){
       const v=trim.slice(2).trim().split(/\s+/).slice(0,3).map(Number);
       if(v.length!==3||v.some(x=>!Number.isFinite(x)||Math.abs(x*scale)>100000))
         fail('Hibás SCN-OBJ csúcskoordináta.');
       vertices.push(v.map(x=>x*scale));
       if(vertices.length>1000000)fail('A SCN túl sok csúcspontot tartalmaz.');
     }else if(trim.startsWith('o ')){
       openGroup(trim.slice(2));
     }else if(trim.startsWith('g ')){
       // Az OBJ g/o csoportok nem feltétlenül bútorok: a pontos
       // kapcsolat hiányában csak a csoportnevüket használjuk.
       openGroup(trim.slice(2));
     }else if(trim.startsWith('f ')){
       const tokens=trim.slice(2).trim().split(/\s+/);
       if(tokens.length<3||tokens.length>32)fail('Érvénytelen OBJ lap.');
       const ids=tokens.map(token=>{
         const n=Number(token.split('/')[0]);
         const id=n<0?vertices.length+n:n-1;
         if(!Number.isInteger(n)||n===0||id<0||id>=vertices.length)fail('Az SCN-OBJ érvénytelen csúcsra hivatkozik.');
         return id;
       });
       for(let i=1;i+1<ids.length;i++)group.faces.push([ids[0],ids[i],ids[i+1]]);
       if(group.faces.length>200000)fail('Egy SCN objektum túl sok háromszöget tartalmaz.');
     }
   }
   if(group.faces.length)groups.push(group);
   if(!groups.length)fail('Az SCN OBJ nem tartalmaz háromszögeket.');
   if(groups.length>600)fail('Az SCN OBJ túl sok külön objektumot tartalmaz (600+).');
   const objects=Array.isArray(manifest?.objects)?manifest.objects:[];
   const modelParts=[],modelGroups=[],cabinetNames=new Set(),usedNames=new Set();
   for(const [index,g] of groups.entries()){
     const used=[...new Set(g.faces.flat())],remap=new Map(used.map((id,i)=>[id,i]));
     const points=used.map(i=>vertices[i]);
     const lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];
     for(const v of points)for(let k=0;k<3;k++){lo[k]=Math.min(lo[k],v[k]);hi[k]=Math.max(hi[k],v[k]);}
     const sizes=hi.map((n,k)=>n-lo[k]);
     if(sizes.some(v=>!Number.isFinite(v)||v<.1||v>10000)){
       warnings.push(g.name+': a geometria túl kicsi, nagy vagy érvénytelen.');continue;
     }
     const tris=g.faces.map(tri=>tri.map(i=>remap.get(i)));
     const isRectangular=solidBox(points,tris,lo,hi);
     const clean=safeName(g.name);
     const candidates=objects.filter(x=>safeName(x.name)===clean||safeName(x.reference)===clean);
     // Az SDK metadata objektumai nincsenek az OBJ hálókkal közös
     // azonosítóval összekapcsolva: többszörös találat nem igazolás.
     const candidate=candidates.length===1?candidates[0]:null;
     const dims=[...sizes].sort((a,b)=>b-a).map(nround);
     const metaDims=candidate?[candidate.widthMm,candidate.depthMm,candidate.heightMm].map(Number).sort((a,b)=>b-a):[];
     const matched=metaDims.length===3&&metaDims.every((n,i)=>Math.abs(n-dims[i])<=Math.max(1,dims[i]*.01));
     const verifiedPart=candidate?.isPart===true&&matched&&isRectangular;
     const cabinet=cabinetHint(clean)||safeName(candidate?.cabinetName);
     if(cabinet)cabinetNames.add(cabinet);
     const stride=Math.max(1,Math.ceil(tris.length/450));
     const previewTriangles=[];
     for(let i=0;i<tris.length;i+=stride){
       previewTriangles.push(tris[i].flatMap(id=>points[id].map(nround)));
       if(previewTriangles.length>=450)break;
     }
     const number=modelParts.length;
     modelParts.push({id:'scn-'+index,name:clean||('SCN objektum '+(index+1)),dimensions:dims,
       originMm:lo.map(nround),axisBoundsMm:sizes.map(nround),
       previewTriangles,isRectangular,isAngledCut:false,scnCabinet:cabinet,
       scnPartVerified:verifiedPart,scnNeedsReview:!verifiedPart,
       scnMetadataMatched:!!matched,
       scnOriginalObjGroup:index});
     modelGroups.push({name:clean||('SCN objektum '+(index+1)),dimensions:dims,
       indices:[number],isRectangular,isAngledCut:false,scnCabinet:cabinet,
       scnPartVerified:verifiedPart,scnNeedsReview:!verifiedPart});
     if(!isRectangular)warnings.push(clean+': nem bizonyított téglatest, csak 3D nézet; nincs automatikus szabás/CNC.');
     else if(!verifiedPart)warnings.push(clean+': OBJ és KitchenDraw alkatrész-metaadat nem azonosítható biztosan; a szabáshoz kézi jóváhagyás kell.');
   }
   if(!modelParts.length)fail('Nincs használható OBJ-objektum a KitchenDraw jelenetben.');
   return {schema:'gatterka-3mf-v1',source:'scn',designName:safeName(manifest?.sceneName||options.filename||'SCN modell'),
     parts:modelParts,groups:modelGroups,scnCabinets:[...cabinetNames],
     warnings: warnings.slice(0,100)};
 }
 const api={parseObj,solidBox,cabinetHint};
 if(typeof module!=='undefined'&&module.exports)module.exports=api;

})(typeof window!=='undefined'?window:null);

</script>
<script>
'use strict';
/**
 * CNC Xilog XXL automata terv: a bútortervező által kiszámolt, tényleges
 * csatlakozási geometriából dolgozik. NINCS átmérő-, furatszám- vagy
 * szerszámpálya-találgatás: az igazolt makrók a gyári furatkiosztást végzik.
 *
 * Csak bútortervezős, hiteles szerkezeti kapcsolatokból exportálunk.
 * Más vagy hiányos geometriánál név szerinti hiba (nem félkész .xxl fájl).
 * A szabászgép .xPrg/.xMix kódja és sorrendje teljesen független.
 */
(function(root){
  const core=(typeof module!=='undefined'&&module.exports)
    ?require('./cnc-xxl.cjs'):(root&&root.GatterkaCnc);
  const FACES=new Set(['primary','reverse']);
  const VALID_MACROS=new Set(['LAPA','LAPF','ELF2','ELF3','ELF5','REF','POLC','XBO']);
  function finite(n){return Number.isFinite(Number(n))?Number(n):NaN;}
  function round(n){return Number(Number(n).toFixed(3));}
  function cleanName(s){
    return String(s||'Alkatresz').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[^A-Za-z0-9_-]+/g,'_').replace(/^_+|_+$/g,'').slice(0,65)||'Alkatresz';
  }

   * 3MF szerkezeti érintkezések: kizárólag tengelypárhuzamos, valódi
   * téglatestek teljes lapszél és lapfelület közötti illeszkedéséből.
   * Nincs 3MF furatadat: az eredmény jelölt Xilog TESZTTERV, nem
   * automatikusan hitelesített megmunkálási program.
   */
  function threeMfContactDrafts(furniture,allowedIds,options={}){
    const model=furniture?.threeMfImport;
    const data={byPart:new Map(),errors:new Map(),warnings:new Map(),contacts:[]};
    if(!Array.isArray(model?.parts)||!Array.isArray(model?.groups))return data;
    const allowed=new Set((allowedIds||[]).map(String));
    const byKey=new Map((furniture.parts||[]).filter(p=>p.threeMfGenerated&&allowed.has(String(p.id)))
      .map(p=>[String(p.cabinetDesignKey||''),p]));
    const boxes=[],eps=.12,near=(a,b)=>Math.abs(a-b)<=eps;
    const error=(id,reason)=>{
      if(!data.errors.has(id))data.errors.set(id,String(reason));
    };
    const warn=(id,reason)=>{
      const messages=data.warnings.get(id)||[];
      if(!messages.includes(String(reason)))messages.push(String(reason));
      data.warnings.set(id,messages);
    };
    for(let gi=0;gi<model.groups.length;gi++){
      const group=model.groups[gi],part=byKey.get('3mf-'+(gi+1));
      if(!part)continue;
      if(!Array.isArray(group.indices)||!group.indices.length){
        error(part.id,'A 3MF csoporthoz nincs eredeti szilárdtest.');continue;
      }
      const q=Number(part.q);
      if(!Number.isInteger(q)||q!==group.indices.length){
        error(part.id,'A darabszám eltér az eredeti 3MF testpéldányok számától.');continue;
      }
      for(const index of group.indices){
        const shape=model.parts[index];
        if(!shape||shape.isRectangular!==true||!Array.isArray(shape.originMm)||
           !Array.isArray(shape.axisBoundsMm)||shape.originMm.length!==3||
           shape.axisBoundsMm.length!==3){

        }

          error(part.id,'Hibás 3MF világkoordináták vagy lapméret.');continue;
        }
        const hi=lo.map((v,k)=>v+size[k]);
        const axes=[0,1,2].sort((a,b)=>size[b]-size[a]||a-b);
        const [xAxis,yAxis,tAxis]=axes;
        if(size[tAxis]>50){
          error(part.id,'A 3MF testen nem azonosítható a lap vastagsági tengelye.');continue;
        }
        const a=Number(options.actualDimensions?.[part.id]?.a??part.a);
        const b=Number(options.actualDimensions?.[part.id]?.b??part.b);
        const actualZ=Number(options.actualThicknesses?.[part.id]??part.threeMfThickness??size[tAxis]);
        // A 3MF CNC-TESZTTERVET mindig a tényleges 3MF test geometriája
        // határozza meg. A getParts() szabászati alapanyaga lehet más
