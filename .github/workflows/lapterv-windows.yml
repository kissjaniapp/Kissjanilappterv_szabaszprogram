name: Gatterka - Windows telepito automatikus epites

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    name: Windows 64 bites Gatterka forditas
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Forraskod letoltese
        uses: actions/checkout@v4

      - name: Go fordito telepitese
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Node.js tesztkornyezet
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python ikon beagyazashoz
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Natív Windows mappaválasztó és gépi mentés ellenőrzése
        shell: pwsh
        run: |
          Push-Location desktop-go
          try { go test ./launcher }
          finally { Pop-Location }
          if ($LASTEXITCODE -ne 0) { throw 'Gatterka Windows gépi mentés teszt hiba' }

      - name: Gatterka ellenorzesek
        run: node --test

      - name: Windows EXE es telepito leforditasa
        shell: cmd
        run: call desktop-go\Build-Windows.cmd

      - name: Ikon ellenorzese a harom Windows EXE-ben
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -q pefile
          if ($LASTEXITCODE -ne 0) { throw 'PE ikon ellenorzo nem telepult' }
          python tests/check-pe-icon.py Gatterka.ico desktop-go/assets/bin/Gatterka.exe desktop-go/assets/bin/Gatterka_Eltavolitas.exe dist/Gatterka_Telepito_1.0.16_x64.exe
          if ($LASTEXITCODE -ne 0) { throw 'Hianyzik vagy elter a Gatterka ikon valamelyik EXE-ben' }

      - name: Hordozhato valtozat es ellenorzo hash
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = 'dist/Gatterka_Telepito_1.0.16_x64.exe'
          if (-not (Test-Path $installer)) { throw 'Nem keszult el a telepito EXE!' }
          New-Item -ItemType Directory -Force -Path 'dist/portable/app' | Out-Null
          Copy-Item 'desktop-go/assets/bin/Gatterka.exe' 'dist/portable/Gatterka.exe'
          Copy-Item 'desktop-go/assets/app/index.htm' 'dist/portable/app/index.htm'
          Compress-Archive -Path 'dist/portable/*' -DestinationPath 'dist/Gatterka_Portable_1.0.16.zip' -Force
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash
          "$hash  Gatterka_Telepito_1.0.16_x64.exe" | Set-Content -Encoding ascii 'dist/SHA256.txt'
          Write-Host "A telepito merete: $((Get-Item $installer).Length) byte"

      - name: Telepito es hordozhato program letoltheto atadasa
        uses: actions/upload-artifact@v4
        with:
          name: Gatterka-Windows-Telepito-1.0.16
          path: |
            dist/Gatterka_Telepito_1.0.16_x64.exe
            dist/Gatterka_Portable_1.0.16.zip
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 30
