name: Gatterka - PR ellenorzes
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Windowsos mappamentes tesztek
        working-directory: desktop-go
        run: go test ./launcher
      - name: Alkalmazas tesztek
        run: node --test
